<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>浏览器操作</title>
<style id="pv-kit">/*PV-KIT*/
/* ═══════════════════════════════════════════════════════════════
   EggBloom 插件 UI 套件（1.5.10）
   目标：所有插件页共用一套 token 与组件，不再各写各的配色。
   用法：插件 ui.html 里 <style> 之前引入（构建期会内联），
        结构用 .pv-* 类；没有类的旧页面也会被基础层统一。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --pv-bg:#141210; --pv-panel:#1b1815; --pv-panel2:#211d18;
  --pv-line:#332c23; --pv-line2:#3f3629;
  --pv-ink:#e8e2d6; --pv-dim:#9a8f7d; --pv-faint:#6f6657;
  --pv-gold:#c9a96e; --pv-gold-d:#8d6b3f;
  --pv-ok:#7fae8a; --pv-warn:#c9935f; --pv-bad:#c96e5f;
  --pv-r:8px; --pv-r2:6px;
  --pv-font:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --pv-mono:'Consolas','JetBrains Mono',monospace;
}
html,body{background:var(--pv-bg)!important;color:var(--pv-ink)}
body{font:13px/1.65 var(--pv-font)!important;margin:0;padding:20px 22px 40px!important;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em;color:var(--pv-ink)}
h1{font-size:16px;letter-spacing:.14em;color:var(--pv-gold)}
h2{font-size:12px;letter-spacing:.18em;color:var(--pv-dim);font-weight:500}
code,.mono{font-family:var(--pv-mono);font-size:12px}
a{color:var(--pv-gold)}

/* ── 页头 ── */
.pv-head{margin-bottom:16px}
.pv-sub{color:var(--pv-dim);font-size:12px;margin-top:6px;letter-spacing:.03em}

/* ── 面板 ── */
.pv-panel{background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:var(--pv-r);
  padding:14px 16px;margin-bottom:14px}
.pv-panel>.pv-panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pv-panel>.pv-panel-h h2{flex:none}
.pv-rule{flex:1;height:1px;background:var(--pv-line);opacity:.8}
.pv-count{color:var(--pv-faint);font-size:11px;letter-spacing:.08em}

/* ── 表单 ── */
.pv-field{margin-bottom:12px}
.pv-label{display:block;color:var(--pv-dim);font-size:12px;margin-bottom:6px;letter-spacing:.04em}
.pv-input,.pv-textarea,.pv-select{
  width:100%;box-sizing:border-box;background:var(--pv-panel2);color:var(--pv-ink);
  border:1px solid var(--pv-line);border-radius:var(--pv-r2);padding:8px 10px;
  font:12px/1.6 var(--pv-mono);outline:none;transition:border-color .15s,box-shadow .15s}
.pv-textarea{min-height:120px;resize:vertical;font-family:var(--pv-mono)}
.pv-input:focus,.pv-textarea:focus,.pv-select:focus{
  border-color:var(--pv-gold);box-shadow:0 0 0 3px rgba(201,169,110,.12)}
.pv-hint{color:var(--pv-faint);font-size:11px;margin-top:6px;line-height:1.6}

/* ── 按钮 ── */
button,.pv-btn{background:var(--pv-panel2);color:var(--pv-ink);border:1px solid var(--pv-line);
  border-radius:var(--pv-r2);padding:7px 14px;cursor:pointer;
  font:12px/1 var(--pv-font);letter-spacing:.04em;transition:all .15s}
button:hover,.pv-btn:hover{border-color:var(--pv-gold);color:var(--pv-gold)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary,.pv-btn.primary{background:var(--pv-gold);color:#141210;border-color:var(--pv-gold);font-weight:600}
button.primary:hover{background:#d8bb85;color:#141210}
button.danger:hover{border-color:var(--pv-bad);color:var(--pv-bad)}

/* ── 数据条（状态/进度）── */
.pv-rows{display:grid;gap:10px}
.pv-row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:10px}
.pv-row .pv-lab{color:var(--pv-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar{height:8px;background:#241f19;border:1px solid #2b251e;border-radius:6px;overflow:hidden}
.pv-bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--pv-gold-d),var(--pv-gold));transition:width .35s ease}
.pv-bar.warn>i{background:linear-gradient(90deg,#8d5a3f,var(--pv-warn))}
.pv-bar.bad>i{background:linear-gradient(90deg,#8d3f3f,var(--pv-bad))}
.pv-val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--pv-ink)}

/* ── 统计块 ── */
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pv-stat{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:10px 12px;text-align:center}
.pv-stat b{display:block;font-size:20px;color:var(--pv-gold);font-variant-numeric:tabular-nums}
.pv-stat span{display:block;color:var(--pv-faint);font-size:11px;margin-top:2px;letter-spacing:.08em}

/* ── 表格 ── */
.pv-table{width:100%;border-collapse:collapse;font-size:12px}
.pv-table th,.pv-table td{text-align:left;padding:7px 9px;border-bottom:1px solid #272219}
.pv-table th{color:var(--pv-dim);font-weight:500;letter-spacing:.06em;white-space:nowrap}
.pv-table tr:last-child td{border-bottom:0}
.pv-table td.k{color:var(--pv-gold);white-space:nowrap}

/* ── 标签 / 空态 / 提示 ── */
.pv-tag{display:inline-block;padding:2px 8px;border:1px solid var(--pv-line2);border-radius:999px;
  color:var(--pv-dim);font-size:11px;letter-spacing:.04em}
.pv-tag.ok{border-color:rgba(127,174,138,.45);color:var(--pv-ok)}
.pv-tag.bad{border-color:rgba(201,110,95,.45);color:var(--pv-bad)}
.pv-empty{color:var(--pv-faint);font-size:12px;text-align:center;padding:22px 10px}
.pv-msg{color:var(--pv-dim);font-size:12px;margin-top:10px;min-height:18px}
.pv-msg.ok{color:var(--pv-ok)}
.pv-msg.err{color:var(--pv-bad)}
.pv-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pv-day{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:8px;min-height:92px}
.pv-day h3{font-size:11px;color:var(--pv-dim);letter-spacing:.1em;margin-bottom:6px}
.pv-day .pv-slot{font-size:11px;line-height:1.5;color:var(--pv-ink);padding:3px 0;
  border-bottom:1px dashed #2b251e}
.pv-day .pv-slot:last-child{border-bottom:0}
.pv-day .pv-slot em{color:var(--pv-faint);font-style:normal;font-family:var(--pv-mono);font-size:10px}
.pv-day.today{border-color:var(--pv-gold)}
.pv-day.now .pv-slot.cur{color:var(--pv-gold)}
</style>
</head>
<body>
  <div class="pv-head">
    <h1>浏览器操作</h1>
    <div class="pv-sub">CDP 感知 + ref 定位 + 自愈 + 视觉兜底；任务链按顺序跑，失败有截图与日志</div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>状态</h2><i class="pv-rule"></i><span class="pv-count" id="en">—</span></div>
    <div class="pv-flex">
      <span class="pv-tag" id="tag-en">读取中</span>
      <button class="primary" id="toggle">切换启用</button>
      <button id="check-dep">检查依赖</button>
      <button id="refresh">刷新</button>
    </div>
    <div class="pv-stats" style="margin-top:14px">
      <div class="pv-stat"><b id="s-history">0</b><span>历史条数</span></div>
      <div class="pv-stat"><b id="s-tasks">0</b><span>任务链</span></div>
      <div class="pv-stat"><b id="s-engine">—</b><span>引擎</span></div>
      <div class="pv-stat"><b id="s-dep">—</b><span>依赖</span></div>
    </div>
    <div id="dep-box"></div>
    <div class="pv-msg" id="msg"></div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>运行设置</h2><i class="pv-rule"></i>
      <span class="pv-count">保存后下一次任务生效</span></div>
    <table class="pv-table">
      <tbody id="basic"></tbody>
    </table>
    <div class="pv-panel-h" style="margin-top:16px"><h2>浏览器</h2><i class="pv-rule"></i></div>
    <div class="pv-flex" id="web-toggles"></div>
    <div class="pv-flex" style="margin-top:12px">
      <button class="primary" id="save-cfg">保存设置</button>
    </div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>任务链</h2><i class="pv-rule"></i>
      <span class="pv-count" id="task-n">—</span></div>
    <table class="pv-table">
      <thead><tr><th style="width:180px">名称</th><th style="width:70px">步数</th><th>步骤</th><th style="width:70px"></th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
    <div class="pv-field" style="margin-top:14px">
      <label class="pv-label">新增 / 覆盖任务（JSON 数组）</label>
      <textarea class="pv-textarea" id="f-chain" style="min-height:90px"
        placeholder='[{"type":"goto","params":{"url":"https://example.com"}},{"type":"screenshot","params":{}}]'></textarea>
    </div>
    <div class="pv-flex">
      <input class="pv-input" id="f-name" placeholder="任务名，如 每日签到" style="max-width:220px">
      <button class="primary" id="save-task">保存任务</button>
    </div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>最近任务</h2><i class="pv-rule"></i>
      <span class="pv-count" id="hist-n">—</span></div>
    <table class="pv-table">
      <thead><tr><th style="width:70px">时间</th><th style="width:150px">动作</th><th style="width:56px">结果</th><th>摘要</th></tr></thead>
      <tbody id="hist"></tbody>
    </table>
    <div class="pv-flex" style="margin-top:12px">
      <button class="danger" id="clear-hist">清空历史</button>
    </div>
  </div>

<script>
const API='/api/plugins/action';
const $=id=>document.getElementById(id);
const msg=$('msg');
let CFG={};

async function call(action,params){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plugin_id:'web_operator',action,params:params||{}})});
  const t=await r.text(); try{return JSON.parse(t)}catch{return {raw:t}}
}
function setMsg(t,ok){ msg.className='pv-msg '+(ok?'ok':'err'); msg.textContent=t||''; }
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

function drawBasic(c){
  const num=(k,label,hint)=>'<tr><td class="k" style="width:190px">'+label+'</td>'
    +'<td style="width:140px"><input class="pv-input" data-c="'+k+'" type="number" min="1" value="'+(c[k]!=null?c[k]:'')+'"></td>'
    +'<td class="pv-hint" style="margin:0">'+hint+'</td></tr>';
  $('basic').innerHTML=[
    num('default_timeout','默认超时(秒)','单步默认超时'),
    num('default_retries','默认重试','单步失败重试次数'),
    num('history_limit','历史上限','最多保留多少条任务历史'),
    num('max_file_size_mb','文件大小上限(MB)','下载/上传单文件上限')
  ].join('');
  const w=c.web||{};
  const toggles=[
    ['headless','无头浏览器'],['auto_screenshot','自动截图'],
    ['screenshot_on_error','失败时截图'],['snapshot_enabled','无障碍快照'],
    ['self_heal','自愈重试'],['vision_grounding','视觉兜底'],
    ['action_cache','动作缓存'],['stealth','反自动化检测'],
    ['humanize','拟人化操作']
  ];
  $('web-toggles').innerHTML=toggles.map(([k,label])=>
    '<label class="pv-tag '+(w[k]?'ok':'')+'" style="cursor:pointer">'
    +'<input type="checkbox" data-w="'+k+'" '+(w[k]?'checked':'')+' style="margin-right:6px">'+label+'</label>').join('');
}
async function drawDeps(force){
  const d=await call('check_dependencies');
  const box=$('dep-box');
  if(!d||d.error){ box.innerHTML=''; return; }
  const okDep=d.ok!==false;
  $('s-dep').textContent=okDep?'就绪':'缺依赖';
  $('s-dep').style.color=okDep?'var(--pv-ok)':'var(--pv-bad)';
  box.innerHTML='<div class="pv-flex" style="margin-top:12px">'
    +'<span class="pv-tag '+(okDep?'ok':'bad')+'">'+(okDep?'依赖就绪':'缺少依赖')+'</span>'
    +'<span class="pv-hint" style="margin:0">Chromium: '+(d.playwright_chromium_ready?'可用':'不可用')+'</span>'
    +(d.missing&&d.missing.length?'<span class="pv-tag bad">缺 '+d.missing.join('、')+'</span>':'')
    +'</div>';
}
function drawTasks(t){
  const items=(t&&t.tasks)||{};
  const names=Object.keys(items);
  $('s-tasks').textContent=names.length;
  $('task-n').textContent=names.length+' 条';
  $('tasks').innerHTML=names.map(n=>{
    const it=items[n]||{}, chain=it.chain||[];
    const steps=chain.map(s=>s.type||'?').join(' → ');
    return '<tr><td class="k">'+esc(n)+'</td><td class="mono">'+chain.length+'</td>'
      +'<td class="mono" style="word-break:break-all">'+esc(steps||'—')+'</td>'
      +'<td style="text-align:right"><button class="danger" data-task="'+esc(n)+'">删除</button></td></tr>';
  }).join('')||'<tr><td colspan="4" class="pv-empty">还没有任务链</td></tr>';
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{
    const r=await call('delete_task',{name:b.dataset.task});
    if(r&&r.ok!==false){ setMsg('已删除',true); await load(); } else setMsg('删除失败：'+JSON.stringify(r),false);
  });
}
function drawHist(h){
  const items=(h&&h.history)||[];
  $('s-history').textContent=items.length;
  $('hist-n').textContent=items.length?('最近 '+items.length+' 条'):'暂无';
  $('hist').innerHTML=items.slice().reverse().map(x=>{
    const ts=x.ts||x.time||0, action=x.action||x.task||'—';
    const ok=x.ok!==false;
    const text=x.error||x.summary||x.result||x.text||'';
    return '<tr><td class="mono">'+(ts?new Date(ts*1000).toLocaleTimeString():'—')+'</td>'
      +'<td>'+esc(action)+'</td><td><span class="pv-tag '+(ok?'ok':'bad')+'">'+(ok?'成功':'失败')+'</span></td>'
      +'<td class="pv-hint" style="margin:0">'+esc(String(text).slice(0,120))+'</td></tr>';
  }).join('')||'<tr><td colspan="4" class="pv-empty">还没有执行记录</td></tr>';
}
async function load(){
  const r=await call('get_config');
  CFG=(r&&r.config)||{};
  $('en').textContent=CFG.enabled?'已启用':'已停用';
  $('tag-en').textContent=CFG.enabled?'已启用':'已停用';
  $('tag-en').className='pv-tag '+(CFG.enabled?'ok':'bad');
  $('s-engine').textContent=(CFG.web&&CFG.web.engine)||'playwright';
  drawBasic(CFG);
  const t=await call('get_tasks'); drawTasks(t);
  const h=await call('get_history'); drawHist(h);
  await drawDeps();
}
$('refresh').onclick=load;
$('toggle').onclick=async()=>{
  const r=await call('toggle');
  if(r&&r.ok!==false){ setMsg('已切换',true); await load(); } else setMsg('失败：'+JSON.stringify(r),false);
};
$('check-dep').onclick=async()=>{ await drawDeps(true); setMsg('依赖检查完成',true); };
$('save-cfg').onclick=async()=>{
  const payload={web:{}};
  document.querySelectorAll('[data-c]').forEach(i=>{ payload[i.dataset.c]=Number(i.value); });
  document.querySelectorAll('[data-w]').forEach(i=>{ payload.web[i.dataset.w]=i.checked; });
  const r=await call('set_config',payload);
  if(r&&r.ok!==false){ setMsg('设置已保存',true); await load(); } else setMsg('保存失败：'+JSON.stringify(r),false);
};
$('save-task').onclick=async()=>{
  const name=$('f-name').value.trim();
  if(!name){ setMsg('先填任务名',false); return; }
  let chain;
  try{ chain=JSON.parse($('f-chain').value||'[]'); }
  catch(e){ setMsg('JSON 不合法：'+e.message,false); return; }
  if(!Array.isArray(chain)||!chain.length){ setMsg('步骤必须是数组且不能为空',false); return; }
  const r=await call('save_tasks',{name,chain});
  if(r&&r.ok!==false){ setMsg('任务已保存',true); $('f-name').value=''; $('f-chain').value=''; await load(); }
  else setMsg('保存失败：'+JSON.stringify(r),false);
};
$('clear-hist').onclick=async()=>{
  if(!confirm('清空全部任务历史？')) return;
  const r=await call('clear_history');
  if(r&&r.ok!==false){ setMsg('历史已清空',true); await load(); } else setMsg('失败：'+JSON.stringify(r),false);
};
load();
</script>
</body>
</html>
