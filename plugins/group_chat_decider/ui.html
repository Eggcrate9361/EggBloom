<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>群聊决策器</title>
<style id="pv-kit">/*PV-KIT*/
/* ═══════════════════════════════════════════════════════════════
   EggBloom 插件 UI 套件（1.5.10）
   目标：所有插件页共用一套 token 与组件，不再各写各的配色。
   用法：插件 ui.html 里 <style> 之前引入（构建期会内联），
        结构用 .pv-* 类；没有类的旧页面也会被基础层统一。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --pv-bg:#141210; --pv-panel:#1b1815; --pv-panel2:#211d18;
  --pv-line:#332c23; --pv-line2:#3f3629;
  --pv-ink:#e8e2d6; --pv-dim:#9a8f7d; --pv-faint:#6f6657;
  --pv-gold:#c9a96e; --pv-gold-d:#8d6b3f;
  --pv-ok:#7fae8a; --pv-warn:#c9935f; --pv-bad:#c96e5f;
  --pv-r:8px; --pv-r2:6px;
  --pv-font:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --pv-mono:'Consolas','JetBrains Mono',monospace;
}
html,body{background:var(--pv-bg)!important;color:var(--pv-ink)}
body{font:13px/1.65 var(--pv-font)!important;margin:0;padding:20px 22px 40px!important;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em;color:var(--pv-ink)}
h1{font-size:16px;letter-spacing:.14em;color:var(--pv-gold)}
h2{font-size:12px;letter-spacing:.18em;color:var(--pv-dim);font-weight:500}
code,.mono{font-family:var(--pv-mono);font-size:12px}
a{color:var(--pv-gold)}

/* ── 页头 ── */
.pv-head{margin-bottom:16px}
.pv-sub{color:var(--pv-dim);font-size:12px;margin-top:6px;letter-spacing:.03em}

/* ── 面板 ── */
.pv-panel{background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:var(--pv-r);
  padding:14px 16px;margin-bottom:14px}
.pv-panel>.pv-panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pv-panel>.pv-panel-h h2{flex:none}
.pv-rule{flex:1;height:1px;background:var(--pv-line);opacity:.8}
.pv-count{color:var(--pv-faint);font-size:11px;letter-spacing:.08em}

/* ── 表单 ── */
.pv-field{margin-bottom:12px}
.pv-label{display:block;color:var(--pv-dim);font-size:12px;margin-bottom:6px;letter-spacing:.04em}
.pv-input,.pv-textarea,.pv-select{
  width:100%;box-sizing:border-box;background:var(--pv-panel2);color:var(--pv-ink);
  border:1px solid var(--pv-line);border-radius:var(--pv-r2);padding:8px 10px;
  font:12px/1.6 var(--pv-mono);outline:none;transition:border-color .15s,box-shadow .15s}
.pv-textarea{min-height:120px;resize:vertical;font-family:var(--pv-mono)}
.pv-input:focus,.pv-textarea:focus,.pv-select:focus{
  border-color:var(--pv-gold);box-shadow:0 0 0 3px rgba(201,169,110,.12)}
.pv-hint{color:var(--pv-faint);font-size:11px;margin-top:6px;line-height:1.6}

/* ── 按钮 ── */
button,.pv-btn{background:var(--pv-panel2);color:var(--pv-ink);border:1px solid var(--pv-line);
  border-radius:var(--pv-r2);padding:7px 14px;cursor:pointer;
  font:12px/1 var(--pv-font);letter-spacing:.04em;transition:all .15s}
button:hover,.pv-btn:hover{border-color:var(--pv-gold);color:var(--pv-gold)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary,.pv-btn.primary{background:var(--pv-gold);color:#141210;border-color:var(--pv-gold);font-weight:600}
button.primary:hover{background:#d8bb85;color:#141210}
button.danger:hover{border-color:var(--pv-bad);color:var(--pv-bad)}

/* ── 数据条（状态/进度）── */
.pv-rows{display:grid;gap:10px}
.pv-row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:10px}
.pv-row .pv-lab{color:var(--pv-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar{height:8px;background:#241f19;border:1px solid #2b251e;border-radius:6px;overflow:hidden}
.pv-bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--pv-gold-d),var(--pv-gold));transition:width .35s ease}
.pv-bar.warn>i{background:linear-gradient(90deg,#8d5a3f,var(--pv-warn))}
.pv-bar.bad>i{background:linear-gradient(90deg,#8d3f3f,var(--pv-bad))}
.pv-val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--pv-ink)}

/* ── 统计块 ── */
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pv-stat{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:10px 12px;text-align:center}
.pv-stat b{display:block;font-size:20px;color:var(--pv-gold);font-variant-numeric:tabular-nums}
.pv-stat span{display:block;color:var(--pv-faint);font-size:11px;margin-top:2px;letter-spacing:.08em}

/* ── 表格 ── */
.pv-table{width:100%;border-collapse:collapse;font-size:12px}
.pv-table th,.pv-table td{text-align:left;padding:7px 9px;border-bottom:1px solid #272219}
.pv-table th{color:var(--pv-dim);font-weight:500;letter-spacing:.06em;white-space:nowrap}
.pv-table tr:last-child td{border-bottom:0}
.pv-table td.k{color:var(--pv-gold);white-space:nowrap}

/* ── 标签 / 空态 / 提示 ── */
.pv-tag{display:inline-block;padding:2px 8px;border:1px solid var(--pv-line2);border-radius:999px;
  color:var(--pv-dim);font-size:11px;letter-spacing:.04em}
.pv-tag.ok{border-color:rgba(127,174,138,.45);color:var(--pv-ok)}
.pv-tag.bad{border-color:rgba(201,110,95,.45);color:var(--pv-bad)}
.pv-empty{color:var(--pv-faint);font-size:12px;text-align:center;padding:22px 10px}
.pv-msg{color:var(--pv-dim);font-size:12px;margin-top:10px;min-height:18px}
.pv-msg.ok{color:var(--pv-ok)}
.pv-msg.err{color:var(--pv-bad)}
.pv-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pv-day{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:8px;min-height:92px}
.pv-day h3{font-size:11px;color:var(--pv-dim);letter-spacing:.1em;margin-bottom:6px}
.pv-day .pv-slot{font-size:11px;line-height:1.5;color:var(--pv-ink);padding:3px 0;
  border-bottom:1px dashed #2b251e}
.pv-day .pv-slot:last-child{border-bottom:0}
.pv-day .pv-slot em{color:var(--pv-faint);font-style:normal;font-family:var(--pv-mono);font-size:10px}
.pv-day.today{border-color:var(--pv-gold)}
.pv-day.now .pv-slot.cur{color:var(--pv-gold)}
</style>
</head>
<body>
  <div class="pv-head">
    <h1>群聊决策器</h1>
    <div class="pv-sub">v3 · AI 读空气：先在零成本前置门上过滤，再让轻量模型判断「这条值不值得接」</div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>状态</h2><i class="pv-rule"></i>
      <span class="pv-count" id="ver">—</span></div>
    <div class="pv-flex">
      <span class="pv-tag" id="en-tag">读取中</span>
      <button id="toggle" class="primary">切换启用</button>
      <span class="pv-hint" style="margin:0">关掉 = 决策器不参与任何消息（发言闸与生成链不受影响）</span>
    </div>
    <div class="pv-stats" style="margin-top:14px">
      <div class="pv-stat"><b id="s-profile">0</b><span>群画像</span></div>
      <div class="pv-stat"><b id="s-topic">0</b><span>话题流</span></div>
      <div class="pv-stat"><b id="s-emo">0</b><span>情绪记录</span></div>
      <div class="pv-stat"><b id="s-chain">0</b><span>对话链</span></div>
    </div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>参与度</h2><i class="pv-rule"></i>
      <span class="pv-count">决定它多主动找接梗点</span></div>
    <div class="pv-flex" id="parts"></div>
    <div class="pv-hint" id="part-hint">—</div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>决策参数</h2><i class="pv-rule"></i>
      <span class="pv-count">v3 真正消费的值 · 保存后立刻生效</span></div>
    <table class="pv-table">
      <thead><tr><th>参数</th><th style="width:150px">值</th><th>说明</th></tr></thead>
      <tbody id="params"></tbody>
    </table>
    <div class="pv-flex" style="margin-top:12px">
      <button class="primary" id="save-params">保存参数</button>
      <span class="pv-hint" style="margin:0">置信度阈值：越低越保守（看不懂氛围时默认跳过）</span>
    </div>
    <div class="pv-msg" id="msg"></div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>决策模型</h2><i class="pv-rule"></i>
      <span class="pv-count">免密车道，不需要 Key</span></div>
    <div class="pv-flex">
      <select class="pv-select" id="model" style="max-width:300px"></select>
      <button id="save-model">保存模型</button>
    </div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>最近决策</h2><i class="pv-rule"></i>
      <span class="pv-count" id="recent-n">每 5 秒刷新</span></div>
    <table class="pv-table">
      <thead><tr><th style="width:64px">时间</th><th style="width:58px">动作</th><th style="width:64px">置信度</th>
        <th>原因</th><th>触发消息</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </div>

<script>
const API='/api/plugins/action';
const $=id=>document.getElementById(id);
const msg=$('msg');

async function call(action,params){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plugin_id:'group_chat_decider',action,params:params||{}})});
  const t=await r.text(); try{return JSON.parse(t)}catch{return {raw:t}}
}
function setMsg(t,ok){ msg.className='pv-msg '+(ok?'ok':'err'); msg.textContent=t||''; }
function fmtTime(ts){ const d=new Date(ts*1000); return d.toTimeString().slice(0,8); }
const ACT_LABEL={inject:'放行',skip:'跳过',observe:'观察',none:'—'};
const ACT_CLASS={inject:'ok',skip:'',observe:'bad'};

function drawParts(cfg){
  const lv=cfg.participation_levels||{};
  const cur=cfg.participation||'normal';
  $('parts').innerHTML=Object.keys(lv).map(k=>
    '<button class="'+(k===cur?'primary':'')+'" data-part="'+k+'">'+lv[k]+'</button>').join('');
  document.querySelectorAll('[data-part]').forEach(b=>b.onclick=async()=>{
    const r=await call('set_config',{participation:b.dataset.part});
    if(r&&r.ok){ setMsg('参与度已改为「'+lv[b.dataset.part]+'」',true); await load(); }
    else setMsg('保存失败：'+JSON.stringify(r),false);
  });
}
function drawParams(cfg){
  const p=cfg.decision_params||{}, d=cfg.decision_param_defaults||{};
  const labels={
    confidence_threshold:'置信度阈值（越低越保守）',
    max_context_messages:'送入 AI 的最近消息条数',
    max_bot_replies:'窗口内最多发言次数（防刷屏）',
    cooldown_seconds:'冷却秒数（0 = 不冷却）',
    followup_wait_seconds:'接话窗口（追问还能再答）',
    followup_max_chars:'追问的短消息阈值',
    observe_before_silence_seconds:'沉默前观察秒数'
  };
  $('params').innerHTML=Object.keys(d).map(k=>{
    const isFloat=typeof d[k]==='number'&&!Number.isInteger(d[k]);
    return '<tr><td><code>'+k+'</code></td>'
      +'<td><input class="pv-input" data-p="'+k+'" type="number" step="'+(isFloat?0.05:1)+'" value="'
      +(p[k]!=null?p[k]:d[k])+'"></td>'
      +'<td class="pv-hint" style="margin:0">'+(labels[k]||('默认 '+d[k]))+'</td></tr>';
  }).join('');
}
async function load(){
  const r=await call('get_config');
  if(!r||!r.config){ $('ver').textContent='读取失败'; return; }
  const c=r.config;
  $('ver').textContent='group_chat_decider v3';
  $('en-tag').textContent=r.enabled?'已启用':'已停用';
  $('en-tag').className='pv-tag '+(r.enabled?'ok':'bad');
  drawParts(c);
  drawParams(c);
  const models=c.models||[];
  $('model').innerHTML=models.map(m=>{
    const id=typeof m==='string'?m:(m.id||m.name);
    const label=typeof m==='string'?m:(m.label||m.name||id);
    return '<option value="'+id+'"'+(id===c.active_model?' selected':'')+'>'+label+'</option>';
  }).join('')||'<option value="">（无可用模型）</option>';
  const st=await call('stats');
  const s=(st&&st.stats)||{};
  $('s-profile').textContent=s.group_profiles||0;
  $('s-topic').textContent=s.topic_flows||0;
  $('s-emo').textContent=s.emotion_logs||0;
  $('s-chain').textContent=s.conversation_chains||0;
  await loadRecent();
}
async function loadRecent(){
  const r=await call('recent');
  const list=(r&&r.decisions)||[];
  $('recent-n').textContent=list.length?('最近 '+list.length+' 条 · 每 5 秒刷新'):'暂无记录（有消息进来后出现）';
  $('recent').innerHTML=list.map(d=>{
    const act=ACT_LABEL[d.act]||d.act;
    return '<tr><td class="mono">'+fmtTime(d.ts)+'</td>'
      +'<td><span class="pv-tag '+(ACT_CLASS[d.act]||'')+'">'+act+'</span></td>'
      +'<td class="mono">'+(d.confidence!=null?Number(d.confidence).toFixed(2):'—')+'</td>'
      +'<td>'+((d.reason||'').replace(/</g,'&lt;'))+'</td>'
      +'<td class="pv-hint" style="margin:0">'+((d.text||'').replace(/</g,'&lt;'))+'</td></tr>';
  }).join('')||'<tr><td colspan="5" class="pv-empty">还没有决策记录</td></tr>';
}
$('toggle').onclick=async()=>{
  const r=await call('toggle');
  if(r&&('enabled' in r)){ setMsg(r.enabled?'已启用':'已停用',true); await load(); }
  else setMsg('切换失败：'+JSON.stringify(r),false);
};
$('save-params').onclick=async()=>{
  const payload={};
  document.querySelectorAll('[data-p]').forEach(i=>{ payload[i.dataset.p]=i.value; });
  const r=await call('set_config',payload);
  if(r&&r.ok){ setMsg('参数已保存',true); await load(); }
  else setMsg('保存失败：'+JSON.stringify(r),false);
};
$('save-model').onclick=async()=>{
  const r=await call('set_ai_config',{active_model:$('model').value});
  if(r&&r.ok){ setMsg('模型已切换',true); await load(); }
  else setMsg('切换失败：'+JSON.stringify(r),false);
};
load();
setInterval(loadRecent, 5000);
</script>
</body>
</html>
