<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>personality_engine 插件</title>
<style>
  :root{
    --bg:#0a0a0f;--surface:#111118;--paper:#16161f;--elevated:#1e1e28;--input:#14141b;
    --ink:#f0f0f5;--ink2:#b8b8c8;--ink3:#8a8f9a;--ink4:#3a3f48;--gold:#c9a96e;
    --font-d:'Outfit','Noto Sans SC','PingFang SC',system-ui,sans-serif;
    --font-m:'JetBrains Mono','Consolas',monospace;--radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-d)}
  .wrap{max-width:900px;margin:0 auto;padding:22px}
  .panel{background:linear-gradient(180deg,var(--surface),var(--paper));border:1px solid var(--ink4);border-radius:var(--radius);padding:18px}
  .panel-title{font-size:17px;font-weight:700;margin-bottom:12px}
  .meta{font-size:12px;color:var(--ink3);margin-left:8px;font-weight:400}
  .desc{color:var(--ink2);font-size:14px;line-height:1.7;margin-top:10px}
  .grid{display:grid;gap:12px;margin-top:14px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr} }
  .card{background:var(--elevated);border:1px solid var(--ink4);border-radius:var(--radius);padding:12px}
  .card-label{font-size:12px;color:var(--ink3);margin-bottom:4px}
  .card-value{font-family:var(--font-m);font-size:14px;color:var(--ink)}
  .back{display:inline-block;margin-top:14px;color:var(--gold);cursor:pointer;font-size:14px}
  button{padding:6px 12px;border:1px solid var(--ink4);background:var(--elevated);color:var(--ink);border-radius:6px;cursor:pointer;font-size:13px}
  button:hover{background:var(--paper);border-color:var(--gold)}
  button.primary{background:var(--gold);color:#0a0a0f;border-color:var(--gold);font-weight:600}
  input[type="text"],textarea,select{padding:8px 10px;background:var(--input);color:var(--ink);border:1px solid var(--ink4);border-radius:6px;font-family:inherit;font-size:13px;width:100%}
  textarea{min-height:80px;resize:vertical}
  .muted{color:var(--ink3);font-size:12px;margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .tag{display:inline-block;background:var(--elevated);color:var(--gold);padding:2px 8px;border-radius:4px;margin:2px;font-size:12px;border:1px solid var(--ink4)}
  .section-title{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--ink)}
  .empty{color:var(--ink3);font-size:13px;padding:8px 0}

  /* eggb-motion */
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}}
  .btn-ripple{position:absolute;border-radius:50%;background:rgba(201,169,110,0.3);transform:scale(0);pointer-events:none;animation:rippleAnim 550ms ease-out forwards}
  @keyframes rippleAnim{to{transform:scale(3);opacity:0}}
  .card,.panel,.stat-card,.tool-item,.list-item{transition:transform 160ms cubic-bezier(0.22,1,0.36,1),box-shadow 200ms ease,border-color 200ms ease}
  .card:hover,.panel:hover,.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.45)}
  .tool-item:hover,.list-item:hover{transform:translateX(2px)}
  button{transition:all 160ms cubic-bezier(0.4,0,0.2,1)}
  button:active:not(:disabled){transform:scale(0.96)}
  .tab{transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease}
  .tab:hover{transform:translateY(-1px)}
  .tab.active{transform:scale(1.05)}
  .toast{display:flex;align-items:center;gap:8px;overflow:hidden;position:relative}
  .toast::before{content:attr(data-icon);width:18px;text-align:center;font-size:13px;line-height:1;flex-shrink:0}
  .toast::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;transform:scaleX(0);transform-origin:left;animation:toastProgress 2s linear forwards}
  .toast.success::after{background:#6ecf8e}
  .toast.error::after{background:#ff8a80}
  .toast.info::after{background:#c9a96e}
  @keyframes toastProgress{to{transform:scaleX(1)}}
  .toast.show{animation:toastIn 260ms cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(0.92)}to{opacity:1;transform:translateY(0) scale(1)}}
  .panel-title{position:relative}
  .panel-title::after{content:'';position:absolute;bottom:-2px;left:0;width:34px;height:2px;background:linear-gradient(90deg,#c9a96e,transparent);border-radius:2px;transition:width 300ms cubic-bezier(0.22,1,0.36,1)}
  .panel:hover .panel-title::after{width:60px}
  
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="panel-title">人格引擎<span class="meta">personality_engine v0.2.0</span></div>
      <div class="desc">编辑小a的人格、说话方式、行为规则。保存后即时生效。</div>
      <div class="row" style="margin-top:12px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)">
          <input type="checkbox" id="example-enabled" checked>
          <span>启用示例库</span>
        </label>
        <button class="primary" onclick="saveAll()">保存人格</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">基础信息</div>
      <div class="grid grid-2">
        <div><div class="muted">【你是谁】</div><textarea id="sec-你是谁" placeholder="18岁男生，喜欢计算机..."></textarea></div>
        <div><div class="muted">【日常】</div><textarea id="sec-日常" placeholder="阴间作息，晚上精神..."></textarea></div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">性格与表达</div>
      <div class="grid grid-2">
        <div><div class="muted">【性格】</div><textarea id="sec-性格" placeholder="懒散但对感兴趣的事认真..."></textarea></div>
        <div><div class="muted">【说话方式】</div><textarea id="sec-说话方式" placeholder="短句为主，口语化..."></textarea></div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">行为规则</div>
      <div class="grid grid-2">
        <div><div class="muted">【群聊行为】</div><textarea id="sec-群聊行为" placeholder="只在被@或叫小a时回复..."></textarea></div>
        <div><div class="muted">【遇到各种事】</div><textarea id="sec-遇到各种事" placeholder="- 被问身份/年龄/在哪 → ..."></textarea></div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">其他</div>
      <div class="grid grid-2">
        <div><div class="muted">【口头禅】</div><textarea id="sec-口头禅" placeholder="…… 无语 | 行吧 勉强接受 | ..."></textarea></div>
        <div><div class="muted">【绝对不能说的话】</div><textarea id="sec-绝对不能说的话" placeholder="作为AI / 根据算法 / ..."></textarea></div>
      </div>
    </div>
    <div class="panel">
      <div class="row">
        <div>
          <div class="section-title" style="margin:0">示例库</div>
          <div class="muted">few-shot 示例，会注入 prompt。可直接修改 JSON，保存后即时生效。</div>
        </div>
        <button class="primary" onclick="saveExamples()">保存示例</button>
      </div>
      <textarea id="example-editor" style="min-height:180px;font-family:var(--font-m);margin-top:10px"></textarea>
    </div>
    <div class="panel">
      <div class="section-title">实时预览</div>
      <div id="preview" style="white-space:pre-wrap;font-family:var(--font-m);font-size:13px;color:var(--ink2);line-height:1.7;background:var(--input);padding:12px;border-radius:8px;border:1px solid var(--ink4)">加载中...</div>
    </div>
    {BACK_BTN}
  <script>
  async function api(path, opts={}) {
    const res = await fetch(path, Object.assign({headers: {'Content-Type':'application/json'}}, opts));
    return res.json();
  }
  async function loadPersonality() {
    const data = await api('/api/plugins/action', {
      method: 'POST',
      body: JSON.stringify({plugin_id:'personality_engine', action:'get_personality'})
    });
    const sections = (data && data.sections) || {};
    const fields = ['你是谁','日常','性格','说话方式','群聊行为','遇到各种事','口头禅','绝对不能说的话'];
    for (const key of fields) {
      const el = document.getElementById('sec-' + key);
      if (el) el.value = sections['【' + key + '】'] || '';
    }
    const cfg = (data && data.config) || {};
    const exEl = document.getElementById('example-enabled');
    if (exEl) exEl.checked = !(cfg.example_enabled === false);
    updatePreview();
  }
  async function saveAll() {
    const sections = {};
    const fields = ['你是谁','日常','性格','说话方式','群聊行为','遇到各种事','口头禅','绝对不能说的话'];
    for (const key of fields) {
      const el = document.getElementById('sec-' + key);
      if (el && el.value.trim()) {
        sections['【' + key + '】'] = el.value.trim();
      }
    }
    const exEl = document.getElementById('example-enabled');
    const payload = {
      plugin_id:'personality_engine',
      action:'save_personality',
      params:{
        sections,
        config: {
          example_enabled: exEl ? exEl.checked : true,
        }
      }
    };
    const data = await api('/api/plugins/action', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    alert(data.success !== false ? '已保存' : '保存失败：' + (data.error || '未知错误'));
    updatePreview();
  }
  function updatePreview() {
    const fields = ['你是谁','日常','性格','说话方式','群聊行为','遇到各种事','口头禅','绝对不能说的话'];
    const parts = [];
    for (const key of fields) {
      const el = document.getElementById('sec-' + key);
      if (el && el.value.trim()) {
        parts.push('【' + key + '】\n' + el.value.trim());
      }
    }
    document.getElementById('preview').textContent = parts.join('\n\n') || '暂无内容';
  }
  document.querySelectorAll('textarea').forEach(el => {
    el.addEventListener('input', updatePreview);
  });
  async function loadExamples() {
    const data = await api('/api/plugins/action', {
      method: 'POST',
      body: JSON.stringify({plugin_id:'personality_engine', action:'get_examples', params:{scene:''}})
    });
    const list = Array.isArray(data && data.examples) ? data.examples : [];
    document.getElementById('example-editor').value = JSON.stringify(list, null, 2);
  }
  async function saveExamples() {
    const raw = document.getElementById('example-editor').value || '[]';
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { alert('示例库 JSON 格式错误'); return; }
    const data = await api('/api/plugins/action', {
      method: 'POST',
      body: JSON.stringify({plugin_id:'personality_engine', action:'save_examples', params:{examples: parsed}})
    });
    alert(data.success !== false ? '示例已保存' : '保存失败：' + (data.error || '未知错误'));
  }
  (async function init(){
    await loadPersonality();
    await loadExamples();
  })();
  </script>
<script>
(function(){
  if (window.__eggbMotion) return; window.__eggbMotion = true;
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button, .btn, .tool-item') : null;
    if(!btn || btn.disabled) return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.2;
    var r = document.createElement('span');
    r.className = 'btn-ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(function(){ r.remove(); }, 600);
  });
})();
</script>
</body>
</html>
