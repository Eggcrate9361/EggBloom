<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拟人节奏</title>
  <style>
    :root{
      --bg:#0a0a0f;--surface:#111118;--paper:#16161f;--elevated:#1e1e28;--input:#14141b;
      --ink:#f0f0f5;--ink2:#b8b8c8;--ink3:#8a8f9a;--ink4:#3a3f48;--gold:#c9a96e;
      --font-d:'Outfit','Noto Sans SC','PingFang SC',system-ui,sans-serif;
      --font-m:'JetBrains Mono','Consolas',monospace;--radius:12px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-d)}
    .wrap{max-width:900px;margin:0 auto;padding:22px}
    .panel{background:linear-gradient(180deg,var(--surface),var(--paper));border:1px solid var(--ink4);border-radius:var(--radius);padding:18px}
    .panel-title{font-size:17px;font-weight:700;margin-bottom:12px}
    .meta{font-size:12px;color:var(--ink3);margin-left:8px;font-weight:400}
    .desc{color:var(--ink2);font-size:14px;line-height:1.7;margin-top:10px}
    .grid{display:grid;gap:12px;margin-top:14px}
    .grid-2{grid-template-columns:repeat(2,1fr)}
    @media (max-width:860px){ .grid-2{grid-template-columns:1fr} }
    .card{background:var(--elevated);border:1px solid var(--ink4);border-radius:var(--radius);padding:12px}
    .card-label{font-size:12px;color:var(--ink3);margin-bottom:4px}
    .card-value{font-family:var(--font-m);font-size:14px;color:var(--ink)}
    .back{display:inline-block;margin-top:14px;color:var(--gold);cursor:pointer;font-size:14px}
  
  /* eggb-motion */
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}}
  .btn-ripple{position:absolute;border-radius:50%;background:rgba(201,169,110,0.3);transform:scale(0);pointer-events:none;animation:rippleAnim 550ms ease-out forwards}
  @keyframes rippleAnim{to{transform:scale(3);opacity:0}}
  .card,.panel,.stat-card,.tool-item,.list-item{transition:transform 160ms cubic-bezier(0.22,1,0.36,1),box-shadow 200ms ease,border-color 200ms ease}
  .card:hover,.panel:hover,.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.45)}
  .tool-item:hover,.list-item:hover{transform:translateX(2px)}
  button{transition:all 160ms cubic-bezier(0.4,0,0.2,1)}
  button:active:not(:disabled){transform:scale(0.96)}
  .tab{transition:transform 160ms ease,background 160ms ease,color 160ms ease,border-color 160ms ease}
  .tab:hover{transform:translateY(-1px)}
  .tab.active{transform:scale(1.05)}
  .toast{display:flex;align-items:center;gap:8px;overflow:hidden;position:relative}
  .toast::before{content:attr(data-icon);width:18px;text-align:center;font-size:13px;line-height:1;flex-shrink:0}
  .toast::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;transform:scaleX(0);transform-origin:left;animation:toastProgress 2s linear forwards}
  .toast.success::after{background:#6ecf8e}
  .toast.error::after{background:#ff8a80}
  .toast.info::after{background:#c9a96e}
  @keyframes toastProgress{to{transform:scaleX(1)}}
  .toast.show{animation:toastIn 260ms cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(0.92)}to{opacity:1;transform:translateY(0) scale(1)}}
  .panel-title{position:relative}
  .panel-title::after{content:'';position:absolute;bottom:-2px;left:0;width:34px;height:2px;background:linear-gradient(90deg,#c9a96e,transparent);border-radius:2px;transition:width 300ms cubic-bezier(0.22,1,0.36,1)}
  .panel:hover .panel-title::after{width:60px}
  
  </style>
<style id="pv-kit">/*PV-KIT*/
/* ═══════════════════════════════════════════════════════════════════════
   EggBloom 插件 UI 套件 v2（2026-10-29）
   ---------------------------------------------------------------------
   和 v1 的区别：v1 只是"统一配色"，v2 是一套**可用的前端规范**：
     · 设计 token（颜色 / 间距 / 圆角 / 阴影 / 动效曲线）全部成体系
     · 组件带完整状态：hover / active / focus-visible / disabled / loading
     · 布局原语：pv-split / pv-grid / pv-toolbar，窄屏自动降级
     · 语义组件：pv-kpi / pv-seg / pv-switch / pv-chip / pv-timeline
   旧类名（pv-panel / pv-table / pv-msg …）保留并重绘，老页面不用改也能变好看。
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* 色板：暖黑底 + 米金主色 + 三个语义色 */
  --pv-bg:#0f0e0c;
  --pv-surface:#181512;
  --pv-surface-2:#1f1b16;
  --pv-surface-3:#262119;
  --pv-line:rgba(232,226,214,.08);
  --pv-line-2:rgba(232,226,214,.14);
  --pv-ink:#efe9dd;
  --pv-ink-2:#b9b0a0;
  --pv-ink-3:#7d7466;
  --pv-gold:#d8b877;
  --pv-gold-2:#b8914f;
  --pv-gold-soft:rgba(216,184,119,.12);
  --pv-ok:#8fc4a0;
  --pv-ok-soft:rgba(143,196,160,.12);
  --pv-warn:#d9a15f;
  --pv-warn-soft:rgba(217,161,95,.12);
  --pv-bad:#d97b6c;
  --pv-bad-soft:rgba(217,123,108,.12);

  /* 间距 4 的倍数 */
  --pv-1:4px; --pv-2:8px; --pv-3:12px; --pv-4:16px; --pv-5:22px; --pv-6:32px; --pv-7:44px;
  /* 圆角 */
  --pv-r-sm:6px; --pv-r:10px; --pv-r-lg:14px; --pv-r-full:999px;
  /* 阴影 / 光 */
  --pv-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --pv-ring:0 0 0 1px var(--pv-gold), 0 0 0 4px var(--pv-gold-soft);
  --pv-ease:cubic-bezier(.22,.61,.36,1);

  --pv-font:'Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI',system-ui,sans-serif;
  --pv-mono:'Cascadia Mono','Consolas',monospace;
  --pv-fs-xs:11px; --pv-fs-sm:12px; --pv-fs:13px; --pv-fs-lg:15px; --pv-fs-xl:19px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--pv-bg)!important;color:var(--pv-ink)}
body{
  margin:0;padding:var(--pv-5) var(--pv-5) var(--pv-7)!important;
  font:var(--pv-fs)/1.65 var(--pv-font)!important;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(1200px 500px at 15% -10%,rgba(216,184,119,.055),transparent 60%)!important;
}
::selection{background:var(--pv-gold-soft);color:var(--pv-gold)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3;letter-spacing:.01em;color:var(--pv-ink)}
h1{font-size:var(--pv-fs-xl);letter-spacing:.02em}
h2{font-size:var(--pv-fs-sm);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-ink-3);font-weight:600}
h3{font-size:var(--pv-fs)}
a{color:var(--pv-gold);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--pv-mono);font-size:var(--pv-fs-sm);font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--pv-line);margin:var(--pv-4) 0}

/* ── 页头 ───────────────────────────────────────────────────────── */
.pv-head{display:flex;align-items:flex-start;gap:var(--pv-4);margin:0 0 var(--pv-5)}
.pv-head .pv-head-body{flex:1;min-width:0}
.pv-head .pv-eyebrow{font-size:var(--pv-fs-xs);letter-spacing:.18em;text-transform:uppercase;
  color:var(--pv-gold-2);margin-bottom:6px}
.pv-sub{color:var(--pv-ink-3);font-size:var(--pv-fs);margin-top:6px;max-width:72ch}
.pv-hero-icon{width:46px;height:46px;flex:none;border-radius:var(--pv-r);display:grid;place-items:center;
  background:linear-gradient(145deg,var(--pv-surface-2),var(--pv-surface));
  border:1px solid var(--pv-line-2);box-shadow:var(--pv-shadow);color:var(--pv-gold);font-size:20px}

/* ── 布局原语 ───────────────────────────────────────────────────── */
.pv-split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.85fr);gap:var(--pv-4)}
.pv-grid{display:grid;gap:var(--pv-4)}
.pv-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pv-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pv-toolbar{display:flex;align-items:center;gap:var(--pv-2);flex-wrap:wrap}
.pv-spacer{flex:1}
@media (max-width:900px){
  .pv-split{grid-template-columns:1fr}
  .pv-grid.cols-2,.pv-grid.cols-3{grid-template-columns:1fr}
}

/* ── 卡片 ───────────────────────────────────────────────────────── */
.pv-panel{
  position:relative;background:var(--pv-surface);border:1px solid var(--pv-line);
  border-radius:var(--pv-r-lg);padding:var(--pv-4) var(--pv-4) var(--pv-4);
  box-shadow:var(--pv-shadow);margin:0 0 var(--pv-4);
}
.pv-panel-h{display:flex;align-items:center;gap:var(--pv-3);margin:0 0 var(--pv-3)}
.pv-panel-h h2{flex:none}
.pv-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--pv-line-2),transparent)}
.pv-count{color:var(--pv-ink-3);font-size:var(--pv-fs-xs);letter-spacing:.06em;white-space:nowrap}
.pv-card{background:var(--pv-surface-2);border:1px solid var(--pv-line);border-radius:var(--pv-r);
  padding:var(--pv-3) var(--pv-4)}
.pv-card:hover{border-color:var(--pv-line-2)}

/* ── 按钮 ───────────────────────────────────────────────────────── */
button,.pv-btn{
  --_bg:var(--pv-surface-2);--_fg:var(--pv-ink);--_bd:var(--pv-line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--_bg);color:var(--_fg);border:1px solid var(--_bd);
  border-radius:var(--pv-r-sm);padding:8px 14px;cursor:pointer;
  font:500 var(--pv-fs)/1 var(--pv-font);letter-spacing:.02em;white-space:nowrap;
  transition:background .18s var(--pv-ease),border-color .18s var(--pv-ease),
             color .18s var(--pv-ease),transform .06s var(--pv-ease);
}
button:hover,.pv-btn:hover{--_bg:var(--pv-surface-3);--_bd:var(--pv-gold-2);--_fg:var(--pv-gold)}
button:active,.pv-btn:active{transform:translateY(1px)}
button:focus-visible,.pv-btn:focus-visible{outline:none;box-shadow:var(--pv-ring)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.primary,.pv-btn.primary{--_bg:linear-gradient(180deg,#e3c68a,#c9a463);--_fg:#161310;--_bd:transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px rgba(201,164,99,.18);font-weight:600}
button.primary:hover{--_bg:linear-gradient(180deg,#ecd299,#d5af6d);--_fg:#161310}
button.ghost{--_bg:transparent;--_bd:transparent;--_fg:var(--pv-ink-2)}
button.ghost:hover{--_bg:var(--pv-surface-2);--_fg:var(--pv-ink)}
button.danger{--_fg:var(--pv-bad);--_bd:rgba(217,123,108,.35)}
button.danger:hover{--_bg:var(--pv-bad-soft);--_bd:var(--pv-bad);--_fg:var(--pv-bad)}
button.sm{padding:5px 10px;font-size:var(--pv-fs-xs)}

/* ── 表单 ───────────────────────────────────────────────────────── */
.pv-field{margin:0 0 var(--pv-4)}
.pv-label{display:block;color:var(--pv-ink-2);font-size:var(--pv-fs-sm);margin-bottom:6px}
.pv-input,.pv-textarea,.pv-select{
  width:100%;background:var(--pv-surface-2);color:var(--pv-ink);
  border:1px solid var(--pv-line-2);border-radius:var(--pv-r-sm);
  padding:9px 11px;font:var(--pv-fs-sm)/1.6 var(--pv-mono);outline:none;
  transition:border-color .18s var(--pv-ease),box-shadow .18s var(--pv-ease),background .18s var(--pv-ease);
}
.pv-textarea{min-height:110px;resize:vertical;font-family:var(--pv-mono)}
.pv-input::placeholder,.pv-textarea::placeholder{color:var(--pv-ink-3)}
.pv-input:hover,.pv-textarea:hover,.pv-select:hover{border-color:rgba(232,226,214,.22)}
.pv-input:focus,.pv-textarea:focus,.pv-select:focus{border-color:var(--pv-gold);box-shadow:var(--pv-ring)}
.pv-hint{color:var(--pv-ink-3);font-size:var(--pv-fs-xs);margin-top:6px;line-height:1.65}
.pv-input.mono{font-family:var(--pv-mono)}

/* 开关（checkbox 改造）*/
.pv-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.pv-switch input{position:absolute;opacity:0;width:0;height:0}
.pv-switch .pv-track{width:36px;height:20px;border-radius:var(--pv-r-full);background:var(--pv-surface-3);
  border:1px solid var(--pv-line-2);position:relative;transition:background .2s var(--pv-ease),border-color .2s var(--pv-ease)}
.pv-switch .pv-track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--pv-ink-3);transition:transform .2s var(--pv-ease),background .2s var(--pv-ease)}
.pv-switch input:checked+.pv-track{background:var(--pv-gold-soft);border-color:var(--pv-gold-2)}
.pv-switch input:checked+.pv-track::after{transform:translateX(16px);background:var(--pv-gold)}
.pv-switch input:focus-visible+.pv-track{box-shadow:var(--pv-ring)}
.pv-switch .pv-switch-label{font-size:var(--pv-fs-sm);color:var(--pv-ink-2)}

/* 分段控件 */
.pv-seg{display:inline-flex;background:var(--pv-surface-2);border:1px solid var(--pv-line-2);
  border-radius:var(--pv-r-sm);padding:3px;gap:2px}
.pv-seg button{background:transparent;border:0;padding:6px 14px;border-radius:4px;
  color:var(--pv-ink-3);font-size:var(--pv-fs-sm)}
.pv-seg button:hover{color:var(--pv-ink);--_bg:transparent}
.pv-seg button.on{background:var(--pv-gold-soft);color:var(--pv-gold);font-weight:600}

/* ── 数据展示 ───────────────────────────────────────────────────── */
.pv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--pv-3)}
.pv-kpi{background:linear-gradient(180deg,var(--pv-surface-2),var(--pv-surface));
  border:1px solid var(--pv-line);border-radius:var(--pv-r);padding:var(--pv-3) var(--pv-4);min-width:0}
.pv-kpi .k{display:block;color:var(--pv-ink-3);font-size:var(--pv-fs-xs);letter-spacing:.1em;text-transform:uppercase}
.pv-kpi b{display:block;margin-top:6px;font-size:24px;font-weight:600;letter-spacing:-.01em;
  color:var(--pv-ink);font-variant-numeric:tabular-nums;line-height:1.2}
.pv-kpi .d{font-size:var(--pv-fs-xs);color:var(--pv-ink-3);margin-top:4px}
.pv-kpi .d.ok{color:var(--pv-ok)} .pv-kpi .d.bad{color:var(--pv-bad)} .pv-kpi .d.warn{color:var(--pv-warn)}
.pv-kpi.hero b{color:var(--pv-gold)}

/* 兼容旧统计块 */
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--pv-3)}
.pv-stat{background:linear-gradient(180deg,var(--pv-surface-2),var(--pv-surface));
  border:1px solid var(--pv-line);border-radius:var(--pv-r);padding:var(--pv-3) var(--pv-4);text-align:left}
.pv-stat b{display:block;font-size:22px;color:var(--pv-gold);font-variant-numeric:tabular-nums;line-height:1.25}
.pv-stat span{display:block;color:var(--pv-ink-3);font-size:var(--pv-fs-xs);margin-top:4px;letter-spacing:.06em}

/* 进度/状态条 */
.pv-rows{display:grid;gap:var(--pv-3)}
.pv-row{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:var(--pv-3)}
.pv-row .pv-lab{color:var(--pv-ink-2);font-size:var(--pv-fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar{position:relative;height:6px;background:var(--pv-surface-3);border-radius:var(--pv-r-full);overflow:hidden}
.pv-bar>i{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--pv-gold-2),var(--pv-gold));transition:width .5s var(--pv-ease)}
.pv-bar.warn>i{background:linear-gradient(90deg,#a9763f,var(--pv-warn))}
.pv-bar.bad>i{background:linear-gradient(90deg,#a05a4e,var(--pv-bad))}
.pv-val{text-align:right;font-family:var(--pv-mono);font-size:var(--pv-fs-sm);color:var(--pv-ink-2);font-variant-numeric:tabular-nums}

/* 表格 */
.pv-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--pv-fs-sm)}
.pv-table th{color:var(--pv-ink-3);font-weight:500;font-size:var(--pv-fs-xs);letter-spacing:.1em;
  text-transform:uppercase;text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--pv-line-2);white-space:nowrap}
.pv-table td{padding:10px;border-bottom:1px solid var(--pv-line);vertical-align:top}
.pv-table tbody tr:hover td{background:rgba(232,226,214,.025)}
.pv-table tbody tr:last-child td{border-bottom:0}
.pv-table td.k{color:var(--pv-gold);white-space:nowrap}
.pv-scroll{overflow:auto;max-height:380px}

/* 标签 / 胶囊 */
.pv-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--pv-r-full);
  border:1px solid var(--pv-line-2);color:var(--pv-ink-2);font-size:var(--pv-fs-xs);letter-spacing:.03em;white-space:nowrap}
.pv-tag.ok{border-color:rgba(143,196,160,.4);color:var(--pv-ok);background:var(--pv-ok-soft)}
.pv-tag.warn{border-color:rgba(217,161,95,.4);color:var(--pv-warn);background:var(--pv-warn-soft)}
.pv-tag.bad{border-color:rgba(217,123,108,.4);color:var(--pv-bad);background:var(--pv-bad-soft)}
.pv-tag.gold{border-color:rgba(216,184,119,.45);color:var(--pv-gold);background:var(--pv-gold-soft)}

/* 空态 / 提示 */
.pv-empty{color:var(--pv-ink-3);font-size:var(--pv-fs-sm);text-align:center;padding:var(--pv-6) var(--pv-4);
  border:1px dashed var(--pv-line-2);border-radius:var(--pv-r);background:rgba(255,255,255,.012)}
.pv-msg{font-size:var(--pv-fs-sm);margin-top:var(--pv-3);min-height:18px;color:var(--pv-ink-3)}
.pv-msg.ok{color:var(--pv-ok)} .pv-msg.err{color:var(--pv-bad)}
.pv-flex{display:flex;gap:var(--pv-2);flex-wrap:wrap;align-items:center}
.pv-muted{color:var(--pv-ink-3)}

/* 时间线 */
.pv-timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--pv-line-2)}
.pv-timeline li{position:relative;padding:0 0 var(--pv-3) 14px}
.pv-timeline li::before{content:"";position:absolute;left:-21px;top:6px;width:7px;height:7px;border-radius:50%;
  background:var(--pv-surface-3);border:1px solid var(--pv-line-2)}
.pv-timeline li.hot::before{background:var(--pv-gold);border-color:var(--pv-gold);box-shadow:0 0 0 4px var(--pv-gold-soft)}
.pv-timeline .t{font-family:var(--pv-mono);font-size:var(--pv-fs-xs);color:var(--pv-ink-3)}
.pv-timeline .tx{color:var(--pv-ink-2);font-size:var(--pv-fs-sm);margin-top:3px}

/* 周网格 */
.pv-grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--pv-2)}
.pv-day{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:var(--pv-r);padding:var(--pv-2)}
.pv-day h3{font-size:var(--pv-fs-xs);color:var(--pv-ink-3);letter-spacing:.12em;text-transform:uppercase;margin:2px 0 var(--pv-2)}
.pv-day .pv-slot{font-size:var(--pv-fs-xs);line-height:1.55;color:var(--pv-ink-2);padding:5px 0;
  border-bottom:1px dashed var(--pv-line)}
.pv-day .pv-slot:last-child{border-bottom:0}
.pv-day .pv-slot em{color:var(--pv-ink-3);font-style:normal;font-family:var(--pv-mono);font-size:10px}
.pv-day.today{border-color:rgba(216,184,119,.5);background:linear-gradient(180deg,var(--pv-gold-soft),transparent 70%)}
.pv-day.now .pv-slot.cur{color:var(--pv-gold)}
@media (max-width:900px){.pv-grid7{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* SVG 趋势图容器 */
.pv-chart{width:100%;height:120px;display:block}
.pv-chart .grid{stroke:rgba(232,226,214,.06)}
.pv-chart .line{fill:none;stroke:var(--pv-gold);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.pv-chart .area{fill:url(#pv-grad);opacity:.5}
.pv-chart .dot{fill:var(--pv-bg);stroke:var(--pv-gold);stroke-width:1.4}

/* 骨架屏 */
.pv-skeleton{height:12px;border-radius:4px;
  background:linear-gradient(90deg,var(--pv-surface-2) 25%,var(--pv-surface-3) 37%,var(--pv-surface-2) 63%);
  background-size:400% 100%;animation:pv-sk 1.4s ease infinite}
@keyframes pv-sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* 细节 */
.pv-panel>.pv-panel-h+.pv-hint{margin-top:-6px}
.pv-inline-code{background:var(--pv-surface-2);border:1px solid var(--pv-line);border-radius:4px;
  padding:1px 5px;font-family:var(--pv-mono);font-size:var(--pv-fs-xs)}
.pv-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="panel-title">拟人节奏<span class="meta">humanlike_rhythm v0.1.0</span></div>
      <div class="desc">在回复前加轻度随机停顿，避免秒回；可配置延迟区间。</div>
      <div class="grid grid-2">
        <div class="card">
          <div class="card-label">启用</div>
          <div class="card-value" id="cfgEnabled">--</div>
        </div>
        <div class="card">
          <div class="card-label">最小延迟</div>
          <div class="card-value" id="cfgMin">--</div>
        </div>
        <div class="card">
          <div class="card-label">最大延迟</div>
          <div class="card-value" id="cfgMax">--</div>
        </div>
        <div class="card">
          <div class="card-label">显示输入中</div>
          <div class="card-value" id="cfgTyping">--</div>
        </div>
        <div class="card">
          <div class="card-label">逐句延迟</div>
          <div class="card-value" id="cfgPer">--</div>
        </div>
        <div class="card">
          <div class="card-label">已延迟次数</div>
          <div class="card-value" id="cfgDelayed">--</div>
        </div>
      </div>
      <div class="back" onclick="window.parent.postMessage({type:'eggbloom:navigate',page:'plugins'},'*')">返回插件列表</div>
    </div>
  </div>
  <script>
    function $(id){ return document.getElementById(id) }
    fetch('/api/plugins').then(r=>r.json()).then(data=>{
      const list = (data && data.plugins) || [];
      const p = list.find(x => x.name === 'humanlike_rhythm');
      if (!p) return;
      if ($('cfgEnabled')) $('cfgEnabled').textContent = p.已启用 ? '启用' : '禁用';
      if ($('cfgMin')) $('cfgMin').textContent = String(p.最小延迟 ?? '--');
      if ($('cfgMax')) $('cfgMax').textContent = String(p.最大延迟 ?? '--');
      if ($('cfgTyping')) $('cfgTyping').textContent = p.显示输入中 ? '是' : '否';
      if ($('cfgPer')) $('cfgPer').textContent = p.逐句延迟 ? '是' : '否';
      if ($('cfgDelayed')) $('cfgDelayed').textContent = String(p.已延迟次数 ?? '--');
    }).catch(()=>{});
  </script>
<script>
(function(){
  if (window.__eggbMotion) return; window.__eggbMotion = true;
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button, .btn, .tool-item') : null;
    if(!btn || btn.disabled) return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.2;
    var r = document.createElement('span');
    r.className = 'btn-ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(function(){ r.remove(); }, 600);
  });
})();
</script>
</body>
</html>
