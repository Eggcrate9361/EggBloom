<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>主动消息</title>
<style id="pv-kit">/*PV-KIT*/
/* ═══════════════════════════════════════════════════════════════
   EggBloom 插件 UI 套件（1.5.10）
   目标：所有插件页共用一套 token 与组件，不再各写各的配色。
   用法：插件 ui.html 里 <style> 之前引入（构建期会内联），
        结构用 .pv-* 类；没有类的旧页面也会被基础层统一。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --pv-bg:#141210; --pv-panel:#1b1815; --pv-panel2:#211d18;
  --pv-line:#332c23; --pv-line2:#3f3629;
  --pv-ink:#e8e2d6; --pv-dim:#9a8f7d; --pv-faint:#6f6657;
  --pv-gold:#c9a96e; --pv-gold-d:#8d6b3f;
  --pv-ok:#7fae8a; --pv-warn:#c9935f; --pv-bad:#c96e5f;
  --pv-r:8px; --pv-r2:6px;
  --pv-font:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --pv-mono:'Consolas','JetBrains Mono',monospace;
}
html,body{background:var(--pv-bg)!important;color:var(--pv-ink)}
body{font:13px/1.65 var(--pv-font)!important;margin:0;padding:20px 22px 40px!important;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em;color:var(--pv-ink)}
h1{font-size:16px;letter-spacing:.14em;color:var(--pv-gold)}
h2{font-size:12px;letter-spacing:.18em;color:var(--pv-dim);font-weight:500}
code,.mono{font-family:var(--pv-mono);font-size:12px}
a{color:var(--pv-gold)}

/* ── 页头 ── */
.pv-head{margin-bottom:16px}
.pv-sub{color:var(--pv-dim);font-size:12px;margin-top:6px;letter-spacing:.03em}

/* ── 面板 ── */
.pv-panel{background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:var(--pv-r);
  padding:14px 16px;margin-bottom:14px}
.pv-panel>.pv-panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pv-panel>.pv-panel-h h2{flex:none}
.pv-rule{flex:1;height:1px;background:var(--pv-line);opacity:.8}
.pv-count{color:var(--pv-faint);font-size:11px;letter-spacing:.08em}

/* ── 表单 ── */
.pv-field{margin-bottom:12px}
.pv-label{display:block;color:var(--pv-dim);font-size:12px;margin-bottom:6px;letter-spacing:.04em}
.pv-input,.pv-textarea,.pv-select{
  width:100%;box-sizing:border-box;background:var(--pv-panel2);color:var(--pv-ink);
  border:1px solid var(--pv-line);border-radius:var(--pv-r2);padding:8px 10px;
  font:12px/1.6 var(--pv-mono);outline:none;transition:border-color .15s,box-shadow .15s}
.pv-textarea{min-height:120px;resize:vertical;font-family:var(--pv-mono)}
.pv-input:focus,.pv-textarea:focus,.pv-select:focus{
  border-color:var(--pv-gold);box-shadow:0 0 0 3px rgba(201,169,110,.12)}
.pv-hint{color:var(--pv-faint);font-size:11px;margin-top:6px;line-height:1.6}

/* ── 按钮 ── */
button,.pv-btn{background:var(--pv-panel2);color:var(--pv-ink);border:1px solid var(--pv-line);
  border-radius:var(--pv-r2);padding:7px 14px;cursor:pointer;
  font:12px/1 var(--pv-font);letter-spacing:.04em;transition:all .15s}
button:hover,.pv-btn:hover{border-color:var(--pv-gold);color:var(--pv-gold)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary,.pv-btn.primary{background:var(--pv-gold);color:#141210;border-color:var(--pv-gold);font-weight:600}
button.primary:hover{background:#d8bb85;color:#141210}
button.danger:hover{border-color:var(--pv-bad);color:var(--pv-bad)}

/* ── 数据条（状态/进度）── */
.pv-rows{display:grid;gap:10px}
.pv-row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:10px}
.pv-row .pv-lab{color:var(--pv-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar{height:8px;background:#241f19;border:1px solid #2b251e;border-radius:6px;overflow:hidden}
.pv-bar>i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--pv-gold-d),var(--pv-gold));transition:width .35s ease}
.pv-bar.warn>i{background:linear-gradient(90deg,#8d5a3f,var(--pv-warn))}
.pv-bar.bad>i{background:linear-gradient(90deg,#8d3f3f,var(--pv-bad))}
.pv-val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--pv-ink)}

/* ── 统计块 ── */
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pv-stat{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:10px 12px;text-align:center}
.pv-stat b{display:block;font-size:20px;color:var(--pv-gold);font-variant-numeric:tabular-nums}
.pv-stat span{display:block;color:var(--pv-faint);font-size:11px;margin-top:2px;letter-spacing:.08em}

/* ── 表格 ── */
.pv-table{width:100%;border-collapse:collapse;font-size:12px}
.pv-table th,.pv-table td{text-align:left;padding:7px 9px;border-bottom:1px solid #272219}
.pv-table th{color:var(--pv-dim);font-weight:500;letter-spacing:.06em;white-space:nowrap}
.pv-table tr:last-child td{border-bottom:0}
.pv-table td.k{color:var(--pv-gold);white-space:nowrap}

/* ── 标签 / 空态 / 提示 ── */
.pv-tag{display:inline-block;padding:2px 8px;border:1px solid var(--pv-line2);border-radius:999px;
  color:var(--pv-dim);font-size:11px;letter-spacing:.04em}
.pv-tag.ok{border-color:rgba(127,174,138,.45);color:var(--pv-ok)}
.pv-tag.bad{border-color:rgba(201,110,95,.45);color:var(--pv-bad)}
.pv-empty{color:var(--pv-faint);font-size:12px;text-align:center;padding:22px 10px}
.pv-msg{color:var(--pv-dim);font-size:12px;margin-top:10px;min-height:18px}
.pv-msg.ok{color:var(--pv-ok)}
.pv-msg.err{color:var(--pv-bad)}
.pv-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pv-day{background:var(--pv-panel2);border:1px solid var(--pv-line);border-radius:var(--pv-r2);
  padding:8px;min-height:92px}
.pv-day h3{font-size:11px;color:var(--pv-dim);letter-spacing:.1em;margin-bottom:6px}
.pv-day .pv-slot{font-size:11px;line-height:1.5;color:var(--pv-ink);padding:3px 0;
  border-bottom:1px dashed #2b251e}
.pv-day .pv-slot:last-child{border-bottom:0}
.pv-day .pv-slot em{color:var(--pv-faint);font-style:normal;font-family:var(--pv-mono);font-size:10px}
.pv-day.today{border-color:var(--pv-gold)}
.pv-day.now .pv-slot.cur{color:var(--pv-gold)}
</style>
</head>
<body>
  <div class="pv-head">
    <h1>主动消息</h1>
    <div class="pv-sub">心跳评估：沉默够久、时间合适、概率过了，就主动开口一次；不连发、不群发</div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>运行状态</h2><i class="pv-rule"></i><span class="pv-count" id="hb">—</span></div>
    <div class="pv-stats">
      <div class="pv-stat"><b id="s-last">—</b><span>上次主动</span></div>
      <div class="pv-stat"><b id="s-next">—</b><span>下次最早</span></div>
      <div class="pv-stat"><b id="s-user">—</b><span>对方上次说话</span></div>
      <div class="pv-stat"><b id="s-chance">—</b><span>当前开口概率</span></div>
    </div>
    <div class="pv-flex" style="margin-top:14px">
      <button class="primary" id="send-now">立即发一条</button>
      <button id="probe">试跑一次决策</button>
      <button id="refresh">刷新</button>
      <span class="pv-hint" style="margin:0">试跑不发送，只回各闸门结果</span>
    </div>
    <div class="pv-msg" id="msg"></div>
    <div id="probe-box"></div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>节奏</h2><i class="pv-rule"></i></div>
    <table class="pv-table">
      <thead><tr><th>项</th><th style="width:170px">值</th><th>说明</th></tr></thead>
      <tbody id="rhythm"></tbody>
    </table>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>对象与话术</h2><i class="pv-rule"></i></div>
    <div class="pv-flex" style="align-items:flex-start">
      <div class="pv-field" style="flex:1;min-width:170px;margin:0">
        <label class="pv-label">目标私聊 QQ（空 = 主配置第一个）</label>
        <input class="pv-input" id="f-target" placeholder="10003">
      </div>
      <div class="pv-field" style="flex:1;min-width:150px;margin:0">
        <label class="pv-label">称呼</label>
        <input class="pv-input" id="f-nick" placeholder="（可空）">
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:2px">
        <button id="save-basic">保存</button>
      </div>
    </div>
    <div class="pv-field" style="margin-top:12px">
      <label class="pv-label">追加人设（接在默认风格约束后面）</label>
      <textarea class="pv-textarea" id="f-persona" style="min-height:90px"></textarea>
    </div>
  </div>

  <div class="pv-panel">
    <div class="pv-panel-h"><h2>最近主动记录</h2><i class="pv-rule"></i>
      <span class="pv-count" id="hist-n">—</span></div>
    <table class="pv-table">
      <thead><tr><th style="width:70px">时间</th><th>内容</th></tr></thead>
      <tbody id="hist"></tbody>
    </table>
  </div>

<script>
const API='/api/plugins/action';
const $=id=>document.getElementById(id);
const msg=$('msg');
let CFG={};

async function call(action,params){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plugin_id:'proactive_talk',action,params:params||{}})});
  const t=await r.text(); try{return JSON.parse(t)}catch{return {raw:t}}
}
function setMsg(t,ok){ msg.className='pv-msg '+(ok?'ok':'err'); msg.textContent=t||''; }
function ago(ts){
  if(!ts) return '—';
  const s=Math.max(0,Math.floor(Date.now()/1000-ts));
  if(s<60) return s+' 秒前';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return (s/3600).toFixed(1)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}
function clock(ts){ return ts?new Date(ts*1000).toLocaleString():'—'; }

function row(label, inputHtml, hint){
  return '<tr><td class="k">'+label+'</td><td>'+inputHtml+'</td>'
    +'<td class="pv-hint" style="margin:0">'+(hint||'')+'</td></tr>';
}
function drawRhythm(c){
  const num=(k,step)=>'<input class="pv-input" data-c="'+k+'" type="number" step="'+(step||1)+'" value="'+(c[k]!=null?c[k]:'')+'">';
  const bool=(k)=>'<label class="pv-flex" style="margin:0"><input type="checkbox" data-c="'+k+'" '
    +(c[k]?'checked':'')+'> <span class="pv-hint" style="margin:0">启用</span></label>';
  $('rhythm').innerHTML=[
    row('心跳间隔(秒)', num('heartbeat_sec'), '多久评估一次要不要开口'),
    row('最小间隔(分钟)', num('min_interval_min'), '两次主动之间的硬间隔'),
    row('对方刚说话(分钟)', num('active_cooldown_min'), '对方刚说完不久就不打扰'),
    row('开口概率', num('speak_chance',0.05), '每次心跳通过闸门的概率 0–1'),
    row('静默时段', '<input class="pv-input" data-c="quiet_hours" value="'+((c.quiet_hours||'')).replace(/"/g,'&quot;')+'" placeholder="2:00-7:00">', '留空 = 不静默'),
    row('作息乘子', bool('bio_rhythm'), '凌晨更懒、晚上更活跃（软闸）'),
    row('单次气泡数', num('max_bubbles'), '一次最多发几条'),
    row('记忆注入', bool('use_memory'), '带上最近几轮私聊'),
    row('人设注入', bool('use_personality'), '与群聊里的它一致'),
    row('情绪注入', bool('use_mood'), '按当前心情调整语气')
  ].join('');
}
function drawStatus(st){
  $('hb').textContent=st.heartbeat_alive?'心跳线程运行中':'心跳线程未运行';
  $('s-last').textContent=ago(st.last_proactive_ts);
  $('s-user').textContent=ago(st.last_user_ts);
  const minInt=Number(CFG.min_interval_min||0)*60;
  const next=st.last_proactive_ts?Math.max(0,st.last_proactive_ts+minInt-Math.floor(Date.now()/1000)):0;
  $('s-next').textContent=next>0?(Math.ceil(next/60)+' 分钟后'):'现在可以';
  $('s-chance').textContent=(CFG.speak_chance!=null?Number(CFG.speak_chance).toFixed(2):'—');
  const hist=st.history||[];
  $('hist-n').textContent=hist.length?('最近 '+hist.length+' 条'):'暂无';
  $('hist').innerHTML=hist.slice().reverse().map(h=>{
    const ts=h.ts||h.time||0, text=h.text||h.content||JSON.stringify(h);
    return '<tr><td class="mono">'+(ts?new Date(ts*1000).toLocaleTimeString():'—')+'</td><td>'
      +String(text).replace(/</g,'&lt;')+'</td></tr>';
  }).join('')||'<tr><td colspan="2" class="pv-empty">还没有主动发过</td></tr>';
}
async function load(){
  const r=await call('get_config');
  CFG=(r&&(r.config||r))||{};
  if(CFG.config) CFG=CFG.config;
  $('f-target').value=CFG.target_qq||'';
  $('f-nick').value=CFG.nickname||'';
  $('f-persona').value=CFG.persona_extra||'';
  drawRhythm(CFG);
  const st=await call('get_status');
  if(st&&st.ok) drawStatus(st);
}
$('refresh').onclick=load;
$('save-basic').onclick=async()=>{
  const r=await call('set_config',{target_qq:$('f-target').value.trim(),
    nickname:$('f-nick').value.trim(), persona_extra:$('f-persona').value});
  if(r&&(r.ok!==false)){ setMsg('已保存',true); await load(); } else setMsg('保存失败：'+JSON.stringify(r),false);
};
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(!el||!el.dataset||!el.dataset.c) return;
  const k=el.dataset.c;
  let v=el.type==='checkbox'?el.checked:el.value;
  const r=await call('set_config',{[k]:v});
  if(r&&(r.ok!==false)){ setMsg('已更新 '+k,true); await load(); } else setMsg('更新失败：'+JSON.stringify(r),false);
});
$('send-now').onclick=async()=>{
  if(!confirm('立即主动发一条？会跳过所有闸门。')) return;
  const r=await call('send_now');
  setMsg((r&&r.msg)||JSON.stringify(r), !!(r&&r.ok));
  setTimeout(load, 3000);
};
$('probe').onclick=async()=>{
  const r=await call('test_decision');
  const box=$('probe-box');
  if(!r||r.ok===false){ box.innerHTML='<div class="pv-msg err">试跑失败：'+JSON.stringify(r)+'</div>'; return; }
  const skip=JSON.stringify(r,null,1);
  box.innerHTML='<pre class="mono" style="background:#211d18;border:1px solid var(--pv-line);'
    +'border-radius:6px;padding:10px;overflow:auto;max-height:220px">'+skip.replace(/</g,'&lt;')+'</pre>';
};
load();
setInterval(async()=>{ const st=await call('get_status'); if(st&&st.ok) drawStatus(st); }, 15000);
</script>
</body>
</html>
