    pp.style.visibility = 'visible'; sk.style.display = 'block'; nn.textContent = '下一步';
    var ge = $('oboGoEgo'); if(ge) ge.addEventListener('click', function(){ router('plugin_ego'); });
    API('/plugins/action', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plugin_id:'ego',action:'wizard_status'})}).then(function(r){
      var done = !!(r && r.done);
      var e = $('oboEgoStatus'); if(e){ e.textContent = done ? '已完成 ✓（可到 EGO 页微调人格 / 记忆 / 黑话）' : '未完成 —— 点下方按钮开始 5 步引导'; }
    }).catch(function(){ var e = $('oboEgoStatus'); if(e) e.textContent = 'EGO 未启用或后端无响应（可在插件页开启）'; });
  } else if(st==='done'){
    head.textContent = '一切就绪';
    sub.textContent = '你已经了解了 EggBloom 的基本用法。';
    body.innerHTML = '<div class="obo-step obo-done"><div class="big">✦</div><div class="tt">开始使用 EggBloom</div><div class="dd">先去「协议」连接 QQ 协议层（推荐 SnowLuma，登录后即可用完整群管理），再到「EGO」完成人格引导，最后到「Bot 控制」启动机器人；更多参数可在「配置中心」调整。<br>以后想再看引导，点右上角「?」按钮即可。</div></div>';
    pp.style.visibility = 'visible'; sk.style.display = 'none'; nn.textContent = '完成';
  }
}
function oboBind(){
  var ov = $('oboOverlay'); if(!ov) return;
  var pp = $('oboPrev'), nn = $('oboNext'), sk = $('oboSkiplnk');
  if(pp) pp.addEventListener('click', function(){ oboGo(obo.idx-1); });
  if(nn) nn.addEventListener('click', function(){
    var st = OBO_STEPS[obo.idx];
    if(st==='config'){
      var qqV=($('oboQq')?$('oboQq').value:'').trim(), keyV=($('oboKey')?$('oboKey').value:'').trim(), urlV=($('oboUrl')?$('oboUrl').value:'').trim(), qpV=($('oboQqPath')?$('oboQqPath').value:'').trim();
      var payload = {bot_qq:qqV, api_key:keyV, api_url:urlV, qq_path:qpV};
      API('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(){
        obo.goNext = true; nn.textContent='下一步'; oboGo(obo.idx+1);
      }).catch(function(){ showToast('保存失败，请重试','error'); return; });
    } else if(obo.idx >= OBO_STEPS.length-1){
      oboClose();
    } else {
      oboGo(obo.idx+1);
    }
  });
  if(sk) sk.addEventListener('click', oboSkip);
  var pb = $('oboPreviewBtn');
  if(pb) pb.addEventListener('click', function(){ oboOpen(true); });
}
function oboInit(){
  oboBind();
  var done = false; try{ done = !!localStorage.getItem(OBO_KEY); }catch(e){}
  if(done) return;
  // 读取当前配置判断是否需引导
  API('/config').then(function(r){
    var c = (r&&r.config)?r.config:{};
    obo.cfg.api_key = c.api_key||''; obo.cfg.bot_qq = c.bot_qq||''; obo.cfg.api_url = c.api_url||''; obo.cfg.qq_path = c.qq_path||'';
    var unconfigured = !c.api_key || !c.bot_qq;
    // 首次进入且未配置 -> 自动引导；已配置则标记完成不再打扰
    if(unconfigured){ setTimeout(function(){ oboOpen(false); }, 900); }
    else { try{ localStorage.setItem(OBO_KEY,'1'); }catch(e){} }
  }).catch(function(){});
}
oboInit();/* customSelectEnhanceInjected */

/* ── 自定义下拉框增强（动效，v2 重写） ── */
(function(){
  'use strict';

  // ── 状态 ─────────────────────────────────────────────
  var ARROW_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var sharedPanel = null;   // 全局唯一面板（挂 document.body）
  var active = null;        // { wrap, sel, panel } 当前打开的
  var openTimer = null;

  // ── 面板 ─────────────────────────────────────────────
  function getPanel(){
    if (sharedPanel) return sharedPanel;
    var p = document.createElement('div');
    p.className = 'egg-select-panel';
    // 隔离面板内部事件，避免冒泡触发应用全局 handler（冒泡阶段拦截，不影响子元素先处理）
    ['pointerdown','mousedown','click','contextmenu'].forEach(function(ev){
      p.addEventListener(ev, function(e){ e.stopPropagation(); });
    });
    document.body.appendChild(p);
    sharedPanel = p;
    return p;
  }

  function positionPanel(wrap, panel){
    var trig = wrap.__trig;
    var r = trig.getBoundingClientRect();
    if (!r || r.width === 0 || r.height === 0) return false;
    var H = Math.min(280, Math.max(150, r.height * 6));
    panel.style.maxHeight = H + 'px';
    panel.style.minWidth = Math.max(r.width, 200) + 'px';
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + 'px';
    panel.classList.remove('from-bottom');
    if ((window.innerHeight - r.bottom - 10) >= H){
      panel.style.top = (r.bottom + 6) + 'px';
      panel.style.bottom = 'auto';
    } else {
      panel.classList.add('from-bottom');
      panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
      panel.style.top = 'auto';
    }
    return true;
  }

  // ── 打开 / 关闭 ──────────────────────────────────────
  function openPanel(wrap, sel){
    var panel = getPanel();
    wrap.__panel = panel;
    panel.style.visibility = '';   // 清除 instant-close 遗留的内联 hidden
    buildOptions(wrap, sel);
    syncValue(wrap, sel);
    var h = measureHeight(sel);
    if (h > 10 && Math.abs(h - (parseInt(wrap.style.height, 10) || 0)) > 2) wrap.style.height = h + 'px';
    if (!positionPanel(wrap, panel)) return;
    if (active && active.panel !== panel) closePanel(true);
    active = { wrap: wrap, sel: sel, panel: panel };
    wrap.classList.add('is-open');
    panel.classList.add('open');
    var cur = panel.querySelector('.egg-option.is-selected');
    if (cur){ cur.classList.add('is-hover'); }
    // 滚动到已选项（下一帧，等面板渲染）
    if (cur){
      clearTimeout(openTimer);
      openTimer = setTimeout(function(){ try{ cur.scrollIntoView({block:'nearest'}); }catch(e){} }, 30);
    }
    document.addEventListener('mousedown', onDocDown, true);
    document.addEventListener('keydown', onDocKey, true);
  }

  function closePanel(instant){
    if (!active) return;
    var a = active;
    active = null;
    clearTimeout(openTimer);
    a.panel.classList.remove('open');
    if (a.wrap) a.wrap.classList.remove('is-open');
    if (instant){
      a.panel.style.transition = 'none';
      a.panel.style.visibility = 'hidden';
      a.panel.getBoundingClientRect();
      a.panel.style.transition = '';
    }
    document.removeEventListener('mousedown', onDocDown, true);
    document.removeEventListener('keydown', onDocKey, true);
  }

  // ── 全局事件 ─────────────────────────────────────────
  function onDocDown(e){
    if (!active) return;
    var panel = active.panel;
    // 完整命中链判定：面板/触发器/包裹器内部都不关闭
    var path = e.composedPath ? e.composedPath() : [];
    for (var i = 0; i < path.length; i++){
      var n = path[i];
      if (n === panel) return;
      if (n && n.classList && (n.classList.contains('egg-select-wrap') || n.classList.contains('egg-select-trigger'))) return;
      if (n === document || n === window || n === document.documentElement) break;
    }
    closePanel(true);
  }
  function onDocKey(e){
    if (!active) return;
    if (e.key === 'Escape'){ e.preventDefault(); closePanel(true); }
    else if (e.key === 'Tab'){ closePanel(true); }
  }
  function onScrollRepos(){
    if (active) positionPanel(active.wrap, active.panel);
  }
  function onWinResize(){
    if (active) positionPanel(active.wrap, active.panel);
  }

  // ── 选项构建与同步 ───────────────────────────────────
  function buildOptions(wrap, sel){
    var panel = wrap.__panel || getPanel();
    wrap.__panel = panel;
    var opts = sel.options || [];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < opts.length; i++){
      if (opts[i].disabled) continue;
      (function(idx){
        var div = document.createElement('div');
        div.className = 'egg-option';
        div.dataset.index = idx;
        var span = document.createElement('span');
        span.className = 'egg-opt-text';
        span.textContent = opts[idx].textContent || opts[idx].label || '';
        div.appendChild(span);
        if (idx === sel.selectedIndex) div.classList.add('is-selected');
        div.addEventListener('mousedown', function(ev){ ev.preventDefault(); ev.stopPropagation(); });
        div.addEventListener('click', function(ev){
          ev.stopPropagation();
          if (sel.value === opts[idx].value){ closePanel(false); return; }
          sel.value = opts[idx].value;
          sel.dispatchEvent(new Event('change', {bubbles:true}));
          sel.dispatchEvent(new Event('input', {bubbles:true}));
          syncValue(wrap, sel);
          closePanel(false);
        });
        frag.appendChild(div);
      })(i);
    }
    panel.innerHTML = '';
    panel.appendChild(frag);
  }
  function syncValue(wrap, sel){
    var v = wrap.__value;
    var idx = sel.selectedIndex;
    var txt = (idx >= 0 && sel.options[idx]) ? (sel.options[idx].textContent || '') : '';
    v.textContent = txt;
    v.classList.toggle('is-empty', !txt);
    var panel = wrap.__panel;
    if (panel){
      var items = panel.querySelectorAll('.egg-option');
      for (var i = 0; i < items.length; i++) items[i].classList.toggle('is-selected', i === idx);
    }
  }
  function measureHeight(sel){
    var h = sel.getBoundingClientRect().height;
    if (h && h > 10) return Math.round(h);
    try {
      var cs = getComputedStyle(sel);
      var fs = parseFloat(cs.fontSize) || 13;
      var lh = cs.lineHeight === 'normal' ? Math.round(fs * 1.4) : (parseFloat(cs.lineHeight) || Math.round(fs * 1.4));
      return Math.round((parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0) + (parseFloat(cs.borderTopWidth)||0) + (parseFloat(cs.borderBottomWidth)||0) + lh + 2);
    } catch(e){ return 40; }
  }
  function moveHover(wrap, sel, dir){
    var panel = wrap.__panel;
    if (!panel) return;
    var items = panel.querySelectorAll('.egg-option');
    if (!items.length) return;
    var idx = -1;
    for (var i = 0; i < items.length; i++){ if (items[i].classList.contains('is-hover')){ idx = i; break; } }
    if (idx < 0){
      for (var j = 0; j < items.length; j++){ if (items[j].classList.contains('is-selected')){ idx = j; break; } }
      if (idx < 0) idx = -1;
    }
    idx = Math.min(Math.max(0, idx + dir), items.length - 1);
    for (var k = 0; k < items.length; k++) items[k].classList.toggle('is-hover', k === idx);
    items[idx].scrollIntoView({block:'nearest'});
  }

  // ── 增强单个 select ──────────────────────────────────
  function enhanceSelect(sel){
    if (sel.__egg2 || sel.closest('.egg-select-wrap')) return;
    sel.__egg2 = true;
    var wrap = document.createElement('div');
    wrap.className = 'egg-select-wrap';
    var st = sel.style;
    ['width','maxWidth','minWidth','flex','flexGrow','flexShrink','flexBasis','margin','alignSelf'].forEach(function(p){ if (st[p]) wrap.style[p] = st[p]; });
    if (!wrap.style.width) wrap.style.width = '100%';
    wrap.style.height = (measureHeight(sel)) + 'px';
    // 原生 select 仅作值载体：不可交互、不可见但保留布局尺寸已由 wrap 承担
    sel.style.width = '100%';
    sel.style.height = '100%';
    sel.style.margin = '0';
    sel.style.position = 'absolute';
    sel.style.top = '0';
    sel.style.left = '0';
    sel.style.opacity = '0';
    sel.style.pointerEvents = 'none';
    sel.style.appearance = 'none';
    sel.classList.add('egg-native');
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    // 触发器
    var trig = document.createElement('button');
    trig.type = 'button';
    trig.className = 'egg-select-trigger';
    trig.tabIndex = 0;
    var val = document.createElement('span');
    val.className = 'egg-value';
    var ar = document.createElement('span');
    ar.className = 'egg-arrow';
    ar.innerHTML = ARROW_SVG;
    trig.appendChild(val);
    trig.appendChild(ar);
    wrap.appendChild(trig);
    wrap.__trig = trig; wrap.__value = val; wrap.__panel = getPanel();
    function syncDisabled(){ wrap.classList.toggle('is-disabled', !!sel.disabled); trig.disabled = !!sel.disabled; }
    syncDisabled();
    trig.addEventListener('mousedown', function(e){ e.preventDefault(); });
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      if (sel.disabled) return;
      if (active && active.wrap === wrap) closePanel(false);
      else openPanel(wrap, sel);
    });
    trig.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
        e.preventDefault();
        if (!(active && active.wrap === wrap)){ openPanel(wrap, sel); }
        else if (e.key === 'ArrowDown'){ moveHover(wrap, sel, 1); }
        else {
          var hv = wrap.__panel.querySelector('.egg-option.is-hover');
          if (hv) hv.click();
        }
      } else if (e.key === 'ArrowUp'){
        e.preventDefault();
        if (active && active.wrap === wrap) moveHover(wrap, sel, -1);
      } else if (e.key === 'Tab' || e.key === 'Escape'){
        closePanel(true);
      }
    });
    if (typeof MutationObserver === 'function'){
      var obs = new MutationObserver(function(){ buildOptions(wrap, sel); syncValue(wrap, sel); syncDisabled(); });
      obs.observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled']});
      wrap.__obs = obs;
    }
    buildOptions(wrap, sel);
    syncValue(wrap, sel);
  }
  function scanAll(root){
    if (!root || !root.querySelectorAll) return;
    var lists = root.querySelectorAll('select');
    for (var i = 0; i < lists.length; i++){
      var s = lists[i];
      if (s.closest('.egg-select-wrap')) continue;
      enhanceSelect(s);
    }
  }
  function init(){
    window.addEventListener('scroll', onScrollRepos, true);
    window.addEventListener('resize', onWinResize);
    scanAll(document);
    if (typeof MutationObserver === 'function'){
      new MutationObserver(function(muts){
        for (var m = 0; m < muts.length; m++){
          var added = muts[m].addedNodes;
          for (var n = 0; n < added.length; n++){
            var node = added[n];
            if (!node || node.nodeType !== 1) continue;
            if (node.tagName === 'SELECT'){ enhanceSelect(node); }
            else { scanAll(node); }
          }
        }
      }).observe(document.body, {childList:true, subtree:true});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
