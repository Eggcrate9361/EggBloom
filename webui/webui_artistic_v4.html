/* ⑮ Agent —— 节点连线（点 + 连线，像拓扑） */
html[data-page="agent"] .deco{opacity:.62}
html[data-page="agent"] .deco::before{left:10vw;top:20vh;width:34vw;height:28vh;
  background:
    linear-gradient(28deg,transparent 0 44%,var(--c30-ink) 44% calc(44% + 1.5px),transparent calc(44% + 1.5px)),
    linear-gradient(-18deg,transparent 0 62%,var(--c30-ink) 62% calc(62% + 1.5px),transparent calc(62% + 1.5px)),
    radial-gradient(circle,var(--c10) 0 4px,transparent 5px) 0 0/34vw 14vh,
    radial-gradient(circle,var(--c30-ink) 0 4px,transparent 5px) 100% 0/34vw 14vh,
    radial-gradient(circle,var(--c30-ink) 0 4px,transparent 5px) 50% 100%/34vw 14vh}
html[data-page="agent"] .deco::after{right:12vw;top:24vh;width:16vw;height:2px;
  background:linear-gradient(90deg,transparent,var(--c10));opacity:.6}

@media (max-width:1080px){.deco{display:none}}


/* ══════════════════════════════════════════════════════════════════
   第二套母题（小）：与大构图呼应但更小、更精、位置错开。
   用 .deco 的第二层（i.i1 之外的 b.el），共享 data-page 切换。
   大构图在角落撑场，小母题在另一侧补一笔 —— 一页两套，层次更多。
   ══════════════════════════════════════════════════════════════════ */
.deco .el{position:absolute;display:block;opacity:.78}

/* 每页的小母题：形状 + 位置 + 动效（动效延续大构图的语义） */
/* ① 仪表盘：小刻度方块（像读数窗） */
html[data-page="dashboard"] .deco .el{right:22vw;bottom:20vh;width:52px;height:26px;
  border:2px solid var(--c30-ink);
  background:repeating-linear-gradient(90deg,var(--c30-ink) 0 2px,transparent 2px 9px);
  animation:decoBlink 3.2s steps(2,end) infinite}
/* ② 协议：小端子排 */
html[data-page="protocol"] .deco .el{left:8vw;bottom:18vh;width:64px;height:14px;
  background:repeating-linear-gradient(90deg,var(--c10) 0 4px,transparent 4px 12px);
  animation:decoBlink 1.4s steps(2,end) infinite}
/* ③ 群管理：小型音轨条 */
html[data-page="groupmanage"] .deco .el{right:14vw;top:22vh;width:44px;height:30px;
  background:repeating-linear-gradient(90deg,var(--c30-ink) 0 3px,transparent 3px 8px);
  animation:decoBar 2s ease-in-out infinite alternate;transform-origin:center}
/* ④ 表情包：三个小点 + 短线 */
html[data-page="memes"] .deco .el{left:20vw;top:26vh;width:58px;height:2px;
  background:repeating-linear-gradient(90deg,var(--c10) 0 6px,transparent 6px 18px);
  animation:decoSlideX 6s linear infinite}
/* ⑤ 生图：小取景框 */
html[data-page="imagegen"] .deco .el{right:16vw;bottom:24vh;width:40px;height:40px;
  border:2px solid var(--c10);
  border-left-color:transparent;border-bottom-color:transparent;
  animation:decoSpin 22s linear infinite}
/* ⑥ 行为：迷你波形条 */
html[data-page="behavior"] .deco .el{right:10vw;top:30vh;width:56px;height:18px;
  background:repeating-linear-gradient(90deg,var(--c30-ink) 0 2px,transparent 2px 7px);
  -webkit-mask-image:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 5px);
  mask-image:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 5px);
  animation:decoSlideX 4s linear infinite}
/* ⑦ Token：小数据流节点 */
html[data-page="tokens"] .deco .el{left:18vw;top:20vh;width:50px;height:2px;
  background:repeating-linear-gradient(90deg,var(--c10) 0 5px,transparent 5px 16px);
  animation:decoSlideX 3.2s linear infinite}
/* ⑧ 配置：小点阵窗 */
html[data-page="settings"] .deco .el{right:20vw;bottom:30vh;width:46px;height:23px;
  background:radial-gradient(circle,var(--c30-ink) 0 2px,transparent 3px) 0 0/11px 11px;
  animation:decoBreath 4.4s ease-in-out infinite}
/* ⑨ Bot：小仪表弧 */
html[data-page="bot"] .deco .el{left:16vw;bottom:26vh;width:34px;height:34px;
  border:2px solid var(--c10);border-right-color:transparent;border-radius:50%;
  animation:decoSpinR 15s linear infinite}
/* ⑩ 日志：小文本行组 */
html[data-page="chatlogs"] .deco .el{right:8vw;top:18vh;width:52px;height:26px;
  background:repeating-linear-gradient(180deg,var(--c30-ink) 0 2px,transparent 2px 9px);
  animation:decoSlideY 2.4s linear infinite}
/* ⑪ 通知：小雷达 */
html[data-page="monitor"] .deco .el{right:26vw;bottom:22vh;width:36px;height:36px;
  border:1.5px solid var(--c30-ink);border-radius:50%;
  background:radial-gradient(circle,var(--c10) 0 2.5px,transparent 3.5px);
  animation:decoBreath 3s ease-in-out infinite}
/* ⑫ 控制台：小光标条 */
html[data-page="console"] .deco .el{right:20vw;bottom:20vh;width:22px;height:14px;
  background:var(--c10);animation:decoCaret 1.15s steps(2,end) infinite}
/* ⑬ 记忆：小螺旋点 */
html[data-page="memory"] .deco .el{right:24vw;top:24vh;width:26px;height:26px;
  border:2px dashed var(--c10);border-radius:50%;
  animation:decoSpinR 18s linear infinite}
/* ⑭ 插件：小斜网格 */
html[data-page="plugins"] .deco .el{left:10vw;top:52vh;width:44px;height:30px;
  background:
    repeating-linear-gradient(45deg,var(--c30-ink) 0 1.5px,transparent 1.5px 9px),
    repeating-linear-gradient(-45deg,var(--c30-ink) 0 1.5px,transparent 1.5px 9px);
  animation:decoDrift 20s ease-in-out infinite alternate}
/* ⑮ Agent：小连线节点 */
html[data-page="agent"] .deco .el{right:8vw;bottom:28vh;width:48px;height:2px;
  background:repeating-linear-gradient(90deg,var(--c10) 0 4px,transparent 4px 13px);
  animation:decoSlideX 3.6s linear infinite}

/* ══════════════════════════════════════════════════════════════════
   母题动效：每页的装饰都在动，但**动法符合它的语义**
   —— 该转的转（仪表盘/记忆螺旋/仪表圆弧）、该流的流（数据/日志/接线）、
      该跳的跳（音轨）、该呼吸的呼吸（取景框/点阵）。
   全部只动 transform / opacity / background-position，不触发重排。
   统一尊重 prefers-reduced-motion（系统关掉动画时静止，不硬动）。
   ══════════════════════════════════════════════════════════════════ */
@keyframes decoSpin{to{transform:rotate(360deg)}}
@keyframes decoSpinR{to{transform:rotate(-360deg)}}
@keyframes decoSpin3{to{transform:rotate(360deg)}}
@keyframes decoBreath{0%,100%{opacity:.34}50%{opacity:.72}}
@keyframes decoDrift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(1.4vw,-1vh,0)}100%{transform:translate3d(0,0,0)}}
@keyframes decoSlideY{0%{background-position:0 0}100%{background-position:0 44px}}
@keyframes decoSlideX{0%{background-position:0 0}100%{background-position:44px 0}}
@keyframes decoBlink{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes decoPulse{0%{opacity:.28;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}100%{opacity:.28;transform:scale(1)}}
@keyframes decoBar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.42)}}
@keyframes decoCaret{0%,100%{opacity:1}50%{opacity:0}}

/* ① 仪表盘 —— 十字准星缓慢自转（仪表在走） */
html[data-page="dashboard"] .deco::before{animation:decoSpin 74s linear infinite}
html[data-page="dashboard"] .deco::after{animation:decoBreath 7.5s ease-in-out infinite}

/* ② 协议 —— 接线端子台：端子呼吸（像通电指示） */
/* 端子指示灯：steps(2) 是"闪现"不是渐变，采样落在同一步内看不出变化，
   所以周期要短（1.1s）才像通电指示；2.6s 太慢，看着像没动。*/
html[data-page="protocol"] .deco::after{animation:decoBlink 1.1s steps(2,end) infinite}

/* ③ 群管理 —— 音轨刻度：条形跳动（像音量） */
html[data-page="groupmanage"] .deco{animation:decoBar 2.4s ease-in-out infinite alternate;
  transform-origin:left bottom}

/* ④ 表情包 —— 散点阵：整体缓缓漂移 */
html[data-page="memes"] .deco{animation:decoDrift 26s ease-in-out infinite}
html[data-page="memes"] .deco::before{animation:decoSpin3 60s linear infinite}

/* ⑤ 生图 —— 取景框：四角呼吸（像对焦中） */
html[data-page="imagegen"] .deco::before{animation:decoBreath 3.4s ease-in-out infinite}
html[data-page="imagegen"] .deco::after{animation:decoPulse 3.4s ease-in-out infinite}

/* ⑥ 行为 —— 波形折线：横向流动（像声波推进） */
html[data-page="behavior"] .deco::before{animation:decoSlideX 5.2s linear infinite}

/* ⑦ Token —— 数据流：流向线滚动 + 节点脉冲 */
html[data-page="tokens"] .deco::after{animation:decoSlideX 3.8s linear infinite}
html[data-page="tokens"] .deco::before{animation:decoPulse 2.8s ease-in-out infinite}

/* ⑧ 配置中心 —— 索引点阵：整体呼吸（像待命指示灯） */
html[data-page="settings"] .deco::before{animation:decoBreath 5.2s ease-in-out infinite}
html[data-page="settings"] .deco::after{animation:decoSlideX 7s linear infinite}

/* ⑨ Bot —— 分段大圆弧：缓慢自转（机械仪表在扫） */
html[data-page="bot"] .deco::before{animation:decoSpin 46s linear infinite}
html[data-page="bot"] .deco::after{animation:decoSpinR 68s linear infinite}

/* ⑩ 日志 —— 文本行：向下滚动（日志在流） */
html[data-page="chatlogs"] .deco{animation:decoSlideY 2.2s linear infinite}

/* ⑪ 通知 —— 雷达同心圆：**跟随鼠标**（JS 写 --mx/--my）+ 自转扫描线 */
html[data-page="monitor"] .deco::before{
  transform:translate3d(calc(var(--mx,0) * 1px), calc(var(--my,0) * 1px), 0);
  transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
html[data-page="monitor"] .deco::after{
  transform:translate3d(calc(var(--mx,0) * .6px), calc(var(--my,0) * .6px), 0);
  transition:transform 260ms cubic-bezier(.2,.7,.3,1);
  animation:decoSpin 9s linear infinite}

/* ⑫ 控制台 —— 终端角标 + 光标块：光标闪烁 */
html[data-page="console"] .deco::after{animation:decoCaret 1.05s steps(2,end) infinite}
html[data-page="console"] .deco::before{animation:decoBreath 6s ease-in-out infinite}

/* ⑬ 记忆 —— 螺旋：缓慢自转（最该转的一页：记忆在回旋） */
html[data-page="memory"] .deco::before{animation:decoSpin3 88s linear infinite}
html[data-page="memory"] .deco::after{animation:decoPulse 3.6s ease-in-out infinite}

/* ⑭ 插件 —— 交叉斜网：缓慢平移（模块在拼装） */
html[data-page="plugins"] .deco{animation:decoDrift 34s ease-in-out infinite alternate}
html[data-page="plugins"] .deco::before{animation:decoSpin 42s linear infinite}

/* ⑮ Agent —— 节点连线：连线亮起脉冲（像信号传输） */
html[data-page="agent"] .deco::before{animation:decoPulse 3.2s ease-in-out infinite}
html[data-page="agent"] .deco::after{animation:decoSlideX 4.4s linear infinite}

@media (prefers-reduced-motion: reduce){
  .deco::before,.deco::after,.deco{animation:none !important}
}

/* ══════════════════════════════════════════════════════════════════
   常驻状态显示器（参考稿左下角那条「群 / 好友　消息　状态」）
   固定在底部、指针穿透；只显示不需要点击的东西，所以不挡任何操作。
   ══════════════════════════════════════════════════════════════════ */
/* 放在**标题带下方右对齐**：底部那条会压住内容（用户反馈），标题带这行
   本来就是"仪表区"（页码 + 英文 + 状态），语义上也对。
   z-index 高于内容、pointer-events:none —— 看得见但点不到，不干扰任何操作。*/
.hud{position:fixed;right:40px;top:112px;z-index:13;pointer-events:none;
  display:flex;align-items:center;gap:var(--s4);
  padding:5px 11px 5px 10px;
  border:1px solid color-mix(in srgb,var(--c30-ink) 40%,transparent);
  border-left:2px solid var(--c10);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  font-family:var(--f-m);font-size:9px;letter-spacing:.14em;color:var(--ink4)}
.hud .cell{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hud .cell b{font-weight:400;color:var(--ink2)}
.hud .cell .k{color:var(--ink4)}
.hud .dot{width:6px;height:6px;border-radius:50%;background:var(--ink4);flex:none}
.hud .dot.on{background:var(--ok);box-shadow:0 0 6px color-mix(in srgb,var(--ok) 60%,transparent)}
.hud .dot.off{background:var(--err)}
.hud .dot.warn{background:var(--warn)}
.hud .t{color:var(--ink4);padding-left:var(--s3);border-left:1px solid var(--c30-ink)}
.hud .t b{color:var(--ink2)}

/* Agent 页：左会话列表 + 右对话/轨迹 */
.ag-wrap{display:grid;grid-template-columns:206px 1fr;gap:var(--s5);align-items:start}
.ag-sess{border-right:1px solid var(--line);padding-right:var(--s4);min-width:0}
#agSess{max-height:min(60vh,640px);overflow:auto}   /* 会话列表限高内滚，与右侧对话框同高 */
.ag-sess .it{padding:7px 8px;border:1px solid transparent;cursor:pointer;font-size:12px;
  color:var(--ink2);transition:background 120ms linear,border-color 120ms linear}
.ag-sess .it:hover{background:var(--c30-ink);color:var(--ink)}
.ag-sess .it.on{border-color:var(--c10);color:var(--c10);background:transparent}
/* 会话条目悬停操作：归档 / 删除（2026-10-29 补——以前整个列表只能点进去，
   归档、删除都没有入口，列表只会越积越长） */
.ag-sess .it .it-ops{display:none;gap:6px;margin-top:3px}
.ag-sess .it:hover .it-ops{display:flex}
.ag-sess .it .it-ops .lnk{font-size:10px;color:var(--ink4);padding:0}
.ag-sess .it:hover .it-ops .lnk{color:var(--ink2)}
.ag-sess .it .it-ops .lnk:hover{color:var(--c10)}
/* 已归档折叠区：默认收起，弱化显示；恢复后回到主列表 */
.ag-sess details.ag-arc{margin-top:var(--s3);border-top:1px solid var(--line);padding-top:var(--s3)}
.ag-sess details.ag-arc summary{cursor:pointer;font-size:10px;color:var(--ink4);
  margin-bottom:var(--s2);user-select:none;list-style:none}
.ag-sess details.ag-arc summary::before{content:'▸ ';}
.ag-sess details.ag-arc[open] summary::before{content:'▾ ';}
.ag-sess details.ag-arc .it{opacity:.72}
.ag-wrap textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:8px 0;outline:none;resize:vertical;line-height:1.6}
.ag-wrap textarea:focus{border-bottom-color:var(--accent)}
@media (max-width:900px){.ag-wrap{grid-template-columns:1fr}.ag-sess{border-right:0;
  border-bottom:1px solid var(--line);padding:0 0 var(--s3)}}

/* ── Agent 对话区：**定高框架**（用户：之前是无限向下衍生的整页高度）──────
   对话在框内自己滚；滚动条之外再给一条「对话定位条」：每个气泡一个刻度
   （你发的=金，本体的=亮灰，过程/系统=暗），点刻度直接跳到那条消息，
   点空白按比例跳。视口窗（.vp）随滚动移动，一眼看出现在看的是哪一段。 */
.ag-dial{display:flex;flex-direction:column;min-width:0}
.ag-shell{position:relative;display:flex;min-width:0;
  height:min(60vh,640px);min-height:320px;
  border:1px solid var(--line2);background:rgba(255,255,255,.012)}
.ag-shell .chat{flex:1;min-width:0;position:relative;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:var(--s4) var(--s3) var(--s4) var(--s3)}
.ag-shell .pv-jump{right:24px}
.ag-rail{position:relative;flex:none;width:15px;margin:5px 0;border-left:1px solid var(--line);
  cursor:pointer;background:linear-gradient(90deg,transparent,rgba(255,255,255,.016));
  transition:background 140ms var(--ez)}
.ag-rail:hover{background:rgba(255,255,255,.045)}
.ag-rail .mk{position:absolute;left:2px;width:5px;height:2px;background:var(--line3)}
.ag-rail .mk.bot{background:var(--ink4);width:7px}
.ag-rail .mk.me{background:var(--accent);width:9px}
.ag-rail .mk.err{background:var(--err);width:8px}
.ag-rail .vp{position:absolute;left:0;right:0;min-height:16px;pointer-events:none;
  background:rgba(201,169,110,.12);border-top:1px solid var(--accent-dim);
  border-bottom:1px solid var(--accent-dim)}

/* 协议页补充：驱动说明 / 官网链接 / 启动前自检清单 */
.pd-note{font-size:9px;color:var(--ink3);line-height:1.8;letter-spacing:.02em;
  border-left:2px solid var(--c30-ink);padding:2px 0 2px 10px;margin-bottom:var(--s4)}
.pd-links{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4);
  padding-top:var(--s3);border-top:1px solid var(--line)}
.pd-links .dim{font-size:9px;letter-spacing:.16em}
.pd-links a{text-decoration:none}
.pd-check{border:1px solid var(--line2);padding:var(--s4);margin-top:var(--s4);
  border-left:3px solid var(--c30-ink)}
.pd-check.bad{border-left-color:var(--warn)}
.pd-check-t{font-size:12px;color:var(--ok);margin-bottom:var(--s2);letter-spacing:.06em}
.pd-check.bad .pd-check-t{color:var(--warn)}
.pd-check .it{display:flex;gap:var(--s3);align-items:baseline;font-size:12px;line-height:1.85;
  color:var(--ink2)}
.pd-check .it .mk{flex:none;width:14px;color:var(--ok)}
.pd-check.bad .it .mk{color:var(--warn)}
.pd-check .it .lb{flex:none;min-width:96px}
.pd-check .it .ht{color:var(--ink4);font-size:9px;word-break:break-all}
.pd-qqpath{margin-left:auto;font-size:9px;color:var(--ink4);letter-spacing:.1em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}

/* ══════════════════════════════════════════════════════════════════
   协议页：驱动配置卡 / 文件浏览器 / 分步向导 / 自动识别
   ────────────────────────────────────────────────────────────────── */
/* ① 驱动配置：三个驱动各一套同构字段（启动器 / QQ / URL / WS 端口） */
.pd-tabs{display:flex;gap:var(--s2) var(--s4);border-bottom:1px solid var(--line2);
  margin-bottom:var(--s4);padding-bottom:var(--s2)}
.pd-tab{font-family:var(--f-m);font-size:12px;letter-spacing:.16em;color:var(--ink3);
  padding:6px 10px;border:1px solid transparent;border-bottom:3px solid transparent;
  background:none;cursor:pointer;white-space:nowrap;
  transition:color 140ms var(--ez),border-color 140ms var(--ez)}
.pd-tab:hover{color:var(--ink)}
.pd-tab.on{color:var(--c10);border-color:var(--c30);border-bottom-color:var(--c10)}
.pd-tab i{font-style:normal;font-size:9px;color:var(--ink4);margin-left:6px}
.pd-tab.on i{color:var(--c10)}
.pd-grid{display:flex;flex-direction:column;gap:var(--s3)}
.pd-row{display:grid;grid-template-columns:minmax(150px,190px) 1fr auto;gap:var(--s3) var(--s4);
  align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pd-row:last-child{border-bottom:0}
.pd-lab{font-size:12px;color:var(--ink)}
.pd-lab em{font-style:normal;display:block;font-size:9px;color:var(--ink4);margin-top:3px}
.pd-in{display:flex;align-items:center;gap:var(--s2);min-width:0}
.pd-in input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:8px 0;outline:none}
.pd-in input:focus{border-bottom-color:var(--c10)}
.pd-in input[readonly]{color:var(--ink3);border-bottom-style:dashed}
.pd-act{display:flex;gap:var(--s2);flex:none}
/* 只读回显（Token / WebUI 地址）：等宽 + 可复制 */
.pd-ro{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.pd-ro code{font-family:var(--f-m);font-size:11px;color:var(--ink2);
  border:1px dashed var(--line2);padding:6px 8px;word-break:break-all;flex:1;min-width:0}
.pd-ro .none{font-size:9px;color:var(--ink4)}
/* ② 文件浏览器模态 */
.fb-mask{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--deep) 66%,transparent);
  display:grid;place-items:center;padding:var(--s6)}
.fb{width:min(760px,92vw);max-height:82vh;display:flex;flex-direction:column;
  border:1px solid var(--line3);background:var(--panel);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.fb-hd{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--line2)}
.fb-hd b{font-size:12px;font-weight:400;letter-spacing:.2em;color:var(--c10)}
.fb-path{flex:1;font-family:var(--f-m);font-size:11px;color:var(--ink2);
  border:1px solid var(--line2);background:var(--deep);padding:7px 9px;min-width:0;
  overflow:auto;white-space:nowrap}
.fb-list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;min-height:180px}
.fb-list li{display:flex;align-items:center;gap:var(--s3);padding:7px var(--s5);
  border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.fb-list li:hover{background:var(--c30-ink)}
.fb-list li.dir b{color:var(--c10)}
.fb-list li b{flex:1;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-list li span{font-family:var(--f-m);font-size:9px;color:var(--ink4);flex:none}
/* ③ 分步向导（用户批准：v4 视觉重做成卡片式） */
.wz{display:flex;flex-direction:column;gap:var(--s4)}
.wz-steps{display:flex;gap:var(--s2);align-items:center}
.wz-step{display:flex;align-items:center;gap:6px;font-family:var(--f-m);font-size:9px;
  letter-spacing:.16em;color:var(--ink4)}
.wz-step b{width:16px;height:16px;display:grid;place-items:center;font-size:9px;
  border:1px solid var(--line3);color:var(--ink4);font-weight:400}
.wz-step.on{color:var(--c10)}
.wz-step.on b{border-color:var(--c10);background:var(--c10);color:var(--panel)}
.wz-step.done{color:var(--ink2)}
.wz-step.done b{border-color:var(--c30-ink)}
.wz-arrow{flex:1;height:1px;background:var(--line2)}
.wz-card{border:1px solid var(--line2);border-left:3px solid var(--c30-ink);
  background:color-mix(in srgb,var(--panel) 88%,transparent);padding:var(--s5)}
.wz-card h4{font-size:var(--z4);font-weight:400;color:var(--ink);margin:0 0 var(--s2)}
.wz-card p{font-size:9px;color:var(--ink4);line-height:1.7;margin:0 0 var(--s4)}
.wz-card .fld{margin-bottom:var(--s3)}
.wz-ft{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s4)}
.wz-ft .dim{margin-left:auto;font-size:9px}
/* ④ 自动识别结果 */
.pd-det{display:flex;flex-direction:column;gap:var(--s2)}
.pd-det .it{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3);
  border:1px solid var(--line2);font-size:12px}
.pd-det .it b{flex:1;font-weight:400}
.pd-det .it code{font-family:var(--f-m);font-size:10px;color:var(--ink3)}
@media (max-width:860px){.pd-row{grid-template-columns:1fr;gap:var(--s2)}}

/* ══════════════════════════════════════════════════════════════════
   配置中心控件：面板标签 / 开关 / 自定义下拉 / 可编辑划线列表
   设计约束（跟 v4 视觉一致）：直角、硬边、无圆角阴影堆叠；
   开关的滑块和下拉的指示符都是**方块**，因为这是像素字体的界面。
   ══════════════════════════════════════════════════════════════════ */
/* ① 面板标签：一条横排的机械刻度，当前项用金色粗线下压 */
.cf-tabs{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);
  border-bottom:1px solid var(--line2);padding-bottom:var(--s3);margin-bottom:var(--s5)}
/* ── 配置页骨架（2026-10-24 重排）──────────────────────────────
   顶栏固定：搜索 + 改动计数 + 保存。分组按钮是两层文字（组名 + 一句人话），
   不做图标 —— 这套像素字体系里图标比文字更难认。 */
.cfg-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  flex-wrap:wrap;padding-bottom:var(--s3);margin-bottom:var(--s4);
  border-bottom:1px solid var(--line2)}
.cfg-bar-l{display:flex;align-items:baseline;gap:var(--s3);min-width:0}
.cfg-bar-l b{font-family:var(--f-m);font-size:14px;letter-spacing:.22em;color:var(--ink)}
.cfg-bar-r{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.cfg-bar-r input{width:min(300px,42vw);height:28px;padding:0 10px;background:var(--panel);
  border:1px solid var(--line3);color:var(--ink);font-size:12px;letter-spacing:.04em}
.cfg-bar-r input:focus{outline:none;border-color:var(--accent)}
.cfg-groups{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:var(--s5)}
.cfg-grp{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px 11px;
  background:var(--bg);border:0;cursor:pointer;position:relative;
  transition:background 140ms var(--ez)}
.cfg-grp b{font-family:var(--f-m);font-size:12px;letter-spacing:.16em;color:var(--ink3);font-weight:400}
.cfg-grp span{font-size:9px;color:var(--ink4);line-height:1.4;letter-spacing:.02em}
.cfg-grp:hover b{color:var(--ink)}
.cfg-grp.on{background:var(--panel)}
.cfg-grp.on b{color:var(--c10)}
.cfg-grp.on::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--c10)}
@media (max-width:1080px){.cfg-groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.cfg-groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 小节：一条细标题 + 字段；节与节之间只用留白和一根线分隔，不加卡片边框 */
.cfg-sec{margin-bottom:var(--s6)}
.cfg-sec-hd{display:flex;align-items:baseline;gap:var(--s3);padding-bottom:6px;
  border-bottom:1px solid var(--line2);margin-bottom:var(--s2)}
.cfg-sec-hd b{font-size:12px;color:var(--ink);letter-spacing:.08em;font-weight:400}
.cfg-sec-hd i{font-style:normal;font-family:var(--f-m);font-size:9px;color:var(--ink4);letter-spacing:.14em}
.cfg-empty{padding:var(--s5) 0;color:var(--ink4);font-size:11px;letter-spacing:.04em}
/* 字段底部一行：默认值（可点恢复）+ 键名 */
.cf-meta{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:1px}
.cf-key{font-family:var(--f-m);font-size:9px;color:var(--ink4);opacity:.55;letter-spacing:.08em}
.cf-def{font-family:inherit;font-size:9px;color:var(--ink3);background:transparent;
  border:1px solid var(--line3);padding:2px 6px;cursor:pointer;letter-spacing:.04em;
  transition:color 120ms var(--ez),border-color 120ms var(--ez)}
.cf-def:hover{color:var(--c10);border-color:var(--c10)}
/* 「需重启」标记：红棕，跟在标签后面；不用图标，这套字体系里文字更清楚 */
.cf-restart{font-style:normal;font-size:9px;letter-spacing:.1em;color:#a4472f;
  border:1px solid #a4472f;padding:1px 4px;margin-left:6px;vertical-align:1px}
.cf-tab{font-family:var(--f-m);font-size:12px;letter-spacing:.16em;color:var(--ink3);
  padding:6px 2px 7px;border-bottom:3px solid transparent;cursor:pointer;
  transition:color 140ms var(--ez),border-color 140ms var(--ez);white-space:nowrap}
.cf-tab:hover{color:var(--ink)}
.cf-tab.on{color:var(--c10);border-bottom-color:var(--c10)}
.cf-tab i{font-style:normal;font-size:9px;color:var(--ink4);margin-left:6px}
.cf-tab.on i{color:var(--c10)}
/* ② 字段行：标签（可点 help 显说明）+ 控件，说明用小字灰 */
.cf-fld{display:grid;grid-template-columns:minmax(180px,240px) minmax(200px,1fr);
  gap:var(--s4) var(--s5);align-items:start;padding:11px 0;
  border-bottom:1px solid var(--line)}
.cf-fld:last-child{border-bottom:0}
.cf-lab{font-size:12px;color:var(--ink);line-height:1.45}
.cf-lab em{font-style:normal;color:var(--ink4);font-size:9px;letter-spacing:.1em;margin-left:6px}
.cf-desc{font-size:9px;color:var(--ink4);line-height:1.55;margin-top:5px;letter-spacing:.02em}
.cf-ctl{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
/* ③ 开关：方块滑轨 + 方块滑块；选中=金色，禁用=灰且不可点 */
.sw{position:relative;width:52px;height:22px;flex:none;border:1px solid var(--line3);
  background:var(--panel);cursor:pointer;padding:0;transition:border-color 140ms var(--ez)}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;
  background:var(--ink4);transition:transform 180ms cubic-bezier(.2,1.62,.32,1),background 140ms linear}
.sw[aria-checked="true"]{border-color:var(--c10)}
.sw[aria-checked="true"]::after{transform:translateX(28px);background:var(--c10)}
.sw:focus-visible{outline:2px solid var(--c10);outline-offset:2px}
.sw[disabled]{opacity:.4;cursor:not-allowed}
.swrow{display:flex;align-items:center;gap:var(--s3)}
.swrow b{font-size:12px;font-weight:400;color:var(--ink3)}
/* ④ 自定义下拉：点开是一列方块选项，选中项左侧金色标记 */
.sel{position:relative;min-width:180px;max-width:100%}
.sel-btn{display:flex;align-items:center;gap:var(--s2);width:100%;
  border:1px solid var(--line2);background:var(--panel);color:var(--ink);
  font-size:12px;padding:9px 11px;cursor:pointer;text-align:left}
.sel-btn::after{content:'';margin-left:auto;width:0;height:0;
  border:5px solid transparent;border-top-color:var(--ink3);transform:translateY(3px)}
.sel.open .sel-btn::after{transform:translateY(-3px) rotate(180deg);border-top-color:transparent;
  border-bottom-color:var(--ink3)}
.sel-btn:hover{border-color:var(--c10)}
.sel-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:280px;overflow:auto;
  border:1px solid var(--line3);background:var(--panel);
  box-shadow:0 18px 34px -20px rgba(0,0,0,.6)}
.sel-pop[hidden]{display:none}
.sel-opt{display:block;width:100%;text-align:left;font-size:12px;color:var(--ink2);
  padding:8px 11px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.sel-opt:last-child{border-bottom:0}
.sel-opt:hover{background:var(--c30-ink);color:var(--ink)}
.sel-opt.on{color:var(--c10)}
.sel-opt.on::before{content:'';display:inline-block;width:6px;height:6px;background:var(--c10);
  margin-right:7px;vertical-align:middle}
.sel-opt:disabled{opacity:.42;cursor:not-allowed}
/* ⑤ 可编辑划线列表（退场语 / 撤回反馈）
      v3 的语义：每条可**停用**，停用的条目**划线**显示。用户点名要的就是这个。*/
.edl{display:flex;flex-direction:column;gap:5px}
.edl-row{display:flex;align-items:center;gap:var(--s3);border:1px solid var(--line2);
  background:var(--panel);padding:7px 9px}
.edl-row:hover{border-color:var(--line3)}
.edl-chk{appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:none;
  border:1px solid var(--line3);background:var(--deep);display:grid;place-content:center;cursor:pointer}
.edl-chk:checked{background:var(--c10);border-color:var(--c10)}
.edl-chk:checked::after{content:'';width:7px;height:4px;border-left:2px solid var(--deep);
  border-bottom:2px solid var(--deep);transform:rotate(-45deg) translate(1px,-1px)}
.edl-txt{flex:1;min-width:0;font-size:12px;color:var(--ink);word-break:break-word;line-height:1.5}
.edl-row.off .edl-txt{text-decoration:line-through;color:var(--ink4);text-decoration-thickness:1px}
.edl-del{flex:none;font-size:9px;letter-spacing:.14em;color:var(--ink4);padding:4px 6px;
  border:1px solid transparent;cursor:pointer;background:none}
.edl-del:hover{color:var(--err);border-color:var(--err)}
.edl-add{display:flex;gap:var(--s2);margin-top:7px}
.edl-add input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:7px 0;outline:none}
.edl-add input:focus{border-bottom-color:var(--accent)}
.edl-add textarea{flex:1;min-height:74px;background:transparent;border:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:7px 0;outline:none;resize:vertical}
.edl-empty{font-size:9px;color:var(--ink4);padding:9px 0;letter-spacing:.06em}
@media (max-width:860px){.cf-fld{grid-template-columns:1fr;gap:var(--s2)}}
.panel{background:var(--panel);border:1px solid var(--line);position:relative;
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ink) 7%,transparent),
             inset 0 -1px 0 color-mix(in srgb,var(--ink) 5%,transparent)}
/* ⑥ 红色只做**长条结构**：贯穿的横带 + 右缘竖带，不用于细节 */
.panel{border-top:3px solid var(--c30-ink)}
.panel::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;
  background:var(--accent);opacity:.08;pointer-events:none}
.panel::before{content:'';position:absolute;right:0;top:0;width:230px;height:150px;
  pointer-events:none;z-index:1;opacity:.9;
  background:
    /* 一组斜向细长条（金属块感） */
    linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--ink) 26%,transparent) 26px 28px,transparent 28px 44px),
    linear-gradient(115deg,transparent 0 52px,var(--accent) 52px 55px,transparent 55px 74px),
    linear-gradient(115deg,transparent 0 84px,color-mix(in srgb,var(--ink) 16%,transparent) 84px 85px,transparent 85px 100px),
    /* 细引线 */
    linear-gradient(115deg,transparent 0 118px,color-mix(in srgb,var(--ink) 34%,transparent) 118px 119px,transparent 119px);
  -webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 72%);
  mask-image:linear-gradient(200deg,#000 0%,transparent 72%)}

/* ① 明暗双档：读数块用**深色**（浅档页面上的深块 = 参考里的"终端窗"）
   ★ 深色块不能是纯黑（v4 面板是半透明米色，纯黑块贴上去像打补丁，用户反馈"分层很奇怪"），
     但也**不能变浅** —— 一变浅就跟面板同色、层次就没了。
     做法：深色里掺一点面板色（降对比、不改明暗关系），文字维持浅色。 */
.stats .st,.quad .k{background:color-mix(in srgb,var(--deep) 88%,var(--panel));
  border:1px solid color-mix(in srgb,var(--deep) 76%,var(--panel));
  padding:var(--s3) var(--s4);position:relative;overflow:hidden}
.stats .st .v,.quad .k .v{color:var(--deep-ink)}
.stats .st .lb,.quad .k .lb,.stats .st .k2{color:color-mix(in srgb,var(--deep-ink) 62%,transparent)}
.stats .st::before,.quad .k::before{content:'';position:absolute;left:0;top:0;
  width:3px;height:100%;background:var(--accent)}
/* ④ 内容活着：深块里极轻的扫描线缓慢移动（静止画面里有运动）*/
.stats .st::after,.quad .k::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
  animation:scanPV 7s linear infinite}
@keyframes scanPV{0%{transform:translateY(0)}100%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){.stats .st::after,.quad .k::after{animation:none}}

/* ── 区块标题：小方标 + 中文 + 发丝规则线（②/③ 的密度感）── */
.hd .lab{color:var(--ink);letter-spacing:.22em;font-weight:500;font-family:var(--f-u)}
.hd .lab::before{content:'';display:inline-block;width:9px;height:9px;background:var(--accent);
  margin-right:10px;vertical-align:1px}
.hd::after{background:repeating-linear-gradient(90deg,var(--line2) 0 2px,transparent 2px 6px)}
.hd .rule{background:linear-gradient(90deg,var(--ink),var(--line2) 60%,transparent)}

/* 其它表层 */
.log,.row,.kv{border-bottom:1px solid var(--line)}
.log-time{color:var(--ink4);font-family:var(--f-m)}
.empty-desc{color:var(--ink3)}
.btn{transform:none;border:1px solid var(--line2);background:transparent;color:var(--ink);
  background-image:none;font-weight:500;letter-spacing:.06em}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--deep)}
html[data-palette="a"] .btn.primary{color:#fff}
input,select,textarea,.inp{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.main .cross::before,.main .cross::after{background:var(--ink4)}
.modal{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ══════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════
   ★ 动态系统 v2 —— 学的是**六套不同的运动语言**，按场景分工
   （从 981 帧全片 + 7 段密集连续帧逐帧读出，不是从静帧猜的）
   ══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────
   全片共性（先立规矩，各套都遵守）：
     · 外壳（导轨/标题/红带/编号）**绝对静止**，只在入场/切换时动一次
     · **全程无渐变**：一律硬边 + steps 步进 + 直线位移
     · 变化靠**几何变形**（收缩/碎裂/阶梯/累积），不靠透明度过渡
     · 文字靠**逐个显现**，不靠淡入
     · 强调色只做结构，不做装饰
   ───────────────────────────────────────────────────────────────── */

/* ── M1 砸入→碎裂→重组（首屏一次性，最有表现力）────────────────── */
.pv-sh{position:absolute;z-index:8;pointer-events:none;background:var(--accent);
  will-change:transform,opacity}
.pv-sh.s1{left:-7%;top:6%;width:30%;height:24%;--dx:-38%;--dy:-26%;
  animation:shatterPV 560ms steps(12,end) both}
.pv-sh.s2{right:-9%;top:30%;width:24%;height:42%;--dx:34%;--dy:16%;
  animation:shatterPV 560ms steps(12,end) 40ms both}
.pv-sh.s3{left:26%;bottom:-12%;width:40%;height:20%;--dx:12%;--dy:30%;
  animation:shatterPV 560ms steps(12,end) 90ms both}
@keyframes shatterPV{
  0%{transform:translate(var(--dx),var(--dy));opacity:0}
  16%{opacity:1} 46%{transform:none;opacity:1}
  58%{transform:scale(1.04);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.82);opacity:0}}

/* ── M3 卷轴收缩/展开（页面切换 = 卷轴快门）────────────────────── */
/* 出场：当前面板纵向收成一条线；入场：同一条线展开成新内容。
   巨型编号在同一帧硬切（靠 JS 换 --pageno，不做补间）。 */
.panel.out{animation:scrollShutPV 150ms steps(6,end) both;pointer-events:none}
@keyframes scrollShutPV{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(49.8% 0 49.8% 0)}}
.panel.in{animation:scrollOpenPV 210ms steps(7,end) both}
@keyframes scrollOpenPV{0%{clip-path:inset(49.8% 0 49.8% 0)}100%{clip-path:inset(0 0 0 0)}}
/* 一帧黑闪（明暗硬切，不用淡入淡出）*/
.panel.in::before{content:'';display:block;position:absolute;inset:0;z-index:9;
  background:#07080a;pointer-events:none;animation:cutFlashPV 200ms steps(1,end) both}
@keyframes cutFlashPV{0%{opacity:1}49.9%{opacity:1}50%{opacity:0}100%{opacity:0}}
.panel.in::after{display:none}

/* ── M2 明暗硬切（焦点区"信号"刷新：一帧切，不渐变）────────────── */
/* 用在会周期性刷新的读数/状态块上 —— 外壳不动，只有它一帧一帧地切 */
@keyframes sigCutPV{0%{filter:brightness(1)}40%{filter:brightness(.35)}
  100%{filter:brightness(1)}}
.sig-cut{animation:sigCutPV 90ms steps(1,end) both}

/* ── M4 终端逐行显现（黑底等宽字：日志/控制台/诊断类内容）───────── */
.tv{font-family:var(--f-m);letter-spacing:.06em}
.tv .ln{display:block;overflow:hidden;white-space:nowrap;
  clip-path:inset(0 100% 0 0);animation:typePV 150ms steps(6,end) both}
.tv .ln:nth-child(1){animation-delay:0ms}.tv .ln:nth-child(2){animation-delay:70ms}
.tv .ln:nth-child(3){animation-delay:140ms}.tv .ln:nth-child(4){animation-delay:210ms}
.tv .ln:nth-child(5){animation-delay:280ms}.tv .ln:nth-child(6){animation-delay:350ms}
@keyframes typePV{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}

/* ── M5 累积生长（数值/进度：自下而上长出，不是淡入）──────────── */
.grow{clip-path:inset(100% 0 0 0);animation:growPV 320ms steps(8,end) both}
@keyframes growPV{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.grow:nth-of-type(2){animation-delay:60ms}
.grow:nth-of-type(3){animation-delay:120ms}
.grow:nth-of-type(4){animation-delay:180ms}
.stats .st .v,.quad .k .v{animation:growPV 300ms steps(8,end) both}

/* ── M6 方块阶梯 + 收束（结束/停止态）────────────────────────── */
.stair{position:absolute;pointer-events:none;z-index:9;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px}
.stair i{display:block;background:var(--accent);animation:stairPV 200ms steps(4,end) both}
.stair i:nth-child(1){width:34px;height:10px;animation-delay:0ms}
.stair i:nth-child(2){width:26px;height:10px;animation-delay:55ms;opacity:.75}
.stair i:nth-child(3){width:18px;height:10px;animation-delay:110ms;opacity:.5}
.stair i:nth-child(4){width:10px;height:10px;animation-delay:165ms;opacity:.28}
@keyframes stairPV{0%{transform:translateY(-26px);opacity:0}
  100%{transform:translateY(0);opacity:inherit}}

/* ── 共用：标题逐字显现（片里 INITIALIZING 的做法）────────────── */
.top h2 i{display:inline-block;font-style:inherit;
  clip-path:inset(0 100% 0 0);animation:charPV 190ms steps(4,end) both;
  animation-delay:var(--d,0ms)}
@keyframes charPV{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
.top h2.slam{animation-name:slamPV}

/* ── 共用：强调色横带扫过（scaleX 步进，不是滑动渐变）───────────── */
.top::after{content:'';display:block;position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:var(--accent);transform-origin:left;animation:sweepPV 380ms steps(8,end) both}
@keyframes sweepPV{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

/* ── 共用：内容块错位落位（stagger 30ms，硬步进）────────────────── */
.panel.in>.hd,.panel.in>.stats,.panel.in>.quad,.panel.in>.trio,.panel.in>.rows{
  clip-path:inset(0 0 100% 0);animation:fragPV 200ms steps(5,end) both}
.panel.in>.hd{animation-delay:0ms}
.panel.in>.stats:nth-of-type(2),.panel.in>.quad:nth-of-type(2),
.panel.in>.trio:nth-of-type(2){animation-delay:34ms;clip-path:inset(100% 0 0 0)}
.panel.in>.stats:nth-of-type(3),.panel.in>.quad:nth-of-type(3),
.panel.in>.trio:nth-of-type(3){animation-delay:68ms;clip-path:inset(0 0 0 100%)}
.panel.in>.rows{animation-delay:100ms}
@keyframes fragPV{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}

/* ── 无障碍：一律关掉 ── */
@media (prefers-reduced-motion: reduce){
  .pv-sh,.stair{display:none !important}
  .panel.in::before,.top::after,.top h2 i,.tv .ln,.grow,
  .stats .st .v,.quad .k .v,
  .panel.in>.hd,.panel.in>.stats,.panel.in>.quad,.panel.in>.trio,.panel.in>.rows,
  .sig-cut{animation:none !important;clip-path:none !important;filter:none !important}
}


/* ══ 构图 v3 · 字体适配 · 细节 ══ */



/* ══════════════════════════════════════════════════════════════════
   ★ 构图层 v3 —— 拆掉"左栏 + 顶栏 + 满格面板"这个死板框架
   参考片 198–201s 的布局哲学：**自由散布的画布**
     · 内容区是一张**斜置的透视平面**（有厚度、有投影），不是矩形容器
     · 标题**压在平面下缘**，元素互相压叠、不对齐网格
     · 巨型编号在画布边缘**出血**
     · 微型标注 + 引线**散布四周**
     · 2.5D 板件沿螺旋/扇形轨迹排列，**有厚度、有透视衰减**
   ══════════════════════════════════════════════════════════════════ */

/* ── 字体适配（三套配三套分工，全部系统字体，离线可用）────────────── */
:root{
  /* 流体字号：标题与巨型编号随视口缩放（小窗也不会崩）
     ★ 端点取 12 的倍数：--fz-title 在 1440 宽时恰为 60px（5×12）硬边 */
  --fz-title:clamp(24px,4.1666vw,60px);
  --fz-num:clamp(144px,22vw,420px);
  --fz-sub:12px;
  --fz-micro:12px;
  /* 字体分工：★ 全部收敛到像素栈（和上面 --f-px0 同一栈）——
     中文 FusionPixelSC、拉丁 Silkscreen，浏览器逐字符回退自动混排。
     这样无论哪条规则在覆盖战里获胜，落地的都是像素体。 */
  --f-cn:var(--f-px0);
  --f-lat:var(--f-px0);
  --f-mono:var(--f-px0);
  --tr-micro:.26em;      /* 微型标注的字距 */
  --hair:1px;            /* 发丝线统一 */
}

/* ── 构图：导航浮起来（不再占固定列），内容变成斜置平面 ────────────── */
/* ★ 自由画布：**彻底不用 grid**。
   原来 .rail 是网格项；把它改成 absolute 后它退出了网格流，
   .main 就变成第一个网格项 → 落进 0 宽的第一列 → 视口外控件点不到。
   构图 v3 本来就是要脱离栅格，所以直接 display:block + 绝对定位。 */
.world{display:block;position:relative;height:100vh;overflow:hidden}
.main{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden}
.rail{position:absolute;inset:0 auto 0 0;width:0;background:none;border:0;
  box-shadow:none;clip-path:none;overflow:visible;z-index:14}
.brand{position:absolute;left:16px;bottom:172px;width:168px;text-align:left}  /* 进左走廊 */
.brand h1{font-size:16px;line-height:1.12;white-space:nowrap}  /* 16=Silkscreen 整数倍 → 硬边（15px 实测糊） */
.brand .en{font-size:8px;letter-spacing:.2em;white-space:nowrap}
.brand .tag{font-size:12px;white-space:nowrap}     /* ★ 原来 150px 宽放不下"控制台"，会折行 */
.brand .ver{font-size:8px}
/* 旧列表导航：机械导航（轮盘+书架）接管后收起，但**保留在 DOM 与几何里**
   （几何契约仍按它测 62px 节距与游标对齐；收起用 opacity 而非 display，
    以免破坏游标的几何断言）。 */
.nav{position:absolute;left:-9999px;top:78px;bottom:64px;width:66px;
  padding-top:26px;overflow-y:auto;overflow-x:visible;flex:none;opacity:0;
  pointer-events:none}
/* 机械导航容器 */
/* 旧的圆盘+书架导航已由「机械闸片架」取代 */
.mv{display:none !important}
.ni{width:60px;height:62px;margin:0;padding:0 10px;border-left:2px solid transparent;
  display:flex;align-items:center;justify-content:flex-start}
.ni .idx{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink4)}
/* ★ 标签在**框外**用引线标注呈现（所以项宽恒为 60px，游标对齐不被破坏） */
.ni .tx,.ni .en{position:absolute;left:74px;top:50%;transform:translateY(-50%);
  white-space:nowrap;pointer-events:none;opacity:.5;transition:opacity 90ms linear}
.ni .tx{font-size:var(--fz-sub);color:var(--ink)}
.ni .en{font-family:var(--f-lat);font-style:italic;font-size:11px;letter-spacing:.02em;
  color:var(--ink3);transform:translateY(-50%) translateX(0)}
.ni .tx::before{content:'';position:absolute;left:-16px;top:50%;width:14px;height:var(--hair);
  background:var(--accent);opacity:0}   /* 引线只给激活项 */}
.ni.on .tx::before{opacity:.9}
.ni.on{border-left-color:var(--accent);background:transparent}
.ni.on .idx{color:var(--accent)}
.ni.on .tx,.ni.on .en{opacity:1}
.ni.on .tx{color:var(--accent)}
.ni.on .en{transform:translateY(calc(-50% + 15px))}
.cursor{left:-24px;width:60px}
.cursor .cfill{background:transparent;border-left:3px solid var(--accent);
  clip-path:none;border-radius:0}
.cursor .cedge{background:transparent;width:0}
/* 底部提示移到底栏 */
/* ── 分层契约（用户明确定序，从后到前）──────────────────────────
   ① 水印页   .wm        固定全屏、**最底**、pointer-events:none
   ② 内容页   .panel     半透明（透出水印），斜置平面
   ③ 标题卡   .top       指针穿透（pointer-events:none），只在左上角一小块
   ④ 导航控制键 .rack    只占左走廊，绝不压内容
   ───────────────────────────────────────────────────────────── */

/* ① 水印页：巨型页码，占满视口，永远在内容之下，但**内容也透得出它**
   （.wm 本身是空元素，字形必须画在 ::before 上 —— 直接写 content 会量出 0×0） */
.wm{position:fixed;inset:0;z-index:0;pointer-events:none}
.wm::before{content:var(--pageno,"01");position:absolute;left:50%;bottom:-7vh;
  transform:translateX(-50%);
  font-family:var(--f-cn);font-weight:900;font-size:min(42vw,430px);line-height:.74;
  letter-spacing:-.07em;color:var(--c30-ink);opacity:.30;
  transition:opacity 420ms var(--ez)}

/* ② 内容页：不再是一整块不透明白板 —— 半透明让水印透上来，
   斜置平面 + 左侧红条保持"内容在纸上"的层次，但不再是"巨大遮挡物" */
.panel{position:relative;z-index:1;
  background:color-mix(in srgb,var(--panel) 84%,transparent)}

/* ── 标题：左上角巨型陈述，**允许与内容平面压叠** ────────────────── */
.main{position:relative;overflow:hidden}
.top{position:absolute;left:132px;right:56px;top:24px;z-index:9;background:none;border:0;
  box-shadow:none;backdrop-filter:none;padding:0;pointer-events:none}
.top::after{left:112px;width:min(320px,34vw)}
.top h2{font-family:var(--f-cn);font-size:var(--fz-title);font-weight:900;
  letter-spacing:-.03em;line-height:.92;color:var(--ink)}
.ttlEn{font-family:var(--f-lat);font-style:italic;font-size:var(--fz-sub);
  color:var(--accent);letter-spacing:.03em}
.top .sec{font-family:var(--f-mono);font-size:var(--fz-micro);letter-spacing:var(--tr-micro);
  color:var(--accent)}
.top .right{position:absolute;right:0;top:2px;text-align:right;border:0;
  font-family:var(--f-mono);font-size:var(--fz-micro);letter-spacing:var(--tr-micro)}
.top .right .num{font-size:var(--fz-sub);color:var(--accent)}
.top .hz{display:none}

/* ── 内容：斜置的透视平面（有厚度、有投影、四边留白）──────────────── */
/* ★ 安全带：上 158（标题区）· 左 132（轮盘/品牌/提示的专属走廊）· 下 96 · 右 56
   —— 自由画布不等于随便放：浮动构件必须待在带里，否则会压住内容。 */
/* ★ 分层（用户要求：标题小卡片 / 内容页 / 水印背景 各在各的层）：
     标题带 .top 固定在顶部，.stage 作为**独立滚动容器从标题带下方开始**。
     原来用 padding-top:158px 让内容"绕开"标题，但滚动时内容照样会滚进
     标题区、叠在「配置中心」上（用户反馈的"分层奇怪"）。
     改成 top:150px 后，滚动区与标题带**物理分离**，永远不重叠。 */
.stage{position:absolute;left:0;right:0;top:150px;bottom:0;
  padding:0 84px 96px 196px;   /* 左走廊 196：闸片 96 + 引线标注区 */
  overflow-y:auto;overflow-x:hidden}   /* ★ 必须能滚：斜置平面 + 内容长，
     裁掉会让视口外的控件点不到（页面契约卡在 click 就是这个） */
/* ★ .main 必须**自己就有视口高度**。文件里另一条 `.main{position:relative}`
   会覆盖掉早先的 absolute 版 —— 而 .stage 现在是 absolute（top/bottom 定位），
   父容器高度一旦塌成 0，整个内容区就被 overflow:hidden 裁没了（实测整页空白）。*/
.main{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden}}
.panel{position:relative;z-index:1;   /* 高于水印页码，避免压字 */
  border:var(--hair) solid var(--line);
  border-left:3px solid var(--c30-ink);
  transform:perspective(1500px) rotateX(2.6deg) rotateY(-1.1deg);
  transform-origin:50% 0;box-shadow:
    0 34px 60px -34px rgba(0,0,0,.34),
    0 2px 0 color-mix(in srgb,var(--ink) 10%,transparent),
    inset 0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.panel::after{width:16px;opacity:.07}
.panel::before{opacity:.55}
/* 平面上的区块不再是"卡片行"，改为**引线标注块** */
.hd{margin-top:var(--s5)}
.hd .lab{font-family:var(--f-cn);font-size:var(--fz-sub);font-weight:500;
  letter-spacing:.2em;color:var(--ink);display:inline-flex;align-items:center;gap:10px}
.hd .lab::before{content:'';width:22px;height:var(--hair);background:var(--c30-ink)}
.hd::after{opacity:.7}
.stats{gap:var(--s4)}
.st,.quad .k{border:var(--hair) solid var(--line);background:var(--panel);
  padding:var(--s3) var(--s4)}
.st .lb,.k .lb{font-family:var(--f-mono);font-size:var(--fz-micro);
  letter-spacing:var(--tr-micro);color:var(--ink4);text-transform:uppercase}
.st .v,.k .v{font-family:var(--f-cn);font-size:var(--z5);font-weight:700;color:var(--ink)}
.st .c,.k .c{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.stats .st::before{background:var(--accent);width:2px}

/* ── 2.5D 层次：板件沿扇形/螺旋排列，有厚度与透视衰减 ─────────────── */
/* ★ 板件层只在**内容平面之外**活动：clip 到「下带 + 左廊 + 右缘」，
   绝不允许横穿内容面板（用户反馈的"严重遮挡"就是它们压住了内容与品牌）。
   同时给一层**极慢漂移**，让背景不再是静止的。 */
.pv-depth{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;
  perspective:1000px;perspective-origin:50% 50%;opacity:.62;
  -webkit-mask-image:
    linear-gradient(180deg,transparent 0,#000 62%,#000 100%),
    linear-gradient(90deg,#000 0,#000 15%,transparent 22%);
  mask-image:
    linear-gradient(180deg,transparent 0,#000 62%,#000 100%),
    linear-gradient(90deg,#000 0,#000 15%,transparent 22%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  animation:driftDeep 68s linear infinite}
@keyframes driftDeep{0%{background-position:0 0,0 0}
  50%{background-position:38px -26px,0 0}100%{background-position:0 0,0 0}}
.pv-depth i{position:absolute;width:340px;height:150px;
  left:calc(16% + var(--i) * 13%);bottom:calc(2% + var(--i) * 2.5%);
  border:var(--hair) solid color-mix(in srgb,var(--c30-ink) 34%,transparent);
  background:linear-gradient(148deg,
    color-mix(in srgb,var(--panel) 94%,transparent),
    color-mix(in srgb,var(--ink) 7%,transparent));
  transform-origin:50% 120%;
  transform:rotateX(66deg) rotateZ(-33deg) scale(calc(1 - var(--i) * .08));
  animation:breatheDeep calc(13s + var(--i) * 1.7s) ease-in-out infinite;
  animation-delay:calc(var(--i) * -2.4s)}
@keyframes breatheDeep{0%,100%{opacity:.5}50%{opacity:.95}}

/* ══════════════════════════════════════════════════════════════════
   ★ 机械方块链（reference: zz_iso.jpg 的 2.5D 机械结构）
   参考片里的几何关系（逐条照搬）：
     · 一条**对角轴**，方块沿轴串成一列
     · 每块相对前一块**多转一点**（螺旋），越远越斜
     · **越远越淡**（透视衰减），近处实、远处虚
     · 每块有**厚度**：上亮面 + 下暗面 + 侧边
     · 一条**红色粗斜线压在最上层**，贯穿整条链
     · 四周散布**微型等宽标注 + 引线**（像爆炸图的零件号）
   实现：链**以当前块为中心**（|d|>4 的淡出），所以可见链永远只有 ~9 块 —— 既
   保持"机械链"的观感，又不会变成一条长条。
   ══════════════════════════════════════════════════════════════════ */
.rack .axle{position:absolute;left:8px;top:-40px;width:2px;height:330px;
  background:linear-gradient(180deg,transparent,var(--c30-ink) 10%,
    var(--c30-ink) 90%,transparent);opacity:.5;
  transform:rotate(-30deg);transform-origin:top}
/* ★ 红色粗斜线：压在最上层（参考片里它就在结构之上） */
.rack::before{content:'';position:absolute;left:-16px;top:50%;width:230px;height:3px;
  background:var(--c10);opacity:.92;transform:rotate(-30deg);z-index:6;
  box-shadow:0 0 12px color-mix(in srgb,var(--c10) 45%,transparent)}
/* 轴的刻度（微型标注沿轴排布）*/
.rack::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(-60deg,
    color-mix(in srgb,var(--c30-ink) 26%,transparent) 0 1px,transparent 1px 46px)}

/* ── 方块：沿轴串、逐块多转、越远越淡 ─────────────────────────── */
.blk{position:absolute;left:50%;top:50%;width:50px;height:20px;
  transform:translate(-50%,-50%)

            rotate(calc(-30deg + var(--d) * 4.4deg))
            scale(calc(max(.52, 1 - var(--ad) * .026)));
  opacity:calc(max(.16, 1 - var(--ad) * .052));   /* 缓慢衰减：整条链都可见 */
  cursor:pointer;transform-style:preserve-3d;pointer-events:auto;
  transition:transform 170ms cubic-bezier(.2,1.55,.35,1),opacity 150ms linear}
/* 厚度：上亮面 + 下暗面 + 右侧边 */
.blk-t{position:absolute;left:0;top:0;right:0;height:60%;z-index:2;
  background:linear-gradient(180deg,
    color-mix(in srgb,#fff 82%,var(--panel)),var(--panel));
  border:1px solid var(--c30-ink);
  border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.blk-s{position:absolute;left:0;top:60%;right:0;bottom:0;z-index:1;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--c30-ink) 42%,transparent),
    color-mix(in srgb,var(--c30-ink) 72%,transparent));
  border:1px solid var(--c30-ink);border-top:0}
/* 页码刻在块面上 */
.blk-n{position:absolute;inset:0;display:grid;place-items:center;z-index:3;
  font-family:var(--f-mono);font-size:9px;color:var(--c30-ink)}

.blk.on{width:58px;height:23px}   /* 当前块更大（被「拉出」）*/
.blk.on .top{background:linear-gradient(180deg,#fff,var(--panel));

    color-mix(in srgb,var(--c10) 60%,transparent),

.blk.on .no{color:var(--c10);font-weight:700}

  padding-left:24px;opacity:.52;pointer-events:none;
  transition:opacity 120ms steps(3,end)}
/* 引线改成竖排小标左侧的一道短横（标签改成上下两行后，原来的横线位置不对了）*/
.blk-tag::before{content:'';position:absolute;left:0;top:50%;width:16px;height:1px;background:var(--c10)}

/* ══════════════════════════════════════════════════════════════════
   ★ 中央机械结构（Central Mech）—— 导航即主角
   参考片的机械结构原本是**画面主体**；这里照搬：**平时收起**成左下角一个小机构，
   点它 → 结构在**画面中央**大开大合地展开；滚轮/拖拽/↑↓ 用棘轮转动选页；
   Esc / 点空白 / 再点机构 → 大开大合地收起。
   收起时画布上**没有导航条**，所以彻底没有遮挡。
   ══════════════════════════════════════════════════════════════════ */

/* ── 收起态：小机构（像折起的手柄）── */
/* ══ 收起态 = 解构主义标记（线条 + 点），不是一个实心方块 ══
   构成：① 完整形态的**点线残影**（幽灵轮廓）
        ② 分离的**斜切片**（互不相连，各自偏移）
        ③ 切口的**顶点圆点**
        ④ 等宽小字标注
   悬停：切片微微散开、强调色渗入（像"要展开了"） */
.rack{position:absolute;left:16px;bottom:300px;width:96px;height:96px;z-index:20;
  cursor:pointer;perspective:520px;display:grid;place-items:center}
.rack .axle{display:none}
/* 迷你壳体收起时藏起来（展开时才有意义）*/
.rack .blk{opacity:0 !important;pointer-events:none}
.decon{width:80px;height:80px;overflow:visible;color:var(--c30-ink2);
  transition:color 140ms linear}
/* ① 完整形态的残影：点线矩形（被拆开之前的样子） */
.decon .ghost{fill:none;stroke:currentColor;stroke-width:1.1;
  stroke-dasharray:2 4;opacity:.8}
/* ② 斜切片：各自独立、互不相连 */
.decon .sl{stroke:currentColor;stroke-width:2.4;stroke-linecap:square;
  stroke-dasharray:46;stroke-dashoffset:46}   /* ★ 收起时线是卷着的 */
/* 悬停时稍微画出一点，暗示这里是线 */
.rack:hover .decon .sl{stroke-dashoffset:34}
  transition:transform 180ms cubic-bezier(.2,1.5,.35,1),stroke 140ms linear}
.sl1{transform:translate(-3px,-2px)}
.sl2{transform:translate(2px,-4px)}
.sl3{transform:translate(-1px,2px)}
.sl4{transform:translate(3px,1px)}
.sl5{transform:translate(-4px,3px)}
/* ③ 顶点圆点 */
.decon .dt{fill:currentColor;transition:fill 140ms linear,transform 180ms cubic-bezier(.2,1.5,.35,1)}
.dt1{transform:translate(-3px,-2px)}
.dt2{transform:translate(2px,-4px)}
.dt3{transform:translate(3px,1px)}
.dt4{transform:translate(-4px,3px)}
/* 悬停：切片散开 + 强调色渗入 */
.rack:hover .decon{color:var(--c10)}
.rack:hover .sl1{transform:translate(-7px,-4px)}
.rack:hover .sl2{transform:translate(5px,-8px)}
.rack:hover .sl3{transform:translate(-3px,5px)}
.rack:hover .sl4{transform:translate(7px,3px)}
.rack:hover .sl5{transform:translate(-9px,6px)}
.rack:hover .dt1{transform:translate(-7px,-4px)}
.rack:hover .dt2{transform:translate(5px,-8px)}
.rack:hover .dt3{transform:translate(7px,3px)}
.rack:hover .dt4{transform:translate(-9px,6px)}
/* ★ 提示牌已按用户要求删除：不再有任何"点这里可以导航"的文字/虚线框。
   触发改为**右上角热区**（见 .nav-hot）—— 鼠标移到右上角即展开机械导航。

/* ④ 等宽标注 */
.rack .lb{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  font-family:var(--f-mono);font-size:8px;letter-spacing:.3em;
  color:var(--c30-ink2);white-space:nowrap;transition:color 140ms linear}
.rack:hover .lb{color:var(--c10)}
.rack::before,.rack::after{display:none}

/* ── 展开态：中央机械结构 ─────────────────────────────────────── */
.mech{position:fixed;inset:0;z-index:44;display:grid;place-items:center;
  opacity:0;pointer-events:none;background:
    color-mix(in srgb,var(--deep) 88%,transparent);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  /* 出场：整层先淡出，壳体同时向中轴聚拢（收进机器里），比原地消失干净 */
  transition:opacity 260ms cubic-bezier(.4,0,.7,.2)}
.mech.open{opacity:1;pointer-events:auto;transition:opacity 200ms var(--ez)}

  transform:translateY(-72px) rotateX(-13deg) rotateY(var(--base,0deg)) scale(.34) rotateX(62deg);
  opacity:0;transition:transform 300ms cubic-bezier(.5,0,.75,.2),opacity 220ms linear}
.mech.open .helix{
  transform:translateY(-72px) rotateX(-13deg) rotateY(var(--base,0deg));

.mech-in{position:relative;width:min(1400px,96vw);height:min(820px,92vh);
  display:grid;place-items:center;perspective:1250px;perspective-origin:50% 42%;
  /* ★ 轴线与卡片必须处在**同一个 3D 空间**里，深度才可比

  transform-style:preserve-3d}
/* 导航层装饰：四角角标 + 顶/底刻度带（都是 pointer-events:none，不吃事件） */
.mech-in::before,.mech-in::after{content:'';position:absolute;left:0;right:0;height:12px;
  background:repeating-linear-gradient(90deg,var(--c30-ink) 0 1px,transparent 1px 26px);
  opacity:.5}
.mech-in::before{top:0;mask-image:linear-gradient(180deg,#000,transparent)}
.mech-in::after{bottom:0;mask-image:linear-gradient(0deg,#000,transparent)}
.mcx{position:absolute;width:26px;height:26px;pointer-events:none;opacity:.62}

.mcx.tr{right:6px;top:6px;transform:scaleX(-1)}
.mcx.bl{left:6px;bottom:6px;transform:scaleY(-1)}
.mcx.br{right:6px;bottom:6px;transform:scale(-1)}
/* 螺旋：整圈绕竖轴旋转；棘轮给"锁格"， rocking 给"晃动" */
.helix{position:relative;width:0;height:0;transform-style:preserve-3d;
  transform:translateY(-72px) rotateX(-13deg) rotateY(var(--base,0deg));
  transition:transform 210ms cubic-bezier(.2,1.5,.35,1)}   /* 过冲后骤停 = 棘轮手感 */
.helix.rock{animation:rockMe 5.4s ease-in-out infinite}   /* 缓慢晃动（活着的感觉）*/
@keyframes rockMe{0%,100%{rotate:-1.7deg}50%{rotate:1.7deg}}
/* 竖轴 */
/* 块面上的页名：在序号圈正下方，扫一眼即知块是谁 */
.plate .bpg{position:absolute;left:0;right:0;top:78px;text-align:center;
  font-family:var(--f-m);font-size:10px;letter-spacing:.14em;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.mblk.on .plate .bpg{color:var(--c10)}

/* ══ 卡片纹样：SVG「制图记号」（2026-10-09 换掉 AI 生图 PNG）═════════
   为什么必须换（实测数据，别再用「裁切/定位」去救）：
     · 15 张 PNG 墨迹高度 35–364px（画布 512）→ 缩到卡上 = 3.4–35.5px，比例差 10 倍
     · 水平镜像对称度 IoU 平均 0.672，01=0.101 / 11=0.071 → **天生不对称**，剪裁改不了
     · 512 细线缩进 50px 框 = 缩略比 1:10 → 屏上线宽 0.3–0.6px，必然发虚
     · 暖墨烧死在像素里 → palette b/c（暗）下纹样几乎不可见（SVG 用 var() 会跟着换肤）
   新纹样规则：1px 细线 · 4px 网格 · **严格左右镜像对称** · 每图恰好一枚金元素
   几何：图样窗 96×50 @ (40,13)——与 viewBox 1:1，线宽不失真；
        墨迹落在 25..51，与序号字面顶（≈76）留 **25px** 净间距 → 不再压字
   （原 PNG 那 15 条 .wicon.w-* 规则保留未删，便于随时改回）*/
/* 取景器角标：四角 L 形刻线，是"框"不是"图"——静止态压到 55% 透明度当细框，
   正对卡整圈转金（与 .mblk.on 的金色语言一致，也不占用纹样那唯一一枚金焦点）。
   geometry：inset 6.5px、臂长 16px、1px 线（坐标带 .5 → dsf2 屏压住 2 个物理像素） */
.plate .wframe{position:absolute;left:0;top:0;width:176px;height:108px;z-index:4;
  fill:none;stroke:var(--c30-ink);stroke-width:1;opacity:.7;pointer-events:none}
.mech .mblk.on .wframe{stroke:var(--c10);opacity:1}
/* 图样窗（见上）：与 viewBox 1:1 */
.plate .wicon{position:absolute;left:0;top:0;width:176px;height:108px;
  z-index:3;background:none;transform:none;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
/* 通用圆环：15 张全一样、且正好夹在纹样与序号之间 → 抢重心 + 压字，撤掉。
   （想找回来只需删掉这一行） */
.plate .face::after{display:none}
.plate .blk-n{top:66px}
.plate .bpg{top:88px}
/* 页名（.bpg）**从卡面撤掉**（用户反馈的「文字遮挡」就是它）：
   实测它 top:88 → 字面 ~92..102，而序号字面到 ~98 → 两者叠了 6px。
   卡面本来就只该有「纹样 + 序号」；页名不会丢 —— 正对卡右侧的 .blk-tag
   仍然显示「序号 + 页名 + 英文」。想找回来：删掉下面这一行。 */
.plate .bpg{display:none}

/* 轴线：**通长贯穿**（660px，从上到下不断线）。
   ★ 与卡片的**前后关系**：轴线 translateZ(-340px) 退到所有卡片之后
     （卡片在 z=±320）→ 正对的那张卡（--dim=1，不透明）挡住轴线，
     轴线只从卡片之间的缝隙露出，视觉上就是"卡片围绕着这条线"。
   ⚠ 定位基准是 .mech-in 的**左边缘**（absolute 相对父容器），不是轴心
     → 必须 calc(50% - 1.25px)；写 left:-1px 会让轴线贴到面板最左边，
     表现为"展开后根本看不到线"（历史坑，见交接文档第 8 节第 7 条）。*/
.mech-axle{position:absolute;left:calc(50% - 1.25px);top:-330px;width:2.5px;height:660px;
  background:linear-gradient(180deg,transparent,var(--c30-ink) 14%,
    var(--c30-ink) 86%,transparent);opacity:.8;
  transform:translateZ(-340px)}
/* 顶部深色金属机头（参考片里那个深色机构，随结构一起转）*/
.cap{position:absolute;left:-104px;top:-326px;width:208px;height:60px;
  transform:translateZ(-40px);border:1px solid var(--c30-ink);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c30) 58%,transparent),
    color-mix(in srgb,var(--deep) 82%,transparent));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 18px 34px -14px rgba(0,0,0,.6)}
.cap::after{content:'';position:absolute;left:50%;top:50%;width:26px;height:26px;
  margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 14%,var(--c10) 18% 60%,#000 100%)}
/* （金属机头 .cap 已按用户要求移除）*/
/* 红色粗斜线：压在最上层 */
.mech-redline{position:absolute;left:-8%;top:50%;width:116%;height:3px;
  background:var(--c10);opacity:.72;transform:rotate(-24deg);transform-origin:center;z-index:9;
  box-shadow:0 0 12px color-mix(in srgb,var(--c10) 34%,transparent);
  clip-path:inset(0 100% 0 0)}
.mech.open .mech-redline{animation:lineIn 420ms steps(10,end) both}
@keyframes lineIn{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}

/* ── 板片：绕竖轴排成螺旋（rotateY → translateZ → 上升）────────── */
.mech .mblk{position:absolute;left:0;top:0;width:176px;height:108px;
  margin:-54px 0 0 -88px;cursor:pointer;transform-style:preserve-3d;
  transform:rotateY(var(--a)) translateZ(var(--R,300px)) translateY(var(--y))
            rotateX(var(--tilt,0deg)) rotateZ(var(--spin,0deg))
            translateZ(var(--pop,0px)) scale(var(--sc,1));
  opacity:var(--dim,.9);
  transition:transform 240ms cubic-bezier(.2,1.62,.32,1),opacity 150ms linear}
/* 每块独立晃动（相位/摆幅/周期各不相同）*/
.mech .mblk > .plate{position:absolute;inset:0;transform-style:preserve-3d;
  animation:plateSwing var(--wdur,3.1s) ease-in-out infinite;
  animation-delay:calc(var(--i,0) * -.41s)}
@keyframes plateSwing{0%,100%{transform:rotateX(0deg) rotateZ(0deg)}
  50%{transform:rotateX(var(--amp,4deg)) rotateZ(calc(var(--amp,4deg) * .7))}}

/* ══ 真 3D 壳体：四个面用**真实 rotate** 拼出来（厚度 34px）══ */
.plate .face{position:absolute;inset:0;z-index:2;
  background:linear-gradient(168deg,#f6f8f9,color-mix(in srgb,var(--panel) 80%,#fff));
  border:1px solid var(--c30-ink);
  box-shadow:inset 0 12px 28px rgba(0,0,0,.17),inset 0 -9px 22px rgba(0,0,0,.13),
    inset 0 2px 0 rgba(255,255,255,.55)}
.plate .face::after{content:'';position:absolute;left:50%;top:52%;width:30px;height:30px;
  margin:-15px 0 0 -15px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--c30-ink) 76%,transparent);
  background:radial-gradient(circle at 36% 32%,#fff 0 24%,
    color-mix(in srgb,var(--c30-ink) 30%,transparent) 28%,transparent 64%)}
/* 顶面：真的绕底边转起来（不是斜切的平行四边形）*/
.plate .topf{position:absolute;left:0;top:0;width:100%;height:54px;z-index:3;
  transform-origin:50% 100%;transform:rotateX(-79deg);
  background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--panel) 88%,#fff));
  border:1px solid var(--c30-ink);border-bottom:0}
/* 底面：向外翻，强化"这块有厚度" */
.plate .botf{position:absolute;left:0;bottom:0;width:100%;height:34px;z-index:0;
  transform-origin:50% 0;transform:rotateX(64deg);
  background:linear-gradient(0deg,color-mix(in srgb,var(--c30-ink) 58%,transparent),
    color-mix(in srgb,var(--c30-ink) 26%,transparent));
  border:1px solid var(--c30-ink);border-top:0}
/* 侧面：绕左边真转 */
.plate .sidef{position:absolute;left:0;top:0;width:52px;height:100%;z-index:1;
  transform-origin:0 50%;transform:rotateY(-79deg);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c30-ink) 62%,transparent),
    color-mix(in srgb,var(--c30-ink) 30%,transparent));
  border:1px solid var(--c30-ink);border-right:0}
.plate .blk-n{position:absolute;inset:0;z-index:5;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:22px;color:var(--c30-ink);letter-spacing:-.02em}
.plate .lead{position:absolute;left:100%;top:54%;width:34px;z-index:6;
  border-top:1px dotted color-mix(in srgb,var(--c30-ink) 68%,transparent)}
.plate .blk-tag{position:absolute;left:calc(100% + 38px);top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:9px;white-space:nowrap;z-index:9;opacity:0;
  transition:opacity 110ms steps(3,end)}
.plate .blk-tag::before{content:'';width:24px;height:1px;background:var(--c10)}
.plate .blk-tag b{font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;color:var(--c10)}
.plate .blk-tag span{font-size:14px;color:var(--ink);font-weight:600}
/* 当前块：红边 + 外发光 + **旋转滑出**（--pop 推出 + --spin 拧一下）*/
.mech .mblk.near .face{border-color:color-mix(in srgb,var(--c10) 50%,transparent)}
.mech .mblk.on{z-index:14;--pop:78px;--tilt:0deg;--spin:0deg}
.mech .mblk.on .face{background:linear-gradient(168deg,#fff,var(--panel));
  border-color:var(--c10);border-width:2px;
  box-shadow:0 0 34px color-mix(in srgb,var(--c10) 50%,transparent)}
.mech .mblk.on .topf{background:#fff;border-color:var(--c10);border-width:2px 2px 0}
.mech .mblk.on .sidef{border-color:var(--c10);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c10) 46%,transparent),
    color-mix(in srgb,var(--c10) 76%,transparent))}
.mech .mblk.on .blk-n{color:var(--c10);font-weight:700}
.mech .mblk.on .blk-tag{opacity:1}

/* ══ 入场：由右上角向左下角贯穿 ══
   每块从"右上角远处"飞入自己的位置；延迟按它在螺旋上的位置错开 → 形成一道斜向贯穿 */
/* ★ 入场动画挂在 .plate 上、且只用**独立属性** translate/rotate ——
   如果去动 .mblk 的 transform，动画（fill:both）会**覆盖内联 transform**，
   而那个 transform 正是承载螺旋定位的 → 12 块会被拉回原点叠成一堆。
   CSS 里 translate/rotate 是独立属性，与 transform 叠加而不冲突。 */
.mech .mblk{opacity:var(--dim,.9)}
.mech.open .mblk > .plate{animation:
  plateSwing var(--wdur,3.1s) ease-in-out infinite,      /* 逐块独立晃动（常驻）*/
  unfoldShell 520ms cubic-bezier(.2,.9,.24,1) both,      /* ② 折成壳体（平滑）*/
  flyHelix 880ms cubic-bezier(.16,.84,.2,1) both;       /* ③ 从标记飞向螺旋位 */
  animation-delay:calc(var(--i,0) * -.41s),
    calc(240ms + var(--sw,0) * 26ms),
    calc(480ms + var(--sw,0) * 40ms)}
/* 没展开时不跑入场（保持在"远处"）*/
/* 收起时由 .mech 整体的 opacity 统一隐藏；这里**绝不能**再给 .mblk 设 opacity ——
   否则它会覆盖下面的 opacity:var(--dim)（整条链会全透明，块看不见）。 */

/* ══════════════════════════════════════════════════════════════════
   ★ 开合的因果：展开 = 从收起的那些斜线里"长"出来
     阶段① 线条延伸   —— 斜线沿自身方向画出来（stroke-dashoffset）
     阶段② 折叠成壳体 —— 面从"折平"立起来（rotate 90°→0）
     阶段③ 展开成螺旋 —— 从标记位置飞到螺旋位（translate/scale）
   ⚠️ 三段都只用**独立属性**（translate/rotate/scale），挂在 `.plate` 上；
      绝不能动 `.mblk` 的 transform —— 那正是承载螺旋定位的。
   ══════════════════════════════════════════════════════════════════ */
@keyframes drawOut{from{stroke-dashoffset:46}to{stroke-dashoffset:0}}
@keyframes fadeMark{from{opacity:1}to{opacity:0}}
body.mech-open .decon .sl{animation:drawOut 560ms steps(22,end) forwards}
body.mech-open .decon .ghost{animation:fadeMark 340ms linear 480ms forwards}
body.mech-open .decon .dt{animation:fadeMark 340ms linear 480ms forwards}
body.mech-open .rack .lb{animation:fadeMark 260ms linear 420ms forwards}

@keyframes unfoldShell{     /* 阶段②：折平 → 立起成壳体（平滑 + 轻微过冲）*/
  0%{rotate:88deg;scale:1.1;opacity:.2}
  55%{rotate:-7deg;scale:.985}
  78%{rotate:2deg}
  100%{rotate:0deg;scale:1;opacity:1}}
@keyframes flyHelix{       /* 阶段③：从标记处飞向螺旋位（带自转，像被装上去）*/
  0%{translate:var(--fx,-618px) var(--fy,86px);scale:.16;rotate:-42deg}
  38%{scale:1.07;rotate:6deg}
  72%{scale:.985;rotate:-2deg}
  100%{translate:0 0;scale:1;rotate:0deg}}

/* ★ 2026-10-21：原来写的是 bottom:-52px。
   `.mech-cap` 在 DOM 上是 `.mech-in` 的**兄弟**，定位包含块是 `.mech`（fixed,inset:0）
   —— 也就是整个视口。bottom:-52 于是把它推到视口**外** 52px：
   三种分辨率实测（1440×900 / 1920×1080 / 1280×800）全部不可见。
   它是唯一的操作说明（滚轮/回车/ESC 怎么用），等于从来没人看到过。
   现在贴着视口底 12px；上下留白靠 mech-in 与视口高度的差（最窄 1366×768 仍有 5px 间隙）。
   ★ 颜色必须用 --deep-ink 而不是 --c30-ink：提示牌压在本层遮罩上
   （color-mix(--deep 62%)），**四套配色的遮罩都是深色**，所以字必须是亮的。
   实测对比度（逐像素采样，WCAG 相对亮度）：
     用 --c30-ink   → a 骨白 2.69 / r 绯白 2.79  ← 浅色配色下不可读
     用 --deep-ink  → 四套统一落在 7 以上（--deep-ink 本来就是"深底上的亮字"）。*/
.mech-cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.26em;
  color:var(--deep-ink);white-space:nowrap;opacity:0;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.5)}
.mech.open .mech-cap{opacity:1;animation:capIn 200ms steps(4,end) 200ms both}
@keyframes capIn{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .mech{backdrop-filter:none}
  .mech .mblk{animation:none !important;--op:1}
  .mech.open .mech-redline{animation:none;clip-path:none}
}

/* ══ 机械导航：轮盘 / 棘轮 / 轴 / 书架 ══ */
/* ══════════════════════════════════════════════════════════════════
   ★ 机械导航：轮盘 + 棘轮 + 轴 + 书架
   用户反馈：导航太长 → 改成一格一格的**棘轮**（转动手感），
   并衍生出「轮盘 / 轴 / 书架」这套机械隐喻。
   要点：棘轮**一格一格、有阻尼、到头限位**，不是平滑滚动列表。
   ══════════════════════════════════════════════════════════════════ */

.mv{position:absolute;left:20px;top:78px;bottom:56px;width:112px;z-index:16;
  display:flex;flex-direction:column;gap:14px}

/* ── 轮盘（dial）：可转，带棘齿 ─────────────────────────────── */
.dial{position:relative;width:104px;height:104px;flex:none;cursor:grab;
  touch-action:none;user-select:none}
.dial:active{cursor:grabbing}
/* 齿圈：SVG 画的 15 个棘齿 */
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .tick{stroke:color-mix(in srgb,var(--ink) 34%,transparent);stroke-width:1.4}
.dial .tick.on{stroke:var(--accent);stroke-width:2.6}
/* 盘面（哑光 + 上缘高光，像金属）*/
.dial .face{position:absolute;inset:13px;border-radius:50%;
  background:radial-gradient(120% 120% at 32% 22%,
    color-mix(in srgb,var(--panel) 96%,transparent),
    color-mix(in srgb,var(--ink) 12%,transparent));
  border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 26%,transparent),
             inset 0 -2px 3px rgba(0,0,0,.22),
             0 6px 14px -8px rgba(0,0,0,.5);
  transform:rotate(var(--a,0deg));
  transition:transform 150ms cubic-bezier(.2,1.5,.35,1)}   /* ★ 棘轮手感：轻微过冲后骤停 */
.dial.turn .face{transition:transform 90ms steps(4,end)}   /* 转动中：硬步进（不打滑）*/
/* 刻度上的数字（跟着转）*/
.dial .face b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-cn);font-weight:900;font-size:22px;color:var(--accent);
  letter-spacing:-.04em;transform:rotate(calc(-1 * var(--a,0deg)));
  transition:transform 150ms cubic-bezier(.2,1.5,.35,1)}
.dial.turn .face b{transition:transform 90ms steps(4,end)}
/* 轴（axle）：中心轴 + 轮毂，不随盘转（机械感的关键）*/
.axle{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:
    radial-gradient(circle at 34% 30%,#fff 0 18%,var(--accent) 20% 62%,#000 100%);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 20%,transparent),
             0 0 0 6px color-mix(in srgb,var(--panel) 70%,transparent)}
.axle::after{content:'';position:absolute;left:50%;top:50%;width:1px;height:330px;
  margin-left:-.5px;transform-origin:top;transform:rotate(var(--ax,0deg));
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 42%,transparent),transparent 62%);
  transition:transform 190ms cubic-bezier(.2,1.5,.35,1)}   /* 轴比盘慢半拍 → 阻尼感 */

/* ── 书架（bookshelf）：书脊式条目，比列表短一半 ─────────────── */

.sp{position:relative;height:24px;display:flex;align-items:center;gap:7px;
  padding:0 6px 0 8px;cursor:pointer;flex:none;
  background:color-mix(in srgb,var(--panel) 70%,transparent);
  border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);
  border-left:3px solid transparent;overflow:hidden}
.sp .no{font-family:var(--f-mono);font-size:9px;color:var(--ink4);flex:none}
.sp .tx{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sp .en{font-family:var(--f-lat);font-style:italic;font-size:9px;color:var(--ink4);
  margin-left:auto;flex:none}
.sp:hover{border-left-color:var(--accent);transform:translateX(2px)}
.sp.on{background:var(--accent);border-color:var(--accent)}
.sp.on .no,.sp.on .tx,.sp.on .en{color:var(--panel)}
.sp.on .tx{color:#fff;font-weight:600}
/* 顶/到底的"书挡" */
.mv::before,.mv::after{content:'';display:block;height:3px;flex:none;
  background:color-mix(in srgb,var(--ink) 30%,transparent)}

@media (prefers-reduced-motion: reduce){
  .dial .face,.dial .face b,.axle::after{transition:none}
}
/* ═══ 人格页卡片化（2026-10-29）══════════════════════════════════ */
.pc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:900px){.pc-grid{grid-template-columns:1fr}}
.pc-card{background:#181512;border:1px solid rgba(232,226,214,.10);border-radius:10px;
  padding:12px 14px;transition:border-color .18s ease,background .18s ease;min-width:0}
.pc-card:hover{border-color:rgba(232,226,214,.2)}
.pc-card.open{border-color:rgba(216,184,119,.55);background:#1d1a15}
.pc-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pc-name{color:var(--gold,#d8b877);font-size:12px;letter-spacing:.04em}
.pc-meta{margin-left:auto;color:var(--ink4,#7d7466);font-size:10px;font-variant-numeric:tabular-nums}
.pc-prev{color:var(--ink3,#b9b0a0);font-size:11px;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pc-edit{width:100%;min-height:120px;margin-top:8px;background:#141210;color:#efe9dd;
  border:1px solid rgba(232,226,214,.16);border-radius:6px;padding:8px 10px;

<script>

/* ═════════════ 基础设施 ═════════════ */
const $ = (id) => document.getElementById(id);
const qsa = (s, r = document) => Array.from(r.querySelectorAll(s));
/* ★ 每个请求都带超时（2026-10-27）。
   没有超时的 fetch 会把整个控制台锁死：协议页卡在 /api/protocol/status 时
   （服务端扫 1GB 日志，8 秒起），render() 永远不返回 → go() 的 busy 不释放 →
   之后**所有切页都被挡下**，用户看到的就是"协议页读取中，切别的页也停在这页"。
   默认 60s 只是兜底（启动/停止驱动这类慢操作要留够），真正的修复在服务端；
   需要更长的调用点可以传第三个参数。 */
const API = (p, opt, timeoutMs) => {
  const ms = (typeof timeoutMs === 'number' && timeoutMs > 0) ? timeoutMs : 60000;
  const o = Object.assign({headers:{'Content-Type':'application/json'}}, opt || {});
  let ctl = null, timer = 0;
  try {
    if (!o.signal && typeof AbortController !== 'undefined') {
      ctl = new AbortController();
      o.signal = ctl.signal;
      timer = setTimeout(() => { try { ctl.abort(); } catch (e) {} }, ms);
    }
  } catch (e) {}
  return fetch('/api' + p, o)
  .then(r => r.json().then(j => {
    if (!r.ok) throw new Error((j && (j.error || j.msg)) || ('HTTP ' + r.status));
    return j;
  }))
  .catch(e => {
    if (e && e.name === 'AbortError') throw new Error('请求超时（' + Math.round(ms/1000) + 's）：/api' + p);
    throw e;
  })
  .finally(() => { if (timer) clearTimeout(timer); });
};
const esc = (s) => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v) => {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'boolean') return v ? '开' : '关';
  if (typeof v === 'number') return Number.isInteger(v) ? v.toLocaleString() : String(v);
  if (typeof v === 'object') return Array.isArray(v) ? v.length + ' 项' : Object.keys(v).length + ' 项';
  return String(v);

/* 标识类数值必须原样输出 —— 端口 3000 不能写成「3,000」，

const later = (el, fn, ms) => setTimeout(() => { if (el && el.isConnected) fn(); }, ms);

/* ═════════════ 粘底滚动（日志 / 对话 / 终端输出共用）═════════════
   一次解决用户反馈的三件事：
     · 往上翻日志/对话时，自动刷新**不许**把人拽回底部 —— 只有「本来就在
       底部（阈值内）」才跟着新内容滚（粘底），否则位置原地不动；
     · 右下角给一个「回到最新」圆钮（参考图：三点 + 箭头），点了平滑回底；
     · 钮上带未读计数（翻上去之后又来了多少条），回到底部自动清零。
   用法：const sb = pvStickScroll(box, jumpBtn);
        sb.rewrite(html)  ← 重绘入口，内部按粘底状态决定滚不滚

   ⚠ 一定要用 rewrite() 而不是自己写 box.innerHTML —— 否则滚动位置会被重置，
   这正是"往上翻着看，刷新一下就被拉到底"的另一半原因。 */
function pvStickScroll(box, jumpBtn, opts) {
  if (!box) return null;
  if (box.__pvScroll) return box.__pvScroll;
  const pad = (opts && opts.pad) || 48;
  const api = { stick: true, unseen: 0, _lock: false };
  const gap = () => box.scrollHeight - box.scrollTop - box.clientHeight;
  api.near = () => gap() <= pad;
  api.sync = () => {
    if (!jumpBtn) return;
    const show = !api._lock && gap() > pad;      // 平滑滚动途中不闪按钮
    jumpBtn.hidden = !show;
    if (!show) { api.unseen = 0; return; }
    const nEl = jumpBtn.querySelector('.n');
    const n = api.unseen | 0;
    jumpBtn.classList.toggle('has-n', n > 0);
    if (nEl) nEl.textContent = n > 99 ? '99+' : String(n);
  };
  api.toBottom = (smooth) => {
    api.stick = true; api.unseen = 0;
    const t = Math.max(0, box.scrollHeight - box.clientHeight);
    if (smooth) {
      /* 平滑滚动会连续触发 scroll 事件（中途都不在底部）→ 上锁，
         否则中途会被判成"用户翻上去了"，按钮闪一下又消失。*/
      api._lock = true;
      try { box.scrollTo({ top: t, behavior: 'smooth' }); } catch (e) { box.scrollTop = t; }
      setTimeout(() => { api._lock = false; api.stick = api.near(); api.sync(); }, 460);
    } else {
      box.scrollTop = t;
    }
    api.sync();
  };
  api.rewrite = (html) => {
    const keep = box.scrollTop, was = api.stick;
    box.innerHTML = html;
    if (was) api.toBottom(false);
    else box.scrollTop = Math.min(keep, Math.max(0, box.scrollHeight - box.clientHeight));
    api.sync();
  };
  box.addEventListener('scroll', () => {
    if (!api._lock) {
      api.stick = api.near();
      if (api.stick) api.unseen = 0;
    }
    api.sync();
    if (opts && opts.onScroll) { try { opts.onScroll(api); } catch (e) {} }
  });
  if (jumpBtn) {
    jumpBtn.innerHTML = '<i class="dots"></i><i class="arw"></i><span class="n"></span>';
    jumpBtn.onclick = () => api.toBottom(true);
  }
  box.__pvScroll = api;
  return api;
}

nav.insertBefore(cursor, nav.firstChild);      // ★ 放进 .nav，与条目同坐标原点
const setCursor = (i) => cursor.style.setProperty('--cur', (PAD + i * ROW) + 'px');

/* 鼠标划过导轨：近处条目抬起，影子按高度自动推导 */
nav.parentNode.addEventListener('mousemove', (e) => {
  const r = nav.getBoundingClientRect(), y = e.clientY - r.top + nav.scrollTop;
  items().forEach((n, k) => {
    const d = Math.abs((PAD + k * ROW + ROW / 2) - y);
    setH(n, Math.max(0, 1 - d / 170) * 30);
  });
});
nav.parentNode.addEventListener('mouseleave', () => items().forEach(n => setH(n, 0)));
