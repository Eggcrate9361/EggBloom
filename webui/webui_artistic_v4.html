        + esc(l[0]) + '</a>').join('') + '</div>';
  }
  return h;
}

function protoCollect(drv) {
  const m = PROTO_META[drv] || {};
  const out = {};
  /* 用 startsWith 过滤而不是属性选择器 ^="drv." ——
     一旦驱动名里带正则元字符（当前不会，但将来会），选择器会直接抛错，
     表现为"点保存没反应、也没报错"。 */
  qsa('#pdGrid input[data-pk]').forEach(inp => {
    const k = inp.dataset.pk || '';
    if (k.slice(0, drv.length + 1) !== drv + '.') return;
    const key = k.slice(drv.length + 1);
    const val = (inp.value || '').trim();
    if (key === 'ws_port') out[key] = parseInt(val || m.wsPort, 10) || m.wsPort;
    else out[key] = val;
  });
  return out;
}

/* ② 文件浏览器模态：listDir(path) → 选文件 → onPick(fullPath, name) */
function protoFileBrowser(startPath, onPick) {
  const mask = document.createElement('div');
  mask.className = 'fb-mask';
  mask.innerHTML = '<div class="fb" role="dialog" aria-label="选择文件">'
    + '<div class="fb-hd"><b>选择文件</b>'
    + '<input class="fb-path" id="fbPath" spellcheck="false">'
    + '<button class="btn sm" id="fbUp">上级</button>'
    + '<button class="btn sm" id="fbCancel">取消</button></div>'
    + '<ul class="fb-list" id="fbList"><li><b>读取中…</b></li></ul>'
    + '<div class="wz-ft"><span class="dim">双击目录进入 · 选中文件后写入对应字段并保存</span></div></div>';
  document.body.appendChild(mask);
  const pathEl = mask.querySelector('#fbPath');
  const listEl = mask.querySelector('#fbList');
  const close = () => { mask.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  mask.querySelector('#fbCancel').onclick = close;
  mask.addEventListener('click', (e) => { if (e.target === mask) close(); });

  async function load(p) {
    listEl.innerHTML = '<li><b>读取中…</b></li>';
    let r;
    try { r = await API('/protocol/fs', { method: 'POST', body: JSON.stringify({ path: p || '' }) }); }
    catch (e) { listEl.innerHTML = '<li><b>读取失败：' + esc(e.message) + '</b></li>'; return; }
    if (!r || r.ok === false) {
      listEl.innerHTML = '<li><b>' + esc((r && r.error) || '读取失败') + '</b></li>';
      return;
    }
    pathEl.value = r.path || '';
    const ups = r.parent ? '<li data-up="1"><b>.. 上级目录</b></li>' : '';
    const items = (r.entries || []).map(e =>
      '<li class="' + (e.dir ? 'dir' : '') + '" data-path="' + esc(e.path) + '" data-dir="' + (e.dir ? 1 : 0) + '">'
      + '<b>' + (e.dir ? '▸ ' : '') + esc(e.name) + '</b>'
      + '<span>' + (e.dir ? 'DIR' : Math.round((e.size || 0) / 1024) + ' KB') + '</span></li>').join('');
    listEl.innerHTML = ups + (items || '<li><b>（空目录）</b></li>');
  }
  listEl.onclick = (ev) => {
    const li = ev.target.closest('li');
    if (!li) return;
    if (li.dataset.up) { load(''); return; }         /* 上级：由后端算 */
    const p = li.dataset.path;
    if (!p) return;
    if (li.dataset.dir === '1') { load(p); return; }
    close();
    try { onPick(p, p.split(/[\\/]/).pop()); } catch (e) {}
  };
  mask.querySelector('#fbUp').onclick = () => load('');
  pathEl.onkeydown = (e) => { if (e.key === 'Enter') load(pathEl.value); };
  load(startPath || '');
  return { close };
}

/* 选到文件后：分类（QQ.exe → qq-path；启动器 → 对应驱动配置）*/
async function protoApplyPick(drv, field, filePath, say) {
  const name = filePath.split(/[\\/]/).pop().toLowerCase();
  /* ① 明显是 QQ.exe → 走专用接口 */
  if (name === 'qq.exe') {
    try {
      /* ⚠ 后端读的是 data['qq_path']（不是 path）—— 传错字段名会静默不生效：
         接口照样返回成功，QQ 路径却没写进去（实测踩过）。*/
      const r = await API('/qq-path', { method: 'POST', body: JSON.stringify({ qq_path: filePath }) });
      say(true, (r && (r.output || r.path)) || 'QQ 路径已保存');
    } catch (e) { say(false, e.message); }
    return;
  }
  /* ② 其余交给 classify 判断它属于哪个驱动 */
  try {
    const r = await API('/protocol/classify', { method: 'POST', body: JSON.stringify({ path: filePath }) });
    const kind = (r && (r.kind || r.type || r.driver)) || '';
    const target = (kind === 'napcat' || kind === 'llonebot' || kind === 'snowluma') ? kind : drv;
    await API('/protocol/config', {
      method: 'POST',
      body: JSON.stringify({ driver: target, config: { exe_path: filePath } }),
    });
    say(true, '已识别为 ' + (PROTO_META[target] ? PROTO_META[target].name : target)
      + ' 启动器，路径已保存');
  } catch (e) { say(false, e.message); }
}

/* ③ 自动识别：POST /protocol/detect → 候选列表 → 应用推荐 */
async function protoDetect(say, host) {
  say(false, '正在自动识别…');
  let r;
  try { r = await API('/protocol/detect', { method: 'POST', body: '{}' }); }
  catch (e) { say(false, '识别失败：' + e.message); return; }
  const pick = (r && (r.recommend || r.recommended || r.driver)) || '';
  const paths = {};
  ['napcat', 'llonebot', 'snowluma'].forEach(k => {
    const key = k + '_paths';
    if (r && Array.isArray(r[key]) && r[key].length) paths[k] = r[key];
  });
  const rows = [];
  if (pick) rows.push({ b: '推荐驱动', v: PROTO_META[pick] ? PROTO_META[pick].name : pick, k: 'rec' });
  Object.keys(paths).forEach(k => {
    paths[k].slice(0, 3).forEach((p, i) => {
      rows.push({ b: (PROTO_META[k] ? PROTO_META[k].name : k) + (i ? ' 备选 ' + (i + 1) : ' 安装路径'),
                  v: p, k: k, p: p });
    });
  });
  if (!rows.length) { say(false, '没有探测到已安装的协议驱动'); return; }
  say(true, '识别完成');
  if (host) {
    host.innerHTML = '<div class="pd-det">' + rows.map(r =>
      '<div class="it"><b>' + esc(r.b) + '</b><code>' + esc(r.v) + '</code>'
      + (r.p ? '<button class="btn sm" data-apply-pick="' + esc(r.k) + '|' + esc(r.p) + '">填入并保存</button>' : '')
      + '</div>').join('') + '</div>'
      + (pick ? '<div style="margin-top:var(--s3);display:flex;gap:var(--s2)">'
        + '<button class="btn primary" data-apply-rec="' + esc(pick) + '">切换到推荐驱动</button></div>' : '');
  }
  return { recommend: pick, paths: paths };
}

/* ④ 配置向导（分步卡片式）—— 三步：提供商 → Key/地址 → 模型 + 测试 */
function protoWizard(cfg, say) {
  const state = { step: 0, provider: '', url: '', key: '', model: '', models: [] };
  const wrap = document.createElement('div');
  wrap.className = 'wz';
  const paint = () => {
    const steps = ['提供商', 'Key 与地址', '模型与测试'];
    let body = '';
    if (state.step === 0) {
      const provs = (cfg && cfg.providers) || [];
      body = '<h4>选择提供商</h4><p>决定 API 地址模板与可用模型。已配置的提供商会列在最前。</p>'
        + '<div class="fld"><label>提供商</label><select id="wzProv">'
        + provs.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name || p.id) + '</option>').join('')
        + '<option value="__custom">自定义地址…</option></select></div>'
        + '<div class="fld"><label>API URL</label><input id="wzUrl" value="' + esc(state.url || (cfg && cfg.api_url) || '')
        + '" placeholder="https://api.deepseek.com/chat/completions"></div>';
    } else if (state.step === 1) {
      body = '<h4>填 Key 与地址</h4><p>Key 写入 Windows 凭据管理器，配置文件不落盘明文。</p>'
        + '<div class="fld"><label>API URL</label><input id="wzUrl" value="' + esc(state.url) + '"></div>'
        + '<div class="fld"><label>API Key</label><input id="wzKey" type="password" value="' + esc(state.key)
        + '" placeholder="sk-…" autocomplete="off"></div>'
        + '<div class="wz-ft"><button class="btn sm" id="wzFetch">拉取模型列表</button>'
        + '<span class="dim" id="wzMsg">' + (state.models.length ? '已拉到 ' + state.models.length + ' 个模型' : '') + '</span></div>';
    } else {
      body = '<h4>选模型并测试</h4><p>先测试连接，通了再保存 —— 免得保存完才发现地址或 Key 不对。</p>'
        + '<div class="fld"><label>模型</label>' + (state.models.length
          ? '<select id="wzModel">' + state.models.map(m =>
              '<option value="' + esc(m.id || m) + '">' + esc(m.name || m.id || m) + '</option>').join('') + '</select>'
          : '<input id="wzModel" value="' + esc(state.model) + '" placeholder="手动输入模型代码">')
        + '</div>'
        + '<div class="wz-ft"><button class="btn sm" id="wzTest">测试连接</button>'
        + '<span class="dim" id="wzMsg"></span></div>';
    }
    wrap.innerHTML = '<div class="wz-steps">' + steps.map((s, i) =>
      '<span class="wz-step ' + (i === state.step ? 'on' : i < state.step ? 'done' : '') + '"><b>'
      + (i + 1) + '</b>' + esc(s) + '</span>' + (i < steps.length - 1 ? '<i class="wz-arrow"></i>' : '')).join('')
      + '</div><div class="wz-card">' + body + '</div>'
      + '<div class="wz-ft">'
      + (state.step > 0 ? '<button class="btn sm" id="wzPrev">上一步</button>' : '')
      + '<button class="btn sm" id="wzCancel">取消</button>'
      + (state.step < 2 ? '<button class="btn primary" id="wzNext">下一步</button>'
                        : '<button class="btn primary" id="wzSave">保存并热重载</button>')
      + '</div>';
    bind();
  };
  const msg = (t) => { const m = wrap.querySelector('#wzMsg'); if (m) m.textContent = t || ''; };
  const val = (id) => { const e = wrap.querySelector('#' + id); return e ? (e.value || '').trim() : ''; };
  async function finish() {
    const payload = { api_url: val('wzUrl'), model_name: val('wzModel') };
    if (state.provider) payload.api_provider = state.provider;
    if (state.key) payload.api_key = state.key;
    try {
      const r = await API('/config', { method: 'POST', body: JSON.stringify(payload) });
      if (r && (r.ok === false || r.error)) { say(false, r.error || '保存失败'); return; }
      await API('/config/reload', { method: 'POST', body: '{}' }).catch(() => {});
      say(true, '向导完成：已写入 ' + Object.keys(payload).length + ' 项并热重载');
      wrap.remove();
    } catch (e) { say(false, e.message); }
  }
  function bind() {
    const c = wrap.querySelector('#wzCancel'); if (c) c.onclick = () => wrap.remove();
    const nx = wrap.querySelector('#wzNext');
    if (nx) nx.onclick = () => {
      if (state.step === 0) {
        const p = wrap.querySelector('#wzProv');
        state.provider = p ? p.value : '';
        state.url = val('wzUrl');
        if (state.provider === '__custom') state.provider = '';
      } else if (state.step === 1) {
        state.url = val('wzUrl'); state.key = val('wzKey');
      }
      state.step = Math.min(2, state.step + 1);
      paint();
    };
    const pv = wrap.querySelector('#wzPrev'); if (pv) pv.onclick = () => { state.step = Math.max(0, state.step - 1); paint(); };
    const sv = wrap.querySelector('#wzSave'); if (sv) sv.onclick = finish;
    const fd = wrap.querySelector('#wzFetch');
    if (fd) fd.onclick = async () => {
      state.url = val('wzUrl'); state.key = val('wzKey');
      msg('正在拉取…');
      try {
        const r = await API('/providers/models', { method: 'POST', body: JSON.stringify({ provider: state.provider, api_url: state.url, api_key: state.key }) });
        const list = (r && (r.models || r.data)) || [];
        state.models = Array.isArray(list) ? list : [];
        msg(state.models.length ? '已拉到 ' + state.models.length + ' 个模型' : '没拉到模型，可手动输入');
        state.step = 2; paint();
      } catch (e) { msg('拉取失败：' + e.message); }
    };
    const ts = wrap.querySelector('#wzTest');
    if (ts) ts.onclick = async () => {
      state.model = val('wzModel'); state.url = val('wzUrl');
      msg('正在测试…');
      try {
        const r = await API('/llm/test', { method: 'POST', body: JSON.stringify({ api_url: state.url, api_key: state.key, model_name: state.model, provider: state.provider }) });
        const ok = r && (r.ok !== false) && !(r.error);
        msg(ok ? '连接正常' : ('失败：' + (r.error || r.output || '未知')));
      } catch (e) { msg('测试失败：' + e.message); }
    };
  }
  paint();
  return wrap;
}

      + (d === curDrv ? '<i>使用中</i>' : '') + '</button>').join('');
    $('pdGrid').innerHTML = protoCfgHTML(pcDrv, pcCfg[pcDrv] || {}, pcStatus);
    qsa('[data-pd-tab]').forEach(b => b.onclick = () => { pcDrv = b.dataset.pdTab; pcPaint(); });
    qsa('[data-pbrowse]').forEach(b => b.onclick = () => {
      const key = b.dataset.pbrowse;
      const cur = key.split('.')[1];
      protoFileBrowser('', (fp) => {
        const inp = document.querySelector('[data-pk="' + key + '"]');
        if (inp) inp.value = fp;
        protoApplyPick(pcDrv, cur, fp, say);
      });
    });
    qsa('[data-pdetect]').forEach(b => b.onclick = () => protoDetect(say, out.parentNode));
    qsa('[data-copy]').forEach(b => b.onclick = async () => {
      const t = b.dataset.copy;
      try { await navigator.clipboard.writeText(t); say(true, '已复制：' + t.slice(0, 40)); }
      catch (e) { say(false, '复制失败（浏览器拒绝了剪贴板）'); }
    });
    /* ★ 官网要走后端打开：Electron 窗口里 window.open / target=_blank 会被
       默认策略 deny（用户点了没反应）。后端 /protocol/open-site 带域名白名单，
       比前端裸开安全（实测踩过）。*/
    qsa('[data-open]', el).forEach(b => b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await API('/protocol/open-site', {
          method: 'POST', body: JSON.stringify({ url: b.dataset.open }) });
        say(!(r && r.ok === false), (r && r.error) || '已在系统浏览器打开');
      } catch (e) { say(false, '打开失败：' + e.message); }
      b.disabled = false;
    });
  };
  pcPaint();
  /* 快捷动作条：打开协议 WebUI / 定位驱动切换（用户反馈"缺快捷打开 webui、协议切换"）*/
  const qs = document.createElement('div');
  qs.style.cssText = 'display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)';
  qs.innerHTML = '<button class="btn" id="pdQuickWebui">打开协议 WebUI</button>'
    + '<button class="btn" id="pdQuickSwitch">切换驱动</button>'
    + '<span class="dim" id="pdQuickTip" style="align-self:center"></span>';
  el.insertBefore(qs, el.firstChild);
  $('pdQuickWebui').onclick = async () => {
    try {
      const st2 = await API('/protocol/status');
      /* ★ 地址必须用后端**抓到的**（st2.webui，来自各驱动的 get_webui_info：
         它会读驱动自己的 config/webui.json 与启动日志）。
         旧实现拿 st2.api_port（OneBot API 3000）当 WebUI 端口，还硬编码 3000 兜底 ——
         那是两回事：SnowLuma WebUI 在 5099 / NapCat 6099 / LLOneBot 7000。*/
      const w = (st2 && st2.webui) || {};
      let url = w.url || '';
      if (!url) {                       /* 兜底：驱动配置里的 webui_port（仍然不是 API 端口）*/
        const dc = ({ napcat: st2 && st2.napcat_config,
                      llonebot: st2 && st2.llonebot_config,
                      snowluma: st2 && st2.snowluma_config }[st2 && st2.protocol_driver]) || {};
        if (dc.webui_port) url = 'http://127.0.0.1:' + dc.webui_port;
      }
      if (!url) {
        $('pdQuickTip').textContent = '未找到协议 WebUI 地址（驱动未启动或配置里没有 webui_port）';
        return;
      }
      try { window.open(url, '_blank', 'noopener'); } catch (x) {}
      try { await API('/protocol/open-site', { method: 'POST', body: JSON.stringify({ url: url }) }); } catch (x2) {}
      let tip = '已打开 ' + url;
      if (w.token) tip += '　token: ' + w.token;              /* NapCat/LLOneBot 登录要 token */
      if (w.user || w.password) tip += '　账号 ' + (w.user || '') + ' / ' + (w.password || '');
      if (!w.found) tip += '　（未从驱动配置读到凭据，可能要手动登录）';
      $('pdQuickTip').textContent = tip;
    } catch (e) { $('pdQuickTip').textContent = '读取协议端口失败：' + e.message; }
  };
  $('pdQuickSwitch').onclick = () => {
    const sw = document.querySelector('#pdTabs, [class*=switch], #pdGrid');
    if (sw) { sw.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    $('pdQuickTip').textContent = '已定位到驱动切换区';
  };
  /* 版面：连接状态 → 换驱动 → 自检清单 → 驱动配置 → 启停 → 日志。
     自检提前，是因为"换完这个驱动到底能不能启动"是这一页最想知道的事。*/
  reorderByBlocks(el, ['连接状态', '协议驱动', '操作', '驱动配置', '协议日志']);

  $('pdSave').onclick = async () => {
    const cfg = protoCollect(pcDrv);
    try {
      const r = await API('/protocol/config', {
        method: 'POST', body: JSON.stringify({ driver: pcDrv, config: cfg }) });
      if (r && (r.ok === false || r.error)) { say(false, r.error || '保存失败'); return; }
      pcCfg[pcDrv] = cfg;
      say(true, (PROTO_META[pcDrv] || {}).name + ' 配置已保存' + (r && r.output ? '：' + r.output : ''));
    } catch (e) { say(false, e.message); }
  };
  $('pdDetect').onclick = () => protoDetect(say, out.parentNode);
  /* 启动前自检：逐项 ok/hint 清单（v3 的 renderProtoCheck，v4 第一版只弹一句话）*/
  const paintCheck = (r) => {
    const box = $('pdCheck');
    const items = (r && Array.isArray(r.items)) ? r.items : [];
    if (!items.length) {
      box.innerHTML = '<div class="pd-check"><div class="pd-check-t">启动前自检</div>'
        + '<div class="ht">' + esc((r && r.error) || '暂无检查项') + '</div></div>';
      return;
    }
    const bad = items.filter(it => !it.ok);
    box.innerHTML = '<div class="pd-check' + (bad.length ? ' bad' : '') + '">'
      + '<div class="pd-check-t">启动前自检（' + esc((r && r.driver) || curDrv) + '）：'
      + (bad.length ? ('发现 ' + bad.length + ' 项未就绪') : '全部就绪 ✓') + '</div>'
      + items.map(it => '<div class="it"><span class="mk">' + (it.ok ? '✓' : '✗') + '</span>'
        + '<span class="lb">' + esc(it.label || '') + '</span>'
        + '<span class="ht">' + esc(it.hint || '') + '</span></div>').join('')
      + '</div>';
  };
  const runCheck = async () => {
    try { paintCheck(await API('/protocol/check', { method: 'POST', body: '{}' })); }
    catch (e) { say(false, '自检失败：' + e.message); }
  };
  if ($('pCheck')) $('pCheck').onclick = runCheck;
  /* 页面打开就跑一次自检：v3 也是进页即显示清单（用户要"逐项就绪"而不是一句提示）*/
  later(el, runCheck, 400);
  /* QQ 路径回显在操作条右侧（v3 有） */
  const qqTag = document.createElement('span');
  qqTag.className = 'pd-qqpath';
  qqTag.textContent = 'QQ: ' + (s.qq_path || '未设置');
  const wzft = $('pdSave').parentNode;
  if (wzft) wzft.appendChild(qqTag);
  $('pdQqPath').onclick = () => protoFileBrowser('', (fp) => protoApplyPick(pcDrv, 'qq_path', fp, say));
  $('pdWizardHide').style.display = 'none';
  $('pdWizard').onclick = async () => {
    let cfg = {};
    try { const _r = await API('/config'); cfg = (_r && _r.config) ? _r.config : (_r || {}); } catch (e) {}
    const host = document.getElementById('pdGrid');
    const old2 = host.innerHTML;
    host.innerHTML = '';
    const w = protoWizard(cfg, say);
    host.appendChild(w);
    const cancel = w.querySelector('#wzCancel');
    if (cancel) cancel.addEventListener('click', () => { host.innerHTML = old2; pcPaint(); }, { once: true });
    const save = w.querySelector('#wzSave');
    if (save) save.addEventListener('click', () => {
      setTimeout(() => { host.innerHTML = old2; pcPaint(); }, 900);
    }, { once: true });
  };

  /* 切换驱动：必须走完风控二次确认 */
  qsa('[data-drv]', el).forEach(b => b.onclick = async () => {
    const d = b.dataset.drv;
    b.disabled = true; const old = b.textContent; b.textContent = '…';
    try {
      let r = await API('/protocol/switch', { method:'POST', body: JSON.stringify({ driver: d }) });
      if (r && r.success === false && r.need_confirm) {
        out.innerHTML = '<div class="warnbox">' + esc(r.output || '需二次确认') + '</div>'
          + '<div style="margin-top:var(--s3)"><button class="btn primary" id="pConfirm">确认切换</button>'
          + '　<button class="btn" id="pCancel">取消</button></div>';
        $('pCancel').onclick = () => { out.innerHTML = ''; b.disabled = false; b.textContent = old; };
        $('pConfirm').onclick = async () => {
          $('pConfirm').disabled = true; $('pConfirm').textContent = '切换中…';
          try {
            const r2 = await API('/protocol/switch', { method:'POST',
              body: JSON.stringify({ driver: d, confirm: true }) });
            say(!!r2.success, r2.output || (r2.success ? '已切换' : '切换失败'));
            if (r2.success) later(el, () => pageProtocol(el), 700);
          } catch (e2) { say(false, e2.message); }
        };
        b.disabled = false; b.textContent = old;
        return;
      }
      say(!!r.success, r.output || (r.success ? '已切换' : '切换失败'));
      if (r && r.success) later(el, () => pageProtocol(el), 700);
    } catch (e) { say(false, e.message); }
    b.disabled = false; b.textContent = old;
  });

  $('pStart').onclick = async () => {
    $('pStart').disabled = true; $('pStart').textContent = '启动中…';
    try { const r = await API('/protocol/start', { method:'POST', body:'{}' });
      say(!!r.success, r.output || ''); later(el, () => pageProtocol(el), 900);
    } catch (e) { say(false, e.message); $('pStart').disabled = false; $('pStart').textContent = '启动协议层'; }
  };
  $('pStop').onclick = async () => {
    $('pStop').disabled = true; $('pStop').textContent = '停止中…';
    try { const r = await API('/protocol/stop', { method:'POST', body:'{}' });
      say(!!r.success, r.output || ''); later(el, () => pageProtocol(el), 700);
    } catch (e) { say(false, e.message); $('pStop').disabled = false; $('pStop').textContent = '停止'; }
  };

  /* 启动前自检：逐项 ok / hint —— 避免"启动了才发现配置没填" */
  $('pCheck').onclick = async () => {
    out.innerHTML = '<div class="empty">自检中…</div>';
    try {
      const r = await API('/protocol/check', { method:'POST', body: JSON.stringify({ driver: curDrv }) });
      if (r.error) { say(false, r.error); return; }
      const items = r.items || [];
      out.innerHTML = '<div class="sig ' + (r.ok ? 'ok' : 'err') + '"><i></i>'
        + (r.ok ? '自检通过' : '存在未就绪项') + '（' + esc(r.driver || curDrv) + '）</div>'
        + '<div class="rows" style="margin-top:var(--s3)">'
        + items.map(it => '<div class="row" style="grid-template-columns:1fr 90px">'
            + '<span>' + esc(it.label || it.key) + ' <span class="dim">' + esc(it.hint || '') + '</span></span>'
            + '<span class="sig ' + (it.ok ? 'ok' : 'err') + '"><i></i>' + (it.ok ? '就绪' : '缺失') + '</span>'
            + '</div>').join('')
        + '</div>';
    } catch (e) { say(false, e.message); }
  };

  /* 自动检测：列出本机找到的驱动 */
  $('pAuto').onclick = async () => {
    out.innerHTML = '<div class="empty">检测中…</div>';
    try {
      const r = await API('/protocol/auto-detect', { method:'POST', body:'{}' });
      const c = r.candidates || [];
      out.innerHTML = (r.recommended ? '<div class="sig ok"><i></i>推荐：' + esc(r.recommended) + '</div>' : '')
        + '<div class="rows" style="margin-top:var(--s3)">'
        + (c.length ? c.map(x => '<div class="row" style="grid-template-columns:170px 110px 1fr">'
            + '<span>' + esc(x.name || x.driver) + '</span>'
            + '<span class="sig ' + (x.running ? 'live' : (x.found ? 'ok' : '')) + '"><i></i>'
            + (x.running ? '运行中' : (x.found ? '已安装' : '未找到')) + '</span>'
            + '<span class="dim" style="font-size:var(--z2)">' + esc(x.desc || x.exe || '') + '</span>'
            + '</div>').join('') : '<div class="empty">未检测到任何驱动</div>')
        + '</div>';
    } catch (e) { say(false, e.message); }
  };

  /* 日志分级兜底：只在后端没给 level 时用（磁盘旧行、字符串行）。
     规则与 log_levels.py 一致：错误词 → 注意词 → AI 词 → 行首标签。
     改这里必须同步改 log_levels.py，否则终端和界面会给出两种判级。 */
  const LV_LABEL = { err: 'ERR', warn: 'WARN', ai: 'AI', send: 'SEND', sys: 'SYS', info: 'INFO' };
  const LOG_RULES = [
    ['err', ['CRASH', '未捕获异常', '失败', '异常', '错误', 'ERROR', 'Error', 'error', 'Traceback']],
    ['warn', ['警告', '跳过', '冷却', '超时', '限流', '重试', '未匹配']],
    ['ai', ['AI 回复', 'AI (', 'AI失败', 'AI 重试', 'AI 不重试']],
  ];
  const LOG_TAGS = {
    '发送': 'send', '发图': 'send',
    'Plugin': 'sys', 'Sandglass': 'sys', '事件': 'sys', '表情': 'sys',
    '表情包回敬': 'sys', '画图': 'sys', '搜索': 'sys', '私聊': 'sys', '群': 'sys', '群管理': 'sys',
    'scope': 'sys', '状态': 'sys', 'harness': 'sys', 'Agent': 'sys',
    '转发': 'sys', '文件': 'sys', '出站审计': 'sys', '输出预算': 'sys', '调试': 'sys',
  };
  const LOG_CALM = ['已恢复', '恢复正常', '重连成功', '已自动重启'];
  const classifyLog = (text) => {
    const s = String(text || '');
    if (LOG_CALM.some((k) => s.includes(k))) return 'info';
    for (const [lv, keys] of LOG_RULES) {
      if (keys.some((k) => s.includes(k))) return lv;
    }
    const m = s.replace(/^\[[0-9:]{5,8}\]\s*/, '').match(/^\[([^\]\s:]{1,20})[\]\s:]/);
    if (m && LOG_TAGS[m[1]]) return LOG_TAGS[m[1]];
    return 'info';
  };

  const drawLogs = (logs) => {
    const box = $('pLog');
    if (!box) return;
    /* 走粘底滚动：停在底部才跟随新日志，翻上去看历史时位置不动。
       见 pvStickScroll —— 这里以前是裸 innerHTML，位置全靠运气。 */
    if (!logs || !logs.length) { pBox.rewrite('<div class="empty">暂无日志</div>'); return; }
    pBox.rewrite(logs.map((l, i) => {
      const isObj = l && typeof l === 'object';
      const ts = isObj ? (l.time || l.ts || '') : '';
      /* 后端已在 _collect_logs 里补了 level（规则见 log_levels.py），
         这里只做兜底：万一拿到的是别的来源（字符串行），就地判一次。
         判级规则必须和后端一致，改一边要改另一边。 */
      const raw = isObj ? (l.text || l.msg || l.message || '') : String(l);
      const lv = (isObj ? (l.level || l.lv || '') : '').toLowerCase()
        || classifyLog(raw);
      /* 老代码取 l.msg 取不到就 JSON.stringify(l)，于是整行显示成
         {"time":"12:00:00","text":"..."}。改成按 text 兜底。 */
      const msg = raw || JSON.stringify(l);
      return '<div class="ln"><span class="no">' + (i + 1) + '</span>'
        + '<span class="ts">' + esc(ts) + '</span>'
        + '<span class="lv ' + lv + '">' + esc(LV_LABEL[lv] || lv.toUpperCase()) + '</span>'
        + '<span class="tx lv-' + lv + '">' + esc(msg) + '</span></div>';
    }).join(''));
    pvTerminalOnce(box);
  };
  /* ★ 协议日志自动刷新（用户反馈："日志好像不能实时刷新"）。
     以前只 fetch 一次。现在每 2.5s 拉一次，但**只在内容真的变了才重绘**，
     且重绘走粘底滚动：用户在翻历史时不会被拽回底部。*/
  let _logSig = '';
  const pullLogs = async () => {
    try {
      const r = await API('/protocol/logs', { method: 'POST', body: JSON.stringify({ limit: 200 }) });
      const logs = (r && r.logs) || [];
      const tail = logs.length ? JSON.stringify(logs[logs.length - 1]).slice(0, 160) : '';
      const sig = logs.length + '|' + tail;
      if (sig !== _logSig) { _logSig = sig; drawLogs(logs); }
    } catch (e) { /* 后端没起时不刷错误，保留上一屏 */ }
  };
  if (window.__pLogTimer) { clearInterval(window.__pLogTimer); }
  await pullLogs();
  window.__pLogTimer = setInterval(() => {
    if (!document.body.contains(el)) { clearInterval(window.__pLogTimer); window.__pLogTimer = null; return; }
    pullLogs();
  }, 2500);
  $('pLogClear').onclick = async () => {
    try { await API('/protocol/logs/clear', { method:'POST', body:'{}' }); _logSig = ''; drawLogs(null); }
    catch (e) { say(false, e.message); }
  };
}

/* ═════════════ 群管理页 ═════════════
   接口原本在 bot_core(3005)，旧前端是**跨域直连**；v4 统一走
   `/api/groups*` 由 webui_server 转发（见 webui_server._proxy_bot_core）。
     GET  /api/groups               → {ok, groups:[{group_id, group_name, member_count,
                                          bot_role, bot_is_admin, bot_card,
                                          reply_enabled, whitelisted, block_reason,
                                          new_member_card}]}
     GET  /api/groups/members?group_id= → {ok, members:[{user_id,nickname,card,role,title,is_bot}], bot_qq}
     POST /api/groups/settings {group_id, reply_enabled?, new_member_card?} → {ok}
     POST /api/groups/action {action, group_id, ...} → {ok}
       action ∈ card / admin / ban / unban / kick / name / whole_ban
   ⚠️ 保留重点：`block_reason` 是"Bot 为什么不在这个群说话"的唯一答案（P0-2 加的），
      必须顶到列表可见处，不能埋进二级页。 */
const ROLE_MAP = { owner: '群主', admin: '管理员', member: '成员', unknown: '未知' };

/* ══════════════════════════════════════════════════════════════════
   好友管理（v3 有，v4 第一版缺）：GET /friends + /friends/settings + /friends/action
     · 头像（qlogo）+ 昵称/备注 + QQ 号
     · 自动回复开关（逐好友）
     · 备注编辑
   ══════════════════════════════════════════════════════════════════ */
async function gmFriends(host, say) {
  host.innerHTML = '<div class="empty">读取好友…</div>';
  let fs = [];
  try {
    const r = await API('/friends');
    if (r && r.ok === false) { host.innerHTML = '<div class="errbox">读取失败：' + esc(r.error || '') + '</div>'; return; }
    fs = (r && (r.friends || r.items)) || [];
  } catch (e) { host.innerHTML = '<div class="errbox">读取 /api/friends 失败：' + esc(e.message) + '</div>'; return; }
  if (!fs.length) { host.innerHTML = '<div class="empty">暂无好友（确认 Bot 已登录）</div>'; return; }

  host.innerHTML = fs.map(f => {
    const uid = String(f.user_id || f.uin || '');
    const nick = f.nickname || f.nick || '';
    const remark = f.remark || f.note || '';
    return '<div class="fm-card" data-uid="' + esc(uid) + '">'
      + '<img class="fm-av" src="https://q1.qlogo.cn/g?b=qq&nk=' + esc(uid) + '&s=40" alt=""'
      +   ' onerror="this.style.opacity=.2">'
      + '<div class="fm-main">'
      +   '<div class="fm-t">' + esc(remark || nick || uid)
      +     (remark && nick ? ' <span class="dim">(' + esc(nick) + ')</span>' : '') + '</div>'
      +   '<div class="dim" style="font-size:9px">' + esc(uid) + (remark ? ' · 备注：' + esc(remark) : '') + '</div>'
      +   '<div class="fm-act">'
      +     '<input class="fm-in" placeholder="修改备注" value="' + esc(remark) + '">'
      +     '<button class="btn sm" data-fm="remark">保存备注</button>'
      +   '</div>'
      + '</div>'
      + '<button class="sw" role="switch" data-fm="reply" aria-checked="'
      +   (f.reply_enabled === false ? 'false' : 'true') + '"'
      +   ' aria-label="自动回复"></button>'
      + '</div>';
  }).join('');

  /* 自动回复开关 → POST /friends/settings */
  qsa('[data-fm="reply"]', host).forEach(sw => sw.onclick = async () => {
    const uid = sw.closest('.fm-card').dataset.uid;
    const next = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', next ? 'true' : 'false');
    try {
      const r = await API('/friends/settings', {
        method: 'POST', body: JSON.stringify({ user_id: uid, reply_enabled: next }) });
      say(!!(r && r.ok !== false), '自动回复已' + (next ? '开启' : '关闭') + ' · ' + uid);
    } catch (e) {
      sw.setAttribute('aria-checked', next ? 'false' : 'true');
      say(false, '保存失败：' + e.message);
    }
  });
  /* 备注 → POST /friends/action */
  qsa('[data-fm="remark"]', host).forEach(b => b.onclick = async () => {
    const card = b.closest('.fm-card');
    const uid = card.dataset.uid;
    const val = card.querySelector('.fm-in').value.trim();
    try {
      const r = await API('/friends/action', {
        method: 'POST', body: JSON.stringify({ user_id: uid, remark: val }) });
      if (r && r.ok === false) { say(false, r.error || '保存失败'); return; }
      say(true, '备注已保存 · ' + uid);
      card.querySelector('.dim').textContent = uid + (val ? ' · 备注：' + val : '');
    } catch (e) { say(false, '保存失败：' + e.message); }
  });
}

async function pageGroups(el) {
  el.innerHTML = '<div class="empty">读取群列表…（群多时需几秒，逐个群查成员）</div>';
  let r;
  try { r = await API('/groups'); }
  catch (e) { el.innerHTML = '<div class="errbox">读取 /api/groups 失败：' + esc(e.message) + '</div>'; return; }
  if (r && r.ok === false) {
    el.innerHTML = '<div class="errbox">' + esc(r.error || '读取失败')
      + (r.hint ? '<br>' + esc(r.hint) : '') + '</div>';
    return;
  }
  const groups = (r && r.groups) || [];
  const on = groups.filter(g => g.whitelisted && g.reply_enabled !== false).length;
  const blocked = groups.length - on;

  el.innerHTML = ''
    + '<div class="hd"><span class="lab">总览</span><i class="rule"></i></div>'
    + '<div class="stats">'
    +   '<div class="st"><div class="lab">群总数</div><div class="v">' + groups.length + '</div>'
    +     '<div class="c">Bot 可见的群</div></div>'
    +   '<div class="st"><div class="lab">参与中</div><div class="v">' + on + '</div>'
    +     '<div class="c">白名单内且已开启</div></div>'
    +   '<div class="st"><div class="lab">被拦截</div><div class="v">' + blocked + '</div>'
    +     '<div class="c">不参与回复</div></div>'
    + '</div>'

    + '<div class="hd"><span class="lab">群列表</span><i class="rule"></i>'
    +   '<span class="dim">点群名展开成员与动作</span></div>'
    + '<div class="fld" style="max-width:320px;margin-bottom:var(--s4)">'
    +   '<input id="gFilter" placeholder="按群名或群号筛选…" autocomplete="off"></div>'
    + '<div class="rows" id="gList"></div>';

  const draw = (kw) => {
    const list = kw ? groups.filter(g =>
      (g.group_name + ' ' + g.group_id).toLowerCase().includes(kw.toLowerCase())) : groups;
    const box = $('gList');
    if (!list.length) {
      /* 空态要说清**为什么**：Bot 没登录 / 没加群 / 筛选太窄，是三件不同的事 */
      const filtered = !!kw;   /* 这一页只有搜索框，没有额外的角色筛选 */
      box.innerHTML = '<div class="empty">'
        + (filtered ? '没有匹配当前筛选的群'
                    : '暂无群（确认 Bot 已登录、且已加入至少一个群）')
        + '</div>';
      return;
    }
    box.innerHTML = '<div class="row head" style="grid-template-columns:1fr 90px 90px 150px 90px">'
      + '<span>群</span><span>成员</span><span>Bot</span><span>参与状态</span><span>操作</span></div>'
      + list.map(g => {
          const part = g.whitelisted && g.reply_enabled !== false;
          return '<div class="row" style="grid-template-columns:1fr 90px 90px 150px 90px">'
            + '<span><a href="#" data-open="' + esc(g.group_id) + '" style="color:inherit;'
            +   'border-bottom:1px dotted var(--line3)">' + esc(g.group_name) + '</a>'
            +   ' <span class="dim num">' + esc(g.group_id) + '</span></span>'
            + '<span class="num dim">' + esc(fmtRaw(g.member_count || '—')) + '</span>'
            + '<span class="dim">' + esc(ROLE_MAP[g.bot_role] || g.bot_role || '—')
            +   (g.bot_card ? ' <span class="dim">(' + esc(g.bot_card) + ')</span>' : '') + '</span>'
            + '<span class="sig ' + (part ? 'live' : '') + '" title="' + esc(g.block_reason || '') + '"><i></i>'
            +   (part ? '参与中' : '不参与') + '</span>'
            + '<span><button class="btn" data-toggle="' + esc(g.group_id) + '" data-on="'
            +   (g.reply_enabled === false ? '0' : '1') + '">'
            +   (g.reply_enabled === false ? '开启' : '关闭') + '</button></span>'
            + '</div>'
            + (part ? '' : '<div class="row dim" style="grid-template-columns:1fr;font-size:var(--z2);'
                + 'padding-top:0;border-bottom:1px solid var(--line)">'
                + '<span>↳ 原因：' + esc(g.block_reason || '未说明') + '</span></div>');
        }).join('');

    // 参与开关
    qsa('[data-toggle]', box).forEach(b => b.onclick = async () => {
      b.disabled = true; const t = b.textContent; b.textContent = '…';
      try {
        const res = await API('/groups/settings', { method:'POST',
          body: JSON.stringify({ group_id: b.dataset.toggle, reply_enabled: b.dataset.on !== '1' }) });
        if (res && res.ok === false) { b.disabled = false; b.textContent = t; b.title = res.error || ''; return; }
        await pageGroups(el);
      } catch (e) { b.disabled = false; b.textContent = t; b.title = e.message; }
    });
    // 展开详情
    qsa('[data-open]', box).forEach(a => a.onclick = (ev) => {
      ev.preventDefault();
      openGroup(el, groups.find(x => x.group_id === a.dataset.open));
    });
  };
  draw('');
  $('gFilter').oninput = (e) => draw(e.target.value.trim());
  /* ── 好友管理（v3 有）──────────────────────────────────────────── */
  const fmHost = document.createElement('div');
  const fmHd = document.createElement('div');
  fmHd.className = 'hd';
  fmHd.style.marginTop = 'var(--s6)';
  fmHd.innerHTML = '<span class="lab">好友管理</span><i class="rule"></i>'
    + '<span class="dim">自动回复开关与备注编辑</span>'
    + '<button class="btn sm" id="gmFriendRefresh" style="margin-left:auto">刷新</button>';
  el.appendChild(fmHd);
  el.appendChild(fmHost);
  const fmSay = (ok, t) => {
    fmHost.insertAdjacentHTML('afterbegin',
      '<div class="sig ' + (ok ? 'ok' : 'err') + '" style="margin-bottom:var(--s3)"><i></i>'
      + esc(t) + '</div>');
    setTimeout(() => { const n = fmHost.querySelector('.sig'); if (n) n.remove(); }, 2600);
  };
  await gmFriends(fmHost, fmSay);
  fmHd.querySelector('#gmFriendRefresh').onclick = () => gmFriends(fmHost, fmSay);

}

/* 单个群的详情：入群名片 / 群级动作 / 成员列表与成员操作 */
async function openGroup(el, g) {
  if (!g) return;
  const host = document.createElement('div');
  host.innerHTML = ''
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">' + esc(g.group_name)
    + ' · ' + esc(g.group_id) + '</span><i class="rule"></i>'
    + '<button class="btn" id="gClose">收起</button></div>'
    + '<div id="gDetail"></div>';
  el.appendChild(host);
  host.scrollIntoView({ behavior:'smooth', block:'nearest' });
  $('gClose').onclick = () => host.remove();

  const d = $('gDetail');
  d.innerHTML = ''
    + '<div class="hd"><span class="lab">群设置</span><i class="rule"></i></div>'
    + '<div class="stats">'
    +   '<div class="fld"><label>入群自动名片（留空＝不改）</label>'
    +     '<input id="gCard" value="' + esc(g.new_member_card || '') + '" placeholder="如：2026级 新同学"></div>'
    +   '<div class="fld"><label>群名称（改群名）</label>'
    +     '<input id="gName" value="' + esc(g.group_name || '') + '"></div>'
    + '</div>'
    + '<div style="display:flex;gap:var(--s3);flex-wrap:wrap;margin:var(--s4) 0">'
    +   '<button class="btn primary" id="gSaveCard">保存名片</button>'
    +   '<button class="btn" id="gSaveName">改群名</button>'
    +   '<button class="btn" id="gWholeBan">全员禁言</button>'
    +   '<button class="btn" id="gWholeUnban">解除全员禁言</button>'
    + '</div>'
    + '<div id="gMsg"></div>'
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">成员</span><i class="rule"></i></div>'
    + '<div id="gMembers"><div class="empty">读取成员…</div></div>';

  const msg = (ok, t) => { $('gMsg').innerHTML = '<div class="sig ' + (ok ? 'ok' : 'err')
    + '"><i></i>' + esc(t) + '</div>'; };
  const act = async (body) => {
    try { const res = await API('/groups/action', { method:'POST', body: JSON.stringify(body) });
      return res || {}; } catch (e) { return { ok:false, error:e.message }; }
  };

  $('gSaveCard').onclick = async () => {
    const b = $('gSaveCard'); b.disabled = true; b.textContent = '保存中…';
    try {
      const res = await API('/groups/settings', { method:'POST',
        body: JSON.stringify({ group_id: g.group_id, new_member_card: $('gCard').value }) });
      msg(!!res.ok, res.ok ? '入群名片已保存' : (res.error || '保存失败'));
    } catch (e) { msg(false, e.message); }
    b.disabled = false; b.textContent = '保存名片';
  };
  $('gSaveName').onclick = async () => {
    const b = $('gSaveName'); b.disabled = true; b.textContent = '提交中…';
    const res = await act({ action:'name', group_id: g.group_id, name: $('gName').value });
    msg(!!res.ok, res.ok ? '群名已修改' : (res.error || res.detail || '失败'));
    b.disabled = false; b.textContent = '改群名';
  };
  /* 全员禁言：v3 分"开启/解除"两个动作，后端不提供状态查询，所以也只能拆两个按钮
     （之前合成一个还写死 enable:true → **根本没法解除**，实测才发现）。 */
  const wholeBan = async (btn, enable) => {
    const t = btn.textContent;
    btn.disabled = true; btn.textContent = '提交中…';
    const res = await act({ action: 'whole_ban', group_id: g.group_id, enable: enable });
    msg(!!res.ok, res.ok ? (enable ? '已全员禁言' : '已解除全员禁言')
                        : (res.error || res.detail || '失败'));
    btn.disabled = false; btn.textContent = t;
  };
  /* ★ 应用内二次确认（替代系统 confirm —— 用户反馈"弹窗是系统弹窗"）：
     第一次点"武装"（按钮变成确认文案 + 旁边出现取消），第二次点才执行。
     全站群管理页尽量走这条路，不再打扰系统弹窗。*/
  const armConfirm = (btn, yesText, onYes) => {
    const bar = btn.parentNode;
    const orig = btn.textContent;
    btn.textContent = yesText;
    btn.classList.add('primary');
    const cancel = document.createElement('button');
    cancel.className = 'btn sm'; cancel.textContent = '取消';
    bar.insertBefore(cancel, btn.nextSibling);
    const disarm = () => {
      btn.textContent = orig; btn.classList.remove('primary');
      if (cancel.parentNode) cancel.remove();
    };
    btn.onclick = async () => { disarm(); await onYes(); };
    cancel.onclick = (e) => { e.stopPropagation(); disarm(); };
  };
  $('gWholeBan').onclick = () => armConfirm($('gWholeBan'), '确认全员禁言？', () => wholeBan($('gWholeBan'), true));
  $('gWholeUnban').onclick = () => wholeBan($('gWholeUnban'), false);   /* 解禁无害，不问 */

  try {
    const mr = await API('/groups/members?group_id=' + encodeURIComponent(g.group_id));
    const ms = (mr && mr.members) || [];
    const botQq = (mr && mr.bot_qq) || '';
    $('gMembers').innerHTML = (mr && mr.ok === false)
      ? '<div class="errbox">' + esc(mr.error || '读取成员失败') + '</div>'
      : '<div class="rows"><div class="row head" style="grid-template-columns:1fr 90px 240px">'
        + '<span>成员</span><span>身份</span><span>操作</span></div>'
        + ms.map(m => '<div class="row" style="grid-template-columns:1fr 90px 240px">'
            + '<span>' + esc(m.card || m.nickname || m.user_id)
            + (m.is_bot ? ' <span class="sig live" style="display:inline-flex"><i></i>本机</span>' : '')
            + ' <span class="dim num">' + esc(m.user_id) + '</span></span>'
            + '<span class="dim">' + esc(ROLE_MAP[m.role] || m.role || '—') + '</span>'
            + '<span style="display:flex;gap:var(--s2);flex-wrap:nowrap">'
            +   '<button class="btn sm" data-m="ban" data-u="' + esc(m.user_id) + '">禁言</button>'
            +   '<button class="btn sm" data-m="unban" data-u="' + esc(m.user_id) + '">解禁</button>'
            +   '<button class="btn sm" data-m="kick" data-u="' + esc(m.user_id) + '">踢出</button>'
            + '</span></div>').join('')
        + '</div>';
    /* ★ 成员操作：不再用系统 confirm（用户反馈"弹窗是系统弹窗"），
       也不再写死 10 分钟（用户反馈"只能禁言 10 分钟"）——
       点「禁言」在原地展开时长选项、点「踢出」在原地展开确认，全部走应用内 UI。*/
    const runMemberAction = async (kind, uid, minutes) => {
      const body = { action: kind, group_id: g.group_id, user_id: uid };
      if (kind === 'ban') body.duration_minutes = minutes;
      const res = await act(body);
      msg(!!res.ok, res.ok
        ? ('已执行：' + kind + (kind === 'ban' ? '（' + minutes + ' 分钟）' : ''))
        : (res.error || res.detail || '失败'));
    };
    const bindMemberBtns = () => {
      qsa('[data-m]', $('gMembers')).forEach(b => b.onclick = async () => {
        const kind = b.dataset.m, uid = b.dataset.u;
        if (kind === 'unban') {        /* 解禁无害，直接执行 */
          b.disabled = true; const t = b.textContent; b.textContent = '…';
          await runMemberAction('unban', uid, 0);
          b.disabled = false; b.textContent = t;
          return;
        }
        const bar = b.parentNode;
        const opts = kind === 'ban'
          ? [['1 分钟', 1], ['10 分钟', 10], ['1 小时', 60], ['1 天', 1440]]
          : [['确认踢出', 0]];
        const old = bar.innerHTML;
        const restore = () => { bar.innerHTML = old; bindMemberBtns(); };
        bar.innerHTML = '<span class="dim" style="align-self:center;font-size:10px">'
          + (kind === 'ban' ? '禁言时长' : '确认踢出？') + '</span>'
          + opts.map(o => '<button class="btn sm" data-d="' + o[1] + '">' + o[0] + '</button>').join('')
          + '<button class="btn sm" data-d="-1">取消</button>';
        qsa('[data-d]', bar).forEach(db => db.onclick = async () => {
          const v = parseInt(db.dataset.d, 10);
          if (v < 0) { restore(); return; }
          db.disabled = true;
          await runMemberAction(kind, uid, v);
          restore();
        });
      });
    };
    bindMemberBtns();
  } catch (e) {
    $('gMembers').innerHTML = '<div class="errbox">' + esc(e.message) + '</div>';
  }
}

/* ═════════════ 控制台 ═════════════
   POST /api/command {command} → {output}（服务端支持 status / restart 等） */
async function pageConsole(el) {
  el.innerHTML = ''
    + '<div class="hd"><span class="lab">底层指令</span><i class="rule"></i>'
    +   '<span class="dim">支持 status · restart 等</span></div>'
    + '<div style="display:flex;gap:var(--s3);max-width:760px">'
    +   '<input id="cxIn" class="fld" style="flex:1;background:transparent;border:0;'
    +     'border-bottom:1px solid var(--line2);color:var(--ink);font-family:var(--f-m);'
    +     'font-size:var(--z3);padding:var(--s2) 0;outline:none"'
    +     ' placeholder="输入指令，回车执行…" autocomplete="off">'
    +   '<button class="btn primary" id="cxGo">执行</button></div>'
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">指令输出</span><i class="rule"></i>'
    +   '<button class="btn sm" id="cxClear">清空</button></div>'
    + '<div class="pv-wrap"><pre class="log" id="cxOut" style="padding:var(--s4);white-space:pre-wrap;max-height:34vh;overflow:auto"></pre>'
    +   '<button class="pv-jump" id="cxJump" hidden title="回到最新"></button></div>'
    /* 原始日志流：从日志页搬过来的。日志页现在只画事件（消息/决策/工具/出错），
       调试打印、模块加载、Traceback 这些"给写代码的人看"的行留在这里 ——
       它和底层指令同属"排障"语境，放一起不用来回切页。 */
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">原始日志</span><i class="rule"></i>'
    +   '<span class="dim" id="cxLogStats">—</span>'
    +   '<button class="btn sm" id="cxLogClear">清空日志</button>'
    +   '<button class="btn sm" id="cxLogReload">刷新</button></div>'
    + '<div style="display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)">'
    +   '<input id="cxLogSearch" class="fld" style="flex:1;min-width:200px;background:transparent;border:0;'
    +     'border-bottom:1px solid var(--line2);color:var(--ink);padding:var(--s2) 0;outline:none"'
    +     ' placeholder="在原始日志里搜（模块名、异常栈、任意关键字）" autocomplete="off">'
    +   '<label class="dim" style="display:flex;align-items:center;gap:7px;font-size:12px">'
    +     '<input type="checkbox" id="cxLogAuto" checked style="accent-color:var(--accent)">自动滚动</label>'
    + '</div>'
    + '<div class="pv-wrap"><div class="log" id="cxLog" style="max-height:40vh;overflow:auto;'
    +   'padding:var(--s3) var(--s4)"></div>'
    +   '<button class="pv-jump" id="cxLogJump" hidden title="回到最新"></button></div>';
  const hist = [];
  /* 输出也走粘底滚动：翻上去看历史时，新输出不会把视口拽回底部 */
  const sb = pvStickScroll($('cxOut'), $('cxJump'));
  const push = (ok, t) => {
    hist.push((ok ? '· ' : '! ') + t);
    sb.rewrite(esc(hist.join('\n')));
  };
  const run = async () => {
    const v = $('cxIn').value.trim(); if (!v) return;
    $('cxIn').value = '';
    push(true, '$ ' + v);
    try {
      const r = await API('/command', { method:'POST', body: JSON.stringify({ command: v }) });
      push(!!(r && r.ok !== false), (r && (r.output || r.error)) || JSON.stringify(r));
    } catch (e) { push(false, e.message); }
  };

  /* ── 原始日志流（原 pageChatlogs 的逻辑，逐行照搬以免丢功能）── */
  const logBox = $('cxLog');
  const lsb = pvStickScroll(logBox, $('cxLogJump'));
  let logs = [], logSig = '';
  const renderLogs = () => {
    const kw = $('cxLogSearch').value.trim().toLowerCase();
    const rows = logs.filter(x => {
      if (!kw) return true;
      return (typeof x === 'string' ? x : JSON.stringify(x)).toLowerCase().indexOf(kw) >= 0;
    });
    $('cxLogStats').textContent = rows.length + ' / ' + logs.length + ' 行';
    const html = rows.length ? rows.map((x, i) => {
      const isObj = x && typeof x === 'object';
      const ts = isObj ? (x.time || x.ts || '') : '';
      const lvl = (isObj ? (x.level || x.lv || 'info') : 'info').toLowerCase();
      const src = isObj ? String(x.source || x.src || '') : '';
      /* 服务端并流后的行用 text；PROTO_LOG 也是 text。原来只认 msg/message，
         结果整行被 JSON.stringify 出来 —— 2026-10-25 一并修掉。 */
      const msg = isObj ? (x.text || x.msg || x.message || JSON.stringify(x)) : String(x);
      const kind = /err/.test(lvl) ? 'err' : /warn/.test(lvl) ? 'warn'
        : /send/.test(lvl) ? 'send' : /ai/.test(lvl) ? 'ai'
        : /sys/.test(lvl) ? 'sys' : 'ok';
      return '<div class="ln"><span class="no">' + (i + 1) + '</span>'
        + '<span class="ts">' + esc(ts) + '</span>'
        + '<span class="lv ' + kind + '">' + esc(String(lvl).toUpperCase()) + '</span>'
        + '<span class="tx lv-' + kind + '">'
        + (src ? '<i class="src" title="日志来源">' + esc(src) + '</i>' : '')
        + esc(msg) + '</span></div>';
    }).join('') : '<div class="empty">没有日志</div>';
    /* 自动滚动关掉时也要保住位置（rewrite 内部按 stick 处理） */
    if (!$('cxLogAuto').checked) {
      const keep = logBox.scrollTop;
      logBox.innerHTML = html;
      logBox.scrollTop = keep;
      lsb.stick = lsb.near(); lsb.sync();
    } else lsb.rewrite(html);
  };
  const loadLogs = async () => {
    try {
      const r = await API('/protocol/logs', { method:'POST', body: JSON.stringify({ limit: 500 }) });
      logs = (r && r.logs) || [];
    } catch (e) { logs = ['读取失败：' + e.message]; }
    logSig = JSON.stringify(logs.length ? logs[logs.length - 1] : '').slice(0, 160);
    renderLogs();
  };
  const pullLogs = async () => {
    try {
      const r = await API('/protocol/logs', { method:'POST', body: JSON.stringify({ limit: 500 }) });
      const next = (r && r.logs) || [];
      const tail = next.length ? JSON.stringify(next[next.length - 1]).slice(0, 160) : '';
      const sig = next.length + '|' + tail;
      if (sig === logSig) return;
      const prev = logs.length;
      logSig = sig; logs = next;
      /* 用户翻上去时把新到的行数记在圆钮上，不打断阅读 */
      if (!lsb.stick) lsb.unseen += (next.length > prev ? (next.length - prev) : 1);
      renderLogs();
    } catch (e) { /* 后端没起时静默，保留上一屏 */ }
  };
  if (window.__cxTimer) clearInterval(window.__cxTimer);
  window.__cxTimer = setInterval(() => {
    if (!document.body.contains(el)) { clearInterval(window.__cxTimer); window.__cxTimer = null; return; }
    pullLogs();
  }, 2500);

  /* 版面：输入与输出必须**相邻** —— 输出很长时会顶开中间的说明文字，
     用户就找不到输入框了。原始日志排在最后。*/
  reorderByBlocks(el, ['底层指令', '指令输出', '原始日志']);

  $('cxGo').onclick = run;
  $('cxIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
  $('cxClear').onclick = () => { hist.length = 0; sb.rewrite(''); };
  $('cxLogSearch').oninput = renderLogs;
  $('cxLogAuto').onchange = renderLogs;
  $('cxLogReload').onclick = loadLogs;
  $('cxLogClear').onclick = async () => {
    if (!await pvConfirm('清空原始日志？', '日志文件内容会被清空，不可恢复。', '清空')) return;
    try { await API('/protocol/logs/clear', { method:'POST', body:'{}' }); loadLogs(); }
    catch (e) { logs = ['清空失败：' + e.message]; renderLogs(); }
  };
  $('cxIn').focus();
  await loadLogs();
}


/* ═════════════ 聚焦配置表单（行为 / 通知共用）═════════════
   这两页在旧版里是「从配置里挑一组字段做成小表单 + 保存」。
   v4 的配置中心已经覆盖全部字段，这里做的是**聚焦视图**（少滚动、一眼看到常用项）。 */
async function focusedForm(el, title, sub, fields) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  let cfg;
  try {
    const r = await API('/config');
    /* ★ 真实后端返回 {config:{...}} —— 不解包则所有字段 undefined、页面全空
       （用户实测：群聊行为页整屏空值。与 pageConfig 4268 行同一坑）。 */
    cfg = (r && r.config) ? r.config : (r || {});
  }
  catch (e) { el.innerHTML = '<div class="errbox">读取配置失败：' + esc(e.message) + '</div>'; return; }
  /* v4 面板风（原先是 rows 表格 + 原生 select，用户反馈"还是原码没有设计"）：
     布尔 → 方块开关；数字/文本 → 底线输入；每张卡片带键名与说明。*/
  const field = ([k, label, hint]) => {
    const v = cfg[k];
    let ctl;
    if (typeof v === 'boolean') {
      ctl = '<button type="button" class="sw" role="switch" data-fk="' + esc(k)
        + '" data-fv="' + (v ? '1' : '0') + '" aria-checked="' + (v ? 'true' : 'false')
        + '" aria-label="' + esc(label) + '"></button>';
    } else {
      ctl = '<input class="ff-in" data-fk="' + esc(k) + '"'
        + (typeof v === 'number' ? ' type="number" step="any"' : '')
        + ' value="' + esc(v == null ? '' : String(v)) + '">';
    }
    return '<div class="ff-card' + (typeof v === 'boolean' ? ' is-bool' : '') + '"'
      + ' data-fcard="' + esc(k) + '">'
      + '<div class="ff-main"><div class="ff-t">' + esc(label) + '</div>'
      + '<div class="ff-d">' + esc(hint ? hint + ' · ' : '') + '<span class="mono">' + esc(k) + '</span></div></div>'
      + ctl + '</div>';
  };
  el.innerHTML = ''
    + '<div class="hd"><span class="lab">' + esc(title) + '</span><i class="rule"></i>'
    +   '<span class="dim">' + esc(sub) + '</span></div>'
    + '<div class="ff-grid">' + fields.map(field).join('') + '</div>'
    + '<div class="wz-ft" style="margin-top:var(--s5)">'
    +   '<button class="btn primary" id="ffSave">保存这些设置</button>'
    +   '<button class="btn" id="ffReset">还原</button></div>'
    + '<div id="ffMsg" style="margin-top:var(--s4)"></div>';
  /* 开关交互：点一下翻转 aria-checked（collect 从 data-fv 读）*/
  qsa('.ff-card .sw', el).forEach(sw => sw.onclick = () => {
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    sw.dataset.fv = on ? '1' : '0';
  });

  const collect = () => {
    const out = {};
    qsa('.ff-card .sw[data-fk]', el).forEach(sw => {
      const raw = cfg[sw.dataset.fk];
      out[sw.dataset.fk] = sw.dataset.fv === '1';
      if (typeof raw === 'number') out[sw.dataset.fk] = out[sw.dataset.fk] ? 1 : 0;
    });
    qsa('[data-fk]', el).forEach(e => {
      if (e.classList && e.classList.contains('sw')) return;
      const k = e.dataset.fk, orig = cfg[k];
      let v = e.value;
      if (typeof orig === 'boolean') v = e.value === '1';
      else if (typeof orig === 'number') v = Number(v);
      if (JSON.stringify(v) !== JSON.stringify(orig)) out[k] = v;
    });
    return out;
  };
  const say = (ok, t) => { $('ffMsg').innerHTML = '<div class="sig ' + (ok ? 'ok' : 'err')
    + '"><i></i>' + esc(t) + '</div>'; };
  $('ffSave').onclick = async () => {
    const patch = collect();
    if (!Object.keys(patch).length) { say(true, '没有改动'); return; }
    $('ffSave').disabled = true;
    try {
      const r = await API('/config', { method:'POST', body: JSON.stringify(patch) });
      if (r && (r.ok === false || r.error)) { say(false, r.error || '保存失败'); return; }
      await API('/config/reload', { method:'POST', body:'{}' }).catch(() => {});
      Object.keys(patch).forEach(k => cfg[k] = patch[k]);
      say(true, '已保存 ' + Object.keys(patch).length + ' 项并热重载');
    } catch (e) { say(false, e.message); }
    $('ffSave').disabled = false;
  };
  $('ffReset').onclick = () => focusedForm(el, title, sub, fields);
}

/* ═════════════ 日志（事件视图）═════════════
   POST /api/events {limit} → {events:[{kind,time,text,tag,tools,dir,scope,who}],
                              counts:{message,decision,tool,error,debug}, total}
   一条日志文件里其实混着五种东西：聊天消息、插话决策、工具调用、真错误、
   调试打印。前四种是用户要知道的"发生了什么"，第五种是给写代码的人看的。
   所以这一页只画前四种，调试行去「控制台」页看原始日志流。

   ★ 分类在服务端做（webui_server.collect_events）—— 判据是日志文本格式，
     前端再写一遍正则就是两份规则各算各的，改一处必漏一处。
   ★ 清空日志这种破坏性动作也跟着原始流搬去了控制台：这一页是"读"的地方，
     不该混一个会删东西的按钮。 */
const EVT_KINDS = [
  ['message', '消息'], ['decision', '决策'], ['tool', '工具'],
  ['cost', 'AI'], ['error', '出错']
];
async function pageChatlogs(el) {
  /* 日志页 = 一轮一轮的对话，不是一堆日志行（2026-10-25 重做）。
     用户原话：「日志要用户问，怎么处理，决策判断，工具调用，工具调用记录，回复，
     而且日志页没有分私聊和各群聊」「不用在日志写太多信息，工具失败就失败，
     token计费不用在日志出现」。

     数据来自 /api/rounds（服务端已经把日志重组好）：
       时间 / 会话 / 谁 / 问什么 / 走哪条流程 / 决策 / 工具与记录 / 回复
     成本行由服务端直接丢掉，前端不画。 */
  el.innerHTML = ''
    + '<div class="hd"><span class="lab">对话</span><i class="rule"></i>'
    +   '<span class="dim" id="evStats">—</span></div>'
    + '<div class="evt-chips" id="evChips"></div>'
    + '<div style="display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-top:var(--s4)">'
    +   '<input id="evSearch" class="fld" style="flex:1;min-width:180px;background:transparent;border:0;'
    +     'border-bottom:1px solid var(--line2);color:var(--ink);padding:var(--s2) 0;outline:none"'
    +     ' placeholder="搜内容、群号、昵称、工具名…" autocomplete="off">'
    +   '<button class="btn" id="evCopy">复制当前视图</button>'
    +   '<button class="btn" id="evReload">刷新</button>'
    + '</div>'
    + '<div class="pv-wrap" style="margin-top:var(--s4)">'
    +   '<div class="evt-list" id="evList" style="max-height:52vh;min-height:200px;'
    +     'overflow:auto;padding-right:var(--s3)"></div>'
    +   '<button class="pv-jump" id="evJump" hidden title="回到最新"></button></div>'
    + '<div class="evt-more" id="evMore" hidden></div>';

  let rounds = [], scopes = [], only = '', kw = '';
  const list = $('evList');
  const sb = pvStickScroll(list, $('evJump'));
  const esc = window.esc || (s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));

  const scopeLabel = (k) => (scopes.find(s => s.key === k) || {}).label || ('群 ' + k);
  const hit = (r) => {
    if (!kw) return true;
    const s = kw.toLowerCase();
    return [r.ask, r.reply, r.who, scopeLabel(r.scope),
            (r.tools || []).map(t => t.name + ' ' + (t.q || '') + ' ' + (t.note || '')).join(' ')]
      .join(' ').toLowerCase().includes(s);
  };
  const inScope = (r) => only === '' || String(r.scope || 'pm') === only;

  const chips = () => {
    const shown = rounds.filter(r => inScope(r) && hit(r));
    $('evChips').innerHTML = [['', '全部', shown.length]]
      .concat(scopes.map(s => [s.key, s.label,
        rounds.filter(r => String(r.scope || 'pm') === s.key && hit(r)).length]))
      .map(([k, l, n]) => '<button class="evt-chip' + (only === k ? ' on' : '') + '" data-k="' + k + '">'
        + '<i class="d"></i>' + l + ' <span class="n">' + n + '</span></button>').join('');
    qsa('.evt-chip', $('evChips')).forEach(b => b.onclick = () => { only = b.dataset.k; render(); });
    $('evStats').textContent = shown.length + ' 轮 · ' + scopes.length + ' 个会话';
  };

  const rowHTML = (r) => {
    const sc = only === '' ? scopeLabel(r.scope) : '';
    let h = '<div class="evt k-message" style="margin:0 0 var(--s4) 0">'
      + '<div class="evt-hd"><span class="evt-k">' + esc(r.time || '') + '</span>'
      + (sc ? '<span class="evt-tag">' + esc(sc) + '</span>' : '')
      + '<span class="evt-who"><b>' + esc(r.who || '') + '</b></span></div>'
      + '<div class="evt-b" style="margin-top:4px">'
      +   '<div class="evt-x"><b>问</b> ' + esc(r.ask || '') + '</div>';
    if (r.route) h += '<div class="evt-x" style="color:var(--ink4)">处理：' + esc(r.route) + '</div>';
    (r.decisions || []).forEach(d => {
      h += '<div class="evt-x" style="color:var(--accent)">决策：' + esc(d) + '</div>';
    });
    (r.tools || []).forEach(t => {
      const q = t.q ? '「' + esc(t.q) + '」' : '';
      const note = t.note ? ' <span class="evt-tag">' + esc(t.note) + '</span>' : '';
      h += '<div class="evt-x" style="color:var(--ai)">工具 ' + esc(t.name) + ' ' + q + note + '</div>';
    });
    if (r.reply) {
      h += '<div class="evt-x" style="color:var(--ok);margin-top:4px"><b>回</b> '
        + esc(r.reply).replace(/\n/g, '<br>') + '</div>';
    } else {
      h += '<div class="evt-x" style="color:var(--ink4)">（没有回复记录）</div>';
    }
    return h + '</div></div>';
  };

  const render = () => {
    const shown = rounds.filter(r => inScope(r) && hit(r));
    $('evList').innerHTML = shown.length
      ? shown.map(rowHTML).join('')
      : '<div class="empty">这个会话还没有记录</div>';
    chips();
    if (sb && sb.refresh) sb.refresh();
  };

  const load = async (silent) => {
    try {
      const r = await API('/rounds', { method: 'POST', body: JSON.stringify({ limit: 150 }) });
      rounds = (r && r.rounds) || [];
      scopes = (r && r.scopes) || [];
      if (only && !scopes.some(s => s.key === only)) only = '';
      render();
    } catch (e) {
      if (!silent) $('evList').innerHTML = '<div class="errbox">读取对话记录失败：' + esc(e.message) + '</div>';
    }
  };

  $('evReload').onclick = () => load();
  $('evCopy').onclick = () => {
    const shown = rounds.filter(r => inScope(r) && hit(r));
    const txt = shown.map(r =>
      [r.time + ' ' + scopeLabel(r.scope) + ' ' + (r.who || ''),
       '问: ' + (r.ask || ''), r.route ? '处理: ' + r.route : '',
       ...(r.decisions || []).map(d => '决策: ' + d),
       ...(r.tools || []).map(t => '工具 ' + t.name + (t.q ? ' 「' + t.q + '」' : '') + (t.note ? ' ' + t.note : '')),
       r.reply ? '回: ' + r.reply : ''].filter(Boolean).join('\n')).join('\n\n');
    if (window.copyText) copyText(txt).then(ok => say(ok, ok ? '已复制 ' + shown.length + ' 轮' : '复制失败'));
  };
  const se = $('evSearch');
  if (se) se.addEventListener('input', () => { kw = se.value.trim(); render(); });

  window.__evTimer = setInterval(() => {
    if (!document.body.contains($('evList'))) { clearInterval(window.__evTimer); return; }
    load(true);
  }, 5000);
  await load();
}

    const p = $('igP').value.trim();

    $('igGo').disabled = true; $('igGo').textContent = '生成中…';

    try {
      const r = await API('/imagegen/generate', { method:'POST', body: JSON.stringify({
        prompt: p, negative_prompt: $('igN').value, width: Number($('igW').value),
        height: Number($('igH').value), steps: Number($('igS').value),
        seed: Number($('igSeed').value) }) });
      const ok = !!(r && (r.ok || r.success || r.image || r.url));
      msg(ok, ok ? '生成完成' : ((r && (r.error || r.msg)) || '生成失败'));
      const img = r && (r.image || r.url);

   GET  /api/memes → {memes:[...], tags:{...}}
   POST /api/memes/delete {name}   POST /api/memes/tags {name, tags}
   POST /api/memes/import {directory}   POST /api/memes/upload（FormData） */
/* ══════════════════════════════════════════════════════════════════
   表情包页（三栏陈列，与 v3 的陈列对等）
     左：目录分类 + 标签云（带计数）+ 情绪
     中：工具条（搜索 / 网格·Masonry 切换 / 上传 / 导入目录 / URL 导入 / 计数）
     右：卡片流 —— 图 + 文件名 + 标签 + 标签·删除
   另保留本轮新增的上传、灯箱大图、标签编辑、情绪筛选。
   ══════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════
   表情包增强：上传 / 标签编辑 / 灯箱大图 / 情绪筛选（v3 功能，v4 视觉） */
var MEME_EXTS = /\.(jpg|jpeg|png|gif|webp)$/i;

async function memeUpload(files, say) {
  const list = Array.from(files || []).filter(function (f) { return MEME_EXTS.test(f.name); });
  if (!list.length) { say(false, '只支持 jpg / png / gif / webp'); return 0; }
  let ok = 0, last = '';
  for (const f of list) {
    try {
      const data = await new Promise(function (res, rej) {
        const fr = new FileReader();
        fr.onload = function () { res(String(fr.result || '')); };
        fr.onerror = function () { rej(fr.error || new Error('读取失败')); };
        fr.readAsDataURL(f);
      });
      const r = await API('/memes/upload', {
        method: 'POST', body: JSON.stringify({ name: f.name, data: data, tags: [] }) });
      if (r && (r.success === false || r.error)) last = r.error || '上传失败';
      else ok++;
    } catch (e) { last = e.message; }
  }
  say(ok > 0, ok ? ('已上传 ' + ok + ' 张' + (last ? '（' + last + '）' : ''))
                  : ('上传失败：' + (last || '未知原因')));
  return ok;
}

function memeLightbox(name, url, tags, api) {
  const mask = document.createElement('div');
  mask.className = 'fb-mask';
  mask.style.zIndex = '62';
  const tagList = Array.isArray(tags) ? tags : [];
  mask.innerHTML = '<div class="fb" role="dialog" aria-label="表情包详情" style="width:min(940px,94vw)">'
    + '<div class="fb-hd"><b>' + esc(name) + '</b>'
    + '<button class="btn sm" id="mlTag">编辑标签</button>'
    + '<button class="btn sm" id="mlDel">删除</button>'
    + '<button class="btn sm" id="mlX">关闭</button></div>'
    + '<div style="padding:var(--s5);display:grid;grid-template-columns:1fr 210px;gap:var(--s5)">'
    +   '<div style="background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;'
    +     'min-height:320px;max-height:60vh;overflow:auto">'
    +     '<img src="' + esc(url) + '" style="max-width:100%;max-height:60vh"></div>'
    +   '<div><div class="cf-lab">标签</div>'
    +     '<div id="mlTags" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">'
    +       (tagList.length ? tagList.map(function (t) {
            return '<span class="btn sm" style="cursor:default">' + esc(t) + '</span>'; }).join('')
        : '<span class="dim" style="font-size:9px">暂无标签</span>') + '</div>'
    +     '<div class="cf-desc" style="margin-top:var(--s4)">标签用于按情绪检索：'
    +       '回复时命中情绪才会挑到这张图。</div>'
    +     '<div class="cf-desc" style="margin-top:var(--s2)">路径：' + esc(name) + '</div>'
    +   '</div></div></div>';
  document.body.appendChild(mask);
  const close = function () { mask.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = function (e) { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  mask.querySelector('#mlX').onclick = close;
  mask.querySelector('#mlDel').onclick = async function () {
    if (!await pvConfirm('删除「' + name + '」？', '该素材会从表情库移除，不可恢复。', '删除')) return;
    try {
      const r = await API('/memes/delete', { method: 'POST', body: JSON.stringify({ name: name }) });
      if (r && (r.ok === false || r.error)) { alert(r.error || '删除失败'); return; }
      close(); if (api && api.onDeleted) api.onDeleted();
    } catch (e) { alert(e.message); }
  };
  mask.querySelector('#mlTag').onclick = async function () {
    const next = await pvPrompt('标签（逗号分隔；留空=清空）', tagList.join(', '));
    if (next === null) return;
    const arr = next.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    try {
      const r = await API('/memes/tags', { method: 'POST', body: JSON.stringify({ name: name, tags: arr }) });
      if (r && (r.success === false || r.error)) { alert(r.error || '保存失败'); return; }
      close(); if (api && api.onTagged) api.onTagged();
    } catch (e) { alert(e.message); }
  };
  return { close: close };
}

async function pageMemes(el) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  let all = [];
  try {
    const r = await API('/memes');
    all = (r && (r.memes || r.items)) || [];
  } catch (e) { el.innerHTML = '<div class="errbox">读取 /api/memes 失败：' + esc(e.message) + '</div>'; return; }
  const info = (m) => (typeof m === 'string' ? { name: m, tags: [] } : m);
  all = all.map(info);

  /* 目录（取第一段路径）与标签云（后端每张图自带 tags[]）*/
  const dirCount = {}, tagCount = {};
  all.forEach(m => {
    const dir = String(m.name || '').split('/')[0];
    if (String(m.name || '').indexOf('/') >= 0) dirCount[dir] = (dirCount[dir] || 0) + 1;
    (m.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  const dirs = Object.keys(dirCount).sort((a, b) => dirCount[b] - dirCount[a]);
  const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);
  let emotions = [];
  try {
    const er = await API('/memes/emotions');
    const e0 = (er && (er.emotions || er.items)) || [];
    emotions = Array.isArray(e0) ? e0.map(x => (typeof x === 'string' ? x : (x.name || x.key || '')))
                                .filter(Boolean) : [];
  } catch (e) { /* 后端没这接口就隐藏 */ }

  el.innerHTML = ''
    + '<div class="me-wrap">'
    +   '<aside class="me-side">'
    +     '<div><h4>目录</h4><div class="me-list" id="meDirs"></div></div>'
    +     (tags.length ? '<div><h4>标签云</h4><div class="me-cloud" id="meCloud"></div></div>' : '')
    +     (emotions.length ? '<div><h4>情绪筛选</h4><div class="me-cloud" id="meEmoBox"></div></div>' : '')
    +   '</aside>'
    +   '<section>'

        if (!(r && r.success === false)) later(el, () => pageMemes(el), 900);

        if (!(r && r.success === false)) later(el, () => pageMemes(el), 700);
      })
      .catch(function (e2) { say(false, e2.message); })
      .finally(function () { $('meImportUrl').disabled = false; });

async function render(i) {
  const p = PAGES[i];
  const el = document.createElement('div');
  el.className = 'panel in';
  /* ③ 常态柔光扫过（15s 一次，很淡）—— 用独立元素槽，不与右缘竖带的 ::after 抢 */
  try {
    if (!el.querySelector('.sheen')) {
      var _sh = document.createElement('i');
      _sh.className = 'sheen';
      el.insertAdjacentElement('afterbegin', _sh);
    }
  } catch (e) {}
  /* PV 动态：入场 = **破坏→重组**。先砸入三片色块，碎裂消散后内容才落位
     （参考片开场：红楔砸入 → 形变 → 碎成小方块飞散 → 重新聚合成内容框） */
  /* M1 碎块砸入只演**首屏**（参考片里它是开场，不是每次切页）；
     之后的切页走 M3 卷轴快门。 */
  if (!window.__pv_opened) {
    window.__pv_opened = 1;
    try {
      el.insertAdjacentHTML('afterbegin',
        '<i class="pv-sh s1"></i><i class="pv-sh s2"></i><i class="pv-sh s3"></i>');
    } catch (e) {}
  }
  stage.appendChild(el);
  $('sec').textContent = p.sub;
  const t = $('ttl');
  /* PV 动态：标题**逐字显现**（连续帧里 INITIALIZING 是逐字揭开的）。
     逐字包 <i>，由 CSS 的 stagger 依次揭开；无 JS 时降级为整词动画。 */
  try {
    t.textContent = '';
    const _w = document.createDocumentFragment();
    Array.from(p.name).forEach((ch, _i) => {
      if (ch === ' ') { _w.appendChild(document.createTextNode('\u00a0')); return; }
      const _s = document.createElement('i');
      _s.textContent = ch;
      _s.style.setProperty('--d', (_i * 28) + 'ms');   /* 28ms/字：快、硬停 */
      _w.appendChild(_s);
    });
    t.appendChild(_w);
  } catch (e) { t.textContent = p.name; }
  $('ttlEn').textContent = EN[p.id] || '';
  t.classList.remove('slam'); void t.offsetWidth; t.classList.add('slam');
  $('topright').innerHTML = '<span class="num">'
    + String(cur + 1).padStart(2,'0') + '</span> / 15<br>'
    + '<span class="dim">' + String(EN[p.id] || '') + '</span>';
  if (p.id === 'dashboard') await pageDashboard(el);
  else if (p.id === 'protocol') await pageProtocol(el);
  else if (p.id === 'groupmanage') await pageGroups(el);
  else if (p.id === 'settings') await pageConfig(el);
  else if (p.id === 'bot') await pageBot(el);
  else if (p.id === 'tokens') await pageTokens(el);
  else if (p.id === 'memes') await pageMemes(el);
  else if (p.id === 'imagegen') await pageImagegen(el);
  else if (p.id === 'behavior') await focusedForm(el, '群聊行为', '说话时机与节奏（这些字段在配置中心也有）', BEHAVIOR_FIELDS);
  else if (p.id === 'monitor') await pageMonitor(el);
  else if (p.id === 'chatlogs') await pageChatlogs(el);
  else if (p.id === 'console') await pageConsole(el);
  else if (p.id === 'memory') await pageMemory(el);
  else if (p.id === 'plugins') await pagePlugins(el);
  else if (p.id === 'agent') await pageAgent(el);
  else pagePending(el, p);
  /* ★ 2026-10-21：内容真正落位才解除"提交中"的失焦。
     放在 render 末尾（各 pageXxx 都 await 完）而不是 appendChild 之后：
     面板先挂上树再异步填内容，挂在树上那一刻可能还是空壳，
     此时恢复亮度等于给用户看一块空白 —— 比失焦更糟。 */
  try { if (window.__pvPendLand) window.__pvPendLand(); } catch (e) {}
}

/* ── PV 动态 · M4 终端逐行：进入时演一次，演完摘掉类名，
      避免 1.2s 轮询把打字机效果重播一遍（会变成噪音） ── */
function pvTerminalOnce(box) {
  try {
    if (!box || box.dataset.pvDone === '1') return;
    const rows = box.querySelectorAll(':scope > div');
    if (!rows.length) return;
    /* ★ 只给"本来没有 .ln 的行"临时加类：
       .ln 不只是动画钩子，它还是**行布局本体**（.log .ln 的 grid：序号/时间/级别/正文 四列）。
       原实现无条件 add → 780ms 后无条件 remove，于是协议日志/Token 记录的首屏行会被
       摘掉类名 → 四列塌成一行流式文本（实测确认）。这里按"是否临时加的"收回。 */
    const added = [];
    rows.forEach(r => { if (!r.classList.contains('ln')) { r.classList.add('ln'); added.push(r); } });
    box.dataset.pvDone = '1';
    setTimeout(() => {
      added.forEach(r => r.classList.remove('ln'));
      box.classList.remove('tv');
    }, 780);
  } catch (e) {}
}

/* ── PV 动态 · M2 信号硬切：**只在读数真的变化时**闪一下（不是每次轮询都闪） ── */
let _pv_sig_prev = '';
function pvSignalBlip(root) {
  try {
    if (!root) return;
    const txt = Array.prototype.map.call(
      root.querySelectorAll('.st .v, .k .v'), n => (n.textContent || '').trim()).join('|');
    if (!_pv_sig_prev) { _pv_sig_prev = txt; return; }      /* 首次不闪 */

    const b = root.querySelector('.sig-cut');
    if (!b) return;
    b.classList.remove('sig-cut');
    void b.offsetWidth;
    b.classList.add('sig-cut');

}

/* ══════════════════════════════════════════════════════════════════
   PV 焦点层：canvas 画"活着的内容窗"（全原生，不引库）
   —— 参考片的内容窗不是静态图：有扫描线、数据脉冲、缓慢粒子。
   —— prefers-reduced-motion 时完全不启动。
   ══════════════════════════════════════════════════════════════════ */
(function pvFocus(){
  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (document.querySelector('.pv-canvas')) return;

    var cv = document.createElement('canvas');
    cv.className = 'pv-canvas';
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d');
    var css = getComputedStyle(document.documentElement);
    var ACC = (css.getPropertyValue('--accent') || '#e2231a').trim();

    var parts = [], pulse = [], W = 0, H = 0, scan = 0;
    function size(){
      var r = cv.getBoundingClientRect();
      var d = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = Math.max(1, Math.floor(W * d));
      cv.height = Math.max(1, Math.floor(H * d));
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function seed(){
      parts = [];
      var n = Math.round(W / 46);
      for (var i = 0; i < n; i++){
        parts.push({x: Math.random() * W, y: Math.random() * H,
                    r: 0.6 + Math.random() * 1.5,
                    vx: (Math.random() - 0.5) * 0.09,
                    vy: (Math.random() - 0.5) * 0.09,
                    a: 0.10 + Math.random() * 0.30});
      }
      pulse = [];
    }
    function frame(){
      if (document.hidden) { requestAnimationFrame(frame); return; }
      var acc = (getComputedStyle(document.documentElement)
                   .getPropertyValue('--accent') || ACC).trim();
      ctx.clearRect(0, 0, W, H);

      /* 慢粒子（很少、很慢 —— 参考片的"呼吸"，不是 fireworks）*/
      for (var i = 0; i < parts.length; i++){
        var p = parts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < -6) p.x = W + 6; if (p.x > W + 6) p.x = -6;
        if (p.y < -6) p.y = H + 6; if (p.y > H + 6) p.y = -6;
        ctx.fillStyle = acc; ctx.globalAlpha = p.a;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }
      ctx.globalAlpha = 1;

      /* 扫描线：一条缓慢下行的水平亮带（内容窗"在播放"的暗示）*/
      scan = (scan + 0.42) % (H + 160);
      /* 用白色 + 极低 alpha，而不是给强调色加 alpha ——
         强调色是 hex（如 #46b3a6），`acc.replace(')', ', .07)')` 对它无效，
         曾经导致扫描带变成全不透明实色块（看起来像个 UI 元素而不是扫描）。 */
      var g = ctx.createLinearGradient(0, scan - 90, 0, scan + 90);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,.035)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, scan - 70, W, 140);

      /* 数据脉冲：偶尔一条垂直细线扫过（像信号）*/
      if (Math.random() < 0.006){
        pulse.push({x: Math.random() * W, t: 0});
      }
      for (var k = pulse.length - 1; k >= 0; k--){
        var q = pulse[k];
        q.t += 2.4;
        ctx.fillStyle = acc;
        ctx.globalAlpha = Math.max(0, 0.5 - q.t / 90);
        ctx.fillRect(q.x, 0, 1, H);
        ctx.globalAlpha = 1;
        if (q.t > 90) pulse.splice(k, 1);
      }
      requestAnimationFrame(frame);
    }
    function boot(){ size(); seed(); }
    boot();
    window.addEventListener('resize', boot);
    requestAnimationFrame(frame);
  } catch (e) {}
})();

/* ══════════════════════════════════════════════════════════════════
   中央机械结构：大开大合地展开/收起，展开后用棘轮转动选页
   收起态 = 左下角小机构（点它展开）｜ Esc / 点空白 / 点机构 = 收起
   ══════════════════════════════════════════════════════════════════ */
(function pvMech(){
  try {
    if (document.querySelector('.mech')) return;
    /* ★ 螺旋块数 = 真实页面数（用户要求"完全复现所有功能"→ 15 页必须全部可达。
       原来固定 12 块，第 13/14/15 页（记忆/插件/Agent）**在导航里根本选不到** —— 那是功能缺失。）*/
    var PAGES_N = (typeof PAGES !== 'undefined' && PAGES.length) || 15;   /* 页面数 */
    var N = PAGES_N;              /* 一圈 N 块（每块 = 一页），切换 1→N→1 循环 */
    var PER = 1;              /* 每格 = 1 块 */
    var STEP = 360 / N;       /* 每块角距 */
    var R = 320;              /* 轴半径 */
    var PITCH = 152;          /* ★ 螺距必须 > 块高，否则块之间重叠（原来 52 < 124 是排布乱的根因）*/
    var TOTAL = PITCH * N;    /* 一圈高度 = 竖向回绕周期（"无限"的关键）*/
    /* ★ 展开时转到**当前页**，不是第 1 页（__pvPage 由 go() 同步）*/
    var cur = (typeof window.__pvPage === 'number' ? window.__pvPage : 0), last = 0, open = false;
    /* ★ entered：指针这一轮是否**进到过导航壳体内**。
       热区（.rack）在左上角，导航壳体在屏幕中间，中间隔着一片空白。
       鼠标从热区往壳体移动时，700ms 计时器可能在半路就到点 —— 那时的位置
       还在壳体外面，判成"可收" → 导航刚展开就自己关。
       所以：没进过壳体的这一轮，一律不收；进去过之后再移出才收。 */
    var entered = false;

    /* 结构：竖轴 + 螺旋板片 + 顶部金属机头（参考片 5.4–8.6s 的运动）*/
    var html = '<div class="mech-in">'
      + '<i class="mcx tl"></i><i class="mcx tr"></i><i class="mcx bl"></i><i class="mcx br"></i>'
      + '<i class="mech-axle"></i>'
      + '<div class="helix rock" id="pvHelix">';
    for (var i = 0; i < N; i++) {
      var pgIdx = i % PAGES_N;                          /* ★ 一块 = 一页 */
      var p = (typeof PAGES !== 'undefined' && PAGES[pgIdx]) || {};
      var no = ('0' + (pgIdx + 1)).slice(-2);
      html += '<div class="mblk" data-i="' + i + '" role="option" style="--i:' + i + '">'
            + '<div class="plate"><i class="face"></i>'
            + '<svg class="wframe" viewBox="0 0 176 108" aria-hidden="true">'
            + '<use href="#vframe"></use></svg>'

/* ══════════════════════════════════════════════════════════════════
   常驻状态显示器 —— 全局常驻（不是某个页面的一部分），切页/滚动都在。
   放在标题带下方右对齐：底部会压内容（用户反馈），这里既是"仪表区"又不挡操作。
   ══════════════════════════════════════════════════════════════════ */
(function hudBoot() {
  const hudClock = () => {
    const c = $('hudClock');

    const d = new Date(), p2 = (x) => String(x).padStart(2, '0');

  };

  async function hudRefresh() {
    hudClock();
    try {
      const r = await API('/status');
      if (!r) return;
      /* 兼容两种响应形状：真实后端 {data:{bot_running,bot_uptime,...}} 与
         旧约定 {bot:{status,uptime}} —— 只认真实字段导致 HUD 全是「—」（用户截图）。*/
      const dd = (r && r.data) || r || {};
      const botOld = (r && r.bot) || {};
      const running = dd.bot_running != null ? !!dd.bot_running
                    : (botOld.status ? botOld.status === 'running' : false);
      const up = Number(dd.bot_uptime ?? botOld.uptime ?? 0);
      hudSet('Bot', running ? (up ? ('运行 ' + upText(up)) : '运行中') : '已停止', running ? 'on' : 'off');
      /* 协议：后端 /api/status 现在带 protocol_driver(_label) + protocol_running
         （此前载荷里没有这两个字段 → 恒显示「未设置」，用户截图）。 */
      const pd = dd.protocol_driver_label || dd.protocol_driver
              || r.protocol_driver_label || r.protocol_driver || '';
      const pRun = !!(dd.protocol_running ?? r.protocol_running);
      hudSet('Proto', pd ? (pd + (pRun ? '' : ' · 停止')) : '未设置',
             pRun ? 'on' : (pd ? 'warn' : 'off'));
      const m = $('hudMsg'); if (m) m.textContent = fmtRaw(dd.messages_total ?? dd.messages_today ?? 0);
      const gg = $('hudGroups'); if (gg) gg.textContent = fmtRaw(dd.groups_active ?? dd.groups ?? 0);
    } catch (e) { /* 后端没起就保持上一次的值，不闪 */ }
  }
  if (!$('hud')) return;

  setInterval(hudRefresh, 5000);

  document.addEventListener('keydown', (e) => {

})();

/* ═════════════ 全局通知 toast（通知弹窗化 · 用户要求）═════════════
   20s 轮询 /api/admin/notify_log?since=<水位>，有新投递就右下角弹像素卡
   （成功绿/部分黄/失败红），点击跳通知页看完整时间线，8s 自动收。
   首拉只记水位不弹（开机不把历史全轰一遍）；Bot 没起时静默重试。 */
(function notifyToasts() {
  let water = 0;          // 已见最新 ts（0=还没做过首拉）
  let primed = false;     // 首拉标记
  const wrap = () => {
    let w = document.getElementById('ntfWrap');
    if (!w) { w = document.createElement('div'); w.id = 'ntfWrap'; w.className = 'ntf-wrap';
              document.body.appendChild(w); }
    return w;
  };
  const stCls = (s) => (s === 'sent' ? 'ok' : (s === 'partial' ? 'warn'
                        : (s === 'failed' ? 'bad' : '')));
  const stTxt = { sent: '已送达', partial: '部分失败', failed: '发送失败' };
  function pop(rec) {
    const w = wrap();
    if (w.children.length >= 3) w.removeChild(w.firstChild);   // 最多叠 3 张
    const d = document.createElement('div');
    d.className = 'ntf ' + stCls(rec.status);
    d.innerHTML = '<div class="ntf-h">通知 · ' + esc(rec.event || '')
      + (stTxt[rec.status] ? (' · ' + stTxt[rec.status]) : '') + '</div>'
      + '<div class="ntf-b">' + esc(rec.text || '') + '</div>';
    d.onclick = () => { d.remove(); try { go(10); } catch (e) {} };  // 10 = 通知页
    w.appendChild(d);
    setTimeout(() => { if (d.parentNode) d.remove(); }, 8000);
  }
  async function tick() {
    try {
      const r = await API('/admin/notify_log?limit=20&since=' + (primed ? water : 0));
      if (!r || !r.ok) return;
      const rows = r.log || [];
      const maxTs = rows.reduce((m, x) => Math.max(m, Number(x.ts || 0)), water);
      if (!primed) { water = maxTs || water; primed = true; return; }  // 首拉只定水位
      const fresh = rows.filter(x => Number(x.ts || 0) > water)
                        .sort((a, b) => a.ts - b.ts);
      fresh.forEach(pop);
      water = maxTs;
    } catch (e) { /* Bot 没起/网络抖：静默，下轮再来 */ }
  }
  tick();
  setInterval(tick, 20000);
})();

/* ★ 选中态同步层（go 的第一拍调用，**不等 busy/_pre**）：

function go(i, catchUp) {

  /* 螺旋导航同步：展开时转到当前页（右上角热区展开必须对着当前页，不能回到第 1 页）*/
  try { window.__pvPage = i; } catch (e) {}

     __pvMechPaint 此前**定义了却从无调用点** —— 螺旋只在 show() 展开那一刻读一次
     __pvPage；此后若用导轨/方向键/hover 预选切页，内容已走、螺旋还停在旧页
     （用户截图：螺旋正前方 01、内容 AGENT）。这里补上这条断链。

  try { window.__pvUiVer = new URLSearchParams(location.search).get('uiver') || window.__pvUiVer; } catch (e) {}
  /* 每页一套解构装饰：靠 data-page 换摆法 */
  try {
    const pd = (typeof PAGES !== 'undefined' && PAGES[i]) || {};
    document.documentElement.setAttribute('data-page', pd.id || String(i));
    const v = document.querySelector('.deco i.i1');
    if (v) v.textContent = (pd.sub || pd.name || '').toUpperCase();

  /* ★ 选中跟手 + 内容合并到最新（2026-10-10 用户报："内容页刷新速度匹配不上
