    + '<div class="hd"><span class="lab">快速切换模型</span><i class="rule"></i></div>'
    + '<div style="display:flex;gap:var(--s5);flex-wrap:wrap;align-items:flex-end">'
    +   '<div class="fld" style="min-width:180px"><label>提供商</label>'
    +     '<select id="cProv">' + provOpts + '</select></div>'
    +   '<div class="fld" style="min-width:220px"><label>模型</label>'
    +     '<select id="cModel">' + models + '</select></div>'
    +   '<button class="btn" id="cFetchModels" title="向提供商 API 拉取真实模型列表（顺带验证地址与 Key 连通性）">获取模型</button>'
    +   '<button class="btn primary" id="cModelGo">切换并热重载</button>'
    +   '<button class="btn" id="cReload">热重载配置</button>'
    + '</div>'
    + '<div id="cMsg" style="margin-top:var(--s3)"></div>'

    /* ── 多提供商管理（v3 功能回补：每提供商独立 地址+Key；v4 第一版把
        这个面板砍成了单下拉 → 切提供商不回填地址、Key 只剩全局一份）── */
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">多提供商管理</span>'
    +   '<i class="rule"></i><span class="dim">点卡片选用（自动回填地址）· Edit 改地址/Key · 每提供商可存独立 Key</span></div>'
    + '<div class="pv-cards" id="pvCards"></div>'

    /* ── 接入与诊断动作 ──
       旧版配置页有 23 个动作按钮，v4 第一版只做了「保存/重载」两个 ——
       等于把接入路径、诊断、进程管理、预览全丢了。这里逐项补齐。 */
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">接入与诊断</span>'
    +   '<i class="rule"></i></div>'
    + '<div style="display:flex;gap:var(--s2);flex-wrap:wrap">'
    +   '<button class="btn primary" id="cWizard">配置向导</button>'
    +   '<button class="btn" id="cTest">测试连接</button>'
    +   '<button class="btn" id="cKeyClear">清除当前提供商 Key</button>'
    +   '<button class="btn" id="cScan">探测本地模型</button>'
    +   '<button class="btn" id="cLsStart">启动 llama-server</button>'
    +   '<button class="btn" id="cLsStop">停止 llama-server</button>'
    +   '<button class="btn" id="cLsTest">测试本地连接</button>'
    +   '<button class="btn" id="cLsOpen">打开 8081</button>'
    +   '<button class="btn" id="cImgTest">测试生图模型</button>'
    +   '<button class="btn" id="cImgStart">启动生图模型</button>'
    +   '<button class="btn" id="cImgStop">停止生图模型</button>'
    +   '<button class="btn" id="cImgOpen">打开生图端口</button>'
    + '</div>'
    + '<div id="cDiag" style="margin-top:var(--s4)"></div>'

    + '<div class="hd" style="margin-top:var(--s5)"><span class="lab">预览</span><i class="rule"></i>'
    +   '<span class="dim">读当前列表内容，不走接口</span></div>'
    + '<div style="display:flex;gap:var(--s2);flex-wrap:wrap">'
    +   '<button class="btn sm" data-pv="recall_feedback_pre_messages">撤回前反馈</button>'
    +   '<button class="btn sm" data-pv="recall_feedback_post_messages">撤回后反馈</button>'
    +   '<button class="btn sm" data-pv="custom_exit_phrases_idle">空闲退场语</button>'
    +   '<button class="btn sm" data-pv="custom_exit_phrases_short">短消息退场语</button>'
    + '</div>'

    /* ↑ 以上是「接入」组的内容（模型切换 / 多提供商 / 诊断 / 预览）。
       它整块收在 #cfgConnect 里，切到别的分组时整块隐藏，
       而不是像以前那样永远堆在页面最上面 —— 那些内容占了首屏三屏。 */
    + '</div>'
    + '<div id="cfArea"></div>'
    /* 「其他配置项」默认**收起**：它是页面级区块（不随 tab 切换隐藏），
       常驻展开的话每个 tab 底下都挂着同一坨（用户反馈"所有页都有一个其他"）。*/
    + '<div class="hd" style="margin-top:var(--s6);cursor:pointer" id="cOrphanHd">'
    +   '<span class="lab">其他配置项</span><i class="rule"></i>'
    +   '<span class="dim" id="cOrphanTip">未登记标签的键 · 点击展开</span>'
    +   '<span class="sig" style="display:inline-flex"><i></i>' + keys.length + ' 项</span></div>'
    + '<div id="cOrphanBody" hidden>'
    + '<div class="fld" style="max-width:340px;margin-bottom:var(--s4)">'
    +   '<input id="cFilter" placeholder="筛选配置项名称…" autocomplete="off"></div>'
    + '<div id="cSections"></div></div>';

  const orphanHd = $('cOrphanHd'), orphanBody = $('cOrphanBody');
  if (orphanHd && orphanBody) orphanHd.onclick = () => {
    const show = orphanBody.hidden;
    orphanBody.hidden = !show;
    const tip = $('cOrphanTip');
    if (tip) tip.textContent = show ? '未登记标签的键' : '未登记标签的键 · 点击展开';
  };

  /* ═══ 人格与人设 ═══════════════════════════════════════════════════
     读 get_personality / 写 save_personality（plugin_id=personality_engine）。
     设计要点：
       ① 段名**不写死**，一律用后端返回的 sections 键 —— 人格文件的段名会变
          （实测当前是【我是谁】【怎么说话】…，而插件自带页写死的是【你是谁】…）。
       ② 提交时把**所有段**原样回传（含没改的）。后端 save_personality 只写
          传进去的键，漏一段就等于删一段。
       ③ 总字数暴跌时二次确认 —— 防"段名对不上→提交空集合→整份人格清零"
          这类事故（插件自带页正是这么写的）。
       ④ 保存后不刷新页面：mtime 变了，下次组 prompt 自动重建静态前缀。
     示例（few-shot）不在这里编辑，只给一个注入开关：
      它写的是 plugins/personality/examples/ 下那 9 个文件，改人格时应当一起看，
      所以把 example_enabled 放在同一块里，随时能关掉验证效果。
  */
  (function mountPersona() {
    const hd = $('cPersonaHd'), body = $('cPersonaBody'), inner = $('cPersonaInner');
    if (!hd || !body || !inner) return;
    let loaded = false, lastTotal = 0;

    const say = (t, bad) => {
      const m = $('cPersonaMsg');
      if (!m) return;
      m.className = bad ? 'errbox' : 'dim';
      m.textContent = t || '';
    };

    async function load() {
      inner.innerHTML = '<div class="empty">读取中…</div>';
      let r;
      try {
        r = await API('/plugins/action', {
          method: 'POST',
          body: JSON.stringify({ plugin_id: 'personality_engine', action: 'get_personality' }),
        }, 30000);
      } catch (e) {
        inner.innerHTML = '<div class="errbox">读取人格失败：' + esc(e.message) + '</div>';
        return;
      }
      if (r && r.error) {
        inner.innerHTML = '<div class="errbox">读取人格失败：' + esc(r.error) + '</div>';
        return;
      }
      const secs = (r && r.sections) || {};
      const conf = (r && r.config) || {};
      const names = Object.keys(secs);
      lastTotal = names.reduce((n, k) => n + String(secs[k] || '').length, 0);
      const st = $('cPersonaStat');
      if (st) st.textContent = names.length + ' 段 / ' + lastTotal + ' 字';
      const tip = $('cPersonaTip');
      if (tip) tip.textContent = '写回 plugins/personality.txt · 保存后下一条消息即生效';

      let html = ''
        + '<div class="stats" style="margin-bottom:var(--s4)">'
        +   '<div class="st"><div class="lab">段落</div><div class="v">' + names.length
        +     '</div><div class="c">按【】切分</div></div>'
        +   '<div class="st"><div class="lab">总字数</div><div class="v">' + lastTotal
        +     '</div><div class="c" id="cPersonaTotal">当前生效内容</div></div>'
        +   '<div class="st"><div class="lab">示例注入</div><div class="v">'
        +     (conf.example_enabled === false ? '关' : '开') + '</div><div class="c">few-shot</div></div>'
        + '</div>'
        /* 人格卡：真卡片（应用/删除），不再是"一排按钮" */
        + '<div class="fld" style="margin-bottom:var(--s4)">'
        +   '<label>人格卡 <span class="dim">· 点「应用」覆盖当前人格（先自动备份）；「存为卡」= 把当前编辑内容存成快照</span>'
        +     '<button class="btn sm" id="cCardSave" style="float:right">存为卡</button></label>'
        +   '<div id="cCards"><span class="dim">读取中…</span></div></div>'
        /* 人格段：2 列卡片 */
        + '<div class="pc-grid" id="pcGrid">';

      names.forEach(function (k) {
        const v = String(secs[k] || '');
        const prev = v.replace(/\s+/g, ' ').slice(0, 120);
        const rows = Math.min(16, Math.max(4, Math.ceil(v.length / 42)));
        html += '<div class="pc-card" data-pc="' + esc(k) + '">'
          +   '<div class="pc-hd"><span class="pc-name">' + esc(k) + '</span>'
          +     '<span class="pc-meta">' + v.length + ' 字</span></div>'
          +   '<div class="pc-prev" data-prev="' + esc(k) + '">' + esc(prev || '（空段）') + '</div>'
          +   '<textarea class="pc-edit" data-sec="' + esc(k) + '" rows="' + rows + '" spellcheck="false" hidden></textarea>'
          +   '<div class="pc-foot"><button class="btn sm" data-pc-edit="' + esc(k) + '">编辑</button></div>'
          + '</div>';
      });
      html += '</div>';
      if (!names.length) {
        html += '<div class="errbox">没读到任何段落。人格文件可能是空的 —— '
          + '先别保存，去 plugins/personality.txt 确认内容。</div>';
      }

      html += '<div style="display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end;margin-top:var(--s4)">'
        +   '<button class="btn primary" id="cPersonaSave">保存人格</button>'
        +   '<button class="btn" id="cPersonaReload">重新读取</button>'
        +   '<div class="fld" style="max-width:200px">'
        +     '<label>few-shot 示例注入</label>'
        +     '<select id="cPersonaEx">'
        +       '<option value="1"' + (conf.example_enabled === false ? '' : ' selected') + '>开启</option>'
        +       '<option value="0"' + (conf.example_enabled === false ? ' selected' : '') + '>关闭</option>'
        +     '</select></div>'
        + '</div>'
        + '<div id="cPersonaMsg" class="dim" style="margin-top:var(--s3)"></div>'
        + '<div class="dim" style="margin-top:var(--s2);font-size:var(--z1)">'
        +   '保存会自动备份（auto_backup 保留 5 份）。段标题【】不要改 —— '
        +   '下游按段名取值，改名等于删段。示例开关与人格一起保存。</div>';

      inner.innerHTML = html;
      // 值用 property 写入，避免把人格正文塞进 HTML 属性里被转义破坏
      qsa('[data-pc-edit]').forEach(function (b) {
        b.onclick = function () {
          const card = b.closest('.pc-card');
          const ta = card.querySelector('textarea[data-sec]');
          const open = card.classList.toggle('open');
          ta.hidden = !open;
          b.textContent = open ? '收起' : '编辑';
          if (open) { ta.focus(); ta.selectionStart = ta.selectionEnd = 0; }
        };
      });
      qsa('#cPersonaBody textarea[data-sec]').forEach(function (t) {
        t.value = String(secs[t.dataset.sec] || '');
        t.addEventListener('input', function () {
          const n = qsa('#cPersonaBody textarea[data-sec]')
            .reduce((s, x) => s + x.value.length, 0);
          const tot = $('cPersonaTotal');
          if (tot) tot.textContent = '改后 ' + n + ' 字';
          const prev = document.querySelector('[data-prev="' + t.dataset.sec + '"]');
          if (prev) prev.textContent = t.value.replace(/\s+/g, ' ').slice(0, 120) || '（空段）';
        });
      });

      /* ── 人格卡（批次 I1）：数据口 /api/persona/cards。
          应用卡在后端只走 EGO save_personality 一个写入口（同步 ego）；
          应用后 loadCards()/load() 从 EGO 重新读回 —— 蒸馏卡等更高优先级源
          存在时后端会给 warning，这里如实转述。 ── */
      async function loadCards() {
        const host = $('cCards');
        if (!host) return;
        let r = null;
        try { r = await API('/persona/cards'); }
        catch (e) { host.innerHTML = '<span class="dim">读取人格卡失败：' + esc(e.message) + '</span>'; return; }
        const cards = (r && r.cards) || [];
        if (!cards.length) {
          host.innerHTML = '<span class="dim">还没有卡 —— 点「存为卡」把当前人格存成快照</span>';
          return;
        }
        host.innerHTML = '<div class="pc-chips">' + cards.map(c =>
          '<div class="pc-chip" data-card="' + esc(c.id) + '">'
          + '<div class="n" title="' + esc(c.name) + '">' + esc(c.name) + '</div>'
          +   (c.note ? '<div class="note" title="' + esc(c.note) + '">' + esc(c.note) + '</div>' : '')
          + '<div class="m">' + (c.sections_count || c.sections || 0) + ' 段 · '
          +   (c.chars || 0) + ' 字 · ' + esc(String(c.updated || '').slice(5, 16) || '—') + '</div>'
          + '<div class="row"><button class="btn sm primary" data-apply="' + esc(c.id) + '">应用</button>'
          +   '<span class="x" data-del="' + esc(c.id) + '" title="删除此卡">删除</span></div>'
          + '</div>'
        ).join('') + '</div>' + (r.seeded && r.seeded.length
          ? '<div class="dim" style="font-size:9px;margin-top:6px">首启已生成：' + esc(r.seeded.join('、')) + '</div>' : '');
        qsa('[data-card]', host).forEach(ch => ch.onclick = async (e) => {
          if (e.target.dataset.del) return;      /* 点的是 ✕ 删除钮 */
          const id = ch.dataset.card;
          const nm = (ch.childNodes[0] && ch.childNodes[0].textContent || '该卡').trim();
          if (!await pvConfirm('应用人格卡「' + nm + '」？',
            '用这张卡覆盖当前人格文件（personality.txt），下一条消息生效。覆盖前的原文会自动备份到卡的目录。', '应用')) return;
          try {
            const r2 = await API('/persona/cards', { method: 'POST',
              body: JSON.stringify({ action: 'apply', id: id }) });
            if (r2 && r2.ok) {
              if (r2.warning) say('已应用，但注意：' + r2.warning, true);
              else say('已应用「' + ((r2.card || {}).name || nm) + '」· '
                + ((r2.card || {}).sections_count || Object.keys((r2.card || {}).sections || {}).length)
                + ' 段，下一条消息生效');
              await load();                      /* 应用后从 EGO 读回，编辑器跟着卡走 */
            } else say('应用失败：' + ((r2 && r2.error) || '未知'), true);
          } catch (e2) { say('应用失败：' + e2.message, true); }
        });
        qsa('[data-del]', host).forEach(x => x.onclick = async (ev) => {
          ev.stopPropagation();
          const id = x.dataset.del;
          if (x.dataset.armed !== '1') {
            x.dataset.armed = '1'; x.textContent = '确认✕';
            setTimeout(() => { if (x.parentNode) { x.dataset.armed = ''; x.textContent = '✕'; } }, 3000);
            return;
          }
          if (!await pvConfirm('删除这张人格卡？', '卡文件删除后不可恢复；personality.txt 本身不受影响。', '删除')) return;
          try { await API('/persona/cards', { method: 'POST',
            body: JSON.stringify({ action: 'delete', id: id }) }); } catch (e) { return; }
          loadCards();
        });
      }
      /* 存为卡：弹窗收名字/备注（Electron 不支持 window.prompt —— 用应用内对话框） */
      function cardSaveDialog() {
        const sections = {};
        qsa('#cPersonaBody textarea[data-sec]').forEach(function (t) { sections[t.dataset.sec] = t.value; });
        const total = Object.keys(sections).reduce((s, k) => s + sections[k].length, 0);
        if (!total) { say('编辑器里没有人格内容，空的存不成卡', true); return; }
        const ov = document.createElement('div');
        ov.className = 'modal-ov';
        ov.innerHTML = '<div class="modal" style="max-width:460px">'
          + '<div class="modal-t"><h3>存为人格卡</h3></div>'
          + '<div style="padding-bottom:var(--s3)">'
          + '<div class="fld"><label>卡名 <span class="dim">· ' + total + ' 字，与现有同名卡会覆盖更新</span></label>'
          + '<input id="pcNm" placeholder="小a / 大肥鱼 …"></div>'
          + '<div class="fld" style="margin-top:var(--s2)"><label>一句话备注（可空）</label>'
          + '<input id="pcNote"></div></div>'
          + '<div style="display:flex;gap:var(--s2)"><button class="btn primary" id="pcOk">保存</button>'
          + '<button class="btn" id="pcNo">取消</button></div></div>';
        document.body.appendChild(ov);
        const nm = $('pcNm'); if (nm) nm.focus();
        $('pcNo').onclick = () => ov.remove();
        ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
        const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); ov.remove(); } };
        document.addEventListener('keydown', onKey, true);
        $('pcOk').onclick = async () => {
          const name = (nm.value || '').trim();
          if (!name) { nm.focus(); return; }
          const note = ($('pcNote').value || '').trim();
          ov.remove();
          document.removeEventListener('keydown', onKey, true);
          try {
            const r = await API('/persona/cards', { method: 'POST',
              body: JSON.stringify({ action: 'save', name: name, note: note, sections: sections }) });
            if (r && r.ok) { say('已存卡「' + name + '」· ' + total + ' 字'); await loadCards(); }
            else say('存卡失败：' + ((r && r.error) || '未知'), true);
          } catch (e) { say('存卡失败：' + e.message, true); }
        };
      }
      const csBtn = $('cCardSave');
      if (csBtn) csBtn.onclick = cardSaveDialog;

      const btn = $('cPersonaSave');
      if (btn) btn.onclick = async function () {
        const sections = {};
        qsa('#cPersonaBody textarea[data-sec]').forEach(function (t) {
          sections[t.dataset.sec] = t.value;          // ★ 所有段都回传，漏一段=删一段
        });
        const total = Object.keys(sections).reduce((s, k) => s + sections[k].length, 0);
        if (lastTotal > 0 && total < lastTotal * 0.3) {
          if (!confirm('改动后只剩 ' + total + ' 字（原来 ' + lastTotal + ' 字）。'
            + '确定要保存吗？')) return;
        }
        btn.disabled = true;
        say('保存中…');
        try {
          const r1 = await API('/plugins/action', {
            method: 'POST',
            body: JSON.stringify({ plugin_id: 'personality_engine', action: 'save_personality',
                                   params: { sections: sections } }),
          }, 30000);
          if (r1 && r1.success === false) throw new Error(r1.error || '保存失败');
          const ex = $('cPersonaEx');
          if (ex) {
            await API('/plugins/action', {
              method: 'POST',
              body: JSON.stringify({ plugin_id: 'personality_engine', action: 'set_config',
                                     params: { example_enabled: ex.value === '1' } }),
            }, 30000);
          }
          say('已保存 · ' + total + ' 字，下一条消息生效');
          lastTotal = total;
        } catch (e) {
          say('保存失败：' + e.message, true);
        } finally {
          btn.disabled = false;
        }
      };
      const re = $('cPersonaReload');
      if (re) re.onclick = function () { load(); };
      await loadCards();               /* 人格卡条（I1）：随人格一起刷新 */
    }

    hd.onclick = function () {
      const show = body.hidden;
      body.hidden = !show;
      if (show && !loaded) { loaded = true; load(); }
    };
  })();

  const dirty = {};
  /* 元数据区上下文：与"其他配置项"共用 dirty/mark，保存时一起提交 */
  const cfCtx = {
    cfg, dirty, lists: {}, listDirty: {}, active: null, group: 'connect',
    mark: () => mark(),
  };
  /* 列表字段初值（退场语 / 撤回反馈：[{text,disabled}]）*/
  Object.keys(FIELD_META.fields).forEach(k => {
    const m = FIELD_META.fields[k];
    if (m.ctl === 'editable') cfCtx.lists[k] = cfNormList(cfGet(cfg, k));
  });
  const mark = () => {
    /* 计数要算上列表改动：勾了退场语的"停用"框却显示"无改动"→ 看着像没生效 */
    const n = Object.keys(dirty).length
            + Object.keys(cfCtx.listDirty).filter(k => cfCtx.listDirty[k]).length;
    $('cDirty').textContent = n ? ('有 ' + n + ' 项改动') : '无改动';
    $('cSave').disabled = n === 0;
    $('cSave').textContent = n ? ('保存改动 (' + n + ')') : '保存改动';
  };

  /* 按类型渲染控件 */
  const field = (k) => {
    const v = cfg[k];
    const ro = isMasked(v);
    let ctl;
    if (typeof v === 'boolean') {
      ctl = '<select data-k="' + esc(k) + '"><option value="1"' + (v ? ' selected' : '') + '>开启</option>'
        + '<option value="0"' + (!v ? ' selected' : '') + '>关闭</option></select>';
    } else if (typeof v === 'number') {
      ctl = '<input type="number" step="any" data-k="' + esc(k) + '" value="' + esc(fmtRaw(v)) + '">';
    } else if (Array.isArray(v) || (v && typeof v === 'object')) {
      ctl = '<textarea data-k="' + esc(k) + '" rows="2" spellcheck="false">'
        + esc(JSON.stringify(v)) + '</textarea>';
    } else {
      ctl = '<input data-k="' + esc(k) + '" value="' + esc(v == null ? '' : String(v)) + '"'
        + (isMasked(v) ? ' data-masked="1" spellcheck="false"' : '') + '>';
    }
    return '<div class="row" style="grid-template-columns:minmax(200px,1fr) 2fr">'
      + '<span class="num dim" style="font-size:var(--z2)">' + esc(k)
      + (ro ? ' <span class="sig" style="display:inline-flex"><i></i>凭据</span>' : '') + '</span>'
      + '<span class="fld">' + ctl + '</span></div>';
  };

  const draw = (kw) => {
    const host = $('cSections');
    /* ★ 已经在元数据面板里有中文标签的键，不再在这里重复出现 ——
       否则同一个设置项在页面里出现两次（一次带标签、一次裸键），改哪个都容易漏。*/
    const labelled = new Set(Object.keys(FIELD_META.fields).map(k => k.split('.')[0]));
    const list = Object.keys(groups).filter(g =>
      !kw || groups[g].some(k => k.toLowerCase().includes(kw.toLowerCase())));
    host.innerHTML = (list.length ? list.map(g => {
      const all = kw ? groups[g].filter(k => k.toLowerCase().includes(kw.toLowerCase())) : groups[g];
      const ks = all.filter(k => !labelled.has(k));
      if (!ks.length) return '';
      return '<div style="margin-bottom:var(--s5)">'
        + '<div class="hd"><span class="lab">' + esc(g) + '</span><i class="rule"></i>'
        + '<span class="dim">' + ks.length + ' 项</span></div>'
        + '<div class="rows">' + ks.map(field).join('') + '</div></div>';
    }).join('') : '') || '<div class="empty">没有未登记标签的配置项（全部在上方面板中）</div>';

    // ⚠️ 必须同时听 input 与 change：
    //   文本框/数字框在**打字过程中**只触发 input，change 要等失焦；
    //   只绑 change 的话"有 N 项改动"与保存按钮不会实时更新（实测漏掉过）。
    qsa('[data-k]', host).forEach(elm => {
      const handler = () => {
        const k = elm.dataset.k, orig = cfgOriginal[k];
        let val = elm.value;
        if (elm.tagName === 'SELECT' && typeof orig === 'boolean') val = elm.value === '1';
        else if (elm.tagName === 'INPUT' && elm.type === 'number') val = Number(val);
        else if (elm.tagName === 'TEXTAREA') {
          try { val = JSON.parse(elm.value); }
          catch (e) {
            $('cMsg').innerHTML = '<div class="sig err"><i></i>' + esc(k)
              + ' 不是合法 JSON，未记录改动</div>';
            return;
          }
        }
        // ★ 掩码字段：值没变（仍是掩码）→ 不算改动，避免把占位符写回去
        if (elm.dataset.masked && val === orig) { delete dirty[k]; mark(); return; }
        if (JSON.stringify(val) === JSON.stringify(orig)) delete dirty[k]; else dirty[k] = val;
        mark();
      };
      elm.addEventListener('input', handler);
      elm.addEventListener('change', handler);
    });
  };
  draw('');
  $('cFilter').oninput = (e) => draw(e.target.value.trim());
  /* 元数据面板区渲染（tabs + 字段）*/
  /* ── 分组导航（2026-10-24）────────────────────────────────────
     六个分组按钮 + 一个搜索框。切组只换内容区，不重载页面。
     「接入」组是原来那一整块（模型 / 提供商 / 诊断 / 预览），
     它在 #cfgConnect 里，切到别的组时整块隐藏。 */
  const showGroup = (gid, keyword) => {
    cfCtx.group = gid;
    cfCtx.keyword = keyword || '';
    const grp = CFG_GROUPS.find(g => g[0] === gid) || CFG_GROUPS[0];
    cfCtx.active = grp[2].indexOf('ui') !== -1 ? 'ui' : grp[2][0];
    const bar = $('cfgGroups');
    if (bar) {
      bar.innerHTML = CFG_GROUPS.map(g =>
        '<button type="button" class="cfg-grp' + (g[0] === gid ? ' on' : '')
        + '" data-grp="' + g[0] + '"><b>' + esc(g[1]) + '</b><span>' + esc(g[3]) + '</span></button>'
      ).join('');
      qsa('[data-grp]', bar).forEach(b => b.onclick = () => {
        const kw = ($('cfgSearch') || {}).value || '';
        if (kw.trim()) { $('cfgSearch').value = ''; }   /* 换了组就退出搜索状态 */
        showGroup(b.dataset.grp);
      });
    }
    const conn = $('cfgConnect');
    /* 接入组的内容是页面里原有的那一整块；其余分组看字段区。
       搜索状态下两处都让位给结果列表。 */
    const searching = !!(keyword && keyword.trim());
    if (conn) conn.hidden = searching || gid !== 'connect';
    const hint = $('cfgHint');
    const cnt = $('cfgCount');
    if (cnt) cnt.textContent = Object.keys(FIELD_META.fields).length + ' 项';
    if (hint) hint.textContent = searching ? '搜索中' : '分 ' + CFG_GROUPS.length + ' 组';
    if (searching) cfRenderSearch($('cfArea'), cfg, cfCtx, keyword.trim());
    else cfRenderArea($('cfArea'), cfg, cfCtx);
  };
  showGroup('connect');
  /* 给测试与脚本用的导航入口（2026-10-24 分组重排后新增）。
     旧版靠点 `.cf-tab` 切面板；现在面板是分组内的小节，没有独立按钮，
     所以留一个按面板名跳转的函数，避免测试去猜 DOM 结构。 */
  window.__cfGo = (panel) => {
    const g = CFG_GROUPS.find(x => x[2].indexOf(panel) !== -1);
    if (!g) return false;
    const btn = [...document.querySelectorAll('.cfg-grp')].find(b => b.dataset.grp === g[0]);
    if (btn) btn.click();
    return true;
  };
  window.__cfGroups = () => CFG_GROUPS.map(g => g[0]);
  window.__cfPanelLabels = () =>
    [...document.querySelectorAll('.cfg-sec-hd b')].map(e => e.textContent);
  const se = $('cfgSearch');
  if (se) {
    let timer = null;
    se.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => showGroup(cfCtx.group, se.value), 160);
    });
  }

  const say = (ok, t) => { $('cMsg').innerHTML = '<div class="sig ' + (ok ? 'ok' : 'err')
    + '"><i></i>' + esc(t) + '</div>'; };

  /* ── 多提供商管理（v3 功能回补）──
     v4 第一版把这块砍成单下拉 → 切提供商不回填地址、Key 只剩全局一份。
     后端能力完好（providers 组保存 + 每提供商 Key 进凭据管理器），纯前端补齐。 */
  let pvList = providers.map(p => Object.assign({}, p));
  let pvActive = String(curProv || '');
  const pvHost = $('pvCards');
  const pvModelsOf = (p) => (p.models || [])
    .map(m => (typeof m === 'string' ? m : (m && (m.id || m.name)) || '')).filter(Boolean);
  /* 常用 / 展开全部（2026-10-24）。
     目录里有 18 个提供商，全平铺是一面墙，而普通用户只会在 1~2 个之间换。
     "常用"的判据用**用户自己的数据**，不写死厂商名单：
       正在用的（pvActive）· 配过独立 Key 的（has_api_key）· 用过的（last_model）
     一个都没有时（新装）直接把全部展开，并给一句说明，不留空白区。 */
  let pvShowAll = (() => { try { return localStorage.getItem('pv-show-all') === '1'; } catch (e) { return false; } })();
  const pvIsFav = (p) => String(p.id) === pvActive || !!p.has_api_key || !!p.last_model;
  const pvCardHTML = (p) => {
    const ms = pvModelsOf(p);
    return '<div class="pv-card' + (String(p.id) === pvActive ? ' on' : '') + '" data-pv-id="' + esc(String(p.id)) + '">'
      + '<div class="pv-nm">' + esc(p.name || p.id) + '</div>'
      + '<div class="pv-url" title="' + esc(p.base_url || '') + '">' + esc(p.base_url || '(未填地址)') + '</div>'
      + '<div class="pv-meta"><span>' + ms.length + ' 模型</span>'
      + '<span class="pv-key' + (p.has_api_key ? '' : ' no') + '">'
      + (p.has_api_key ? '独立 Key' : '沿用全局 Key') + '</span></div>'
      + '<div class="pv-acts"><button class="btn sm" data-pv-edit="' + esc(String(p.id)) + '">Edit</button>'
      + '<button class="btn sm" data-pv-del="' + esc(String(p.id)) + '">Del</button></div></div>';
  };
  function pvRender() {
    if (!pvHost) return;
    const favs = pvList.filter(pvIsFav);
    const rest = pvList.filter(p => !pvIsFav(p));
    let html = '';
    if (favs.length) {
      html += '<div class="pv-sec-hd"><b>常用</b><i>' + favs.length + ' 个</i>'
        + (rest.length
            ? '<button type="button" class="btn sm" data-pv-toggle>'
              + (pvShowAll ? '收起其他' : '展开其他 ' + rest.length + ' 个') + '</button>'
            : '')
        + '</div><div class="pv-cards">' + favs.map(pvCardHTML).join('') + '</div>';
      if (pvShowAll && rest.length) {
        html += '<div class="pv-sec-hd"><b>其他提供商</b><i>' + rest.length + ' 个</i></div>'
          + '<div class="pv-cards">' + rest.map(pvCardHTML).join('')
          + '<button type="button" class="pv-card pv-add" data-pv-add>+ 添加提供商</button></div>';
      }
    } else {
      html += '<div class="pv-empty">还没选过提供商。下面是全部 ' + pvList.length
        + ' 个，点一个就能用（模型与 Key 在下一步填）。</div>'
        + '<div class="pv-cards">' + pvList.map(pvCardHTML).join('')
        + '<button type="button" class="pv-card pv-add" data-pv-add>+ 添加提供商</button></div>';
    }
    pvHost.innerHTML = html;
    qsa('[data-pv-id]', pvHost).forEach(c => c.onclick = (e) => {
      if (e.target.closest('[data-pv-edit],[data-pv-del]')) return;
      pvApply(c.dataset.pvId);
    });
    qsa('[data-pv-edit]', pvHost).forEach(b => b.onclick = () => pvModal(b.dataset.pvEdit));
    qsa('[data-pv-del]', pvHost).forEach(b => b.onclick = () => pvDel(b.dataset.pvDel));
    const add = pvHost.querySelector('[data-pv-add]');
    if (add) add.onclick = () => pvModal(null);
    const tg = pvHost.querySelector('[data-pv-toggle]');
    if (tg) tg.onclick = () => {
      pvShowAll = !pvShowAll;
      try { localStorage.setItem('pv-show-all', pvShowAll ? '1' : '0'); } catch (e) {}
      pvRender();
    };
  }
  async function pvSaveProviders(msg) {
    /* 整组写回：掩码 Key（GET 回传的占位符）不能当真实 Key 提交；has_api_key 是展示字段 */
    const body = pvList.map(x => {
      const q = Object.assign({}, x);
      delete q.has_api_key; delete q._fetchedAt;
      if (isMasked(q.api_key)) delete q.api_key;
      return q;
    });
    try {
      const r = await API('/config', { method: 'POST', body: JSON.stringify({ providers: body }) });
      if (r && (r.ok === false || r.error)) { say(false, (r && r.error) || '保存提供商失败'); return false; }
      await API('/config/reload', { method: 'POST', body: '{}' }).catch(() => {});
      /* ★ 2026-10-25：保存后必须回读一次 /config。
         原来直接用 pvList 里的对象重绘，而本地那份 has_api_key 已经在
         编辑时被 delete 掉了 → 卡片一定显示「沿用全局 Key」，
         哪怕独立 Key 已经存进凭据管理器（实测凭据里确实有
         EggBloom.MODEL_API_KEY_aliyun，界面却说沿用全局）。
         要等整页刷新才恢复正常。has_api_key 是**服务端算出来的**字段，
         前端不该自己维护 —— 回读一次，以服务端为准。 */
      await pvReloadFromServer();
      if (msg) say(true, msg);
      return true;
    } catch (e) { say(false, e.message); return false; }
  }
  async function pvReloadFromServer() {
    try {
      const r = await API('/config');
      const cf = (r && r.config) || null;
      if (!cf) return;
      if (Array.isArray(cf.providers)) {
        pvList = cf.providers.map(p => Object.assign({}, p));
      }
      if (cf.api_provider) pvActive = String(cf.api_provider);
      pvRender();
    } catch (e) { /* 回读失败就保持当前视图，不打断用户 */ }
  }
  async function pvApply(pid) {
    const p = pvList.find(x => String(x.id) === String(pid));
    if (!p || String(pid) === pvActive) return;
    const patch = { api_provider: String(pid), api_url: String(p.base_url || '') };
    const lm = String(p.last_model || '') || pvModelsOf(p)[0] || '';
    if (lm) patch.model_name = lm;
    try {
      const r = await API('/config', { method: 'POST', body: JSON.stringify(patch) });
      if (r && (r.ok === false || r.error)) { say(false, (r && r.error) || '切换失败'); return; }
      await API('/config/reload', { method: 'POST', body: '{}' }).catch(() => {});
      pvActive = String(pid);
      /* 就地同步表单（不整页重绘，保住 say 的提示） */
      cfg.api_provider = patch.api_provider; cfg.api_url = patch.api_url;
      if (lm) cfg.model_name = lm;
      cfgOriginal.api_provider = patch.api_provider; cfgOriginal.api_url = patch.api_url;
      if (lm) cfgOriginal.model_name = lm;
      const sp = document.querySelector('[data-k="api_provider"]'); if (sp) sp.value = String(pid);
      const su = document.querySelector('[data-k="api_url"]'); if (su) su.value = patch.api_url;
      if ($('cProv')) $('cProv').value = String(pid);
      if ($('cModel')) {
        const ms = pvModelsOf(p).map(id => '<option value="' + esc(id) + '"'
          + (id === lm ? ' selected' : '') + '>' + esc(id) + '</option>').join('');
        $('cModel').innerHTML = ms || '<option value="">（还没有模型目录）</option>';
      }
      /* 通用字段也跟一份：它在另一个面板里显示「当前模型」，
         不同步的话两个控件会各存一个值（2026-10-25 就是这里分叉的） */
      const sm = document.querySelector('[data-k="model_name"]');
      if (sm && lm) sm.value = lm;
      pvRender();
      say(true, '已切换到 ' + (p.name || p.id) + '（地址已回填'
        + (lm ? (' · 模型 ' + lm) : ' · 请再选模型') + '）');
    } catch (e) { say(false, e.message); }
  }
  async function pvDel(pid) {
    const p = pvList.find(x => String(x.id) === String(pid));
    if (!p) return;
    if (!await pvConfirm('删除提供商「' + (p.name || p.id) + '」？',
        '它的独立 Key（如有）与模型目录会一并移除。', '删除')) return;
    pvList = pvList.filter(x => String(x.id) !== String(pid));
    if (pvActive === String(pid)) pvActive = pvList.length ? String(pvList[0].id) : '';
    if (await pvSaveProviders('已删除 ' + (p.name || p.id))) pvRender();
  }
  function pvModal(pid) {
    const editing = pid != null;
    const p = editing ? pvList.find(x => String(x.id) === String(pid)) : null;
    if (editing && !p) return;
    const data = p || { id: 'custom_' + Date.now(), name: '', base_url: '', models: [] };
    const ov = document.createElement('div');
    ov.className = 'fb-mask';
    ov.style.zIndex = '74';
    ov.innerHTML = '<div class="fb" style="width:min(520px,94vw)">'
      + '<div class="fb-hd"><b>' + (editing ? '编辑提供商' : '添加提供商') + '</b>'
      + '<button class="btn sm" data-pv-x>取消</button></div>'
      + '<div class="pv-form" style="padding:var(--s5)">'
      +   '<div class="fld"><label>名称</label><input class="ff-in" id="pvName" value="' + esc(data.name || '') + '" placeholder="如 DeepSeek"></div>'
      +   '<div class="fld"><label>Base URL</label><input class="ff-in" id="pvUrl" value="' + esc(data.base_url || '') + '" placeholder="https://…/v1/chat/completions"></div>'
      +   '<div class="fld"><label>API 协议</label><select class="ff-in" id="pvProto">'
      +     '<option value="">自动识别（按 URL 推断）</option>'
      +     '<option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option>'
      +     '<option value="gemini">Gemini</option><option value="ollama">Ollama</option>'
      +     '<option value="lmstudio">LM Studio</option></select></div>'
      +   '<div class="fld"><label style="display:flex;align-items:center;gap:10px">模型（每行一个）'
      +     '<button class="btn sm" id="pvFetch" type="button" title="用上方当前地址+Key 拉真实模型列表，成功即填入（无需先保存）">拉取模型</button>'
      +     '<span id="pvFetchMsg" class="cf-desc" style="margin:0"></span></label>'
      +     '<textarea class="ff-in" id="pvModels" rows="4" placeholder="deepseek-chat（或点右上「拉取模型」自动填）">' + esc(pvModelsOf(data).join('\n')) + '</textarea></div>'
      +   '<div class="fld"><label>API Key（本提供商专用）</label>'
      +     '<input class="ff-in" id="pvKey" type="password" autocomplete="new-password" placeholder="' + (data.has_api_key ? '已配置独立 Key（留空=不改）' : 'sk-…（留空=沿用全局 Key）') + '"></div>'
      +   (data.has_api_key ? '<label style="display:flex;gap:8px;align-items:center;font-size:var(--z2);color:var(--ink3)"><input type="checkbox" id="pvClearKey"> 清除已保存的独立 Key</label>' : '')
      +   '<div class="cf-desc">Key 只写不回显：保存进 Windows 凭据管理器（每提供商一条），切换提供商自动使用对应 Key。</div>'
      + '</div>'
      + '<div class="wz-ft" style="padding:0 var(--s5) var(--s5)">'
      +   '<button class="btn primary" data-pv-ok>保存</button></div></div>';
    document.body.appendChild(ov);
    try { ov.querySelector('#pvProto').value = data.protocol || ''; } catch (e) {}
    const close = () => ov.remove();
    ov.querySelector('[data-pv-x]').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    /* 弹窗内拉取模型：用表单当前值（地址/协议/Key 都还没保存也能测），
       成功后直接填进 textarea；掩码 Key 不提交（后端会按已存凭据解析）。 */
    ov.querySelector('#pvFetch').onclick = async () => {
      const url = ov.querySelector('#pvUrl').value.trim();
      if (!url) { ov.querySelector('#pvFetchMsg').textContent = '先填 Base URL'; return; }
      const btn = ov.querySelector('#pvFetch');
      btn.disabled = true; btn.textContent = '拉取中…';
      ov.querySelector('#pvFetchMsg').textContent = '';
      const pl = { provider_id: String(data.id || ''), base_url: url };
      const proto = ov.querySelector('#pvProto').value;
      if (proto) pl.protocol = proto;
      const kEl = ov.querySelector('#pvKey');
      const k = kEl ? kEl.value.trim() : '';
      if (k && !isMasked(k)) pl.api_key = k;
      try {
        const r = await API('/providers/models', { method:'POST', body: JSON.stringify(pl) });
        const list = (r && r.models) || [];
        if (list.length) {
          ov.querySelector('#pvModels').value = list.map(m => m.id || m).join('\n');
          ov.querySelector('#pvFetchMsg').textContent = '已拉取 ' + list.length + ' 个，保存后生效';
        } else {
          ov.querySelector('#pvFetchMsg').textContent = (r && r.error) || '没拉到（可能不支持列表接口，手填即可）';
        }
      } catch (e) {
        const m = String(e.message || '');
        ov.querySelector('#pvFetchMsg').textContent = /401|403|invalid.*key|authentication/i.test(m)
          ? 'Key 无效（401/403）' : (/unreachable|不可达|timed?\s*out|refused/i.test(m) ? '地址不可达' : '拉取失败：' + m);
      }
      btn.disabled = false; btn.textContent = '拉取模型';
    };
    ov.querySelector('[data-pv-ok]').onclick = async () => {
      const name = ov.querySelector('#pvName').value.trim();
      const url = ov.querySelector('#pvUrl').value.trim();
      if (!name) { say(false, '名称必填'); return; }
      const models = ov.querySelector('#pvModels').value.split(/[\n,]+/)
        .map(s => s.trim()).filter(Boolean).map(id => ({ id: id, name: id }));
      const proto = ov.querySelector('#pvProto').value;
      const keyEl = ov.querySelector('#pvKey');
      const key = keyEl ? keyEl.value.trim() : '';
      const clearEl = ov.querySelector('#pvClearKey');
      const clear = !!(clearEl && clearEl.checked);
      const np = Object.assign({}, data, { name: name, base_url: url, models: models });
      if (proto) np.protocol = proto; else delete np.protocol;
      if (clear) { np._clear_key = true; delete np.api_key; }
      else if (key) { np.api_key = key; }
      delete np.has_api_key;
      if (editing) {
        const idx = pvList.findIndex(x => String(x.id) === String(data.id));
        if (idx >= 0) pvList[idx] = np; else pvList.push(np);
      } else {
        pvList.push(np);
      }
      close();
      if (await pvSaveProviders((editing ? '已保存 ' : '已添加 ') + name)) {
        pvActive = String(np.id);
        CFG_OPTIONS.api_provider = pvList.map(x => [String(x.id), String(x.name || x.id)]);
        pvRender();
      }
    };
  }
  pvRender();

  /* ── 引导横幅（2026-10-24）───────────────────────────────────────
     判据与仪表盘那一份**共用 setupReady()**（见文件上方）。这里只负责
     "什么时候画"：本页随时可重画（存完 Key 要立刻收掉横幅），所以每次调用
     都重新判一次，并用 force 覆盖会话缓存 —— 用户刚保存的值还没被后端读进
     /config，缓存里是旧的。
     「开始配置」在本页打开三步向导（仪表盘那份只跳转到本页）。 */
  const setupBox = $('cfgSetup');
  const renderSetup = () => {
    if (!setupBox) return;
    if (setupDismissed() || _SETUP_STATE.ready) {
      setupBox.hidden = true; setupBox.innerHTML = ''; return;
    }
    setupBanner(setupBox, {
      onGo: () => openWizard(providers, curProv, () => pageConfig(el)),
      goText: '开始配置',
    });
  };
  setupReady().then(() => renderSetup());

  $('cSave').onclick = async () => {
    /* 三类改动合并成一个 payload：
       ① dirty        —— 输入框/数字框/每行一条文本框/开关
       ② 划线列表      —— ctx.listDirty（退场语、撤回反馈；v3 只读不存，这里补上）
       ③ 嵌套键        —— de_ai.enabled 这类 a.b 路径要组装成 {a:{b:…}} 再提交 */
    const payload = {};
    Object.keys(dirty).forEach(k => cfSet(payload, k, dirty[k]));
    let nList = 0;
    Object.keys(cfCtx.listDirty).forEach(k => {
      if (!cfCtx.listDirty[k]) return;
      cfSet(payload, k, (cfCtx.lists[k] || []).filter(x => x.text));
      nList++;
    });
    const n = Object.keys(payload).length;
    if (!n) return;
    $('cSave').disabled = true;
    try {
      const r = await API('/config', { method:'POST', body: JSON.stringify(payload) });
      if (r && (r.ok === false || r.error)) { say(false, r.error || '保存失败'); $('cSave').disabled = false; return; }
      await API('/config/reload', { method:'POST', body:'{}' }).catch(() => {});
      /* 保存后才需要知道"要不要重启"：只有被读成模块级常量、又不在热重载名单里的键
         才真正需要（这些键在 _fieldmeta.json 里带 restart:true，由脚本从代码生成）。
         大部分键改完即时生效，不能笼统地说"请重启"，那会让用户白重启。 */
      const needRestart = Object.keys(payload).filter(k => {
        const m = FIELD_META.fields[k];
        return m && m.restart;
      });
      say(true, '已保存 ' + n + ' 项' + (nList ? '（含 ' + nList + ' 组列表）' : '')
        + (needRestart.length
            ? '；其中 ' + needRestart.length + ' 项要重启后端才生效：' + needRestart.join('、')
            : '并已热重载，无需重启'));
      /* 同步基线：否则"已保存"之后仍显示有改动，还会重复提交 */
      Object.keys(payload).forEach(k => cfSet(cfgOriginal, k, payload[k]));
      Object.keys(dirty).forEach(k => delete dirty[k]);
      Object.keys(cfCtx.listDirty).forEach(k => delete cfCtx.listDirty[k]);
      mark();
      /* 刚存了 Key 或切到本地模型 → 横幅当场收掉，不用刷新页面等它自己发现。
         同时写回共享缓存：否则回到仪表盘会再挂一次（那边读的是缓存）。 */
      if (('api_key' in payload) || ('use_local_llm' in payload)
          || ('providers' in payload)) {
        if (payload.api_key || payload.use_local_llm) {
          _SETUP_STATE.ready = true;
          _SETUP_STATE.checked = true;
          renderSetup();
        }
      }
    } catch (e) { say(false, e.message); $('cSave').disabled = false; }
  };
  $('cReload').onclick = async () => {
    try { await API('/config/reload', { method:'POST', body:'{}' }); say(true, '已请求热重载'); }
    catch (e) { say(false, e.message); }
  };
  /* ── 模型自动探测：拉 /providers/models（命中即连通性验证 + 后端自动持久化目录）
      401/403 → Key 无效；不可达 → 地址错；成功 → 直接填充下拉。
      提供商对象来自 pageConfig 作用域的 providers（含 base_url，不含明文 Key）。── */
  async function fetchProviderModels(pid, silent) {
    const p = providers.find(x => String(x.id) === String(pid));
    if (!p || !p.base_url) { if (!silent) say(false, '该提供商没有 Base URL，先编辑填地址'); return; }
    const btn = $('cFetchModels');
    if (btn) { btn.disabled = true; btn.textContent = '拉取中…'; }
    try {
      const r = await API('/providers/models', { method: 'POST',
        body: JSON.stringify({ provider_id: String(pid), base_url: String(p.base_url || '') }) });
      const list = (r && r.models) || [];
      if (list.length) {
        p.models = list;   /* 本地同步，切走再切回不用重拉 */
        const cur = $('cModel').value;
        $('cModel').innerHTML = list.map(m => '<option value="' + esc(m.id || '') + '"'
          + (String(m.id || '') === String(cur) ? ' selected' : '') + '>'
          + esc(m.name || m.id || '') + '</option>').join('');
        say(true, '探测成功 · ' + list.length + ' 个模型（地址与 Key 连通性已验证，目录已保存）');
      } else {
        say(false, (r && r.error) || '没拉到模型（该提供商可能不支持列表接口，可手填模型代码）');
      }
    } catch (e) {
      const m = String(e.message || '');
      say(false, /401|403|invalid.*key|authentication/i.test(m)
        ? '探测失败：Key 无效（401/403）——到「多提供商管理」Edit 重填该提供商 Key'
        : (/unreachable|不可达|timed?\s*out|refused/i.test(m)
          ? '探测失败：地址不可达——检查 Base URL / 网络' : '探测失败：' + m));
    }
    if (btn) { btn.disabled = false; btn.textContent = '获取模型'; }
  }
  $('cFetchModels').onclick = () => fetchProviderModels($('cProv').value, false);

  $('cProv').onchange = async (e) => {
    try {
      const r = await API('/config');
      const _c = (r && r.config) ? r.config : (r || {});   /* 同 4265 行：后端包一层 {config} */
      const ps = (_c && _c.providers) || [];
      const p = ps.find(x => String(x.id) === e.target.value) || {};
      const ms = (p.models || []).map(m => '<option value="' + esc(m.id || '') + '">'
        + esc(m.name || m.id || '(默认)') + '</option>').join('');
      $('cModel').innerHTML = ms || '<option value="">（还没有模型目录）</option>';
      if (!ms) {
        /* 空目录不再只是提示用户去别的页面拉 —— 直接自动探测一次 */
        $('cMsg').innerHTML = '<div class="sig"><i></i>该提供商还没有模型目录，正在自动探测…</div>';
        fetchProviderModels(e.target.value, true);
      }
    } catch (err) { say(false, err.message); }
  };
$('cModelGo').onclick = async () => {
    const pid = $('cProv').value, m = $('cModel').value;
    if (!pid || !m) { say(false, '请选择提供商与模型'); return; }
    $('cModelGo').disabled = true; $('cModelGo').textContent = '切换中…';
    try {
      const r = await API('/config/model', { method:'POST',
        body: JSON.stringify({ api_provider: pid, model_name: m }) });
      say(!!r.success, r.success ? ('已切换到 ' + pid + ' / ' + m) : (r.error || '切换失败'));
      if (r && r.success) {
        /* 同步到通用字段与本地缓存，避免「切换了但测试还是旧模型」 */
        const sm = document.querySelector('[data-k="model_name"]'); if (sm) sm.value = m;
        cfg.model_name = m; cfgOriginal.model_name = m;
        cfg.api_provider = pid; cfgOriginal.api_provider = pid;
      }
    } catch (e) { say(false, e.message); }
    $('cModelGo').disabled = false; $('cModelGo').textContent = '切换并热重载';
  };

  /* ── 接入与诊断动作 ── */
  const diag = (html) => { $('cDiag').innerHTML = html; };
  const diagMsg = (ok, t) => diag('<div class="sig ' + (ok ? 'ok' : 'err') + '"><i></i>' + esc(t) + '</div>');
  /* 编辑器里当前值；掩码值不当作真实 Key 回传 */
  const editorVal = (k) => {
    const e = document.querySelector('.panel [data-k="' + k + '"]');
    return e ? e.value : undefined;
  };
  const realKey = () => {
    const v = editorVal('api_key');
    return (v && !isMasked(v)) ? v : undefined;
  };

  $('cWizard').onclick = () => openWizard(providers, curProv, () => pageConfig(el));

  $('cTest').onclick = async () => {
    const b = $('cTest'); b.disabled = true; const t = b.textContent; b.textContent = '测试中…';
    try {
      /* 修（2026-10-11 用户实测 401）：旧实现发的是 cfg.api_url（全局地址，会被
         点过的提供商卡片改掉）+ curProv（const，页面首屏就定死，下拉改了也不跟）。
         结果"选了 DeepSeek 点测试"实际测的是 sensenova 地址 + DeepSeek Key → 401。
         现在：提供商取下拉现值，地址取该提供商自己的 base_url，与后端
         「按 provider 解析 Key」的口径完全对齐。 */
      const pid = $('cProv').value || curProv;
      const p = providers.find(x => String(x.id) === String(pid)) || {};
      /* ★ 2026-10-25：模型取 `$('cModel')` 下拉的现值，它才是「接入」面板里
         真正被切换动作写入的那个控件；`[data-k="model_name"]` 是另一个面板的
         通用字段，切换提供商时不会跟着变。
         实测症状：卡片上「已切换到 ALIYUN / QWEN-FLASH」，点测试却回
         「连接成功 · MINIMAX-M2.5」—— 测的是上一个提供商的残留模型。
         同一件事两个控件各存一份，读取端挑了错的那个。 */
      const curModel = ($('cModel') && $('cModel').value) || editorVal('model_name') || cfg.model_name;
      const pl = { api_provider: pid,
                   api_url: p.base_url || cfg.api_url,
                   model_name: curModel };
      const k = realKey(); if (k) pl.api_key = k;
      const r = await API('/llm/test', { method:'POST', body: JSON.stringify(pl) });
      const ok = !!(r && r.ok);
      diagMsg(ok, ok ? ('连接成功 · ' + (r.model || '') + ' → ' + String(r.reply || '').slice(0, 80))
                     : ((r && (r.error || r.msg)) || '连接失败'));
    } catch (e) { diagMsg(false, e.message); }
    b.disabled = false; b.textContent = t;
  };

  $('cKeyClear').onclick = async () => {
    if (!await pvConfirm('清除提供商「' + curProv + '」已保存的 API Key？', '清除后需重新填写该提供商的 Key。', '清除')) return;
    try {
      const r = await API('/config', { method:'POST', body: JSON.stringify({ api_key_clear: curProv }) });
      diagMsg(!(r && r.error), (r && r.error) || ('已请求清除「' + curProv + '」的 Key'));
      later(el, () => pageConfig(el), 700);
    } catch (e) { diagMsg(false, e.message); }
  };

  $('cScan').onclick = async () => {
    diag('<div class="empty">扫描中…（全盘常见位置，可能需要一会）</div>');
    try {
      const r = await API('/llama/scan', { method:'POST', body: JSON.stringify({ root: '' }) });
      if (r && r.ok === false) { diagMsg(false, r.error || '扫描失败'); return; }
      const exes = r.llama_servers || [], models = r.models || [];
      diag('<div class="sig ok"><i></i>找到 ' + exes.length + ' 个 llama-server · '
        + models.length + ' 个模型文件</div>'
        + '<div class="rows" style="margin-top:var(--s3)">'
        + exes.slice(0, 6).map(x => '<div class="row" style="grid-template-columns:1fr">'
            + '<span class="num dim" style="font-size:var(--z2)">' + esc(x.path || x) + '</span></div>').join('')
        + models.slice(0, 6).map(x => '<div class="row" style="grid-template-columns:1fr">'
            + '<span class="num dim" style="font-size:var(--z2)">' + esc(x.path || x) + '</span></div>').join('')
        + '</div>');
    } catch (e) { diagMsg(false, e.message); }
  };

  /* 本地 llama-server 进程管理：契约取自 webui_server
     /api/llama/start 需要 use_local_llm=true 且 driver=='llama-server' */
  const llsPayload = () => ({
    driver: editorVal('llama_driver') || cfg.llama_driver || 'llama-server',
    model_path: editorVal('llama_model_path') || cfg.llama_model_path || '',
    model_name: editorVal('llama_model_name') || cfg.llama_model_name || '',
    port: Number(editorVal('llama_port') || cfg.llama_port || 8081),
    use_local_llm: true,
  });
  $('cLsStart').onclick = async () => {
    const b = $('cLsStart'); b.disabled = true; const t = b.textContent; b.textContent = '启动中…';
    try {
      const r = await API('/llama/start', { method:'POST', body: JSON.stringify(llsPayload()) });
      diagMsg(!!(r && r.ok), (r && (r.error || r.detail)) || ('已启动 · ' + ((r && r.driver) || 'local')));
    } catch (e) { diagMsg(false, e.message); }
    b.disabled = false; b.textContent = t;
  };
  $('cLsStop').onclick = async () => {
    try { const r = await API('/llama/stop', { method:'POST', body:'{}' });
      diagMsg(!!(r && r.ok), (r && (r.error || r.output)) || '已停止'); }
    catch (e) { diagMsg(false, e.message); }
  };
  $('cLsOpen').onclick = async () => {
    try { const r = await API('/llama/open', { method:'POST',
      body: JSON.stringify({ port: llsPayload().port }) });
      diagMsg(!!(r && r.ok), '已尝试打开 ' + ((r && r.url) || '端口')); }
    catch (e) { diagMsg(false, e.message); }
  };

  $('cLsTest').onclick = async () => {
    const b = $('cLsTest'); b.disabled = true; const t = b.textContent; b.textContent = '测试中…';
    try { const r = await API('/llama/test', { method:'POST', body: JSON.stringify(llsPayload()) });
      diagMsg(!!(r && r.ok), (r && (r.error || r.detail)) || ('本地服务可达 · ' + ((r && r.model) || ''))); }
    catch (e) { diagMsg(false, e.message); }
    b.disabled = false; b.textContent = t;
  };

  /* 生图模型（ComfyUI / 本地图像 llama） */
  $('cImgTest').onclick = async () => {
    const b = $('cImgTest'); b.disabled = true; const t = b.textContent; b.textContent = '测试中…';
    try {
      const r = await API('/imagegen/test', { method:'POST', body: JSON.stringify({
        host: editorVal('comfyui_host') || cfg.comfyui_host || '127.0.0.1',
        port: Number(editorVal('comfyui_port') || cfg.comfyui_port || 8000),
        timeout: Number(editorVal('comfyui_timeout') || cfg.comfyui_timeout || 120) }) });
      diagMsg(!!(r && r.ok), (r && (r.error || r.msg)) || '生图服务连接正常');
    } catch (e) { diagMsg(false, e.message); }
    b.disabled = false; b.textContent = t;
  };
  const imgPayload = () => ({
    driver: editorVal('image_llama_driver') || cfg.image_llama_driver || 'llama-server',
    model_path: editorVal('image_llama_model_path') || cfg.image_llama_model_path || '',
    model_name: editorVal('image_llama_model_name') || cfg.image_llama_model_name || '',
    port: Number(editorVal('image_llama_port') || cfg.image_llama_port || 8082),
    use_local_llm: true,
  });
  $('cImgStart').onclick = async () => {
    const b = $('cImgStart'); b.disabled = true; const t = b.textContent; b.textContent = '启动中…';
    try { const r = await API('/llama/start', { method:'POST', body: JSON.stringify(imgPayload()) });
      diagMsg(!!(r && r.ok), (r && (r.error || r.detail)) || '生图模型已启动'); }
    catch (e) { diagMsg(false, e.message); }
    b.disabled = false; b.textContent = t;
  };
  $('cImgStop').onclick = async () => {
    try { const r = await API('/llama/stop', { method:'POST', body:'{}' });
      diagMsg(!!(r && r.ok), (r && (r.error || r.output)) || '生图模型已停止'); }
    catch (e) { diagMsg(false, e.message); }
  };
  $('cImgOpen').onclick = async () => {
    try { const r = await API('/llama/open', { method:'POST', body: JSON.stringify({
        port: Number(editorVal('image_llama_port') || cfg.image_llama_port || 8082) }) });
      diagMsg(!!(r && r.ok), '已尝试打开 ' + ((r && r.url) || '生图端口')); }
    catch (e) { diagMsg(false, e.message); }
  };

  /* 预览按钮：读当前列表内容弹窗，不走接口 */
  qsa('[data-pv]', el).forEach(b => b.onclick = () => {
    const k = b.dataset.pv;
    /* 预览要能读三种形态（列表字段不再手写 JSON 了）：
       ① 划线列表（.edl，行在 ctx.lists 里）
       ② 每行一条的文本框（data-kind="lines"）
       ③ 未登记字段的 JSON 文本框 / 直接读配置（字段在别的面板 tab 里，DOM 上没有节点）*/
    let arr = [];
    const list = cfCtx.lists[k];
    if (list && list.length) arr = list.map(x => x.text);
    if (!arr.length) {
      const node = document.querySelector('.panel [data-k="' + k + '"]');
      if (node && node.dataset.kind === 'lines') {
        arr = node.value.split('\n').map(x => x.trim()).filter(Boolean);
      } else if (node) {
        try { arr = JSON.parse(node.value); } catch (e) { arr = []; }
      } else {
        const v = cfGet(cfg, k);
        if (Array.isArray(v)) arr = v;
      }
    }
    if (!Array.isArray(arr)) arr = [];
    /* 列表项是 {text, disabled}：预览**只显示文案**，别把对象 JSON 甩给人看 */
    arr = arr.map(x => (typeof x === 'object' && x ? (x.text != null ? String(x.text) : JSON.stringify(x)) : String(x)))
             .filter(s => s.trim());
    openPreview((b.textContent || k) + ' · 预览', arr);
  });
}

/* ── 配置向导：三步接入（提供商 → Key/地址 → 模型 + 测试）──
   旧版有这个入口（`sOpenWizard`，title「三步接入：提供商 → Key → 模型」），
   是首次接入的主路径 —— 迁移时不能丢。 */
function openWizard(providers, curProv, onDone) {
  const ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML = ''
    + '<div class="modal">'
    +   '<div class="modal-t"><h3>接入向导 · 三步完成</h3>'
    +     '<button class="btn sm" id="wzX">关闭</button></div>'
    +   '<div class="fld"><label>步骤 1 · 选择提供商</label>'
    +     '<select id="wzProv">' + providers.map(p => '<option value="' + esc(p.id) + '"'
    +       (String(p.id) === String(curProv) ? ' selected' : '') + '>' + esc(p.name || p.id)
    +       '</option>').join('') + '</select></div>'
    +   '<div class="fld" style="margin-top:var(--s5)"><label>步骤 2 · API Key 与地址</label>'
    +     '<input id="wzKey" type="password" placeholder="sk-…（保存后写入凭据管理器，不落盘明文）">'
    +     '<input id="wzUrl" style="margin-top:var(--s3)" placeholder="API URL（选提供商后自动填充）"></div>'
    +   '<div class="fld" style="margin-top:var(--s5)"><label>步骤 3 · 选择模型并测试</label>'
    +     '<input id="wzModel" placeholder="模型名（如 deepseek-v4-flash）"></div>'
    +   '<div id="wzMsg" style="margin-top:var(--s4)"></div>'
    +   '<div style="display:flex;gap:var(--s3);justify-content:flex-end;margin-top:var(--s5)">'
    +     '<button class="btn" id="wzCancel">稍后再说</button>'
    +     '<button class="btn" id="wzTest">测试连接</button>'
    +     '<button class="btn primary" id="wzSave">测试并保存</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $('wzX').onclick = close;
  $('wzCancel').onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
  const msg = (ok, t) => { $('wzMsg').innerHTML = '<div class="sig ' + (ok ? 'ok' : 'err')
    + '"><i></i>' + esc(t) + '</div>'; };
  const syncUrl = () => {
    const p = providers.find(x => String(x.id) === $('wzProv').value) || {};
    $('wzUrl').value = p.base_url || '';
    if (!msg_dirty) {}
  };
  let msg_dirty = false;
  $('wzProv').onchange = syncUrl;
  syncUrl();
  const payload = () => ({ api_provider: $('wzProv').value, api_url: $('wzUrl').value.trim(),
                           model_name: $('wzModel').value.trim(), api_key: $('wzKey').value });
  const test = async () => {
    const p = payload();
    if (!p.model_name) { msg(false, '请填写模型名'); return false; }
    msg(true, '测试中…');
    try {
      const r = await API('/llm/test', { method:'POST', body: JSON.stringify(p) });
      const ok = !!(r && r.ok);
      msg(ok, ok ? ('连接成功 · ' + (r.model || p.model_name) + ' → '
        + String(r.reply || '').slice(0, 60)) : (r && (r.error || r.msg) || '连接失败'));
      return ok;
    } catch (e) { msg(false, e.message); return false; }
  };
  $('wzTest').onclick = test;
  $('wzSave').onclick = async () => {
    const p = payload();
    if (!p.model_name) { msg(false, '请填写模型名'); return; }
    if (!(await test())) return;
    $('wzSave').disabled = true; $('wzSave').textContent = '保存中…';
    try {
      const patch = { api_provider: p.api_provider, api_url: p.api_url, model_name: p.model_name };
      if (p.api_key) patch.api_key = p.api_key;
      const r = await API('/config', { method:'POST', body: JSON.stringify(patch) });
      if (r && (r.ok === false || r.error)) { msg(false, r.error || '保存失败'); return; }
      await API('/config/reload', { method:'POST', body:'{}' }).catch(() => {});
      msg(true, '已保存并热重载');
      setTimeout(() => { close(); if (onDone) onDone(); }, 700);
    } catch (e) { msg(false, e.message); }
    $('wzSave').disabled = false; $('wzSave').textContent = '测试并保存';
  };
}

/* ── 预览弹窗：撤回反馈/空闲退场那三个"预览"按钮用的 ──
   旧版这几个按钮**完全在前端**：把列表内容读出来弹窗展示，不走任何接口。
   迁移时照做即可（列表在 v4 里是 JSON 文本域，解析后展示）。 */
function openPreview(title, items) {
  const ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML = '<div class="modal"><div class="modal-t"><h3>' + esc(title) + '</h3>'
    + '<button class="btn sm" id="pvX">关闭</button></div>'
    + '<div class="dim" style="font-size:var(--z2);margin-bottom:var(--s4)">共 '
    + items.length + ' 条</div>'
    + '<div class="rows">' + (items.length ? items.map((t, i) =>
        '<div class="row" style="grid-template-columns:40px 1fr"><span class="num dim">'
        + (i + 1) + '</span><span>' + esc(t) + '</span></div>').join('')
      : '<div class="empty">列表为空</div>') + '</div></div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $('pvX').onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
}

/* ═════════════ Bot 页 ═════════════
   GET  /api/bot/status → {data:{bot_running, pid, uptime, qq_path, protocol_enabled}}
   POST /api/bot/start | /api/bot/stop → {success, output}
   注意 start 会因"没填 Bot QQ"这类前置条件失败并给出中文原因，必须原样显示。 */
const upText = (s) => {
  s = Number(s) || 0;
  if (s < 60) return s + ' 秒';
  if (s < 3600) return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  return Math.floor(s / 3600) + ' 时 ' + Math.floor((s % 3600) / 60) + ' 分';
};

async function pageBot(el) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  /* 2026-10-19：进页面先清旧定时器（重进/切页会重复调用本函数） */
  if (window.__botTick) { clearInterval(window.__botTick); window.__botTick = null; }
  if (window.__botSync) { clearInterval(window.__botSync); window.__botSync = null; }
  let r;
  try { r = await API('/bot/status'); }
  catch (e) { el.innerHTML = '<div class="errbox">读取 /api/bot/status 失败：' + esc(e.message) + '</div>'; return; }
  const d = (r && r.data) || {};
  const running = !!d.bot_running;
  /* 参考稿手法：左侧一个**大号数字**当视觉锚点（本次运行时长），右侧一列小注，
     状态行放最下面 —— 比四个黑卡片平铺有层次。 */
  const upNum = running ? upText(d.uptime) : '00:00:00';
  el.innerHTML = ''
    + '<div class="bot-hero">'
    +   '<div class="bh-num' + (running ? '' : ' idle') + '">' + esc(upNum) + '</div>'
    +   '<div class="bh-side">'
    +     '<span>本次运行时长</span>'
    +     '<span>PID ' + esc(fmtRaw(d.pid)) + '</span>'
    +     '<span>' + (running ? '● LIVE' : '○ STOPPED') + '</span>'
    +   '</div>'
    +   '<div class="bh-rule"></div>'
    + '</div>'
    + '<div class="hd"><span class="lab">运行状态</span><i class="rule"></i>'
    +   '<span class="sig ' + (running ? 'live' : '') + '"><i></i>'
    +   (running ? '运行中' : '已停止') + '</span></div>'
    + '<div class="stats">'
    +   '<div class="st"><div class="lab">进程</div><div class="v">' + (running ? '存活' : '未启动')
    +     '</div><div class="c">' + (d.pid ? 'PID ' + esc(fmtRaw(d.pid)) : '—') + '</div></div>'

    +   '<div class="st"><div class="lab">QQ 路径</div><div class="v mono" style="font-size:var(--z2)">'
    +     esc(d.qq_path || '未检测') + '</div><div class="c">客户端位置</div></div>'
    +   '<div class="st"><div class="lab">协议连接</div><div class="v">'
    +     (d.protocol_online ? '在线' : '离线') + '</div><div class="c">'
    +     esc(d.protocol_url || 'OneBot 未响应') + '</div></div>'
    + '</div>'
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">操作</span><i class="rule"></i></div>'
    + '<div style="display:flex;gap:var(--s3);flex-wrap:wrap">'
    +   '<button class="btn primary" id="bStart"' + (running ? ' disabled' : '') + '>启动 Bot</button>'
    +   '<button class="btn" id="bStop"' + (running ? '' : ' disabled') + '>停止 Bot</button>'
    +   '<button class="btn" id="bQqPath">选择 QQ 路径</button>'
    + '</div>'
    + '<div class="kv" style="margin-top:var(--s5);border-top:1px solid var(--line);padding-top:var(--s3)">'
    +   '<span class="k">状态</span><span class="v">' + (running ? '运行中' : '已停止') + '</span>'
    +   '<span class="k">协议层</span><span class="v">' + (d.protocol_online ? '在线' : '离线') + '</span>'
    +   '<span class="k">主进程</span><span class="v">' + (running ? esc(fmtRaw(d.pid)) : '—') + '</span>'
    +   '<span class="k">QQ 路径</span><span class="v">' + esc(d.qq_path || '未检测') + '</span>'
    + '</div>'
    + '<div class="cf-desc" style="margin-top:var(--s2)">'
    +   '启动协议层之前建议先在「协议」页跑一次启动前自检；路径填错时自检会直接指出是哪一项。</div>'
    + '<div id="bOut" style="margin-top:var(--s4)"></div>';

  const say = (ok, t) => { $('bOut').innerHTML = '<div class="sig ' + (ok ? 'ok' : 'err')
    + '"><i></i>' + esc(t) + '</div>'; };
  const go_ = async (which) => {
    const b = $(which === 'start' ? 'bStart' : 'bStop');
    b.disabled = true; const t = b.textContent; b.textContent = '处理中…';
    try {
      const res = await API('/bot/' + which, { method:'POST', body:'{}' });
      say(!!res.success, res.output || (res.success ? '成功' : '失败'));
      if (res.success) later(el, () => pageBot(el), 1200);
      else { b.disabled = false; b.textContent = t; }
    } catch (e) { say(false, e.message); b.disabled = false; b.textContent = t; }
  };
  $('bStart').onclick = () => go_('start');
  $('bStop').onclick = () => go_('stop');
  /* 选 QQ 路径：走 v3 的文件浏览器 + /qq-path（字段名是 qq_path） */
  $('bQqPath').onclick = () => protoFileBrowser('', (fp) => {
    API('/qq-path', { method: 'POST', body: JSON.stringify({ qq_path: fp }) })
      .then((r) => {
        say(!!(r && r.success !== false),
          (r && (r.error || r.qq_path)) || 'QQ 路径已保存');
        if (r && r.success !== false) later(el, () => pageBot(el), 800);
      })
      .catch((e2) => say(false, e2.message));
  });

  /* ── 运行时长计时器（2026-10-19 修「计时不能刷新」）─────────────────
     此前 pageBot 只在进入页面时 get 一次 /api/bot/status，把 uptime 算成
     一个**常量**塞进 innerHTML → 数字永远停在页面加载那一刻（用户报"还是停止的"，
     截图 6 分 57 秒一直不动，而服务端 uptime 早已 7 分 29 秒）。
     现在：① 每 1s 本地递增走字（不发请求）；② 每 10s 与服务端对齐一次，
     顺便感知"Bot 被停掉"并整页重绘（按钮的禁用态也要跟着变）。 */
  if (running) {
    const numEl = el.querySelector('.bh-num');
    let base = Number(d.uptime) || 0;
    let t0 = Date.now();
    window.__botTick = setInterval(() => {
      /* 切页时容器可能仍留在 body 里（只换 innerHTML）→ 用页面特有元素判定 */
      if (!document.body.contains(el) || !el.querySelector('.bh-num')) {
        clearInterval(window.__botTick); window.__botTick = null; return;
      }
      if (numEl) numEl.textContent = upText(base + Math.floor((Date.now() - t0) / 1000));
    }, 1000);
    window.__botSync = setInterval(async () => {
      if (!document.body.contains(el) || !el.querySelector('.bh-num')) {
        clearInterval(window.__botSync); window.__botSync = null; return;
      }
      try {
        const rr = await API('/bot/status');
        const dd = (rr && rr.data) || {};
        if (dd.bot_running) { base = Number(dd.uptime) || 0; t0 = Date.now(); }
        else { pageBot(el); }          // 已停止 → 整页重绘（含按钮态）
      } catch (e) { /* 网络抖动忽略，下次对齐 */ }
    }, 10000);
  }
}

/* ═════════════ Token 页（零图表：只给读数）═════════════
   GET /api/token-stats → {snapshot:{group/private/web:{...}, all:{...},
                            days:[{d,n}], today, d7, m30, total}, recent:[...]}
   ⚠ 两组数的**归属不同**，必须分开渲染（用户截图："token 页空了"）：
     · group/private/web/all = 会话级（进程启动至今），真值在 **bot_core 进程**
       （token_stats.record() 只在那边被调用；webui 侧读自己的内存表恒 0）；
     · today/d7/m30/total/days = 从落盘 jsonl 聚合，跨重启有效。
   以前把 days/today/d7/m30/total 当成"场景"往表里塞 → 五条全 0 的假行。 */
const SCENE_MAP = { group: '群聊', private: '私聊', web: '网页', all: '合计' };
const TK_WINDOW_KEYS = ['today', 'd7', 'm30', 'total'];
const TK_WINDOW_MAP = { today: '今天', d7: '近 7 天', m30: '近 30 天', total: '累计（全部）' };

async function pageTokens(el) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  let r;
  try { r = await API('/token-stats'); }
  catch (e) { el.innerHTML = '<div class="errbox">读取 /api/token-stats 失败：' + esc(e.message) + '</div>'; return; }
  if (r && r.error) { el.innerHTML = '<div class="errbox">' + esc(r.error) + '</div>'; return; }
  const snap = (r && r.snapshot) || {};
  const all = snap.all || {};
  const scenes = Object.keys(snap).filter(k => k !== 'all' && TK_WINDOW_KEYS.indexOf(k) < 0 && k !== 'days');
  const n = (v) => esc(fmt(v || 0));
  const rec = (r && r.recent) || [];
  const fromBot = (r && r.source) === 'bot_core';
  const days = Array.isArray(snap.days) ? snap.days : [];

  el.innerHTML = ''
    + '<div class="hd"><span class="lab">累计用量</span><i class="rule"></i>'
    +   '<span class="dim">' + (fromBot ? '会话级 · 来自 Bot 进程' : '会话级 · Bot 未运行') + '</span></div>'
    + '<div class="stats">'
    +   '<div class="st"><div class="lab">总 Token</div><div class="v mono">' + n(all.total_tokens)
    +     '</div><div class="c">输入 ' + n(all.input_tokens) + ' / 输出 ' + n(all.output_tokens)
    +     '</div></div>'
    +   '<div class="st"><div class="lab">请求数</div><div class="v">' + n(all.requests)
    +     '</div><div class="c">本次运行累计调用</div></div>'
    +   '<div class="st"><div class="lab">缓存命中率</div><div class="v">'
    +     esc(fmtRaw(all.cache_hit_rate != null ? all.cache_hit_rate : 0)) + '%</div>'
    +     '<div class="c">命中 ' + n(all.cache_hit_tokens) + ' / 未命中 '
    +     n(all.cache_miss_tokens) + '</div></div>'
    + '</div>'
    + ((!fromBot && !Number(all.requests))
        ? '<div class="dim" style="margin-bottom:var(--s4);font-size:var(--z2)">'
          + '会话级计数需要 Bot 进程在运行（LLM 调用发生在 Bot 侧）；下面「时间窗 / 按日」来自落盘日志，'
          + '不受重启影响。</div>'
        : '')
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">按场景</span><i class="rule"></i>'
    +   '<span class="dim">本次运行</span></div>'
    + (scenes.length
        ? '<div class="rows"><div class="row head" style="grid-template-columns:90px 80px 1fr 1fr 2fr 90px">'
          + '<span>场景</span><span>请求</span><span>输入</span><span>输出</span>'
          + '<span>合计</span><span>命中率</span></div>'
          + scenes.map(k => {
              const c = snap[k] || {};
              return '<div class="row" style="grid-template-columns:90px 80px 1fr 1fr 2fr 90px">'
                + '<span>' + esc(SCENE_MAP[k] || k) + '</span>'
                + '<span class="num">' + n(c.requests) + '</span>'
                + '<span class="num dim">' + n(c.input_tokens) + '</span>'
                + '<span class="num dim">' + n(c.output_tokens) + '</span>'
                + '<span class="num">' + n(c.total_tokens) + '</span>'
                + '<span class="num dim">' + esc(fmtRaw(c.cache_hit_rate != null ? c.cache_hit_rate : 0))
                +   '%</span></div>';
            }).join('')
          + '</div>'
        : '<div class="empty">还没有用量记录</div>')
    /* ── 时间窗：从落盘日志聚合，**不随重启清零** ── */
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">时间窗</span><i class="rule"></i>'
    +   '<span class="dim">来自落盘日志（跨重启）</span></div>'
    + '<div class="stats">'
    + TK_WINDOW_KEYS.map(k =>
        '<div class="st"><div class="lab">' + esc(TK_WINDOW_MAP[k]) + '</div>'
        + '<div class="v mono">' + n(snap[k]) + '</div><div class="c">tokens</div></div>').join('')
    + '</div>'
    /* ── 按日：最近 14 天（纯读数，不做图表）── */
    + '<div class="hd" style="margin-top:var(--s5)"><span class="lab">按日</span><i class="rule"></i>'
    +   '<span class="dim">最近 ' + days.length + ' 天</span></div>'
    + (days.length
        ? '<div class="rows"><div class="row head" style="grid-template-columns:1fr 140px 90px">'
          + '<span>日期</span><span>tokens</span><span>占累计</span></div>'
          + days.slice().reverse().map(x => {
              const v = Number(x.n) || 0;
              const pct = Number(snap.total) ? (v / Number(snap.total) * 100) : 0;
              return '<div class="row" style="grid-template-columns:1fr 140px 90px">'
                + '<span class="num">' + esc(x.d || '—') + '</span>'
                + '<span class="num">' + esc(fmt(v)) + '</span>'
                + '<span class="num dim">' + esc(pct.toFixed(1)) + '%</span></div>';
            }).join('')
          + '</div>'
        : '<div class="empty">落盘日志里还没有记录</div>')
    + '<div class="hd" style="margin-top:var(--s6)"><span class="lab">最近记录</span><i class="rule"></i>'
    +   '<span class="dim">最多 50 条</span></div>'
    + '<div class="log tv" id="tkLog"></div>';

  $('tkLog').innerHTML = rec.length
    ? rec.slice().reverse().map((x, i) => {
        const isObj = x && typeof x === 'object';
        const scene = isObj ? (SCENE_MAP[x.scene] || x.scene || '—') : '—';
        const tk = isObj ? (x.total_tokens || ((x.input_tokens || 0) + (x.output_tokens || 0))) : '—';
        const hr = isObj && x.cache_hit_rate != null ? x.cache_hit_rate + '%' : '—';
        const ts = isObj ? (x.time || x.ts || '') : '';
        return '<div class="ln"><span class="no">' + (i + 1) + '</span>'
          + '<span class="ts">' + esc(ts) + '</span>'
          + '<span class="lv ok">' + esc(scene) + '</span>'
          + '<span class="tx">' + esc(String(tk)) + ' tokens · 命中 ' + esc(String(hr)) + '</span></div>';
      }).join('')
    : '<div class="empty">暂无记录</div>';
  pvTerminalOnce($('tkLog'));
}

/* ═════════════ 协议页：连接层 ═════════════
   真实接口（契约取自 webui_server.py，非反推）：
     GET  /api/protocol/status → {protocol_running, protocol_driver, drivers[],
                                  api_port, event_port, qq_path, status{},
                                  napcat_config{}/llonebot_config{}/snowluma_config{}, risks{}}
     POST /api/protocol/switch {driver[, confirm]} → {success, output} |
                                  {success:false, need_confirm:true, output}
     POST /api/protocol/start|stop → {success, output}
     POST /api/protocol/check  {driver} → {ok, driver, items:[{key,label,ok,hint}], error}
     POST /api/protocol/logs   {limit}  → {logs:[]}
     POST /api/protocol/logs/clear → {ok}
     POST /api/protocol/auto-detect → {ok, candidates:[{driver,name,exe,found,running,desc}], recommended}
   ⚠️ 两个"小东西"必须保留，否则就是退功能：
      ① 切换驱动的**风控二次确认**（服务端强制，前端必须走完这个流程）
      ② **启动前自检**（逐项 ok/hint，避免启动失败后才发现配置没填） */
/* ══════════════════════════════════════════════════════════════════
   协议页增强（v3 功能 1:1 复现，v4 视觉）

   v3 的 mountProtocol 有 25KB、涵盖三个驱动各自的配置区 + 文件浏览器 +
   自动识别 + 配置向导；v4 第一版只有状态与切换。这里逐项补齐：
     ① 驱动配置卡：按 status.{napcat,llonebot,snowluma}_config 回填，
        POST /protocol/config {driver, config} 保存（字段与 v3 逐字一致）
     ② 文件浏览器：GET /protocol/fs 列目录 → 选文件回填；
        选到 QQ.exe 走 POST /qq-path，选到启动器走 /protocol/config
     ③ 自动识别：POST /protocol/detect → 列出候选 → 应用推荐驱动
     ④ 配置向导：分步卡片式（用户批准），三步：提供商 → Key/地址 → 模型+测试
   ══════════════════════════════════════════════════════════════════ */
const PROTO_META = {

        + '登录态由你主动控制（不会自动拉起 / 反复重扫），是最不容易触发频繁登录的方式。',

/* ① 驱动配置卡 HTML */
function protoCfgHTML(drv, cfg, st) {
  const m = PROTO_META[drv] || {};
  const v = (k) => esc(cfg && cfg[k] != null ? String(cfg[k]) : '');
  const ro = st || {};
  const inp = (key, ph) => '<div class="pd-in"><input data-pk="' + esc(drv + '.' + key)
    + '" value="' + v(key) + '" placeholder="' + esc(ph || '') + '" spellcheck="false"></div>';
  const acts = (key, kind) => '<div class="pd-act">'
    + '<button class="btn sm" data-pbrowse="' + esc(drv + '.' + key) + '">浏览</button>'

      + (wu ? '<button class="btn sm" data-copy="' + esc(wu) + '">复制</button>'
             + '<button class="btn sm" data-open="' + esc(wu) + '">打开</button>' : '')
      + '</div><div class="pd-act"></div></div>';

      + '<div class="pd-ro"><code>' + (tk ? esc(tk) : '<span class="none">未探测到</span>') + '</code>'
