/* 仪表盘：只读真实 /api/status，按字段铺成读数。**不做任何图表。** */
/* ══════════════════════════════════════════════════════════════════
   版面重排工具：渲染后**移动 DOM 节点**。
   为什么不在 innerHTML 里调字符串顺序：那些块是跨 6KB 拼接的大字符串，
   搬错一个引号就会让整页脚本语法崩（试过，很难定位）。移动节点只改顺序、
   不改结构，出错面也只有"顺序没生效"。
   用法：reorder(host, ['#a', '#b', '#c']) —— 按给定顺序排列顶层子节点。
   每页按**自己的信息结构**排（状态 → 操作 → 细节），不是套同一张模板。
   ══════════════════════════════════════════════════════════════════ */
function reorderByBlocks(host, titles) {
  if (!host || !titles || titles.length < 2) return;
  const all = Array.from(host.children);
  /* v4 的区块是「标题 + 内容」**兄弟拼接**的（'+ <div class="hd">…</div>' + <div class="fld">…</div> '），
     所以必须按"标题开启一组、其后兄弟归入该组"来切分，才不会把内容与标题拆散
     （直接移动内容节点 → 标题留在原地；直接 appendChild 列出的节点 → 全被甩到末尾。
      两种都实测踩过。）*/
  const groups = [];
  let cur = null;
  all.forEach(n => {
    const isHd = n.classList && n.classList.contains('hd');
    if (isHd || !cur) { cur = { hd: isHd ? n : null, items: [n] }; groups.push(cur); }
    else cur.items.push(n);
  });
  const label = (g) => {
    const el = g.hd || g.items[0];
    const l = el.querySelector ? el.querySelector('.lab') : null;
    return l ? l.textContent.trim() : '';
  };
  const used = new Set();
  const picked = [];
  titles.forEach(t => {
    for (const g of groups) {
      if (used.has(g)) continue;
      const lb = label(g);
      if (lb && (lb === t || lb.indexOf(t) >= 0 || t.indexOf(lb) >= 0)) {
        used.add(g); picked.push(g); break;
      }
    }
  });
  if (picked.length < 2) return;
  const rest = groups.filter(g => !used.has(g));
  picked.concat(rest).forEach(g => g.items.forEach(n => host.appendChild(n)));
}

/* ══════════════════════════════════════════════════════════════════
   输入模态 pvPrompt(title, def) → Promise<string|null>
   ★ Electron 不支持 window.prompt()（抛 "prompt() is and will not be
     supported."）—— 表情包的导入目录/URL 导入在桌面壳里点了没反应（实测）。
     confirm()/alert() 可用所以保留；只有 prompt 必须换掉。
   ══════════════════════════════════════════════════════════════════ */
function pvPrompt(title, def) {
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.className = 'fb-mask';
    mask.style.zIndex = '70';
    mask.innerHTML = '<div class="fb" role="dialog" aria-label="' + esc(title) + '" style="width:min(460px,92vw)">'
      + '<div class="fb-hd"><b>' + esc(title) + '</b>'
      + '<button class="btn sm" data-pp="x">取消</button></div>'
      + '<div style="padding:var(--s5)"><input class="ff-in" id="ppIn" style="width:100%;text-align:left" /></div>'
      + '<div class="wz-ft" style="padding:0 var(--s5) var(--s5)">'
      + '<button class="btn primary" data-pp="ok">确定</button></div></div>';
    document.body.appendChild(mask);
    const inp = mask.querySelector('#ppIn');
    inp.value = def || '';
    const close = (val) => { mask.remove(); resolve(val); };
    mask.querySelector('[data-pp="ok"]').onclick = () => close(inp.value);
    mask.querySelector('[data-pp="x"]').onclick = () => close(null);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(null); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') close(inp.value);
      if (e.key === 'Escape') close(null);
    });
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

/* ══════════════════════════════════════════════════════════════════
   确认模态 pvConfirm(title, detail) → Promise<boolean>
   ★ 换掉系统 confirm()：Electron 里原生弹窗是浏览器层的灰框，与 v4 的
     解构主义设计语言完全脱节（用户要求"确认也要应用内"）。与 pvPrompt
     同一套 .fb-mask / .fb 结构，视觉一致。
   用法：if (!await pvConfirm('删除「x」？', '不可恢复')) return;
   ══════════════════════════════════════════════════════════════════ */
function pvConfirm(title, detail, okText) {
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.className = 'fb-mask';
    mask.style.zIndex = '72';
    mask.innerHTML = '<div class="fb" role="dialog" aria-label="' + esc(title) + '" style="width:min(420px,92vw)">'
      + '<div class="fb-hd"><b>' + esc(title) + '</b></div>'
      + (detail ? '<div style="padding:var(--s5);color:var(--ink3);font-size:var(--z3);line-height:1.7">'
                  + esc(detail) + '</div>' : '')
      + '<div class="wz-ft" style="padding:0 var(--s5) var(--s5)">'
      + '<button class="btn sm" data-pc="no">取消</button>'
      + '<button class="btn primary" data-pc="yes">' + esc(okText || '确定') + '</button></div></div>';
    document.body.appendChild(mask);
    const close = (v) => { mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(false); };
    mask.querySelector('[data-pc="yes"]').onclick = () => close(true);
    mask.querySelector('[data-pc="no"]').onclick = () => close(false);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(false); });
    document.addEventListener('keydown', onKey);
    setTimeout(() => { const b = mask.querySelector('[data-pc="yes"]'); if (b) b.focus(); }, 30);
  });
}

/* ── 未配置模型的引导横幅（配置页与仪表盘共用，2026-10-24）────────────
   判据不能看字段空不空 —— api_provider / model_name 都有默认值。
   真正的门槛是**有没有可用的 Key**：
     全局 Key（api_key）· 当前提供商的独立 Key（has_api_key）· 或本来就用本地模型。
   两处共用同一个判据函数，避免"配置页说没配好、仪表盘说配好了"这种自相矛盾。
   检查结果按会话缓存（_SETUP_STATE），两个页面来回切不用反复拉配置。 */
const _SETUP_STATE = { checked: false, ready: false };
function setupDismissed() {
  try { return localStorage.getItem('cfg-setup-dismissed') === '1'; } catch (e) { return false; }
}
async function setupReady(force) {
  if (_SETUP_STATE.checked && !force) return _SETUP_STATE.ready;
  let cfg = {}, providers = [];
  try {
    const r = await API('/config');
    cfg = (r && r.config) ? r.config : (r || {});
    providers = cfg.providers || [];
  } catch (e) {
    /* 读不到配置时不要下结论（否则后端没起会一直挂横幅）*/
    return true;
  }
  let cat = null;
  try { cat = await API('/providers/catalog'); } catch (e) { cat = null; }
  const provId = (cat && cat.api_provider) || cfg.api_provider || '';
  const cur = (providers.find(p => String(p.id) === String(provId)) || {});
  _SETUP_STATE.ready = !!(cfg.api_key || cur.has_api_key || cfg.use_local_llm);
  _SETUP_STATE.checked = true;
  return _SETUP_STATE.ready;
}
/* 画一条引导横幅。host = 容器元素；onGo = 点「开始配置」后的动作 */
function setupBanner(host, opts) {
  if (!host) return;
  const o = opts || {};
  host.innerHTML = '<div class="setup-bn">'
    + '<div class="setup-bn-l"><b>' + esc(o.title || '还没有配置模型') + '</b>'
    + '<span>' + esc(o.text
        || 'Bot 能连上 QQ，但收到消息不会回话 —— 三步就能跑通：选提供商 → 填 Key → 选模型。')
    + '</span></div>'
    + '<div class="setup-bn-r">'
    + '<button class="btn primary" data-setup-go>' + esc(o.goText || '开始配置') + '</button>'
    + '<button class="btn sm" data-setup-skip>我自己配</button></div></div>';
  host.hidden = false;
  const goBtn = host.querySelector('[data-setup-go]');
  if (goBtn) goBtn.onclick = () => {
    if (o.onGo) { o.onGo(); return; }
    const pi = PAGES.findIndex(p => p.id === 'settings');
    if (pi >= 0) go(pi);
  };
  const skip = host.querySelector('[data-setup-skip]');
  if (skip) skip.onclick = () => {
    try { localStorage.setItem('cfg-setup-dismissed', '1'); } catch (e) {}
    host.hidden = true;
    host.innerHTML = '';
  };
}

async function pageDashboard(el) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  let s;
  try { s = await API('/status'); } catch (e) {
    el.innerHTML = '<div class="errbox">读取 /api/status 失败：' + esc(e.message)
      + '<br>（后端未启动时属正常）</div>';
    return;
  }
  const d = (s && (s.data || s)) || {};
  /* ★ 真实后端 /api/status 的字段是 data.{bot_running,bot_uptime,messages_total,
     groups_active,llm_status,llm_model,...}（全小写蛇形）—— 之前 keys 白名单
     与卡片读取用的都是另一套名字，导致整个面板显示"无可读字段"（用户截图）。*/
  const running = !!(d.running ?? d.bot_running ?? (d.bot && d.bot.status === 'running'));
  const upSec = Number(d.bot_uptime ?? (d.bot && d.bot.uptime) ?? d.uptime ?? 0);
  const d2 = Object.assign({}, d, {
    uptime: upSec,
    uptime_text: upSec ? upText(upSec) : '',
    driver: d.driver || d.protocol_driver_label || d.protocol_driver || '',
    model: d.llm_model || d.model || '',
    groups: d.groups_active ?? d.groups ?? '',
    messages_today: d.messages_total ?? d.messages_today ?? 0,
  });
  const keys = ['qq','nickname','protocol','driver','groups','friends','uptime','uptime_text',
                'model','api_url','temperature','messages_today','memories','plugins',
                'bot_running','bot_uptime','messages_total','groups_active','images_generated',
                'memes_sent','plugin_count','plugin_active','llm_status','llm_model',
                'memory_total','session_count'];
  const rows = keys.filter(k => d2[k] !== undefined && d2[k] !== null && typeof d2[k] !== 'object');
  /* 引导横幅：入口页就是仪表盘，用户第一次打开看到的就是这里 —— 只在这里放
     "没配模型"的提示，比让他自己摸到配置中心更直接（配置中心那一份仍在，
     两处共用同一判据与同一个"我自己配"开关）。 */
  const needSetup = !setupDismissed() && !(await setupReady());
  el.innerHTML = ''
    + '<div id="dbSetup" hidden></div>'
    + '<div class="hd"><span class="lab">运行状态</span><i class="rule"></i></div>'
    + '<div class="stats">'
    +   '<div class="st"><div class="lab">Bot</div><div class="v">' + (running ? '运行中' : '已停止')
    +     '</div><div class="c">' + (running ? '正在监听消息' : '未启动') + '</div>'
    /* M6 收束态：未运行时用**方块阶梯**（末段那套），而不是光秃秃一个"已停止" */
    +   (running ? '' : '<i class="stair"><i></i><i></i><i></i><i></i></i>')
    +   '</div>'
    +   '<div class="st"><div class="lab">协议驱动</div><div class="v mono">'
    +     esc(d.driver || d.protocol_driver_label || d.protocol_driver
          || d.protocol_type || '—') + '</div><div class="c">连接层</div></div>'
    +   '<div class="st"><div class="lab">已用时长</div><div class="v mono">'
    +     esc(d2.uptime_text || '—') + '</div><div class="c">本次运行</div></div>'
    +   '<div class="st"><div class="lab">模型</div><div class="v mono">'
    +     esc(d2.model || '—') + '</div><div class="c">当前对话模型</div></div>'
    + '</div>'
    + '<div class="hd"><span class="lab">状态字段（原始）</span><i class="rule"></i></div>'
    + (rows.length
        ? '<dl class="kv">' + rows.map(k =>
            '<dt>' + esc(k) + '</dt><dd>' + esc(fmtRaw(d2[k])) + '</dd>').join('') + '</dl>'
        : '<div class="empty">/api/status 未返回可读的标量字段；下面是完整响应：</div>'
          + '<pre class="log">' + esc(JSON.stringify(s, null, 2).slice(0, 4000)) + '</pre>');
  /* M2 信号硬切：读数真的变化时才闪一下 */
  try { pvSignalBlip(el); } catch (e) {}
  if (needSetup) {
    setupBanner($('dbSetup'), {
      title: '还没有配置模型',
      text: 'Bot 连得上 QQ，但收到消息不会回话。三步跑通：选提供商 → 填 Key → 选模型。',
      goText: '去配置',
      onGo: () => {
        const pi = PAGES.findIndex(p => p.id === 'settings');
        if (pi >= 0) go(pi);
      },
    });
  }
}

/* 插件：真实 /api/plugins + /api/plugins/toggle */
async function pagePlugins(el) {
  el.innerHTML = '<div class="empty">读取中…</div>';
  let r;
  try { r = await API('/plugins'); } catch (e) {
    el.innerHTML = '<div class="errbox">读取 /api/plugins 失败：' + esc(e.message) + '</div>';
    return;
  }
  const list = (r && (r.plugins || r.items)) || [];
  if (!list.length) { el.innerHTML = '<div class="empty">没有插件</div>'; return; }
  const on = list.filter(p => p.enabled !== false && p.已启用 !== false).length;
  /* 网格陈列：每张卡顶部一个 1:1 插图位。
     后端目前没有插图字段（PLUGIN_META 里没有 image/icon），所以这里留的是
     **空位**：斜纹底 + 插件名首字母 + 右下角「1:1」角标。空位要让人看出是
     "留给插图的位置"，就不能是纯空白 —— 纯空白会被当成图片加载失败。 */
  const card = (p, i) => {
    /* 1.5.10：插件统一显示中文名（display_name）；id 仍用英文原名走接口 */
    const id = p.id || p.name || ('#' + i);
    const name = p.display_name || p.name || id;
    const en = p.enabled !== false && p.已启用 !== false;
    const desc = String(p.description || '').trim();
    const tags = Array.isArray(p.tags) ? p.tags.slice(0, 4) : [];
    const art = String(p.image || p.icon || p.art || '').trim();
    /* 首字母：取名字里第一个字母/汉字（跳过下划线与点）*/
    const ch = (String(name).replace(/^[_.]+/, '').match(/[A-Za-z\u4e00-\u9fa5]/) || ['?'])[0];
    return '<div class="plg' + (en ? '' : ' off') + '">'
      + '<div class="plg-art">'
      +   (art
          ? '<img src="' + esc(art) + '" alt="" style="width:100%;height:100%;object-fit:cover">'
          : '<span class="ch">' + esc(ch.toUpperCase()) + '</span>')
      +   '<i class="dot" title="' + (en ? '已启用' : '已停用') + '"></i>'
      +   '<span class="rt">1:1</span>'
      + '</div>'
      + '<div class="plg-b">'
      +   '<div class="plg-n"><b>' + esc(name) + '</b>'
      +     (p.version ? '<em>' + esc(p.version) + '</em>' : '') + '</div>'
      +   '<div class="plg-d" title="' + esc(desc || '') + '">'
      +     esc(desc || '（该插件没写简介）') + '</div>'
      +   (tags.length ? '<div class="plg-tg">' + tags.map(t =>
            '<span>' + esc(t) + '</span>').join('') + '</div>' : '')
      +   '<div class="plg-f">'
      +     '<span class="sig ' + (en ? 'ok' : '') + '"><i></i>' + (en ? '启用' : '停用') + '</span>'
      +     '<button class="btn sm" data-ui="' + esc(id) + '">打开</button>'
      +     '<button class="btn sm" data-tg="' + esc(id) + '" data-en="' + (en ? '1' : '0') + '">'
      +       (en ? '停用' : '启用') + '</button>'
      +   '</div>'
      + '</div></div>';
  };
  el.innerHTML = ''
    + '<div class="hd"><span class="lab">插件 ' + list.length + ' 个 · 启用 ' + on + '</span>'
    +   '<i class="rule"></i><span class="dim">每格上方是插件插图位（1:1）</span></div>'
    + '<div class="plg-grid">' + list.map(card).join('') + '</div>';
  /* ★ 打开插件 UI = iframe 加载 /page?plugin_id=（v3 的 mountPluginPage 就是这样，
     后端没有 open_ui 这种 action）。覆盖层 + 关闭按钮。*/
  qsa('[data-ui]', el).forEach(b => b.onclick = () => {
    const pid = b.dataset.ui;
    const ov = document.createElement('div');
    ov.className = 'fb-mask';
    ov.style.zIndex = '70';
    ov.innerHTML = '<div class="fb" style="width:min(1080px,96vw)">'
      + '<div class="fb-hd"><b>插件 UI · ' + esc(pid) + '</b>'
      + '<button class="btn sm" data-pc>关闭</button></div>'
      + '<iframe src="/page?plugin_id=' + encodeURIComponent(pid) + '"'
      + ' style="width:100%;height:72vh;border:0;background:var(--bg)"></iframe></div>';
    document.body.appendChild(ov);
    ov.querySelector('[data-pc]').onclick = () => ov.remove();
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  });
  qsa('[data-tg]', el).forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    try {
      await API('/plugins/toggle', { method:'POST',
        body: JSON.stringify({ name: b.dataset.tg, enabled: b.dataset.en !== '1' }) });
      await pagePlugins(el);
    } catch (e) { b.disabled = false; b.textContent = '失败'; b.title = e.message; }
  });
}

/* Agent：真实 /api/agent/* */
let agentMsgs = [];
/* ══════════════════════════════════════════════════════════════════
   Agent 页：会话列表 + 流式执行 + 轨迹回放 + 从某步重跑
   v3 有、v4 第一版缺的（它只有一次性 /agent/chat）：
     · 流式执行  GET  /agent/stream?session_id=  （NDJSON，每行一个事件）
     · 会话列表  GET  /agent/sessions；切换 / 新建
     · 轨迹回放  POST /agent/history {session_id, limit} —— **真回放**，不是重跑模型
     · 从某步重跑 POST /agent/rerun {session_id, from_step}
   ══════════════════════════════════════════════════════════════════ */
/* seenAt：用户"看见"到哪一条（回到底部时刷新）—— 圆钮上的未读计数以它为基准 */
const AG_S = { sid: '', list: [], busy: false, ctl: null, events: [], procOpen: true, seenAt: 0 };

function agEventText(ev) {
  const p = (ev && ev.payload) || {};
  if (typeof p === 'string') return p;
  /* ★ error / blocked 必须排在最前面：工具失败时 payload 里只有 error 字段，
     此前这些键**一个都不匹配** → 返回空 → drawChat 跳过 → **失败被静默吞掉**
     （用户："agent失败没有报错啊"，实测 tool_result ok=false 带
     AttributeError 却完全不显示）。 */
  const failed = p.ok === false || !!p.error || !!p.blocked;
  const main = p.text || p.content || p.message || p.delta || p.answer;
  if (failed) {
    /* 措辞：有 tool 名 → "调用 X 失败：原因"；无 tool 名（如顶层 error 事件）→ 直接"失败：原因"。
       blocked 的语义已在 why 里说清（如"本轮未提供该工具"），不再重复附 blocked=xxx。 */
    const why = p.error || (p.blocked === 'not_offered' ? '本轮未提供该工具'
              : p.blocked === 'denied' ? '执行被拒（用户未授权）'
              : (p.blocked || p.message || '执行被拒'));
    return (p.tool ? '调用 ' + p.tool + ' 失败：' : '失败：') + why;
  }
  return main || p.step || p.name || p.tool || ''
    || (p.usage ? ('usage ' + JSON.stringify(p.usage)) : '')
    || (Object.keys(p).length ? JSON.stringify(p).slice(0, 400) : '');
}
function agEventKind(ev) {
  const t = String((ev && ev.type) || '');
  const p = (ev && ev.payload) || {};
  const p_ok = p.ok;
  if (t === 'user_msg' || t === 'user') return 'me';
  if (t === 'bot_msg' || t === 'reply' || t === 'answer' || t === 'final') return 'bot';
  if (t === 'error') return 'err';
  /* 工具执行失败 ≠ 工具调用：单独一档，红色显示，不再被当成普通轨迹 */
  if (t === 'tool_result' && (p_ok === false || !!(p && (p.error || p.blocked)))) return 'err';
  /* 模型思维链（agent_loop 的 EV_THINKING）：单独一档，弱化显示 */
  if (t === 'thinking') return 'think';
  /* 权限询问（插件没启用 → 后端阻塞等待授权）：单独一档，要显眼 */
  if (t === 'permission_request') return 'perm';
  /* 插件创作请求（agent 造了新插件待主人审批）：单独一档 */
  if (t === 'forge_request') return 'forge';
  return 'sys';
}

    if (total <= view + 4) { vp.style.display = 'none'; return; }
    vp.style.display = '';

  }
  /* ── 过程消息渲染（用户参考形态：过程收进折叠区、工具=紧凑单行、思考=实时流出） ──
     分组规则：连续的 thinking / tool_call / tool_result / sys / aborted 事件
     合并进一个「过程消息」块；user 消息、最终答复、顶层 error、授权询问
     各自独立成泡（块在遇到它们时封口）。工具行按 id 回填状态（…→✓/✗）。 */
  const AG_TOOL_ZH = {
    run_command:'运行命令', fs_read:'读取', fs_write:'写入', fs_edit:'修改', fs_list:'浏览目录',
    /* harness 工作型工具（2026-10-12：原来只有写死的英文名，用户看着像一串代码）*/
    ws_read:'读取文件', ws_glob:'查找文件', ws_grep:'搜索内容', ws_write:'写入文件',

    bash:'执行命令', shell:'执行命令',
    search_web:'搜索网页', search_files:'搜索文件', plugin_list:'查询插件', plugin_call:'调用插件',
    sandglass_search:'检索记忆', sandglass_recent:'回顾记忆', generate_image:'生成图片',

    get_group_members:'查群成员', send_user_file:'发送文件', skill__load:'加载技能', skill__read:'读技能',
    plugin_forge:'创作插件', plugin_forge_status:'查创作记录',
  };
  function agToolLabel(name) {
    name = String(name || '');
    if (AG_TOOL_ZH[name]) return AG_TOOL_ZH[name];
    if (name.indexOf('mcp__') === 0) { const s = name.split('__'); return 'MCP · ' + (s[1] || '') + '.' + (s[2] || ''); }
    if (name.indexOf('skill__') === 0) return '技能 · ' + name.slice(7);

  }
  function agToolTarget(args) {
    if (!args || typeof args !== 'object') return '';
    const keys = ['command','cmd','path','file','url','query','q','keyword','text','code','plugin','action','name','pattern'];
    for (const k of keys) {
      const v = args[k];
      if (typeof v === 'string' && v.trim()) return v.trim().slice(0, 70);
    }
    try { return JSON.stringify(args).slice(0, 70); } catch (e) { return ''; }
  }
  const drawChat = (opts) => {
    const out = [];
    let proc = null;                       // {lines:[], slots:{id→lineIdx}, nTool}
    const flush = () => {
      if (!proc) return;
      if (proc.lines.length) {
        out.push('<div class="proc' + (AG_S.procOpen ? '' : ' closed') + '">'
          + '<div class="proc-hd" data-proc-toggle><i class="tw">▾</i>过程消息'

      }

    };
    const ensureProc = () => { if (!proc) proc = { lines: [], slots: {}, nTool: 0 }; return proc; };
    const bubble = (ev, i, k, tx, whoTxt, cls) => {

      const editable = seq !== null && (k === 'me' || k === 'bot');

        + '<div class="who">' + whoTxt + '</div>'
        + '<div class="txw"><div class="tx">' + esc(tx) + '</div>' + ops + '</div></div>';
    };
    AG_S.events.forEach((ev, i) => {
      const t = String((ev && ev.type) || '');
      const k = agEventKind(ev), p = (ev && ev.payload) || {};
      const tx = agEventText(ev);
      /* done 是总线内部的收尾标记（ok/steps/elapsed），信息与 final 泡完全
         重复 → 不渲染（用户截图：过程块里躺着一坨 {"ok":true,"steps":1…}）。 */
      if (t === 'done') return;

      }

          + '<span class="nm">' + esc(agToolLabel(p.tool)) + '</span>'
          + '<span class="tg">' + esc(tg) + '</span><span class="st"></span></div>');
        if (p.id) pr.slots[String(p.id)] = idx;

      }
      if (t === 'tool_result') {

        const failed = p.ok === false || !!p.error || !!p.blocked;

        const tip = esc(String(p.summary || p.error || '').slice(0, 300));
        let idx = (p.id != null && pr.slots[String(p.id)] != null) ? pr.slots[String(p.id)] : -1;

        const tg = (pr.targets && pr.targets[idx]) || agToolTarget(p.args) || String(p.tool || '');
        const row = '<div class="p-tool' + (failed ? ' bad' : '') + '"><i class="ic">◈</i>'
          + '<span class="nm">' + esc(agToolLabel(p.tool)) + '</span>'
          + '<span class="tg" title="' + tip + '">' + esc(tg) + '</span>'
          + '<span class="st">' + stTxt + '</span></div>';
        if (idx >= 0) pr.lines[idx] = row; else pr.lines.push(row);
        return;
      }

        out.push(bubble(ev, i, k, tx, k === 'me' ? '你' : '本体', k === 'me' ? ' me' : ''));
        return;
      }
      if (k === 'err' && t !== 'tool_result') {   /* 顶层 error → 独立红泡（过程内失败已在块内标 ✗） */
        flush();
        out.push(bubble(ev, i, k, tx, '失败', ' err'));
        return;
      }
      if (k === 'perm') {
        flush();
        out.push('<div class="msg perm"><div class="who">授权</div>'
          + '<div class="txw"><div class="tx">' + esc(tx) + '</div></div></div>');
        return;
      }
      /* sys / aborted / 其它杂项 → 过程块内的小字行 */
      ensureProc().lines.push('<div class="p-sys">' + esc(tx) + '</div>');
    });
    flush();
    /* ★ 重绘入口走 chatBox.rewrite（不是直接 chat.innerHTML）：
       ① 之前就贴在底部 → 跟着新内容滚到底（正常聊天体验）；
       ② 用户翻上去看历史 → **位置原地不动**，只在圆钮上累计未读条数。
       直接写 innerHTML + 无条件 scrollTop=scrollHeight 会把用户拽到底部。 */
    chatBox.rewrite(out.join('') || '<div class="empty">还没有对话。发一条，或从左侧回放历史会话。</div>');
    qsa('[data-proc-toggle]', chat).forEach(h => h.onclick = () => {
      AG_S.procOpen = !AG_S.procOpen; drawChat();
    });

    if (opts && opts.toBottom) chatBox.toBottom(false);     /* 切换会话/自己发消息 → 强制到底 */
    if (chatBox.stick) { chatBox.unseen = 0; AG_S.seenAt = AG_S.events.length; }
    else {
      chatBox.unseen = Math.max(0, AG_S.events.length - (AG_S.seenAt || 0));
      chatBox.sync();
    }
    renderRail();
  };
  const setBusy = (b) => {
    AG_S.busy = b;
    $('agSend').disabled = b; $('agStop').disabled = !b;
    sayHint(b ? '执行中…' : (AG_S.sid ? ('流式已连接 · ' + AG_S.sid.slice(0, 8)) : '流式已连接'));
  };
  const sidTag = () => { $('agSid').textContent = AG_S.sid ? ('SID ' + AG_S.sid.slice(0, 8)) : ''; };

  /* ① 会话列表：主区（活跃会话）+ 底部"已归档"折叠区；每项悬停出 归档/删除。
     两个修复（2026-10-29）：标题用后端 title（第一句用户话，以前只有裸 sid 前 8 位）；
     时间改成 MM-DD HH:MM —— 以前 fmtRaw 打印的是 epoch 秒数字或空行，等于没有时间列。 */
  function agFmtTs(v) {
    const n = Number(v);
    if (!n || !(n > 0) || !isFinite(n)) return '';
    const d = new Date(n * 1000);
    const p = (x) => String(x).padStart(2, '0');
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function agSessRow(s, on) {
    const id = s.session_id || s.id || '';
    const t = String(s.title || s.last_message || '');
    const name = t ? t.slice(0, 18) : ('会话 ' + id.slice(0, 8));
    return '<div class="it' + (on ? ' on' : '') + '" data-sid="' + esc(id) + '" title="' + esc(t) + '">'
      + '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(name) + '</div>'
      + '<div class="dim" style="font-size:9px">' + esc(agFmtTs(s.updated_at || s.created_at)) + '</div>'
      + '<span class="it-ops">'
      + (s.archived
          ? '<button class="lnk" data-unarc="' + esc(id) + '">恢复</button>'
          : '<button class="lnk" data-arc="' + esc(id) + '">归档</button>')
      + '<button class="lnk" data-del="' + esc(id) + '">删除</button>'
      + '</span></div>';
  }
  async function loadSessions() {
    try {
      const r = await API('/agent/sessions');
      AG_S.list = (r && (r.sessions || r.items)) || [];
    } catch (e) { AG_S.list = []; }
    const host = $('agSess');
    if (!AG_S.list.length) { host.innerHTML = '<div class="empty">还没有历史会话</div>'; return; }
    const act = AG_S.list.filter(s => !s.archived);
    const arc = AG_S.list.filter(s => s.archived);
    let html = act.map(s => agSessRow(s, s.session_id === AG_S.sid)).join('');
    if (arc.length) {
      html += '<details class="ag-arc"' + (AG_S.arcOpen ? ' open' : '') + '>'
        + '<summary>已归档（' + arc.length + '）</summary>'
        + arc.map(s => agSessRow(s, s.session_id === AG_S.sid)).join('')
        + '</details>';
    }
    host.innerHTML = html;
    qsa('[data-sid]', host).forEach(it => it.onclick = (e) => {
      if (e.target.closest('.it-ops')) return;   /* 点的是条目上的操作按钮 */
      AG_S.sid = it.dataset.sid;
      sidTag(); loadSessions(); replay();
    });
    const actArchive = async (sid, archived) => {
      try { await API('/agent/archive',
        { method: 'POST', body: JSON.stringify({ session_id: sid, archived: archived }) }); }
      catch (e) { sayHint('归档操作失败：' + e.message); return; }
      sayHint(archived ? '已归档（可随时恢复）' : '已恢复到主列表');
      loadSessions();
    };
    qsa('[data-arc]', host).forEach(b => b.onclick =
      (e) => { e.stopPropagation(); actArchive(b.dataset.arc, true); });
    qsa('[data-unarc]', host).forEach(b => b.onclick =
      (e) => { e.stopPropagation(); actArchive(b.dataset.unarc, false); });
    qsa('[data-del]', host).forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      const sid = b.dataset.del;
      /* 归档可恢复、删除不可恢复 → 两道确认文案把差别讲清楚 */
      if (!await pvConfirm('删除该会话？', '会话日志将被删除、恢复不了。想收起请用「归档」。', '删除')) return;
      try { await API('/agent/delete',
        { method: 'POST', body: JSON.stringify({ session_id: sid }) }); }
      catch (e2) { sayHint('删除失败：' + e2.message); return; }
      if (AG_S.sid === sid) { AG_S.sid = ''; AG_S.events = []; sidTag(); drawChat({ toBottom: true }); }
      sayHint('已删除该会话');
      loadSessions();
    });
    const d = host.querySelector('details.ag-arc');
    if (d) d.addEventListener('toggle', () => { AG_S.arcOpen = d.open; });
  }
  /* ② 轨迹回放（真回放：读历史，不重新请求模型） */
  async function replay() {
    if (!AG_S.sid) { AG_S.events = []; drawChat(); return; }
    sayHint('正在回放…');
    try {
      const r = await API('/agent/history', {
        method: 'POST', body: JSON.stringify({ session_id: AG_S.sid, limit: 200 }) });
      const tr = (r && (r.trace || r.events)) || [];
      AG_S.events = tr.length ? tr.slice()
        : [{ type: 'sys', payload: '（这个会话没有可回放的记录）' }];
      drawChat({ toBottom: true }); sayHint('已回放 ' + tr.length + ' 条事件');
    } catch (e) {
      AG_S.events = [{ type: 'error', payload: '回放失败：' + e.message }];
      drawChat(); sayHint('回放失败');
    }
  }
  /* ★ 权限询问弹窗（"真 agent"的权限确认）
     插件没启用时，后端的 plugin_call 会**阻塞等待授权**（默认 180s）。
     我们收到 permission_request 就弹应用内对话框，主人点「允许并继续」后：
       后端 → 打开该插件 → 继续执行原来的动作。拒绝则任务终止。
     复用项目既有的 .modal-ov/.modal 样式，不弹系统框。 */
  const _askedReq = {};
  function askPermission(req) {
    const rid = (req && req.request_id) || '';
    if (!rid || _askedReq[rid]) return;
    _askedReq[rid] = true;
    const plugin = (req && req.plugin) || '';
    const action = (req && req.action) || '';
    /* ★ 人话优先：先讲"要干什么"，再给细节。
       旧版直接把后端英文 message 糊一脸（用户原话："至少翻译一下是要干什么吧，
       给一串代码和一个点不动的勾，没有取消，确认也无法使用"）。 */
    const plan = (req && req.plan) || (plugin && action ? ('打开插件「' + plugin + '」→ 执行 ' + action) : '');
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = '<div class="modal" style="max-width:560px">'
      + '<div class="modal-t"><h3>本体想用一个没打开的插件</h3></div>'
      + '<div style="font-size:var(--z3);line-height:1.9;margin-bottom:var(--s4)">'
      +   '<div style="color:var(--ink)">要干什么：'
      +     esc(plan || (req && req.message) || '本体请求一个额外权限')
      +   '</div>'
      +   (plugin ? '<div class="dim" style="margin-top:var(--s2);font-size:var(--z2)">插件：' + esc(plugin)
      +        + (action ? ' · 动作 ' + esc(action) : '') + '</div>' : '')
      +   ((req && req.desc) ? '<div class="dim" style="margin-top:var(--s2);font-size:var(--z2)">它是干嘛的：' + esc(req.desc) + '</div>' : '')
      +   '<div class="dim" style="margin-top:var(--s2);font-size:var(--z2)">允许 = 打开这个插件并接着干活；拒绝 = 当场结束这轮任务（不会重试）。</div>'
      +   ((req && req.timeout) ? '<div class="dim" style="margin-top:var(--s2);font-size:var(--z2)">' + esc(String(req.timeout)) + ' 秒不回应就自动放弃</div>' : '')
      + '</div>'
      + '<label style="display:flex;gap:var(--s2);align-items:center;font-size:var(--z2);color:var(--ink3);margin-bottom:var(--s5);cursor:pointer">'
      +   '<input type="checkbox" id="pmRemember"> 不再询问「' + esc(plugin || '该插件') + '」（之后直接放行）'
      + '</label>'
      + '<div style="display:flex;gap:var(--s2)">'
      +   '<button class="btn primary" id="pmAllow">允许并继续</button>'
      +   '<button class="btn" id="pmDeny">取消</button></div></div>';
    document.body.appendChild(ov);
    let settled = false;
    const done = async (allow, remember) => {
      if (settled) return;
      settled = true;
      ov.remove();
      document.removeEventListener('keydown', onKey, true);
      try { await API('/agent/permission', { method: 'POST',
        body: JSON.stringify({ request_id: rid, allow: allow, remember: !!remember }) }); } catch (e) {}
      sayHint(allow ? (remember ? '已允许，之后不再询问该插件' : '已允许，继续执行…') : '已取消，本轮任务结束');
    };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false, false); } };
    document.addEventListener('keydown', onKey, true);
    ov.querySelector('#pmAllow').onclick = () => done(true, ov.querySelector('#pmRemember').checked);
    ov.querySelector('#pmDeny').onclick = () => done(false, false);
    ov.onclick = (e) => { if (e.target === ov) done(false, false); };   /* 点遮罩 = 取消 */
    try { ov.querySelector('#pmAllow').focus(); } catch (e) {}
  }

  /* ③ 流式执行：GET /agent/stream?session_id=（NDJSON，每行一个 JSON 事件）*/
  function stopStream() {
    if (AG_S.ctl) { try { AG_S.ctl.abort(); } catch (e) {} AG_S.ctl = null; }
    setBusy(false);
  }
  function startStream() {
    stopStream();
    if (!AG_S.sid || !window.fetch) return;
    try {
      const ctl = new AbortController();
      AG_S.ctl = ctl;
      fetch('/api/agent/stream?session_id=' + encodeURIComponent(AG_S.sid), { signal: ctl.signal })
        .then(res => {
          if (!res.body) throw new Error('浏览器不支持流式读取');
          const reader = res.body.getReader();
          const dec = new TextDecoder('utf-8');
          let buf = '';
          const pump = () => reader.read().then(({ done, value }) => {
            if (done) return;
            buf += dec.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl).trim();
              buf = buf.slice(nl + 1);
              if (!line) continue;
              try {
                const ev = JSON.parse(line);
                /* ★ 字段归一：流式总线推 {type,data,ts}，回放/历史推 {type,payload,seq}。
                   渲染函数只认 ev.payload —— 不补这一步，**实时流式期间**思维链和
                   工具事件全被当空文本跳过（drawChat 里 !tx 就 return），
                   只有刷新后的回放才显示 → 这正是"思维链还是没有"的一层真因。 */
                if (ev && !ev.payload && ev.data) ev.payload = ev.data;
                /* ★ 思维链实时增量：就地替换上一条 live bubble → 文字"滚"出来 */
                const _isLive = ev && ev.type === 'thinking' && ev.payload && ev.payload.live;
                const _n = AG_S.events.length;
                const _prev = (_n && AG_S.events[_n - 1]) || {};
                if (_isLive || (ev && ev.type === 'thinking')) {
                  if (_prev.type === 'thinking' && _prev.payload && _prev.payload.live) {
                    AG_S.events[_n - 1] = ev;          /* 覆盖"思考中"态 */
                  } else { AG_S.events.push(ev); }
                } else { AG_S.events.push(ev); }
                drawChat();
                /* ★ 权限询问：长着"真 agent"的样子 —— 不是拒绝，而是弹窗问主人 */
                if (ev && ev.type === 'permission_request') askPermission(ev.payload || ev.data || {});
                /* ★ 思维链：本轮结束却没有 thinking 事件 → **如实说明**（不让它默默空白）。
                   实测：中转被限流(429)时会返回不带 reasoning_content 的结果，
                   那是模型/中转侧决定，不是本程序漏采 —— 必须区分开说。 */
                if (ev && ev.type === 'final') {
                  const hadThink = AG_S.events.some(e => e && e.type === 'thinking');
                  if (!hadThink) {
                    sayHint('本轮模型未返回思维链（模型/中转侧决定，非本程序漏采；多试几次或换模型可见）');
                  }
                }
              } catch (e) { /* 坏行忽略，与 v3 一致 */ }
            }
            return pump();
          });
          return pump();
        })
        .catch(err => {
          if (err && err.name === 'AbortError') return;
          sayHint('事件流断开（不影响任务本身）：' + ((err && err.message) || err));
        });
    } catch (e) { sayHint('事件流不可用（任务仍会执行）'); }
  }
  /* ④ 发送 */
  async function send() {
    const ta = $('agIn');
    const text = (ta.value || '').trim();
    if (!text) return;
    if (AG_S.busy) { sayHint('已有任务在执行中'); return; }
    ta.value = '';
    AG_S.events.push({ type: 'user_msg', payload: text });
    drawChat({ toBottom: true });      /* 自己发的话必须看得见 → 强制到底并恢复粘底 */
    setBusy(true);
    startStream();
    try {
      const r = await API('/agent/chat', {
        method: 'POST', body: JSON.stringify({ message: text, session_id: AG_S.sid || '' }) });
      if (AG_S.sid || (r && (r.session_id || r.sid))) {
        AG_S.sid = r.session_id || r.sid || AG_S.sid;
        sidTag();
      }
      /* 流式已经把内容推上来了；只有没收到任何事件时才回显结果 */
      const got = AG_S.events.some(e => agEventKind(e) === 'bot');
      if (!got) {
        const body = r && (r.reply || r.content || r.answer);
        if (body) AG_S.events.push({ type: 'bot_msg', payload: body });
        else if (r && r.error) AG_S.events.push({ type: 'error', payload: r.error });
      }
      drawChat();
    } catch (err) {
      AG_S.events.push({ type: 'error', payload: err.message });
      drawChat();
    }
    setBusy(false);
    loadSessions();
  }
  /* ⑤ 从某步重跑 */
  async function rerunFrom(step) {
    if (!AG_S.sid) { sayHint('先选一个会话'); return; }
    if (AG_S.busy) { sayHint('当前任务执行中'); return; }
    /* 重跑会**重新调用模型**（消耗 token）并覆盖这一步之后的轨迹，代价不小，确认一下。
       v3 没有这个确认，但 v3 也没有"从任意步重跑"的入口（是从会话末尾重放）。 */
    if (!await pvConfirm('从第 ' + step + ' 步重跑？', '会重新请求模型并覆盖这一步之后的轨迹。', '重跑')) return;
    setBusy(true);
    try {
      const r = await API('/agent/rerun', {
        method: 'POST', body: JSON.stringify({ session_id: AG_S.sid, from_step: step }) });
      AG_S.events.push({ type: 'sys', payload: '从第 ' + step + ' 步重跑（重建历史 '
        + fmtRaw(r.history_rebuilt || 0) + ' 条）' });
      if (r && r.answer) AG_S.events.push({ type: 'bot_msg', payload: r.answer });
      else if (r && r.error) AG_S.events.push({ type: 'error', payload: r.error });
      drawChat();
    } catch (e) {
      AG_S.events.push({ type: 'error', payload: '重跑失败：' + e.message });
      drawChat();
    }
    setBusy(false);
    loadSessions();
  }
  window.__agRerun = rerunFrom;
  /* 测试钩子（与 __agRerun 同惯例）：注入 AG_S.events 后可直接重绘，
     供视觉回归用 Playwright 撞渲染层（不改数据链路）。 */
  window.__agDraw = drawChat;

  /* ⑥ 插件创作（plugin_forge）：轮询 pending → 弹窗审批；双历史列表。
     与 permission_request 的区别：创作审批是**异步**的（agent 提交后不等），
     所以这里用轮询兜底 —— 群聊里触发的创作，Agent 页也要能看到并批准。 */
  const _forgeAsked = {};
  async function loadForge() {
    const host = $('agForge'); if (!host) return;
    let r = null;
    try { r = await API('/agent/forge', { method: 'POST', body: JSON.stringify({ limit: 30 }) }); }
    catch (e) { host.innerHTML = '<div class="fg-empty">读取创作记录失败：' + esc(e.message) + '</div>'; return; }
    const hist = (r && r.history) || [];
    const pend = (r && r.pending) || [];
    const nEl = $('agForgeN');
    if (nEl) nEl.textContent = pend.length ? ('待审批 ' + pend.length) : '';
    if (!hist.length) { host.innerHTML = '<div class="fg-empty">暂无创作记录 —— 让本体造个新功能，这里就会出现审批入口</div>'; return; }
    const stZh = { pending: '待审批', approved: '已启用', rejected: '已拒绝',
                   approved_load_failed: '已批准·加载失败', failed: '失败' };
    host.innerHTML = hist.map(x => {
      const t = x.created_at ? new Date(x.created_at * 1000) : null;
      const ts = t ? (String(t.getMonth() + 1).padStart(2, '0') + '-'
        + String(t.getDate()).padStart(2, '0') + ' ' + String(t.getHours()).padStart(2, '0')
        + ':' + String(t.getMinutes()).padStart(2, '0')) : '';
      return '<div class="fg-row fg-' + esc(x.status) + '">'
        + '<span class="fg-nm">' + esc(x.plugin) + '</span>'
        + '<span class="fg-d" title="' + esc(x.description || '') + '">' + esc(x.description || '') + '</span>'
        + '<span class="fg-src">' + (x.source === 'group' ? '群聊请求' : 'Agent页') + ' · ' + ts + '</span>'
        + '<span class="fg-st fg-' + esc(x.status) + '">' + esc(stZh[x.status] || x.status || '') + '</span>'
        + (x.status === 'pending'
            ? '<span class="fg-act"><button class="btn sm primary" data-fg-ok="' + esc(x.request_id) + '">同意启用</button>'
              + '<button class="btn sm" data-fg-no="' + esc(x.request_id) + '">拒绝</button></span>'
            : '')
        + '</div>';
    }).join('');
    qsa('[data-fg-ok]', host).forEach(b => b.onclick = () => resolveForge(b.dataset.fgOk, true));
    qsa('[data-fg-no]', host).forEach(b => b.onclick = () => resolveForge(b.dataset.fgNo, false));
    /* 新出现的 pending → 弹窗（每个 request_id 只弹一次） */
    pend.forEach(x => { if (x && x.request_id && !_forgeAsked[x.request_id]) askForge(x); });
  }
  function askForge(rec) {
    _forgeAsked[rec.request_id] = true;
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.style.zIndex = '74';
    ov.innerHTML = '<div class="modal" style="max-width:560px">'
      + '<div class="modal-t"><h3>插件创作审批</h3></div>'
      + '<div style="font-size:var(--z3);line-height:1.85;margin-bottom:var(--s5)">'
      +   '本体生成了新插件「<b>' + esc(rec.plugin) + '</b>」（v' + esc(rec.version || '1.0.0') + '）'
      +   '<div class="dim" style="margin-top:var(--s3)">干什么：' + esc(rec.description || '—') + '</div>'
      +   ((rec.motivation) ? '<div class="dim" style="margin-top:var(--s2)">为什么造：' + esc(rec.motivation) + '</div>' : '')
      +   ((rec.files && rec.files.length) ? '<div class="dim" style="margin-top:var(--s2)">文件：' + esc(rec.files.join('、')) + '</div>' : '')
      +   '<div class="dim" style="margin-top:var(--s3)">同意后代码从 plugins/_pending/ 移入 plugins/ 并热加载启用；'
      +   '拒绝则留在暂存区备查，不会生效。</div>'
      + '</div>'
      + '<div style="display:flex;gap:var(--s2)">'
      +   '<button class="btn primary" id="fgYes">同意启用</button>'
      +   '<button class="btn" id="fgNo">拒绝</button></div></div>';
    document.body.appendChild(ov);
    const done = async (allow) => {
      ov.remove();
      try {
        const r = await API('/agent/forge/resolve', { method: 'POST',
          body: JSON.stringify({ request_id: rec.request_id, allow: allow }) });
        sayHint(allow ? ('「' + rec.plugin + '」' + (r && r.status === 'approved' ? '已启用' : ('处理结果：' + ((r && (r.status || r.error)) || '未知'))))
                      : ('已拒绝「' + rec.plugin + '」'));
      } catch (e) { sayHint('审批失败：' + e.message); }
      loadForge();
    };
    ov.querySelector('#fgYes').onclick = () => done(true);
    ov.querySelector('#fgNo').onclick = () => done(false);
  }
  async function resolveForge(rid, allow) {
    if (!await pvConfirm(allow ? '同意启用该插件？' : '拒绝该创作？',
        allow ? '代码将移入 plugins/ 并热加载启用。' : '代码留在 plugins/_pending/ 备查。',
        allow ? '同意启用' : '拒绝')) return;
    try {
      const r = await API('/agent/forge/resolve', { method: 'POST',
        body: JSON.stringify({ request_id: rid, allow: allow }) });
      sayHint((r && r.ok) ? ('已处理：' + r.status) : ('失败：' + ((r && r.error) || '未知')));
    } catch (e) { sayHint('审批失败：' + e.message); }
    loadForge();
  }
  const agForgeBtn = $('agForgeRefresh');
  if (agForgeBtn) agForgeBtn.onclick = loadForge;
  await loadForge();
  if (window.__forgeTimer) clearInterval(window.__forgeTimer);
  window.__forgeTimer = setInterval(() => {
    /* 只在 Agent 页在场时轮询（离开页面就停，别空转） */
    if (!document.getElementById('agForge')) { clearInterval(window.__forgeTimer); window.__forgeTimer = null; return; }
    loadForge();
  }, 15000);

  $('agSend').onclick = send;
  $('agStop').onclick = stopStream;
  $('agReplay').onclick = replay;
  $('agNew').onclick = () => { AG_S.sid = ''; AG_S.events = []; sidTag(); drawChat({ toBottom: true }); loadSessions(); };
  const ta = $('agIn');
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* 本体记忆：Bot 没起时后端会返回 ready:false + reason，要如实显示而不是空白 */
  async function loadMem() {
    const host = $('agMem');
    if (!host) return;
    let r = null;
    try { r = await API('/agent/memory', { method: 'POST', body: '{}' }); }
    catch (e) { host.innerHTML = '<div class="errbox">读取 /api/agent/memory 失败：' + esc(e.message) + '</div>'; return; }
    const m = (r && r.memory) || {};
    const tools = (r && r.tools) || {};
    const sess = (r && r.sessions) || [];
    const ready = !!(r && r.ready);
    const row = (lab, val, sub) => '<div class="st"><div class="lab">' + esc(lab) + '</div>'
      + '<div class="v">' + esc(val) + '</div><div class="c">' + esc(sub || '') + '</div></div>';
    host.innerHTML = '<div class="stats">'
      + row('状态', ready ? '就绪' : '不可用',
            ready ? ('Bot ' + (r.bot_running ? '运行中' : '未运行')) : ((r && r.reason) || (m.reason || 'Bot 未运行')))
      + row('记忆', m.available === false ? '不可用' : (fmtRaw(m.total || m.messages || 0) + ' 条'),
            m.available === false ? (m.reason || '') : (m.kind || '本体记忆'))
      + row('工具', fmtRaw(tools.total || 0) + ' 个', '按群分派：' + Object.keys(tools.by_group || {}).length + ' 组')
      + row('会话', String(sess.length), sess.length ? (sess[0].title || sess[0].session_id || '') : '暂无')
      + '</div>';
  }
  const agMemBtn = $('agMemRefresh');
  if (agMemBtn) agMemBtn.onclick = loadMem;
  await loadMem();

  /* ★ 设置卡片：读 /agent/settings（POST {} 即读取），保存 POST /agent/settings */
  const agSetHost = $('agSet'), agSetSaveBtn = $('agSetSave');
  const swRow = (label, key, checked, hint) =>
    '<div class="ff-card is-bool" data-fcard="' + esc(key) + '">'
    + '<div class="ff-main"><div class="ff-t">' + esc(label) + '</div>'
    + '<div class="ff-d">' + esc(hint || '') + '</div></div>'
    + '<button type="button" class="sw" role="switch" data-sk="' + esc(key) + '" aria-checked="'
    + (checked ? 'true' : 'false') + '" aria-label="' + esc(label) + '"></button></div>';
  async function loadSettings() {
    if (!agSetHost) return;
    let r = null;
    try { r = await API('/agent/settings', { method: 'POST', body: '{}' }); }
    catch (e) { agSetHost.innerHTML = '<div class="errbox">读取设置失败：' + esc(e.message) + '</div>'; return; }
    const s = (r && r.settings) || {};
    agSetHost.innerHTML = '<div class="stats">'
      + swRow('本体记忆', 'memory', s.memory !== false, '关掉后 agent 不再注入本体记忆，只保留工具')
      + swRow('显示思考过程', 'thinking', s.thinking !== false, '推理模型的思维链，逐条弱化显示')
      + '</div>'
      + '<div class="ff-card" data-fcard="max_steps"><div class="ff-main">'
      + '<div class="ff-t">单次最大步数</div><div class="ff-d">0 = 不限步数（默认）；成本由总工具调用预算兜底，步数不再是失败判据</div></div>'
      + '<input type="number" step="1" min="0" id="agMaxSteps" value="' + (s.max_steps || 0) + '"></div>';
    qsa('.sw', agSetHost).forEach(sw => sw.onclick = () => {
      const on = sw.getAttribute('aria-checked') === 'true';
      sw.setAttribute('aria-checked', on ? 'false' : 'true');
      if (agSetSaveBtn) agSetSaveBtn.disabled = false;
    });
    const ms = $('agMaxSteps');
    if (ms) ms.oninput = () => { if (agSetSaveBtn) agSetSaveBtn.disabled = false; };
    if (agSetSaveBtn) agSetSaveBtn.disabled = true;
  }
  if (agSetSaveBtn) agSetSaveBtn.onclick = async () => {
    agSetSaveBtn.disabled = true;
    const g = (k) => ($('agSet').querySelector('[data-sk="' + k + '"]').getAttribute('aria-checked') === 'true');
    const body = {
      memory: g('memory'), thinking: g('thinking'),
      max_steps: parseInt(($('agMaxSteps').value || '0'), 10) || 0,
    };
    try {
      const r = await API('/agent/settings', { method: 'POST', body: JSON.stringify(body) });
      sayHint('设置已保存' + (r && r.settings ? ('：记忆 ' + (r.settings.memory ? '开' : '关')
              + ' · 思考 ' + (r.settings.thinking ? '开' : '关')) : ''));
    } catch (e) { sayHint('保存失败：' + e.message); }
  };
  /* ── MCP 工具区（T3）──────────────────────────────────────────────
     数据口：GET /api/mcp/status（bot_core T1 聚合，见交接文档 §3.3）。
     红线：status 只读缓存 —— 页面加载/刷新永远不起 MCP 子进程；
     「加载/测试」才是显式动作。卸载只摘工具（forget），删配置走整组 JSON 保存。 */
  const mcBadge = $('mcBadge'), mcCards = $('mcCards'), mcJson = $('mcJson'),
        mcSaveMsg = $('mcSaveMsg'), mcInstallBtn = $('mcInstall'),
        mcInstallLog = $('mcInstallLog');
  let MC_ST = null;               // 最近一次 status
  let mcPollTimer = null;
  function mcSay(msg, bad) {
    if (mcSaveMsg) { mcSaveMsg.textContent = msg || ''; mcSaveMsg.style.color = bad ? 'var(--err)' : ''; }
  }
  function mcSummary(s, cfg) {
    const cmd = String(cfg.command || '');
    const args = (cfg.args || []).join(' ');
    if (cmd) return esc((cmd + ' ' + args).slice(0, 72));
    /* §3.4-3：远程 MCP 未支持 → 卡上红字，不假装支持（点测试也会拿到后端明确报错） */
    if (cfg.url) return esc(String(cfg.url).slice(0, 72))
      + '<br><span style="color:var(--err);font-size:var(--z1)">远程（url/sse）暂未支持，请用 stdio command</span>';
    return '<span class="dim">（无 command/url）</span>';
  }
  function mcRender() {
    if (!mcCards) return;
    if (!MC_ST) { mcCards.innerHTML = '<div class="empty">读取中…</div>'; return; }
    if (MC_ST.ok === false) { mcCards.innerHTML = '<div class="errbox">MCP 状态读取失败：' + esc(MC_ST.error || '') + '</div>'; return; }
    const srvs = MC_ST.servers || {}, cached = MC_ST.cached || {};
    const names = Object.keys(srvs);
    if (!names.length) { mcCards.innerHTML = '<div class="empty">还没有 MCP 服务器 —— 在下方 JSON 里添加后点「保存配置」</div>'; return; }
    mcCards.innerHTML = names.map(nm => {
      const cfg = srvs[nm] || {};
      const tools = cached[nm] || [];
      const envN = Object.keys(cfg.env || {}).length;
      return '<div class="pv-card" data-mc-name="' + esc(nm) + '">'
        + '<div class="pv-nm">' + esc(nm) + (tools.length ? '<span class="sig ok" style="margin-left:6px"><i></i>已加载</span>' : '') + '</div>'
        + '<div class="pv-url" title="' + esc(cfg.command || cfg.url || '') + '">' + mcSummary(nm, cfg) + '</div>'
        + '<div class="pv-meta"><span>' + (tools.length ? tools.length + ' 工具' : '未加载') + '</span>'
        + '<span class="pv-key' + (envN ? '' : ' no') + '">' + (envN ? envN + ' env' : '无 env') + '</span></div>'
        + (tools.length ? '<div class="pv-url" title="' + esc(tools.join(', ')) + '" style="white-space:normal">' + esc(tools.slice(0, 6).join(' · ')) + (tools.length > 6 ? ' …' : '') + '</div>' : '')
        + '<div class="pv-acts"><button class="btn sm" data-mc-load="' + esc(nm) + '">' + (tools.length ? '重新加载' : '加载') + '</button>'
        + '<button class="btn sm" data-mc-test="' + esc(nm) + '">测试</button>'
        + '<button class="btn sm" data-mc-forget="' + esc(nm) + '"' + (tools.length ? '' : ' disabled') + '>卸载</button></div></div>';
    }).join('');
    qsa('[data-mc-load]', mcCards).forEach(b => b.onclick = () => mcAct('/api/mcp/load', b.dataset.mcLoad, b));
    qsa('[data-mc-test]', mcCards).forEach(b => b.onclick = () => mcAct('/api/mcp/test', b.dataset.mcTest, b));
    qsa('[data-mc-forget]', mcCards).forEach(b => b.onclick = async () => {
      const nm = b.dataset.mcForget;
      if (!await pvConfirm('卸载 MCP「' + nm + '」？', '只把它的工具从模型视野摘掉，配置仍保留在 JSON 里；想彻底删除请编辑配置后保存。', '卸载')) return;
      mcAct('/api/mcp/forget', nm, b);
    });
  }
  async function mcAct(path, server, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '处理中…'; }
    try {
      const r = await API(path.replace(/^\/api/, ''), { method: 'POST', body: JSON.stringify({ server: server }) });
      if (r && r.ok) {
        if (path === '/api/mcp/forget') mcSay('已卸载 ' + server + '（' + (r.dropped || []).length + ' 个工具摘除）');
        else mcSay((path === '/api/mcp/test' ? '测试通过：' : '已加载：') + server + ' · ' + (r.count != null ? r.count : (r.names || []).length) + ' 个工具');
      } else {
        mcSay((path.indexOf('test') >= 0 ? '测试失败：' : '失败：') + ((r && r.error) || '未知错误'), true);
      }
    } catch (e) { mcSay('请求失败：' + e.message, true); }
    if (btn) { btn.disabled = false; btn.textContent = ({ '/api/mcp/load': '加载', '/api/mcp/test': '测试', '/api/mcp/forget': '卸载' })[path] || '加载'; }
    mcLoadStatus();
  }
  function mcVenvBadge(st) {
    if (!mcBadge) return;
    if (!st || st.ok === false) { mcBadge.textContent = '状态未知'; mcBadge.style.color = 'var(--ink4)'; return; }
    const v = st.venv || {};
    if (v.installed) {
      mcBadge.innerHTML = '<span class="sig ok"><i></i>MCP 运行环境已就绪</span>';
      mcBadge.title = v.python || '';
      if (mcInstallBtn) mcInstallBtn.hidden = true;
    } else {
      mcBadge.textContent = '运行环境未安装'; mcBadge.style.color = 'var(--warn)';
      if (mcInstallBtn) mcInstallBtn.hidden = false;
    }
  }
  async function mcLoadStatus() {
    let r;
    try { r = await API('/mcp/status'); }
    catch (e) { MC_ST = { ok: false, error: e.message }; mcVenvBadge(MC_ST); mcRender(); return; }
    MC_ST = r;
    mcVenvBadge(r);
    mcRender();
    if (mcJson && !mcJson.dataset.dirty) {
      const s = r.servers || {};
      mcJson.value = Object.keys(s).length ? JSON.stringify(s, null, 2) : '';
    }
    if (r.install && r.install.running) mcStartPoll();
    else if (mcInstallLog && r.install && r.install.done) mcInstallLog.textContent = (r.install.log || []).slice(-6).join('\n');
  }
  function mcStartPoll() {
    if (mcPollTimer) return;
    if (mcInstallBtn) { mcInstallBtn.disabled = true; mcInstallBtn.textContent = '安装中…'; }
    mcPollTimer = setInterval(async () => {
      try {
        const r = await API('/mcp/install_status');
        if (mcInstallLog) mcInstallLog.textContent = (r.log || []).slice(-6).join('\n');
        if (!r.running) {
          clearInterval(mcPollTimer); mcPollTimer = null;
          if (mcInstallBtn) { mcInstallBtn.disabled = false; mcInstallBtn.textContent = '一键装运行环境'; }
          if (r.done && r.done.ok) mcSay('MCP 运行环境安装完成');
          else if (r.done) mcSay('安装失败：' + (r.done.error || '未知'), true);
          mcLoadStatus();
        }
      } catch (e) { /* bot 未起等 transient，下一轮再试 */ }
    }, 2000);
  }
  if (mcInstallBtn) mcInstallBtn.onclick = async () => {
    mcInstallBtn.disabled = true;
    try {
      const r = await API('/mcp/install', { method: 'POST', body: '{}' });
      if (r && r.ok) { mcSay('开始安装 venv：' + (r.target || '')); mcStartPoll(); }
      else mcSay('启动安装失败：' + ((r && r.error) || ''), true);
    } catch (e) { mcSay('请求失败：' + e.message, true); }
    mcInstallBtn.disabled = false;
  };
  if (mcJson) mcJson.oninput = () => { mcJson.dataset.dirty = '1'; mcSay(''); };
  if ($('mcSave')) $('mcSave').onclick = async () => {
    let servers;
    const raw = (mcJson.value || '').trim();
    try { servers = raw ? JSON.parse(raw) : {}; }
    catch (e) { mcSay('JSON 语法错误：' + e.message, true); return; }
    // 兼容两种写法：直接 {name:cfg} 或 {"mcpServers":{...}}
    if (servers && servers.mcpServers && typeof servers.mcpServers === 'object') servers = servers.mcpServers;
    if (typeof servers !== 'object' || Array.isArray(servers)) { mcSay('顶层必须是对象 {"服务器名": {…}}', true); return; }
    $('mcSave').disabled = true;
    try {
      const r = await API('/mcp/save', { method: 'POST', body: JSON.stringify({ servers: servers }) });
      if (r && r.ok) { mcSay('已保存 → ' + (r.path || '')); delete mcJson.dataset.dirty; mcLoadStatus(); }
      else mcSay('保存失败：' + ((r && r.error) || ''), true);
    } catch (e) { mcSay('请求失败：' + e.message, true); }
    $('mcSave').disabled = false;
  };
  if ($('mcReloadCfg')) $('mcReloadCfg').onclick = async () => {
    try {
      const r = await API('/mcp/reload', { method: 'POST', body: '{}' });
      if (r && r.ok) { mcSay('已重载配置（缓存清空，需重新加载服务器）'); delete mcJson.dataset.dirty; mcLoadStatus(); }
      else mcSay('重载失败：' + ((r && r.error) || ''), true);
    } catch (e) { mcSay('请求失败：' + e.message, true); }
  };
  const mcRefreshBtn = $('mcRefresh');
  if (mcRefreshBtn) mcRefreshBtn.onclick = () => { delete mcJson.dataset.dirty; mcLoadStatus(); };
  await mcLoadStatus();

  /* ★ 技能：**弹窗**（用户："明明是主要的聊天框就一点点大小，技能应该是弹窗列表"）
     —— 列出 skills/ 下被发现的技能，开关=停用/启用（持久化 skill_disabled.json）*/
  let _skillCache = { items: [], disabled: [] };
  async function loadSkills() {
    const btn = $('agSkillBtn');
    try {
      const r = await API('/agent/skills', { method: 'POST', body: '{}' });
      _skillCache = { items: (r && r.skills) || [], disabled: (r && r.disabled) || [] };
      if (btn) btn.textContent = '技能 · ' + _skillCache.items.length;
    } catch (e) { if (btn) btn.textContent = '技能 · ?'; }
  }
  function openSkillModal() {
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    const items = _skillCache.items, dis = new Set(_skillCache.disabled);
    ov.innerHTML = '<div class="modal"><div class="modal-t"><h3>技能（' + items.length + '）</h3>'
      + '<button class="btn sm" id="skX">关闭</button></div>'
      + '<div class="dim" style="margin-bottom:var(--s4);font-size:var(--z2)">'
      + '开关 = 停用/启用，停用的不进 system prompt。存放于 skills/ 目录，每技能一个文件夹。</div>'
      + '<div id="skList">' + (items.length ? items.map(it =>
          '<div class="ff-card" data-skn="' + esc(it.name) + '">'
          + '<div class="ff-main"><div class="ff-t">' + esc(it.name) + '</div>'
          + '<div class="ff-d">' + esc(it.desc || '（无简介）') + '</div></div>'
          + '<button type="button" class="sw" role="switch" data-skname="' + esc(it.name) + '"'
          + ' aria-checked="' + (dis.has(it.name) ? 'false' : 'true') + '"'
          + ' aria-label="启用 ' + esc(it.name) + '"></button></div>').join('')
        : '<div class="empty">skills/ 目录下还没有技能</div>') + '</div></div>';
    document.body.appendChild(ov);
    const close = () => { ov.remove(); loadSkills(); };
    $('skX').onclick = close;
    ov.onclick = (e) => { if (e.target === ov) close(); };
    qsa('[data-skname]', ov).forEach(sw => sw.onclick = async () => {
      const name = sw.dataset.skname;
      const nowOn = sw.getAttribute('aria-checked') === 'true';
      const next = new Set(dis);
      if (nowOn) next.add(name); else next.delete(name);
      sw.setAttribute('aria-checked', nowOn ? 'false' : 'true');
      dis.clear(); next.forEach(x => dis.add(x));
      try {
        const r2 = await API('/agent/skills', { method: 'POST',
          body: JSON.stringify({ disabled: Array.from(next) }) });
        _skillCache.disabled = (r2 && r2.disabled) || [];
        sayHint('技能已' + (nowOn ? '停用' : '启用') + '：' + name);
      } catch (e) { sayHint('保存失败：' + e.message); }
    });
  }
  const skBtn = $('agSkillBtn');
  if (skBtn) skBtn.onclick = () => { openSkillModal(); };
  await loadSkills();
  await loadSettings();

  /* Agent 依赖 Bot 进程（/api/agent/* 是转发给 bot_core 的代理）——
     Bot 没跑就明说，别让用户在输入框里白等。*/
  try {
    const st2 = await API('/status');
    if (!(st2 && st2.bot && st2.bot.status === 'running')) {
      const w = document.createElement('div');
      w.className = 'warnbox';
      w.style.marginBottom = 'var(--s4)';
      w.textContent = 'Bot 未在运行 —— Agent 的对话/会话都依赖 Bot 进程。先到「Bot」页启动。';
      el.insertBefore(w, el.firstChild);
    }
  } catch (e) {}
  drawChat({ toBottom: true });
  sidTag();
  await loadSessions();
  if (AG_S.list.length && !AG_S.sid) {
    AG_S.sid = AG_S.list[0].session_id || AG_S.list[0].id || '';
    sidTag(); await replay(); await loadSessions();
  }
  await loadAgentStatus();
}

async function loadAgentStatus() {
  const box = $('agSt'); if (!box) return;
  try {
    const s = await API('/agent/status');
    const ready = !!(s && (s.ready ?? s.ok));
    box.innerHTML = ''
      + '<div class="st"><div class="lab">就绪</div><div class="v">' + (ready ? '是' : '否')
      + '</div><div class="c">' + esc(s && (s.reason || s.msg) || '—') + '</div></div>'
      + '<div class="st"><div class="lab">工具组</div><div class="v mono">'
      + (() => { const tg = s && (s.tools ?? s.tool_groups);
          if (!tg) return '—';
          if (typeof tg === 'object') { const by = tg.by_group || {};
            const ks = Object.keys(by);
            return (tg.total ?? 0) + ' 个 / ' + ks.length + ' 组'
              + (ks.length ? '（' + ks.slice(0, 3).join('·') + (ks.length > 3 ? '…' : '') + '）' : ''); }
          return String(tg).slice(0, 80); })()
      + '</div><div class="c">可用能力</div></div>'
      + '<div class="st"><div class="lab">会话</div><div class="v mono">—</div><div class="c">—</div></div>';
  } catch (e) {
    box.innerHTML = '<div class="errbox">/agent/status 失败：' + esc(e.message) + '</div>';
  }
}

/* ═════════════ 配置中心 ═════════════
   GET  /api/config → 全量配置（api_key / onebot_token / providers[].api_key 已**掩码**）
   POST /api/config → {改动的键...}；特殊键：api_key_clear（清除凭据）
   POST /api/config/reload → 热重载
   POST /api/config/model {api_provider, model_name} → 快速切模型

   ★★ 本页最重要的安全约束 ★★
   敏感字段回传的是掩码占位符 `«redacted:sk-123…»`（webui_server._mask_secret）。
   如果前端把**没改过**的掩码值一起提交回去，就会把真实 Key 覆盖成这串占位符 ——
   这是不可逆的数据损坏。因此：
     ① 提交时做 **diff**，只发真正改动过的键；
     ② 掩码字段若当前值仍等于原始掩码 → 视为"未改动"，跳过；
     ③ `providers` 整组只读（里面含掩码 Key），不给原样写回的入口。
   测试对第 ② 条有专门断言。 */
const CFG_PREFIX_LABEL = {
  ai: 'AI 参数', api: '模型接口', bot: 'Bot 身份', embed: '嵌入服务',
  group: '群聊', friend: '好友', idle: '空闲退场', meme: '表情包',
  msg: '消息处理', notify: '通知', onebot: 'OneBot 连接', private: '私聊',
  protocol: '协议层', recall: '撤回反馈', session: '会话窗口', startup: '启动',
  admin: '管理员', target: '目标账号'
};
/* 只读键：要么由别的页面管理，要么含掩码明文，不给原样写回入口 */
const CFG_READONLY = new Set(['providers', 'group_restrictions', 'friend_restrictions',
                              'protocol_drivers']);
const isMasked = (v) => typeof v === 'string' && v.indexOf('«redacted') === 0;

let cfgOriginal = {};

/* ══ FIELD_META_BEGIN（由 scripts/inject_field_meta.py 从 v3 自动抽取，请勿手改）
/* ★ 挂 window 而不是用 const：
   顶层 const FIELD_META 在这份文件里会因求值顺序/作用域出现
   `typeof FIELD_META === 'undefined'`（页面无报错，但配置页读不到），
   挂到 window 上这个问题就彻底不存在了。*/

/* ══════════════════════════════════════════════════════════════════
   配置中心 · 元数据驱动区（v3 设置项 1:1 复现）

   v3 的设置项是「15 个面板 + 每项中文标签/说明/单位」，
   v4 第一版却是裸 key + JSON 文本框（布尔用"开启/关闭"下拉、数组塞 JSON）——
   看着像配置，其实没法用：不知道哪个键是什么、退场语得手写 JSON 数组。

   这里用 FIELD_META（由 scripts/extract_field_meta.py 从 v3 自动抽取，
   99 个字段 / 13 个面板）按面板还原，并换成本设计语言的控件：
     bool     → 方块开关（.sw，开=金色）
     lines    → 多行输入，**每行一条**（不再手写 JSON 数组）
     editable → 划线列表：取消勾选 = 停用，**停用的条目划线显示**（退场语/撤回反馈）
     select   → 下拉（选项值与 v3 逐字一致）
     number/text → 输入框；每个字段都带中文标签 + 说明，键名降级为灰字小注
   ══════════════════════════════════════════════════════════════════ */
const CFG_OPTIONS = {
  llama_driver: [['llama-server', 'llama-server'], ['ollama', 'Ollama'], ['lmstudio', 'LM Studio']],
  image_llm_driver: [['llama-server', 'llama-server'], ['ollama', 'Ollama'], ['lmstudio', 'LM Studio']],
  command_permission: [['strict', '严格（管理员专用危险指令）'], ['off', '关闭（所有人可执行全部指令）']],
  /* 静默时段被点名时的反应。这两个值由 bot_core 读，写错等于静默功能失效，
     所以下拉只给这两项（v3 那边也是同样的两项）。*/
  quiet_when_mentioned: [['wake', 'wake（被叫醒就回一句困话）'], ['ignore', 'ignore（一律不回）']],
  /* 日志级别：logger_setup 读 config.get_log_level()，值必须是 logging 认的
     四个名字，写错会按 INFO 走（并在日志里点名）。所以下拉只给这四项。 */
  log_level: [['DEBUG', 'DEBUG（最详细，排查问题用）'],
              ['INFO', 'INFO（默认）'],
              ['WARNING', 'WARNING（只要警告与错误）'],
              ['ERROR', 'ERROR（只要错误）']],
  /* 反问闸（1.5.9 §3.6）：reply_gate.guard_mode 只认这三个值，写错退回 off。
     不给自由文本，避免"配了个没人读的字符串"。 */
  reply_question_guard: [['off', 'off（只记口癖，不重生）'],
                         ['regen', 'regen（末句是问号就重生一次）'],
                         ['regen_private', 'regen_private（只在私聊 / 被 @ 时重生）']],
};
function cfGet(cfg, k) {
  const p = String(k).split('.');
  let o = cfg;
  for (const seg of p) { if (o == null) return undefined; o = o[seg]; }
  return o;
}
function cfSet(obj, k, v) {
  const p = String(k).split('.');
  let o = obj;
  for (let i = 0; i < p.length - 1; i++) {
    if (typeof o[p[i]] !== 'object' || o[p[i]] === null) o[p[i]] = {};
    o = o[p[i]];
  }
  o[p[p.length - 1]] = v;
}
/* 退场语 / 撤回反馈的形状：[{text, disabled}]。
   v3 只读不存（mountEditableList 读了但 collectSettings 没收集），v4 补上保存。*/
function cfNormList(v) {
  if (!Array.isArray(v)) return [];
  return v.map(x => (typeof x === 'string'
      ? { text: x, disabled: false }
      : { text: String((x && x.text) != null ? x.text : ''), disabled: !!(x && x.disabled) }))
    .filter(x => x.text);
}
function cfPanelsWithFields() {
  const n = {};
  Object.keys(FIELD_META.fields).forEach(k => { n[FIELD_META.fields[k].panel] = (n[FIELD_META.fields[k].panel] || 0) + 1; });
  return FIELD_META.panels.filter(p => n[p[0]]);
}
/* ── 配置页分组（2026-10-24 重排）────────────────────────────────
   原来 15 个面板平级排成一行标签，用户不知道该点哪个：
   「会话」和「群聊」和「触发」和「退场语」的边界只有写代码的人清楚，
   「去 AI 味」「协议风险」是内部说法，「提供商管理」和「对话大脑」又各占一屏。
   现在按**用户想干什么**分成 6 组，组内小节竖着堆，不再加第三层导航：
     接入 → 换模型、填 Key、连协议、机器人账号
     说话 → 模型参数、语气、去 AI 味、回复长度
     群聊 → 应答时机、触发词、退场、权限
     互动 → 表情包、撤回反馈
     功能 → 总开关、自动通过、会话与记忆
     界面 → 版本配色、原始配置
   分组只是导航层，字段归属仍以 FIELD_META 的 panel 为准。 */
const CFG_GROUPS = [
  ['connect',  '接入', ['basic'],                        '模型 · Key · 协议'],
  ['talk',     '说话', ['llm', 'deai', 'length'],        '参数 · 语气 · 长度'],
  ['grouptalk','群聊', ['group', 'trigger', 'exit', 'perm'], '时机 · 触发 · 退场'],
  ['interact', '互动', ['meme', 'recall'],               '表情 · 撤回'],
  ['feature',  '功能', ['switches', 'autoaccept', 'session'], '开关 · 自动通过'],
  ['look',     '界面', ['ui'],                           '版本 · 配色'],
];
function cfGroupOf(panel) {
  const g = CFG_GROUPS.find(x => x[2].indexOf(panel) !== -1);
  return g ? g[0] : 'feature';
}
function cfFieldHTML(k, m, cfg, ctx) {
  const v = cfGet(cfg, k);
  /* 单位徽标只在**标签本身没写单位**时才加。

     「退场静默时间（秒）秒」—— 群聊面板里十几个字段都是这个样子。
     判据用标签结尾的括号，不靠人工判断。 */
  const _u = (m.unit && !new RegExp('[（(]\\s*' + m.unit + '\\s*[)）]\\s*$').test(m.label || ''))
    ? m.unit : '';
  const lab = '<div class="cf-lab">' + esc(m.label || k)
    + (_u ? '<em>' + esc(_u) + '</em>' : '') + '</div>'
    + (m.desc ? '<div class="cf-desc">' + esc(m.desc) + '</div>' : '');
  let ctl;
  if (m.ctl === 'bool') {
    const on = !(v === false || v == null || v === 0 || v === '0' || v === '');
    ctl = '<div class="swrow"><button type="button" class="sw" role="switch" aria-checked="'
      + (on ? 'true' : 'false') + '" data-sw="' + esc(k) + '" aria-label="' + esc(m.label || k) + '"></button>'
      + '<b data-sw-t="' + esc(k) + '">' + (on ? '开启' : '关闭') + '</b></div>';
  } else if (m.ctl === 'toolcheck') {
    /* 群聊工具白名单：一组勾选框（数据源 GET /tools），不是文本框。
       v3 就是勾选；做成文本框会让人手填工具名，既容易写错也看不到说明。*/
    const hasList = Array.isArray(v);
    const cur = hasList ? v : (typeof v === 'string' && v ? v.split(',') : []);
    /* 后端语义（bot_core）：group_tool_allowlist 为 None → 全放行；
       为数组 → 只放行名单内。所以"启用白名单"= 该键是否为数组，
       关闭时提交 null（空数组=一个工具都不给，不是关闭）。*/
    ctl = '<div class="swrow" style="margin-bottom:var(--s2)">'
      + '<button type="button" class="sw" role="switch" aria-checked="' + (hasList ? 'true' : 'false')
      + '" data-tc-sw="' + esc(k) + '" aria-label="启用群聊工具白名单"></button>'
      + '<b data-tc-sw-t="' + esc(k) + '">' + (hasList ? '已启用（只放行勾选项）' : '未启用（群聊工具全放行）') + '</b>'
      + '</div>'
      + '<div class="tool-list" data-tc="' + esc(k) + '"' + (hasList ? '' : ' hidden') + '>'
      + '<div class="dim" style="font-size:9px">读取工具目录…</div></div>'
      + '<input type="hidden" data-tc-cur="' + esc(k) + '" value="' + esc(cur.join(',')) + '">';
  } else if (m.ctl === 'editable') {
    const items = ctx.lists[k] || [];
    ctl = '<div class="edl">' + (items.length ? items.map((it, i) =>
        '<div class="edl-row' + (it.disabled ? ' off' : '') + '">'
        + '<input type="checkbox" class="edl-chk" data-edl-k="' + esc(k) + '" data-edl-i="' + i + '"'
        + (it.disabled ? '' : ' checked') + ' aria-label="启用这条">'
        + '<span class="edl-txt">' + esc(it.text) + '</span>'
        + '<button type="button" class="edl-del" data-edl-k="' + esc(k) + '" data-edl-i="' + i
        + '" aria-label="删除这条">删除</button></div>').join('')
      : '<div class="edl-empty">（空）—— 在下面粘贴多行或逐条添加</div>') + '</div>'
      + '<div class="edl-add"><textarea data-edl-add="' + esc(k) + '" rows="3" spellcheck="false"'
      + ' placeholder="每行一条"></textarea><button type="button" class="btn sm" data-edl-push="'
      + esc(k) + '">加入</button></div>'
      + '<div class="cf-desc">共 <b data-edl-n="' + esc(k) + '">' + items.length + '</b> 条　·　'

function cfBindArea(host, cfg, ctx) {
  const repaint = () => (ctx.keyword
    ? cfRenderSearch($('cfArea'), cfg, ctx, ctx.keyword)
    : cfRenderArea($('cfArea'), cfg, ctx));
  /* ⓪ 恢复默认：把控件写回默认值并计入改动。

     其余是 input.value。写错类型会让"恢复了但没保存"。 */
  qsa('[data-reset]', host).forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.reset;
      const m = FIELD_META.fields[k] || {};
      if (!('default' in m)) return;
      const dv = m.default;
      if (m.ctl === 'bool') {
        const sw = host.querySelector('[data-sw="' + CSS.escape(k) + '"]');
        const on = !!dv;
        if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
        const t = host.querySelector('[data-sw-t="' + CSS.escape(k) + '"]');
        if (t) t.textContent = on ? '开启' : '关闭';
        ctx.dirty[k] = on;
      } else if (m.ctl === 'editable') {
        ctx.lists[k] = cfNormList(dv);
        ctx.listDirty[k] = true;
        repaint();
      } else {
        const el = host.querySelector('[data-k="' + CSS.escape(k) + '"]');
        if (el) {
          if (m.ctl === 'lines') el.value = (Array.isArray(dv) ? dv : []).join('\n');
          else if (Array.isArray(dv) || (dv && typeof dv === 'object')) el.value = JSON.stringify(dv);
          else el.value = dv == null ? '' : String(dv);
        }
        ctx.dirty[k] = dv;
      }
      ctx.mark();
    };
  });
  /* ① 开关 */
  qsa('[data-sw]', host).forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.sw;
      const next = btn.getAttribute('aria-checked') !== 'true';
      btn.setAttribute('aria-checked', next ? 'true' : 'false');
      const t = host.querySelector('[data-sw-t="' + CSS.escape(k) + '"]');
      if (t) t.textContent = next ? '开启' : '关闭';
      const orig = cfGet(cfg, k);
      const cur = !(orig === false || orig == null || orig === 0 || orig === '0' || orig === '');
      if (next === !!cur) delete ctx.dirty[k]; else ctx.dirty[k] = next;
      ctx.mark();

  qsa('[data-edl-k]', host).forEach(elm => {
    elm.onchange = () => {
      const k = elm.dataset.edlK, i = +elm.dataset.edlI;
      if (!ctx.lists[k] || !ctx.lists[k][i]) return;
      ctx.lists[k][i].disabled = !elm.checked;

    elm.onclick = () => {

      if (same) delete ctx.dirty[k]; else ctx.dirty[k] = arr;

  });

  /* 启用开关：关 → 提交 null（全放行）；开 → 提交勾选数组 */

    const k = sw.dataset.tcSw;
    const next = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', next ? 'true' : 'false');
    const t = host.querySelector('[data-tc-sw-t="' + k + '"]');
    if (t) t.textContent = next ? '已启用（只放行勾选项）' : '未启用（群聊工具全放行）';
    const box = host.querySelector('[data-tc="' + k + '"]');
    if (box) box.hidden = !next;
    if (!next) { ctx.dirty[k] = null; }
    else {
      const picked = [];
      qsa('[data-tc-i="' + k + '"]', box || document).forEach(x => { if (x.checked) picked.push(x.value); });
      ctx.dirty[k] = picked;
    }
    ctx.mark();
  });
  qsa('[data-tc]', host).forEach(box => {
    const k = box.dataset.tc;
    const cur = ((host.querySelector('[data-tc-cur="' + k + '"]') || {}).value || '')
      .split(',').map(x => x.trim()).filter(Boolean);

      const tools = (r && (r.tools || r.items)) || [];

          + '<input type="checkbox" data-tc-i="' + esc(k) + '" value="' + esc(t.name) + '"'
          + (on ? ' checked' : '') + '>'
          + '<span class="tl-l">' + esc(t.label || t.name)

        const sw = host.querySelector('[data-tc-sw="' + k + '"]');
        if (sw && sw.getAttribute('aria-checked') !== 'true') sw.click();
        const picked = [];

        cb.closest('.tool-item').classList.toggle('on', cb.checked);
        const orig = cfGet(cfg, k);
        const before = Array.isArray(orig) ? orig : [];
        if (JSON.stringify(picked.slice().sort()) === JSON.stringify(before.slice().sort())) delete ctx.dirty[k];
        else ctx.dirty[k] = picked;

  });

  qsa('input[data-k], select[data-k]', host).forEach(elm => {
    if (elm.dataset.kind === 'lines') return;
    const handler = () => {
      const k = elm.dataset.k, orig = cfGet(cfg, k);
      let val = elm.value;
      if (elm.tagName === 'INPUT' && elm.type === 'number') val = Number(val);
      /* 掩码字段：没改值就不算改动，否则会把占位符原样写回凭据存储 */
      if (elm.dataset.masked && String(val) === String(orig)) { delete ctx.dirty[k]; ctx.mark(); return; }
      if (JSON.stringify(val) === JSON.stringify(orig)) delete ctx.dirty[k]; else ctx.dirty[k] = val;
      ctx.mark();
    };
    elm.addEventListener('input', handler);
    elm.addEventListener('change', handler);
  });
