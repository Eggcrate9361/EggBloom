     快速滚动时 go 请求只记 pending 就 return，**选中态和内容一起停在旧页**，
     尾巴才一次性跳到最新 → 滚动全程"选中 ≠ 内容"。
     现在拆成两层：
       · 选中态（游标/条目高亮/幽灵页码/连接线）**同步更新**，不受 busy 阻挡
         —— 选中永远 = 手指位置；
       · 内容渲染仍"合并到最新"，且**过期中间页直接不渲染**：setTimeout 到点时

    }

/* ③ 氛围金尘：给面板「呼吸感」。
   分析文的原话是「粒子贴图不受玩家操作输入而产生变化…如果粒子效果可以
   随着玩家的操作输入而有所变化…整体反馈感将会增强许多」——
   所以这里的尘埃会**被鼠标推开**。z-index 45：浮在界面之上，但极淡。 */

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;z-index:45;pointer-events:none';
  document.body.appendChild(c);
  const x = c.getContext('2d');
  let W, H;
  const fit = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const N = 46, ps = [];
  for (let i = 0; i < N; i++) ps.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: .5 + Math.random() * 1.3, vy: -(.05 + Math.random() * .15),
    ph: Math.random() * 6.28, a: .1 + Math.random() * .26
  });
  let mx = -9e3, my = -9e3;
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  (function loop(now){
    requestAnimationFrame(loop);
    const t = now / 1000;
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.y += p.vy;
      p.x += Math.sin(t * .5 + p.ph) * .18;
      /* 鼠标避让：分析文要求的「随操作输入变化」 */
      const dx = p.x - mx, dy = p.y - my, d2 = dx*dx + dy*dy;
      if (d2 < 8100) { const d = Math.sqrt(d2) || 1, f = (90 - d) / 90 * .9;
        p.x += dx / d * f * 2.2; p.y += dy / d * f * 2.2; }
      if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
      if (p.x < -8) p.x = W + 8; else if (p.x > W + 8) p.x = -8;
      x.beginPath();
      x.fillStyle = 'rgba(232,198,132,' + (p.a * (.55 + .45 * Math.sin(t * .9 + p.ph))).toFixed(3) + ')';
      x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    }
  })(performance.now());
})();

setCursor(0); setH(items()[0], CURSOR_H);
render(0);

/* ══════════════════════════════════════════════════════════════════
   关闭确认（Electron）：主进程 close 事件 → 页面内模态。
   独立透明小窗三宗罪（浅色调没实体感/字体回落/全屏挡其他应用），
   页面内模态用界面自己的字体配色，且遮罩天然只覆盖本窗。
   ══════════════════════════════════════════════════════════════════ */
(function closeAsk() {
  try {
    const bridge = window.__EGGBLOOM_WINDOW__;
    if (!bridge || !bridge.onCloseAsk) return;
    bridge.onCloseAsk(() => {
      if (document.getElementById('closeAsk')) return;
      const ov = document.createElement('div');
      ov.id = 'closeAsk';
      ov.className = 'modal-ov';
      ov.innerHTML = '<div class="modal" style="width:min(430px,90vw)">'
        + '<div class="modal-t"><h3>关闭窗口后程序将如何处理？</h3></div>'
        + '<div style="padding:0 var(--s5) var(--s5);color:var(--ink2);font-size:11px;line-height:1.9">'
        + '最小化到托盘可保持协议层和 Bot 在后台运行。</div>'
        + '<div style="display:flex;gap:var(--s3);padding:0 var(--s5) var(--s5)">'
        + '<button class="btn primary" style="flex:1" data-ca="tray">最小化到托盘</button>'
        + '<button class="btn" style="flex:1;border-color:#a34d45;color:#c9584f" data-ca="quit">退出程序</button>'
        + '<button class="btn" data-ca="cancel">取消</button></div></div>';
      document.body.appendChild(ov);
      ov.querySelectorAll('[data-ca]').forEach(b => b.onclick = () => {
        const a = b.dataset.ca;
        ov.remove();
        try { if (a !== 'cancel') bridge.closeAct(a); } catch (x) {}
      });
    });
  } catch (e) {}
})();

(function paletteBoot() {
  try {
    const saved = localStorage.getItem('pv-palette');
    if (saved) document.documentElement.setAttribute('data-palette', saved);
  } catch (e) {}
  /* 当前 UI 版本：后端注入的切换按钮带 data-other=另一版本，反推当前 */
  try {
    const sw = document.getElementById('__uiSwitch');
    window.__pvUiVer = (sw && sw.dataset.other === 'v4') ? 'v3' : 'v4';
  } catch (e) { window.__pvUiVer = 'v4'; }
  try {
    const pal = localStorage.getItem('pv-palette') || 'a';
    if (window.__EGGBLOOM_WINDOW__ && window.__EGGBLOOM_WINDOW__.setPalette) window.__EGGBLOOM_WINDOW__.setPalette(pal);
  } catch (e) {}
})();

/* ══════════════════════════════════════════════════════════════════
   窗口外壳：自绘标题栏（最小化 / 全屏 / 关闭）+ 启动动画
   —— 浏览器直接打开时（没有 window.__EGGBLOOM_WINDOW__）标题栏自动隐藏、
      启动层直接跳过：这两个都是**桌面壳才需要**的东西。
   ══════════════════════════════════════════════════════════════════ */
(function shellBoot() {
  const isDesk = !!(window.__EGGBLOOM_WINDOW__ && window.__EGGBLOOM_WINDOW__.close);
  const boot = document.getElementById('boot');

  /* ── 启动动画 ────────────────────────────────────────────────
     步骤跟着真实进度走（DOM 就绪 → 字体就绪 → 首屏渲染 → 就绪），
     不做假进度条：每一步真完成了才推进，卡在字体加载上时进度条会停在那，
     这比演一段假的百分比更诚实。*/
  const steps = [
    ['系统初始化', 12],
    ['载入界面字体', 34],
    ['装配机械结构', 62],
    ['校准仪表指针', 84],
    ['就绪', 100],
  ];
  let si = 0;
  const step = (idx) => {
    si = idx;
    const m = document.getElementById('bootMsg'), b = document.getElementById('bootBar');
    if (m && steps[idx]) m.textContent = steps[idx][0];
    if (b && steps[idx]) b.style.width = steps[idx][1] + '%';
  };
  const finish = () => {
    step(steps.length - 1);
    setTimeout(() => { if (boot) boot.classList.add('done'); }, 180);
  };
  /* EncryptedText 式乱码解码（用户参考的组件同款）：
     未定格位滚动随机字符，从左到右逐位定格；定格速度前快后慢。*/
  function bootDecode(text, done) {
    const el = document.getElementById('bootTx');
    if (!el) { done && done(); return; }
    const GLYPHS = '!<>-_\\/[]{}=+*^?#01ABCDEF';
    let frame = 0, locked = 0;
    const total = text.length;
    const lockEvery = 3;                       /* 每 3 帧定格一位 → 总时长 ≈ 1.2s */
    const tick = () => {
      frame++;
      if (frame % lockEvery === 0 && locked < total) locked++;
      let out = '';
      for (let i = 0; i < total; i++) {
        out += i < locked ? text[i]
          : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      }
      el.textContent = out;
      if (locked < total) setTimeout(tick, 42);
      else { el.textContent = text; done && done(); }
    };
    tick();
  }

  if (!boot) { /* 浏览器/无启动层：直接到底 */ }
  else if (!isDesk) { boot.remove(); }              /* 浏览器里不演启动动画 */
  else {
    step(0);
    bootDecode('EGGBLOOM');
    /* 字体真的就绪才推进（document.fonts.ready）*/
    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontsReady.then(() => { step(2); });
    /* 等首屏第一帧内容真的画出来 */
    requestAnimationFrame(() => requestAnimationFrame(() => { step(3); }));
    setTimeout(finish, 1500);                       /* 兜底：不卡住启动 */
  }

  /* ── 标题栏 ──────────────────────────────────────────────────*/
  if (!isDesk) {
    document.documentElement.classList.add('tb-off');
    return;
  }
  const W = window.__EGGBLOOM_WINDOW__;
  document.getElementById('tbMin').onclick = () => { try { W.minimize(); } catch (e) {} };
  document.getElementById('tbMax').onclick = () => { try { W.maximize(); } catch (e) {} };
  document.getElementById('tbClose').onclick = () => { try { W.close(); } catch (e) {} };
  try {
    W.onMaximizedState((isMax) => {
      const b = document.getElementById('tbMax');
      if (b) b.classList.toggle('maxed', !!isMax);
      if (b) b.title = isMax ? '退出全屏' : '全屏';
    });
  } catch (e) {}
  /* 双击拖拽区 = 全屏切换（Windows 习惯）*/
  const drag = document.querySelector('.tb-drag');
  if (drag) drag.addEventListener('dblclick', () => { try { W.maximize(); } catch (e) {} });
  /* 标题栏右侧显示当前页名，切页时更新 */
  window.__pvTbPage = function (txt) {
    const e = document.getElementById('tbPage');
    if (e) e.textContent = txt || 'RHODES CONSOLE';
  };
})();

</script>
