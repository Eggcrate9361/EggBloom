<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EggBloom // Desktop</title>
<!-- 字体：**全部本地化，不依赖任何 CDN**
     · 像素体（Press Start 2P / Silkscreen）打包在 webui/fonts/（SIL OFL 1.1，允许打包分发）
     · 中文字体走**系统栈**（苹方 / 微软雅黑 / Noto Sans SC）——
       原本这里挂的是 Google Fonts 的 Noto Sans SC，但**它在大陆加载不到**，
       等于中文正文一直失败、悄悄退回了系统字体。桌面端应用不该为字体请求第三方。 -->
<style id="fonts-local">
  @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;
    font-display:swap;src:url('fonts/press-start-2p-latin-400.woff2') format('woff2')}
  @font-face{font-family:'Silkscreen';font-style:normal;font-weight:400;
    font-display:swap;src:url('fonts/silkscreen-latin-400.woff2') format('woff2')}
  /* 融合像素 12px（简体中文，OFL）：中文用像素字，拉丁仍走 Silkscreen ——
     浏览器按字符逐个回退，所以一行里可以混排两种像素字 */
  @font-face{font-family:'FusionPixelSC';font-style:normal;font-weight:400;
    font-display:swap;src:url('fonts/fusion-pixel-12px-sc.woff2') format('woff2')}
/* 后端注入的右下角「切换到旧版」浮钮：配置中心已有界面切换，隐藏 */
#__uiSwitch,#__uiSwitchBtn{display:none !important}
</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   EggBloom WebUI v4  (T8 重做)
   原则（按用户要求）：
     · 画面简洁 —— 不用渐变光晕、不用装饰图形、不用图表
     · 动态大胆 —— 动的是**框架**：导轨是立体物体，切页整场景参与
     · 字号可读 —— 正文 14px 起，标签最低 12px，绝不做 9px 小字
     · 保留旧版 —— v3 逐字节原样保留，右上角按钮可随时切回对照
   与 v3 的关系：v3 是基线（对照接口用），本文件是重做版。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0a0c; --rail:#0c0c0f; --panel:#0e0e11;
  --line:#1e1e24; --line2:#2a2a32; --line3:#3d3d47;
  --ink:#f0eeea; --ink2:#b4b1ab; --ink3:#84817b; --ink4:#5a5852;
  --accent:#c9a96e; --accent-dim:#8a7350;
  --ok:#6f9e78; --warn:#d0a45c; --err:#b05a52;
  /* 日志分级额外两级：--ai 模型输出、--sys 子系统。取中间调，
     深色/浅色两套 palette 下都能读，因此不随 palette 覆盖 */
  --ai:#6f93a8; --sys:#9b87b8;
  --f-d:var(--f-px0);   /* 像素化：全部字体变量收敛到同一像素栈（v4 字体决策） */
  --f-u:var(--f-px0);
  --f-m:var(--f-px0);
  --f-px0:'Silkscreen','Press Start 2P','FusionPixelSC',Consolas,monospace;  /* 像素三件套（webui/fonts/，全部本地 OFL；中文由 FusionPixelSC 逐字符接管） */
  /* 间距阶梯 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  /* 字号阶梯（最低 12px，保证可读） */
  /* 字号阶梯 —— ★ 全部取 12px 的整数倍：FusionPixel 原生网格 12px，
     只有整倍字号才是硬边（实测 24px=5 级灰度，13px=104 级） */
  --z1:12px; --z2:12px; --z3:12px; --z4:12px; --z5:24px; --z6:24px; --z7:36px; --z8:72px;
  --row:62px; --navpad:26px; --rail-w:290px;
  /* 统一光源：影子一律向右下偏，偏移/模糊/透明度全部由高度推导 */
  --lx:0.42; --ly:0.62;
  --ez:cubic-bezier(.2,.86,.18,1);
  --ez-bold:cubic-bezier(.62,.02,.16,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--f-px0);font-size:var(--z3);line-height:1.55;
  -webkit-font-smoothing:none}   /* ★ none：保住像素硬边（antialiased 会把像素棱磨圆） */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line3)}
::-webkit-scrollbar-thumb:hover{background:var(--ink4)}
::selection{background:rgba(201,169,110,.28)}

.world{position:relative;height:100vh;display:grid;grid-template-columns:var(--rail-w) 1fr;
  transition:grid-template-columns 620ms var(--ez),transform 680ms var(--ez)}
.world.dolly{animation:dolly 680ms var(--ez) both}
@keyframes dolly{0%{transform:scale(1.03) translateX(-8px)}100%{transform:none}}

/* ═══ 导轨：立体物体。容器**不旋转**，深度靠条目抬起 + 按高度推导的投影 ═══ */
.rail{position:relative;z-index:12;background:var(--rail);border-right:1px solid var(--line2);
  overflow:hidden;display:flex;flex-direction:column;
  perspective:1100px;perspective-origin:50% 44%}
.brand{padding:var(--s6) var(--s5) var(--s5);flex:none;position:relative;z-index:4;
  border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-d);font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.brand .tag{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.16em;color:var(--ink4);
  text-transform:uppercase;margin-top:var(--s2)}
.brand .ver{position:absolute;right:var(--s5);top:var(--s6);font-family:var(--f-m);font-size:var(--z1);
  color:var(--ink4);letter-spacing:.1em}

/* ★ 幽灵序号：当前页的巨大数字压在导轨底部。
   这是"导轨也是构图的一部分"的关键 —— 它随切页翻动，让左栏从菜单变成一件排版物。 */
.ghost{position:absolute;left:2px;right:0;bottom:46px;z-index:1;pointer-events:none;user-select:none;
  font-family:var(--f-m);font-weight:500;font-size:172px;line-height:.76;letter-spacing:-.08em;
  color:var(--ink);opacity:.075;text-align:left}
.ghost.flip{animation:ghostIn 560ms var(--ez) both}
@keyframes ghostIn{0%{opacity:0;transform:translateY(30px) scale(.94)}100%{opacity:.075;transform:none}}

.nav{position:relative;z-index:4;padding-top:var(--navpad);padding-bottom:var(--s7);
  overflow-y:auto;flex:1;transform-style:preserve-3d}
.ni{height:var(--row);position:relative;display:block;padding:0 var(--s5) 0 20px;cursor:pointer;
  color:var(--ink3);transform-style:preserve-3d}
.ni .sh{position:absolute;left:16px;right:16px;height:9px;top:calc(50% + 6px);border-radius:50%;
  background:rgba(0,0,0,.92);pointer-events:none;
  transform:translate(calc(var(--h,0px) * var(--lx)),calc(var(--h,0px) * var(--ly)))
            translateZ(calc(var(--h,0px) * -1 - 2px))
            scaleX(calc(1 + var(--h,0px) * 0.012));
  filter:blur(calc(4px + var(--h,0px) * 0.36));
  opacity:calc(var(--h,0px) / 48)}
.ni .bd{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:26px 1fr auto;
  align-items:center;gap:var(--s3);transform:translateZ(var(--h,0px));
  transition:transform 420ms var(--ez)}
.ni .idx{font-family:var(--f-m);font-size:var(--z1);color:var(--ink4);letter-spacing:.04em}
.ni .tx{font-size:var(--z3);letter-spacing:.01em}
.ni .val{font-family:var(--f-m);font-size:var(--z1);color:var(--ink4);opacity:0;
  transform:translateX(-7px);transition:opacity 240ms var(--ez),transform 240ms var(--ez)}
.ni:hover{color:var(--ink2)}
.ni:hover .tx{transform:translateX(4px)}
.ni:hover .val{opacity:1;transform:none}
.ni.on{color:var(--ink)}
.ni.on .idx{color:var(--accent)}
/* ★ 激活项放大到 20px 并右移 —— 导航不是列表，是目录 */
.ni.on .tx{font-weight:600;font-size:20px;transform:translateX(14px)}
.ni.on .val{opacity:1;transform:none;color:var(--ink3)}
.ni.recoil .bd{animation:recoil 420ms var(--ez-bold) both}
@keyframes recoil{0%{transform:translateZ(var(--h,0px)) translateX(0)}
  30%{transform:translateZ(var(--h,0px)) translateX(-9px)}100%{transform:translateZ(var(--h,0px)) translateX(0)}}
.ni.lunge .bd{animation:lunge 520ms var(--ez-bold) both}
@keyframes lunge{0%{transform:translateZ(0) translateX(0)}
  34%{transform:translateZ(46px) translateX(13px)}100%{transform:translateZ(var(--h,0px)) translateX(0)}}

/* ═══ 待定态（滚轮转动螺旋、但还没进入某页）═══
   导航只负责"转"和"我要进哪一页"，内容页在提交前不动：
     · 正对块 + 虚框 + ↵ = 待定（还没进去）
     · 右侧 panel 失焦    = "你还在浏览"
   提交（点击板片 / 回车）后才切页并恢复。状态表达放在**结果侧**（panel 失焦），
   导航侧只做一行提示，避免用户同时读两个地方。 */
.stage{transition:opacity 240ms var(--ez),filter 240ms var(--ez)}
/* ⚠️ 修饰类必须带 `.stage` 前缀，不能写成裸 `.pending`。
   历史事故（2026-10-22 抓到）：这里原本是 `.stage.pending{...}`，
   而下面「未迁移页容器」是**独立布局类** `.pending{max-width:560px;padding:...}`。
   CSS 没有作用域 —— 那个全局 `.pending` 会命中**任何**带 pending 的元素，
   包括 `.stage` 本身。于是每次导航预演（setPend → classList.toggle('pending')）
   舞台都会被压到 560px 宽并吃到 s7 的内边距，正是"看着像渲染坏了"。
   现在两侧彻底分家：舞台用 `.stage.pending`，容器用 `.pending`（已限定在
   `.pending` 只出现在内容区），且全局那条改名为 `.page-todo` 不再叫 pending。 */
.stage.pending{opacity:.62;filter:saturate(.72) brightness(.92)}
.mech.pend .mblk.on .plate .face{border-style:dashed}
.mech.pend .mblk.on .blk-tag b::after{content:'↵';margin-left:6px;color:var(--c10)}
.mech.pend .mech-cap{color:var(--c10)}
/* ═══ 关于"提交骨架"：试过，删了（2026-10-21）═══
   原本的设想：切页时 panel 先挂上树、内容异步填，空壳期用骨架盖住。
   实测 15 个页面逐个验（fetch 人为延迟 900ms，采样点 560ms）：
     · 15/15 页在 await 之前就已同步画好"读取中…"（或等价的自家提示）；
     · .panel.in 本身的 flipIn 420ms 也一直在，切页并不是"硬切"。
   也就是说空壳期**根本不存在**，骨架永远不触发 —— 那是死代码，删掉。
   真解决问题的是下面这条：提交瞬间直到内容落地之前，panel 保持失焦。 */

.ni.wave .tx{animation:waveZ 560ms var(--ez) both}
@keyframes waveZ{0%{color:var(--ink3)}28%{color:var(--accent)}100%{color:var(--ink3)}}
/* ⚠️ 类名一度叫 `.pending`，与下面"未迁移页面容器"的 `.pending` **撞车** ——
   导航项因此吃到了 `padding:48px 0`，把 56px 的条目撑成 96px、游标全部错位。
   改名 `.todo` 彻底避开。命名冲突是这类"看着像渲染坏了"问题的头号原因。 */
.ni.todo .tx::after{content:'未迁移';font-family:var(--f-m);font-size:var(--z1);
  color:var(--ink4);margin-left:var(--s2);letter-spacing:.06em}

/* 游标：挂在 `.nav` 内（与条目**同一个坐标原点**）。
   上一版挂在 `.rail` 下 → 差了整个品牌区的高度（107px），切换后最大错位 271px。
   另外**不用 translateZ** —— 透视会把它的视觉位置按 Z 缩放，造成随位置变化的偏移；
   "浮起"交给下面按高度推导的影子表达，几何就精确了。 */
.cursor{position:absolute;left:0;right:0;height:var(--row);top:0;z-index:2;pointer-events:none;
  transform:translateY(var(--cur,0px));transition:transform 470ms var(--ez)}
.cursor .csh{position:absolute;left:14px;right:14px;top:calc(50% + 8px);height:12px;border-radius:50%;
  background:rgba(0,0,0,.92);filter:blur(22px);opacity:.85;
  transform:translate(calc(52px * var(--lx)),calc(52px * var(--ly)))}
.cursor .cfill{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(201,169,110,.20),rgba(201,169,110,.05) 58%,transparent)}
.cursor .cedge{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}

/* ═══ 主区 ═══ */
.main{position:relative;z-index:8;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{padding:var(--s6) var(--s7) var(--s5) 40px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;gap:var(--s5)}
.top .sec{font-family:var(--f-m);font-size:var(--z2);letter-spacing:.3em;color:var(--ink3);
  text-transform:uppercase}
/* ★ 页面标题放到 72px：整个顶栏变成一次排版表态。
   旁边那行 meta 保持小字 —— 大小对比本身就是张力，不需要装饰。 */
.top h2{font-family:var(--f-d);font-size:72px;font-weight:600;letter-spacing:-.03em;
  line-height:1;margin-top:var(--s2)}
/* ★ 常驻连接线：当前导航项与内容之间的 tie。
   剖面不该只在切页那一瞬存在 —— 它应该一直指着当前位置。 */
.tie{position:absolute;left:0;width:150px;height:1px;z-index:6;pointer-events:none;
  transform-origin:left center;opacity:0;
  background:linear-gradient(90deg,var(--accent),rgba(201,169,110,.35) 46%,transparent)}
.tie.on{animation:tieIn 560ms var(--ez) both}
@keyframes tieIn{0%{transform:scaleX(0);opacity:0}28%{opacity:1}
  100%{transform:scaleX(1);opacity:.85}}
.top h2.slam{animation:slam 340ms var(--ez-bold) both}
@keyframes slam{0%{transform:translateZ(-200px) translateX(30px);opacity:0}
  46%{opacity:1}100%{transform:none;opacity:1}}
.top .right{margin-left:auto;text-align:right;font-family:var(--f-m);font-size:var(--z2);
  color:var(--ink3);line-height:1.9}

.stage{flex:1;overflow:hidden;position:relative;perspective:1500px;perspective-origin:0% 50%}
.slab{position:absolute;left:0;top:0;width:130%;height:200px;z-index:9;pointer-events:none;opacity:0;
  transform-origin:left center;
  background:linear-gradient(90deg,rgba(201,169,110,.30),rgba(201,169,110,.06) 40%,transparent 70%)}
.slab::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,rgba(255,246,228,.9),var(--accent) 22%,transparent 78%)}
.slab.run{animation:slabRun 640ms var(--ez-bold) both}
@keyframes slabRun{0%{transform:translateX(-20%) rotateX(76deg) scaleY(.2);opacity:0}
  12%{opacity:1}100%{transform:translateX(72%) rotateX(76deg) scaleY(1);opacity:0}}

.panel{position:absolute;inset:0;overflow:auto;padding:var(--s6) var(--s7) var(--s8) 40px;
  transform-origin:left center;background:var(--panel)}
.panel.in{animation:flipIn 420ms var(--ez-bold) both}
.panel.out{animation:flipOut 210ms var(--ez-bold) both;pointer-events:none}
@keyframes flipIn{0%{transform:rotateY(-32deg) translateZ(-110px);opacity:.5}
  42%{opacity:1}72%{transform:rotateY(3deg) translateZ(12px)}
  100%{transform:none;opacity:1}}
@keyframes flipOut{0%{transform:none;opacity:1}
  100%{transform:rotateY(-32deg) translateZ(-110px);opacity:.5}}
.panel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--accent) 45%,transparent);opacity:0}
.panel.in::before{animation:hinge 420ms var(--ez-bold) both}
@keyframes hinge{0%{opacity:1}50%{opacity:.4}100%{opacity:0}}
.stage.upward .panel.in{animation-name:flipInUp}
@keyframes flipInUp{0%{transform:rotateY(-32deg) translateZ(-110px) translateY(-38px);opacity:.5}
  42%{opacity:1}72%{transform:rotateY(3deg) translateZ(12px) translateY(3px)}
  100%{transform:none;opacity:1}}

/* ═══ 版式原语（简洁：线 + 字 + 留白，不装盒子）═══ */
.hd{display:flex;align-items:baseline;gap:var(--s4);margin:0 0 var(--s4)}
.hd .lab{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.18em;color:var(--ink4);
  text-transform:uppercase;white-space:nowrap}
.hd .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s6) var(--s7);
  padding:var(--s2) 0 var(--s6)}
.st .lab{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.14em;color:var(--ink4);text-transform:uppercase}
.st .v{font-family:var(--f-d);font-size:var(--z7);font-weight:600;line-height:1.1;margin-top:var(--s2);
  word-break:break-all}
.st .v.mono{font-family:var(--f-m);font-size:var(--z6);font-weight:500}
.st .c{font-size:var(--z2);color:var(--ink4);margin-top:var(--s1)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s5);align-items:baseline;
  padding:var(--s1) 0}
.kv dt{font-family:var(--f-m);font-size:var(--z2);color:var(--ink4);white-space:nowrap}
.kv dd{font-size:var(--z3);color:var(--ink2);word-break:break-all}

.rows{border-top:1px solid var(--line)}
.row{display:grid;align-items:center;gap:var(--s4);padding:var(--s3) 0;
  border-bottom:1px solid var(--line);font-size:var(--z3)}
.row.head{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink4);padding-bottom:var(--s2)}
.row .dim{color:var(--ink3)}
.row .num{font-family:var(--f-m);font-variant-numeric:tabular-nums}

.sig{display:inline-flex;align-items:center;gap:var(--s2);font-family:var(--f-m);font-size:var(--z2);
  color:var(--ink3)}
.sig i{width:7px;height:7px;border-radius:50%;background:var(--ink4);flex:none}
.sig.ok i{background:var(--ok)}
.sig.warn i{background:var(--warn)}
.sig.err i{background:var(--err)}
.sig.live i{background:var(--accent);animation:br 2.4s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.35}}

.btn{display:inline-flex;align-items:center;gap:var(--s2);font-family:var(--f-m);font-size:var(--z2);
  letter-spacing:.08em;color:var(--ink2);border:1px solid var(--line3);padding:var(--s2) var(--s4);
  transition:color 120ms var(--ez),border-color 120ms var(--ez),background-color 120ms var(--ez)}
.btn:hover{color:var(--ink);border-color:var(--ink4);background:rgba(255,255,255,.03)}
.btn.primary{color:var(--accent);border-color:var(--accent-dim);background:rgba(201,169,110,.10)}
.btn[disabled]{color:var(--ink4);border-color:var(--line2);cursor:default}
/* 紧凑变体：一行里要并排三个动作时用（默认 .btn 的 padding 会把它们挤成两行） */
.btn.sm{padding:var(--s1) var(--s2);font-size:var(--z1);letter-spacing:.04em}

.fld{display:flex;flex-direction:column;gap:var(--s1)}
.fld>label{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.14em;color:var(--ink4);
  text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;
  border-bottom:1px solid var(--line2);color:var(--ink);font-size:var(--z3);padding:var(--s2) 0;outline:none;
  transition:border-bottom-color 140ms var(--ez)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--accent)}

.log{font-family:var(--f-m);font-size:var(--z2);line-height:1.85}
.log .ln{display:grid;grid-template-columns:38px 84px 62px 1fr;align-items:baseline;
  border-bottom:1px solid var(--line)}
.log .ln:last-child{border-bottom:0}
.log .no{color:var(--ink4);text-align:right;padding-right:var(--s2);border-right:1px solid var(--line)}
.log .ts{color:var(--ink4);padding-left:var(--s3)}
.log .lv{padding-left:var(--s3);color:var(--ink3)}
.log .lv.ok,.log .lv.send{color:var(--ok)}
.log .lv.warn{color:var(--warn)}
.log .lv.err{color:var(--err)}
.log .lv.ai{color:var(--ai)}
.log .lv.sys{color:var(--sys)}
.log .lv.info{color:var(--ink4)}
/* 来源徽标：core / app / data / temp（2026-10-25，日志并流后需要分得清出处）*/
.log .tx .src{font-style:normal;margin-right:6px;padding:0 4px;border:1px solid var(--line2);
  border-radius:3px;color:var(--ink4);font-size:9px;letter-spacing:.04em;vertical-align:1px}
.log .tx{padding-left:var(--s3);color:var(--ink2);white-space:pre-wrap;word-break:break-word}
/* 正文只在「需要抬头看」的级别上着色；info 保持中性，否则整页花掉 */
.log .tx.lv-err{color:var(--err)}
.log .tx.lv-warn{color:var(--warn)}
.log .tx.lv-ai{color:var(--ink)}

/* ── 定高滚动框 + 「回到最新」圆钮（日志 / 对话 / 终端输出共用）──────────
   用户：内容不能把页面无限撑下去，要固定高、里面自己滚；往上翻的时候
   自动刷新不许把视口拽回底部。圆钮形态参照给出的参考图：深色圆底 +
   三点 + 箭头，回到底部后自动隐藏。 */
.pv-wrap{position:relative;min-width:0}
.pv-jump{position:absolute;right:12px;bottom:12px;z-index:8;width:38px;height:38px;
  border:1px solid var(--line3);border-radius:50%;background:var(--deep);color:var(--ink3);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.85);
  transition:color 120ms var(--ez),border-color 120ms var(--ez)}
.pv-jump:hover{color:var(--accent);border-color:var(--accent-dim)}
.pv-jump[hidden]{display:none}
.pv-jump .dots{width:14px;height:4px;background:
  radial-gradient(circle 1.6px at 2px 50%,currentColor,transparent 2.2px),
  radial-gradient(circle 1.6px at 7px 50%,currentColor,transparent 2.2px),
  radial-gradient(circle 1.6px at 12px 50%,currentColor,transparent 2.2px)}
.pv-jump .arw{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor}
.pv-jump .n{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 3px;display:none;
  font-family:var(--f-m);font-size:9px;line-height:16px;text-align:center;
  color:var(--deep);background:var(--accent)}
.pv-jump.has-n .n{display:block}

.chat{display:flex;flex-direction:column;gap:var(--s4);padding-bottom:var(--s5)}
.msg{display:grid;grid-template-columns:64px 1fr;gap:var(--s4);align-items:baseline}
.msg .who{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.12em;color:var(--ink4);
  text-transform:uppercase;text-align:right}
.msg .what{font-size:var(--z3);color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.msg.me .what{color:var(--ink)}
.msg.me .who{color:var(--accent)}
/* Agent 轨迹里的「思考过程」（事件类型 thinking）：比结论**弱一档** ——
   次级字色 + 虚线左边框。它只是过程，不该和答复抢注意力。 */
.msg.think .tx{font-size:var(--z2);color:var(--ink3);border-left:2px dotted var(--line3);
  padding-left:var(--s3);white-space:pre-wrap}
.msg.think .who{color:var(--ink4)}
/* 权限询问事件：要显眼（金线），因为它是"等你回应"的那一条 */
.msg.perm .tx{border-left:2px solid var(--c10);padding-left:var(--s3);color:var(--ink2)}
.msg.perm .who{color:var(--c10)}
/* 失败事件（工具异常 / 执行被拒 / blocked）：**必须看得见** ——
   此前 agEventKind 已归 err 档，但这里没有 .msg.err .tx 规则 →
   颜色与普通消息无异 → "红字报错"落空。实线红边 + 红字。 */
.msg.err .tx{border-left:2px solid var(--err);padding-left:var(--s3);color:var(--err)}
.msg.err .who{color:var(--err)}
/* 思维链实时流：标题旁三点脉冲 + 文末闪烁光标（"正在想"的观感）*/
.msg.live .who{color:var(--ink3)}
.msg.live .dots{display:inline-block;width:14px;height:8px;margin-left:6px;
  background:radial-gradient(circle 2px at 3px 50%,var(--c10),transparent 2px),
             radial-gradient(circle 2px at 7px 50%,var(--c10),transparent 2px),
             radial-gradient(circle 2px at 11px 50%,var(--c10),transparent 2px);
  animation:pvblink 1.1s steps(1,end) infinite}
.msg.live .caret{display:inline-block;width:7px;height:11px;margin-left:2px;
  background:var(--ink3);vertical-align:-1px;animation:pvblink .9s steps(1,end) infinite}
@keyframes pvblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
/* 消息级操作（撤回/编辑/删除）：平时几乎隐形，悬停气泡才浮现 */
.msg-ops{display:flex;gap:var(--s3);margin-top:3px;opacity:0;transition:opacity 120ms var(--ez)}
.msg:hover .msg-ops{opacity:1}
/* ── 过程消息（Agent 轨迹的呈现层重构 · 用户参考"过程实时动态输出"形态）──
   思维链/工具调用不再各占一个大气泡，而是收进一个可折叠的「过程消息」区：
   工具 = 紧凑单行（图标 + 中文动词 + 对象 + 状态），思考 = 行间流出的正文。
   最终答复留在区外，过程与结果分层，"有没有在想"一眼可见。 */
.proc{border:1px solid var(--line);background:rgba(255,255,255,.014)}
.proc-hd{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  cursor:pointer;user-select:none;font-family:var(--f-m);font-size:var(--z1);
  letter-spacing:.14em;color:var(--ink3)}
.proc-hd:hover{color:var(--ink)}
.proc-hd .tw{font-style:normal;transition:transform 160ms var(--ez)}
.proc.closed .tw{transform:rotate(-90deg)}
.proc-hd .n{margin-left:auto;color:var(--ink4);letter-spacing:.06em}
.proc-body{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3);
  border-top:1px dashed var(--line2)}
.proc.closed .proc-body{display:none}
.p-think{font-size:var(--z2);color:var(--ink3);line-height:1.8;white-space:pre-wrap;
  word-break:break-word;border-left:2px dotted var(--line3);padding-left:var(--s3)}
.p-think .lb{display:block;font-family:var(--f-m);font-size:var(--z1);letter-spacing:.14em;
  color:var(--ink4);margin-bottom:2px}
.p-tool{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--z2);
  color:var(--ink2);line-height:1.8;min-width:0}
.p-tool .ic{color:var(--ink4);flex:none;font-style:normal}
.p-tool .nm{color:var(--ink3);flex:none;font-weight:400;letter-spacing:.06em}
.p-tool .tg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--ink2)}
.p-tool .st{margin-left:auto;flex:none;font-size:var(--z1);color:var(--ink4);letter-spacing:.06em;
  white-space:nowrap}
.p-tool .tg{text-transform:none}   /* 路径/命令保持原样大小写，别被像素体渲染成大写 */
.p-tool .nm{color:var(--ink3)}
.p-tool.run .st{display:inline-block;width:14px;height:8px;
  background:radial-gradient(circle 2px at 3px 50%,var(--c10),transparent 2px),
             radial-gradient(circle 2px at 7px 50%,var(--c10),transparent 2px),
             radial-gradient(circle 2px at 11px 50%,var(--c10),transparent 2px);
  animation:pvblink 1.1s steps(1,end) infinite}
.p-tool.bad{color:var(--err)} .p-tool.bad .st,.p-tool.bad .nm{color:var(--err)}
.p-sys{font-size:var(--z2);color:var(--ink4);line-height:1.7}
.p-perm{font-size:var(--z2);color:var(--c10);border-left:2px solid var(--c10);
  padding-left:var(--s3);line-height:1.7}
/* 插件创作区（审批 + 双历史）。状态类一律 fg- 前缀 —— 裸 pending/approved
   会撞上既有独立布局类 .pending（未迁移页容器，125 行注释警告过）。 */
.fg-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);
  border:1px solid var(--line);margin-bottom:var(--s2);font-size:var(--z2)}
.fg-row.fg-pending{border-color:var(--c10);background:rgba(201,169,110,.06)}
.fg-row .fg-nm{font-weight:600;color:var(--ink);letter-spacing:.04em}
.fg-row .fg-d{color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fg-row .fg-src{font-size:var(--z1);color:var(--ink4);letter-spacing:.06em;flex:none}
.fg-row .fg-st{font-size:var(--z1);letter-spacing:.06em;flex:none}
.fg-row .fg-st.fg-pending{color:var(--c10)}.fg-row .fg-st.fg-approved{color:var(--ok)}
.fg-row .fg-st.fg-rejected{color:var(--ink4)}.fg-row .fg-st.fg-failed,.fg-row .fg-st.fg-approved_load_failed{color:var(--err)}
.fg-row .fg-act{display:flex;gap:var(--s2);flex:none}
.fg-empty{color:var(--ink4);font-size:var(--z2);padding:var(--s2)}
/* ── 通知可视化（通知页时间线 + 全局 toast）── */
.nt-list{display:flex;flex-direction:column;gap:var(--s2)}
.nt-row{display:flex;gap:var(--s3);align-items:baseline;border:1px solid var(--line);
  padding:var(--s2) var(--s3);font-size:var(--z2);line-height:1.7}
.nt-row .nt-ev{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.12em;color:var(--ink3);
  text-transform:uppercase;flex:none;min-width:64px;text-align:right}
.nt-row .nt-tx{flex:1;min-width:0;color:var(--ink2);word-break:break-word}
.nt-row .nt-ts{flex:none;font-family:var(--f-m);font-size:var(--z1);color:var(--ink4);letter-spacing:.06em}
.nt-row .nt-st{flex:none;font-family:var(--f-m);font-size:var(--z1);letter-spacing:.08em}
.nt-st.s-sent{color:var(--ok)}.nt-st.s-partial{color:var(--warn)}
.nt-st.s-failed{color:var(--err)}
.nt-st.s-skipped_disabled,.nt-st.s-skipped_switch,.nt-st.s-skipped_no_admin{color:var(--ink4)}
.nt-qq{display:inline-block;font-family:var(--f-m);font-size:var(--z1);letter-spacing:.04em;
  border:1px solid var(--line2);padding:0 4px;margin:0 2px;color:var(--ink3)}
.nt-qq.bad{border-color:var(--err);color:var(--err)}
/* 全局通知 toast：右下角像素卡，点击跳通知页，8s 自动收 */
.ntf-wrap{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;
  flex-direction:column;gap:var(--s2);max-width:min(380px,88vw)}
.ntf{border:1px solid var(--line2);background:var(--panel);padding:var(--s3) var(--s4);
  cursor:pointer;box-shadow:6px 8px 0 rgba(0,0,0,.35);animation:ntfIn 220ms var(--ez) both}
.ntf:hover{border-color:var(--accent-dim)}
.ntf .ntf-h{font-family:var(--f-m);font-size:var(--z1);letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:4px}
.ntf .ntf-b{font-size:var(--z2);color:var(--ink2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntf.ok .ntf-h{color:var(--ok)}.ntf.warn .ntf-h{color:var(--warn)}.ntf.bad .ntf-h{color:var(--err)}
@keyframes ntfIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
/* ── 多提供商管理卡片（v3 功能回补 · v4 设计语言）──
   每张卡 = 一个提供商：名字 + base_url + 模型数 + 独立 Key 标记；
   点卡=选用（回填 api_url/提供商并保存），Edit=弹窗编辑（含每提供商专属 Key），
   Del=删除。当前生效提供商描金边。 */
.pv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s3)}
/* 未配置模型的引导横幅：整宽一条，颜色用强调金，不用红色（不是错误，只是没开始） */
.setup-bn{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  flex-wrap:wrap;padding:var(--s4) var(--s5);margin-bottom:var(--s4);
  border:1px solid var(--accent-dim);background:var(--panel);position:relative}
.setup-bn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c10)}
.setup-bn-l{display:flex;flex-direction:column;gap:5px;min-width:0;padding-left:var(--s3)}
.setup-bn-l b{font-family:var(--f-m);font-size:12px;letter-spacing:.16em;color:var(--c10);font-weight:400}
.setup-bn-l span{font-size:11px;color:var(--ink3);line-height:1.6;letter-spacing:.02em;max-width:70ch}
.setup-bn-r{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}

/* ══ 日志页：事件流（2026-10-24 重新设计）═════════════════════════
   旧页面是把日志文件整行铺出来：调试打印、Traceback、插件内部流水混在一起，
   一条"谁说了什么"和一串"loaded module x"长得一样，谁也读不出来。
   现在按**事件**画：每一行只回答一个问题 —— 发生了什么。
     · 消息  谁在哪个群/私聊说了什么
     · 决策  为什么回 / 为什么不回（放行、建议插话、判定不接、沉默）
     · 工具  这一轮调了哪些工具
     · 出错  真正需要抬头看的异常
   调试行不进这一页（去「控制台」看原始日志），但在页脚点名被隐藏了多少条，
   不让人以为日志丢了。 */
.evt-chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.evt-chip{display:inline-flex;align-items:center;gap:7px;padding:5px var(--s3);
  border:1px solid var(--line2);color:var(--ink3);font-size:12px;letter-spacing:.04em;
  transition:border-color 120ms var(--ez),color 120ms var(--ez),background-color 120ms var(--ez)}
.evt-chip:hover{border-color:var(--ink4);color:var(--ink2)}
.evt-chip .d{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.evt-chip .n{font-variant-numeric:tabular-nums;color:var(--ink4);font-size:12px}
.evt-chip.on{color:var(--ink);border-color:var(--accent-dim);background:rgba(201,169,110,.07)}
.evt-chip.on .n{color:var(--accent)}
.evt-list{position:relative}
.evt{display:grid;grid-template-columns:64px 1fr;gap:var(--s4);align-items:start;
  padding:11px 0;border-bottom:1px solid var(--line)}
.evt:last-child{border-bottom:0}
.evt-t{font-family:var(--f-m);font-size:12px;color:var(--ink4);letter-spacing:.03em;
  padding-top:1px;font-variant-numeric:tabular-nums}
/* 左侧一条时间轴：点是事件类别，线把它们串起来。四类各一色，但只有决策/工具/出错
   上色 —— 消息占绝大多数，跟着上色整页就花了。 */
.evt-b{min-width:0;position:relative;padding-left:var(--s4)}
.evt-b::before{content:'';position:absolute;left:0;top:6px;bottom:-12px;width:1px;background:var(--line2)}
.evt:last-child .evt-b::before{display:none}
.evt-b::after{content:'';position:absolute;left:-2px;top:5px;width:5px;height:5px;
  border-radius:50%;background:var(--ink4)}
.evt.k-message .evt-b::after{background:var(--ink3)}
.evt.k-decision .evt-b::after{background:var(--accent)}
.evt.k-tool .evt-b::after{background:var(--ai)}
.evt.k-cost .evt-b::after{background:var(--ok)}
.evt.k-error .evt-b::after{background:var(--err)}
.evt-hd{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:3px}
.evt-k{font-family:var(--f-m);font-size:12px;letter-spacing:.14em;color:var(--ink4)}
.evt.k-decision .evt-k{color:var(--accent)}
.evt.k-tool .evt-k{color:var(--ai)}
.evt.k-cost .evt-k{color:var(--ok)}
.evt.k-error .evt-k{color:var(--err)}
.evt-tag{font-size:12px;color:var(--ink4);letter-spacing:.02em}
.evt-who{font-size:12px;color:var(--ink3);letter-spacing:.02em;min-width:0}
.evt-who b{color:var(--ink2);font-weight:400}
.evt-x{font-size:12px;color:var(--ink2);line-height:1.7;word-break:break-word;
  white-space:pre-wrap;max-width:96ch}
.evt.k-message .evt-x{color:var(--ink);font-size:var(--z3)}
.evt.k-error .evt-x{color:var(--err)}
.evt.out .evt-x{color:var(--accent)}
.evt-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.evt-tool{font-family:var(--f-m);font-size:12px;color:var(--ai);padding:1px 7px;
  border:1px solid var(--line2)}
.evt-more{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--line2);
  background:var(--panel);font-size:12px;color:var(--ink3)}
.evt-more b{color:var(--ink2);font-weight:400;font-variant-numeric:tabular-nums}

/* ══ 插件页：网格 + 每张卡一个 1:1 插图位（2026-10-24）══════════════
   原来是「名称 | 状态 | 操作」的三列窄行，插件一多就是一堵墙。
   改成商户陈列式的卡片网格：每卡上方留一个**正方形**位置放插图
   （后端目前没有插图字段，所以是虚线空位，不是破图），下方才是名字、
   简介、标签与开关。字数不齐也不会把网格拉歪 —— 卡片等高，内容自动换行。 */
.plg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(246px,1fr));gap:var(--s4)}
.plg{display:flex;flex-direction:column;border:1px solid var(--line2);background:var(--panel);
  transition:border-color 140ms var(--ez),transform 200ms var(--ez)}
.plg:hover{border-color:var(--accent-dim)}
.plg.off{opacity:.62}
/* 1:1 插图位：空着也要有内容 —— 大号首字母 + 角标「1:1」，一眼看出这是留的位
   而不是渲染失败。斜纹底让空位有材质，不至于是一块死白。 */
.plg-art{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line);overflow:hidden;
  background:
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(140,140,140,.05) 7px 8px)}
.plg-art .ch{font-family:var(--f-m);font-size:64px;line-height:1;color:var(--ink);
  opacity:.10;letter-spacing:-.04em}
.plg-art .rt{position:absolute;right:8px;bottom:7px;font-family:var(--f-m);font-size:9px;
  letter-spacing:.14em;color:var(--ink4)}
.plg-art .dot{position:absolute;left:9px;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--ink4)}
.plg:not(.off) .plg-art .dot{background:var(--ok)}
.plg-b{padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:6px;flex:1}
.plg-n{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.plg-n b{font-size:var(--z3);font-weight:400;color:var(--ink);word-break:break-all}
.plg-n em{font-style:normal;font-family:var(--f-m);font-size:9px;color:var(--ink4);letter-spacing:.1em}
.plg-d{font-size:12px;color:var(--ink3);line-height:1.65;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.me-card img{width:100%;display:block;height:132px;object-fit:cover}
.me-cards.mas .me-card img{height:auto;object-fit:contain}
.me-nm{font-size:9px;color:var(--ink4);word-break:break-all;line-height:1.4}
.me-tg{display:flex;flex-wrap:wrap;gap:4px}
.me-tg span{font-size:9px;padding:2px 6px;border:1px solid var(--line2);color:var(--ink3)}
.me-ac{display:flex;gap:5px;margin-top:auto}
.me-ac button{flex:1;font-size:9px;padding:4px 0;letter-spacing:.1em}
@media (max-width:900px){.me-wrap{grid-template-columns:1fr}.me-side{border-right:0;
  border-bottom:1px solid var(--line);padding:0 0 var(--s4)}}

/* Bot 页：大号数字锚点 + 右侧小注（参考稿手法） */
.bot-hero{position:relative;display:flex;align-items:flex-start;gap:var(--s6);
  padding:var(--s5) 0 var(--s4);border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.bh-num{font-family:var(--f-cn);font-size:min(56px,6.4vw);font-weight:900;line-height:.9;
  letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.bh-num.idle{color:var(--ink4)}
.bh-side{display:flex;flex-direction:column;gap:7px;padding-top:10px;min-width:0}
.bh-side span{font-family:var(--f-m);font-size:9px;letter-spacing:.2em;color:var(--ink4);white-space:nowrap}
.bh-rule{position:absolute;right:0;bottom:-1px;width:26%;height:2px;
  background:linear-gradient(90deg,transparent,var(--c10))}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px var(--s4);
  align-items:baseline}
.kv .k{font-family:var(--f-m);font-size:9px;letter-spacing:.16em;color:var(--ink4);white-space:nowrap}
.kv .v{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.kv{grid-template-columns:auto 1fr}}

/* 配置中心顶部：界面控件（UI 版本 + 配色） */
.cf-uicfg{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.cf-uicfg select{background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:4px 0;outline:none;cursor:pointer}
.cf-uicfg select:focus{border-bottom-color:var(--c10)}

/* 界面面板：版本卡与配色卡 */
.ui-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3)}
.ui-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;
  gap:6px;padding:var(--s4);border:1px solid var(--line);background:var(--panel);
  cursor:pointer;text-align:left;transition:border-color 120ms linear}
.ui-card:hover{border-color:var(--line3)}
.ui-card.on{border-color:var(--c10);box-shadow:0 0 0 1px var(--c10) inset}
.ui-card b{font-size:13px;color:var(--ink)}
.ui-card span{font-size:9px;color:var(--ink4);line-height:1.5}
.ui-card .uion{position:absolute;right:10px;top:10px;font-style:normal;font-size:9px;
  letter-spacing:.18em;color:var(--c10);border:1px solid var(--c10);padding:2px 6px}
.ui-card .pdot{width:22px;height:22px;border:1px solid var(--line2);display:block}

/* focusedForm 换皮：卡片式字段（通知页 / 群聊行为页） */
.ff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s3)}
.ff-card{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);
  border:1px solid var(--line);background:var(--panel)}
.ff-card:hover{border-color:var(--line3)}
.ff-main{flex:1;min-width:0}
.ff-t{font-size:12px;color:var(--ink)}
.ff-d{font-size:9px;color:var(--ink4);margin-top:3px;word-break:break-all}
.ff-in{width:130px;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:12px;padding:6px 0;outline:none;text-align:right}
.ff-in:focus{border-bottom-color:var(--c10)}
.ff-card.is-bool .sw{flex:none}

/* 群聊工具白名单：勾选列表（数据源 /tools） */
.tool-list{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);padding:2px}
.tool-item{display:flex;align-items:baseline;gap:var(--s3);padding:7px 9px;cursor:pointer;
  border-left:2px solid transparent;transition:background 120ms linear}
.tool-item:hover{background:var(--c30-ink)}
.tool-item.on{border-left-color:var(--c10);background:color-mix(in srgb,var(--c10) 7%,transparent)}
.tool-item input{appearance:none;-webkit-appearance:none;width:14px;height:14px;flex:none;
  border:1px solid var(--line3);background:var(--deep);display:grid;place-content:center;cursor:pointer}
.tool-item input:checked{background:var(--c10);border-color:var(--c10)}
.tool-item input:checked::after{content:'';width:7px;height:4px;border-left:2px solid var(--deep);
  border-bottom:2px solid var(--deep);transform:rotate(-45deg) translate(1px,-1px)}
.tool-item .tl-l{font-size:12px;color:var(--ink2);flex:none;min-width:118px}
.tool-item.on .tl-l{color:var(--ink)}
.tool-item .tl-l i{font-style:normal;font-size:9px;color:var(--c10);border:1px solid var(--c10);
  padding:1px 4px;margin-left:6px}
.tool-item .tl-d{font-size:9px;color:var(--ink4);flex:1;min-width:0}


/* ══════════════════════════════════════════════════════════════════
   自绘窗口标题栏 + 启动动画（v4 视觉：直角、像素字、硬边）
   —— 标题栏只在 Electron 里出现（浏览器直接打开时自动隐藏，并把内容顶上去）
   ══════════════════════════════════════════════════════════════════ */
:root{--tb-h:36px}
html.tb-off{--tb-h:0px}

/* ── 标题栏 ─────────────────────────────────────────────────── */
.tb{position:fixed;left:0;right:0;top:0;height:var(--tb-h);z-index:80;
  display:flex;align-items:stretch;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-2);
  font-family:var(--f-m);user-select:none;-webkit-user-select:none;
  transition:height 200ms var(--ez),opacity 200ms var(--ez)}
html.tb-off .tb{height:0;opacity:0;pointer-events:none;border-bottom-color:transparent}
.tb-drag{flex:1;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);
  -webkit-app-region:drag;min-width:0}
.tb-mark{width:9px;height:9px;flex:none;background:var(--c10);
  box-shadow:0 0 8px color-mix(in srgb,var(--c10) 55%,transparent)}
.tb-name{font-size:11px;letter-spacing:.3em;color:var(--ink2);white-space:nowrap}
.tb-sep{width:1px;height:12px;background:var(--line-2);flex:none}
.tb-page{font-size:9px;letter-spacing:.24em;color:var(--ink4);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-btns{display:flex;align-items:stretch;flex:none;-webkit-app-region:no-drag}
.tb-btn{width:44px;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;padding:0;position:relative;
  transition:background 120ms linear}
.tb-btn:hover{background:color-mix(in srgb,var(--c10) 16%,transparent)}
.tb-btn:active{background:color-mix(in srgb,var(--c10) 28%,transparent)}
.tb-btn i{position:relative;display:block;width:11px;height:11px;color:var(--ink2)}
/* 三个键都用**细线方块**画，不依赖字体符号（避免缺字变豆腐块） */
.tb-btn.tb-min i::before{content:'';position:absolute;left:0;right:0;bottom:1px;height:1px;background:currentColor}
.tb-btn.tb-max i::before{content:'';position:absolute;inset:1px 0;border:1px solid currentColor}
.tb-btn.tb-max.maxed i::before{inset:3px 0 0 3px;border-width:0 0 1px 1px}
.tb-btn.tb-max.maxed i::after{content:'';position:absolute;left:0;top:0;width:8px;height:8px;
  border:1px solid currentColor;border-bottom:0;border-right:0}
.tb-btn.tb-close:hover{background:#b05a52}
.tb-btn.tb-close:hover i{color:#fff}
.tb-btn.tb-close i::before,.tb-btn.tb-close i::after{content:'';position:absolute;
  left:0;right:0;top:5px;height:1px;background:currentColor}
.tb-btn.tb-close i::before{transform:rotate(45deg)}
.tb-btn.tb-close i::after{transform:rotate(-45deg)}
/* 内容整体让出标题栏高度 */
.world,.wm,.deco,.hud{top:var(--tb-h)}
.world{position:absolute;inset:var(--tb-h) 0 0 0;height:auto}
.wm{position:fixed}
.hud{top:calc(var(--tb-h) + 112px)}

/* ── 启动动画 ───────────────────────────────────────────────── */
.boot{position:fixed;inset:0;z-index:200;background:var(--bg);
  display:grid;place-items:center;pointer-events:auto;
  transition:opacity 520ms var(--ez),visibility 520ms}
.boot.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s5)}
.boot-mark{width:14px;height:14px;background:var(--c10);margin-bottom:var(--s2);
  animation:bootPulse 1.5s steps(4,end) infinite}
@keyframes bootPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.boot-t{font-family:var(--f-cn);font-size:min(52px,7vw);font-weight:900;letter-spacing:.06em;
  color:var(--ink);display:flex;align-items:baseline}
.boot-t em{font-style:normal;width:3px;height:.82em;background:var(--c10);margin-left:6px;
  animation:bootCaret .9s steps(2,end) infinite}
@keyframes bootCaret{0%,100%{opacity:1}50%{opacity:0}}
.boot-s{font-family:var(--f-m);font-size:10px;letter-spacing:.42em;color:var(--ink4);
  display:flex;gap:3px;align-items:center}
.boot-bar{width:min(320px,44vw);height:2px;background:var(--line-2);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--c10);
  transition:width 260ms linear}
/* 四角标记 + 扫描线：用几何而不是图片 */
.boot::before,.boot::after{content:'';position:absolute;width:26px;height:26px;
  border:2px solid var(--c30-ink);opacity:.7}
.boot::before{left:26px;top:26px;border-right:0;border-bottom:0}
.boot::after{right:26px;bottom:26px;border-left:0;border-top:0}
.boot-scan{position:absolute;left:0;right:0;height:96px;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c10) 8%,transparent),transparent);
  animation:bootScan 3.4s cubic-bezier(.5,0,.5,1) infinite}
@keyframes bootScan{0%{top:-96px}100%{top:100%}}

/* ══════════════════════════════════════════════════════════════════
   螺旋卡片（单面版）：序号与图样**融合**——大序号为核，图样围绕它布置。
   去掉 8 面折叠盒（sidef/botf/topf）——立体折叠的失败痕迹。
   ══════════════════════════════════════════════════════════════════ */
.mech .mblk{backface-visibility:hidden}
.plate .face::after{display:none}
.plate .face{background:linear-gradient(168deg,#fff,var(--panel));
  border:1px solid var(--c30-ink);
  box-shadow:inset 0 10px 22px rgba(0,0,0,.10),inset 0 2px 0 rgba(255,255,255,.6)}
.mblk.on .plate .face{border-color:var(--c10)}
/* 中央大序号（图样的核）*/
.plate .blk-n{position:absolute;left:0;right:0;top:34px;text-align:center;
  font-family:var(--f-m);font-size:26px;line-height:1;color:var(--ink);z-index:4;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.mblk.on .plate .blk-n{color:var(--c10)}
/* 页名：底缘 */
.plate .bpg{position:absolute;left:0;right:0;bottom:14px;text-align:center;
  font-family:var(--f-cn);font-size:12px;line-height:1.35;letter-spacing:.3em;color:var(--ink3);
  white-space:nowrap;z-index:4;text-indent:.3em}
.mblk.on .plate .bpg{color:var(--c10)}
/* 图样层：整卡面，元素以中心序号为几何核心布置 */
.plate .wicon{position:absolute;left:0;top:0;width:176px;height:108px;
  z-index:3;background:none;transform:none;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
/* ── 15 个融合构图（全部以中心序号为核）────────────────────────── */
/* 01 仪表盘：准星环包住序号 */
.wicon.w-dashboard{background-image:url('card-icons/01.png')}
/* 02 协议：左右接线进序号 */
.wicon.w-protocol{background-image:url('card-icons/02.png')}
/* 03 群管理：均衡器条在序号两侧 */
.wicon.w-groupmanage{background-image:url('card-icons/03.png')}
/* 04 表情包：四角散点 */
.wicon.w-memes{background-image:url('card-icons/04.png')}
/* 05 生图：四角取景框包住序号 */
.wicon.w-imagegen{background-image:url('card-icons/05.png')}
/* 06 行为：中线穿序号 + 两侧脉冲 */
/* 06 行为：中线拆两段（原横穿压数字）*/
.wicon.w-behavior{background-image:url('card-icons/06.png')}
/* 07 Token：上下双流线 */
.wicon.w-tokens{background-image:url('card-icons/07.png')}
/* 08 配置：淡点阵衬底 */
.wicon.w-settings{background-image:url('card-icons/08.png')}
/* 09 Bot：下弧托住序号 */
.wicon.w-bot{background-image:url('card-icons/09.png')}
/* 10 日志：上下文本行 */
.wicon.w-chatlogs{background-image:url('card-icons/10.png')}
/* 11 通知：同心环包序号 */
/* 11 通知：同心环放大（序号落环心），同色系 */
.wicon.w-monitor{background-image:url('card-icons/11.png')}
/* 12 控制台：四角终端括号 */
.wicon.w-console{background-image:url('card-icons/12.png')}
/* 13 记忆：双环 */
/* 13 记忆：环放大让序号落在**干净环心**；同色系细环（原黑金双环压数字且不和谐）*/
.wicon.w-memory{background-image:url('card-icons/13.png')}
/* 14 插件：斜网衬底 */
.wicon.w-plugins{background-image:url('card-icons/14.png')}
/* 15 Agent：三线汇聚 */
/* 15 Agent：三线从四角汇聚到中心**外围**（不触序号）*/
/* 15 Agent：四角 34px 小区内的斜线段（指向中心但不触）—— 原 38deg 铺满全卡会让两线在中心交叉成大 X */
.wicon.w-agent{background-image:url('card-icons/15.png')}
/* ③ 群管理 —— 音轨刻度条（疏密不一的竖线） */
html[data-page="groupmanage"] .deco{
  background:repeating-linear-gradient(90deg,
    var(--c30-ink) 0 2px,transparent 2px 7px,var(--c30-ink) 7px 8px,
    transparent 8px 19px,var(--c30-ink) 19px 22px,transparent 22px 29px);
  -webkit-mask-image:linear-gradient(90deg,#000 4%,transparent 44%);
  mask-image:linear-gradient(90deg,#000 4%,transparent 44%);
  opacity:.5;height:26vh;bottom:16vh;top:auto;left:0;right:auto;width:34vw}
html[data-page="groupmanage"] .deco::before{left:6vw;bottom:calc(16vh + 28vh);width:26vw;height:2px;
  background:var(--c10);opacity:.62}
html[data-page="groupmanage"] .deco::after{left:6vw;bottom:16vh;width:26vw;height:2px;
  background:var(--c10);opacity:.34}

/* ④ 表情包 —— 不规则散点阵（像素材分布） */
html[data-page="memes"] .deco{
  background:
    radial-gradient(circle at 12% 22%,var(--c30-ink) 0 2px,transparent 3px),
    radial-gradient(circle at 34% 62%,var(--c30-ink) 0 3px,transparent 4px),
    radial-gradient(circle at 58% 28%,var(--c10) 0 2px,transparent 3px),
    radial-gradient(circle at 78% 71%,var(--c30-ink) 0 2px,transparent 3px),
    radial-gradient(circle at 90% 34%,var(--c30-ink) 0 4px,transparent 5px),
    radial-gradient(circle at 22% 84%,var(--c30-ink) 0 2px,transparent 3px),
    radial-gradient(circle at 66% 88%,var(--c30-ink) 0 2px,transparent 3px);
  opacity:.62;width:100%;height:100%}
html[data-page="memes"] .deco::before{left:48vw;top:44vh;width:13vw;height:13vw;
  border:2px solid var(--c10);transform:rotate(18deg);opacity:.5}
html[data-page="memes"] .deco::after{left:48vw;top:44vh;width:13vw;height:2px;background:var(--c10);
  transform:rotate(-24deg);opacity:.44}

/* ⑤ 生图 —— 相机取景框（四角标记 + 中心十字） */
html[data-page="imagegen"] .deco{opacity:.6}
html[data-page="imagegen"] .deco::before{left:12vw;top:18vh;width:24vw;height:24vw;
  background:
    linear-gradient(var(--c10),var(--c10)) left top/26px 2px no-repeat,
    linear-gradient(var(--c10),var(--c10)) left top/2px 26px no-repeat,
    linear-gradient(var(--c10),var(--c10)) right top/26px 2px no-repeat,
    linear-gradient(var(--c10),var(--c10)) right top/2px 26px no-repeat,
    linear-gradient(var(--c10),var(--c10)) left bottom/26px 2px no-repeat,
    linear-gradient(var(--c10),var(--c10)) left bottom/2px 26px no-repeat,
    linear-gradient(var(--c10),var(--c10)) right bottom/26px 2px no-repeat,
    linear-gradient(var(--c10),var(--c10)) right bottom/2px 26px no-repeat}
html[data-page="imagegen"] .deco::after{left:calc(12vw + 12vw - 14px);top:calc(18vh + 12vh - 1px);
  width:28px;height:2px;background:var(--c10);
  box-shadow:0 0 0 0 var(--c10)}

/* ⑥ 行为 —— 波形折线（像音频/心电图） */
html[data-page="behavior"] .deco{opacity:.55}
html[data-page="behavior"] .deco::before{left:7vw;top:34vh;width:32vw;height:16vh;
  background:
    linear-gradient(90deg,transparent 0 12%,var(--c10) 12% 12.6%,transparent 12.6% 26%,
      var(--c10) 26% 26.6%,transparent 26.6% 44%,var(--c30-ink) 44% 44.8%,transparent 44.8% 61%,
      var(--c10) 61% 61.6%,transparent 61.6% 78%,var(--c30-ink) 78% 78.6%,transparent 78.6%);
  -webkit-mask-image:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 4px);
  mask-image:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 4px)}
html[data-page="behavior"] .deco::after{left:7vw;top:calc(34vh + 8vh);width:32vw;height:1px;
  background:var(--c30-ink);opacity:.42}

/* ⑦ Token —— 柱状骨架（竖条阵列，像直方图） */
/* 母题改为「数据流」：流向线 + 节点圆点（原来等距竖条太像直方图图表）*/
html[data-page="tokens"] .deco{opacity:.58}
html[data-page="tokens"] .deco::before{left:8vw;bottom:18vh;width:32vw;height:20vh;
  background:
    radial-gradient(circle,var(--c10) 0 5px,transparent 6px) 0 50%/100% 50%,
    radial-gradient(circle,var(--c30-ink) 0 4px,transparent 5px) 50% 100%/100% 50%,
    radial-gradient(circle,var(--c30-ink) 0 4px,transparent 5px) 32% 0/100% 50%;
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 32%,transparent 42%);
  mask-image:repeating-linear-gradient(90deg,#000 0 32%,transparent 42%)}
html[data-page="tokens"] .deco::after{left:8vw;bottom:18vh;width:32vw;height:2px;
  background:repeating-linear-gradient(90deg,var(--c30-ink) 0 18px,transparent 18px 34px);
  opacity:.5}

/* ⑧ 配置中心 —— 索引点阵（像参数表/矩阵） */
html[data-page="settings"] .deco{opacity:.6}
html[data-page="settings"] .deco::before{left:6vw;top:22vh;width:22vw;height:26vh;
  background:
    radial-gradient(circle,var(--c30-ink) 0 2px,transparent 3px) 0 0/22px 22px}
html[data-page="settings"] .deco::after{left:6vw;top:22vh;width:22vw;height:2px;
  background:var(--c10);opacity:.6;
  box-shadow:0 calc(26vh - 2px) 0 0 var(--c10)}

/* ⑨ Bot —— 分段大圆弧（机械仪表盘） */
html[data-page="bot"] .deco{opacity:.62}
html[data-page="bot"] .deco::before{right:9vw;top:16vh;width:32vw;height:32vw;
  border:3px solid transparent;border-top-color:var(--c10);border-right-color:var(--c10);
  border-radius:50%;transform:rotate(24deg)}
html[data-page="bot"] .deco::after{right:15vw;top:22vh;width:20vw;height:20vw;
  border:2px dashed var(--c30-ink);border-radius:50%;opacity:.6}

/* ⑩ 日志 —— 文本行（像日志条目） */
html[data-page="chatlogs"] .deco{
  background:repeating-linear-gradient(180deg,
    var(--c30-ink) 0 2px,transparent 2px 11px);
  -webkit-mask-image:linear-gradient(90deg,#000 3%,transparent 56%);
  mask-image:linear-gradient(90deg,#000 3%,transparent 56%);
  opacity:.42;left:6vw;top:16vh;right:auto;bottom:auto;width:34vw;height:34vh}
html[data-page="chatlogs"] .deco::before{left:6vw;top:16vh;width:3px;height:34vh;

html[data-page="chatlines"] .deco::after{left:0}

/* ⑪ 通知 —— 雷达同心圆 + 十字 */
html[data-page="monitor"] .deco{opacity:.6}
html[data-page="monitor"] .deco::before{left:14vw;top:20vh;width:24vw;height:24vw;
  background:
    radial-gradient(circle,transparent 0 22%,var(--c30-ink) 22% calc(22% + 1.5px),transparent calc(22% + 1.5px)),
    radial-gradient(circle,transparent 0 40%,var(--c30-ink) 40% calc(40% + 1.5px),transparent calc(40% + 1.5px)),
    radial-gradient(circle,transparent 0 58%,var(--c10) 58% calc(58% + 2px),transparent calc(58% + 2px))}
html[data-page="monitor"] .deco::after{left:calc(14vw + 12vw - 1px);top:20vh;width:2px;height:24vw;
  background:linear-gradient(180deg,transparent,var(--c10),transparent);opacity:.6}

/* ⑫ 控制台 —— 终端角标 + 光标块 */
html[data-page="console"] .deco{opacity:.66}
html[data-page="console"] .deco::before{left:8vw;top:15vh;width:26vw;height:30vh;
  background:
    linear-gradient(var(--c30-ink),var(--c30-ink)) left top/22px 2px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) left top/2px 22px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) right top/22px 2px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) right top/2px 22px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) left bottom/22px 2px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) left bottom/2px 22px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) right bottom/22px 2px no-repeat,
    linear-gradient(var(--c30-ink),var(--c30-ink)) right bottom/2px 22px no-repeat}
html[data-page="console"] .deco::after{left:12vw;top:20vh;width:9px;height:16px;
  background:var(--c10);opacity:.8}

/* ⑬ 记忆 —— 螺旋（同心旋转的断续弧） */
html[data-page="memory"] .deco{opacity:.55}
html[data-page="memory"] .deco::before{left:20vw;top:22vh;width:26vw;height:26vw;
  background:conic-gradient(from 0deg,
    var(--c30-ink) 0 6deg,transparent 6deg 30deg,var(--c30-ink) 30deg 34deg,transparent 34deg 90deg,
    var(--c10) 90deg 96deg,transparent 96deg 150deg,var(--c30-ink) 150deg 154deg,transparent 154deg 210deg);
  border-radius:50%;
  -webkit-mask-image:radial-gradient(circle,transparent 0 18%,#000 22% 46%,transparent 50% 62%,#000 66% 88%,transparent 92%);
  mask-image:radial-gradient(circle,transparent 0 18%,#000 22% 46%,transparent 50% 62%,#000 66% 88%,transparent 92%)}
html[data-page="memory"] .deco::after{left:33vw;top:35vh;width:3px;height:3px;background:var(--c10);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--c10) 22%,transparent)}

/* ⑭ 插件 —— 交叉斜网（像模块拼接） */
html[data-page="plugins"] .deco{
  background:
    repeating-linear-gradient(45deg,transparent 0 30px,color-mix(in srgb,var(--c30-ink) 55%,transparent) 30px 32px),
    repeating-linear-gradient(-45deg,transparent 0 30px,color-mix(in srgb,var(--c30-ink) 40%,transparent) 30px 31px);
  -webkit-mask-image:radial-gradient(44% 40% at 68% 62%,#000,transparent 76%);
  mask-image:radial-gradient(44% 40% at 68% 62%,#000,transparent 76%);
  opacity:.48}
html[data-page="plugins"] .deco::before{left:12vw;top:26vh;width:12vw;height:12vw;
  border:2px solid var(--c10);opacity:.55}
html[data-page="plugins"] .deco::after{left:12vw;top:26vh;width:12vw;height:12vw;
  border-left:2px solid var(--c10);border-top:2px solid var(--c10);
