name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # 项目是 Windows 桌面程序，用 windows runner 更贴近真实环境
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      # 只跑「纯逻辑、无 GUI、无网络、无本机状态依赖」的测试。
      # ★ 2026-10-22 更新：原来这里写着「完整套件里还有若干已知失败」——**已经不成立了**。
      #   本地全量 77 个测试文件现在全部通过（此前 9 个红：4 个环境缺失、4 个断言过期、
      #   1 个真 bug，另有 2 个退出码被守护线程拖垮）。失败原因查清后逐个修掉了。
      #   但**扩容仍然谨慎**：本机有 bot_config.json、有 chromium、有 plugins 运行态，
      #   CI 上没有这些。一次全加进去很可能红一批，而长期红的 CI 等于没有 CI。
      #   所以策略仍是「确认一个加一个」—— 下面的名单只是还没扩，不是因为红的。
      - name: Run smoke tests
        shell: pwsh
        env:
          # GitHub 的 windows runner 是英文系统，控制台编码 cp1252；
          # 测试打印中文会直接 UnicodeEncodeError（本机 cp936 复现不了）。
          # 强制 Python 用 UTF-8 模式跑，两边行为一致。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $tests = @(
            "test_persona_tag",
            "test_personality_contract",
            "test_privacy_terms",
            "test_at_others_gate",
            "test_reply_time_anchor_leak",
            "test_smart_send_split",
            "test_typing_delay",
            "test_dev_watch",
            "test_decider_degrade",
            "test_decider_pacing",
            "test_group_decider_logic",
            "test_memory_feed",
            "test_scope_policy_text",
            "test_prompt_segments",
            "test_turn_trace_isolation"
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "::group::$t"
            python "tests/$t.py"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::失败: $($failed -join ', ')"
            exit 1
          }
          Write-Host "全部通过"

  stability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Run runtime stability gates
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $tests = @(
            "test_trace_id",
            "test_trace_fields",
            "test_group_pipeline",
            "test_bot_core_events",
            "test_poke_policy",
            "test_poke_private_gate",
            "test_poke_private_mode",
            "test_poke_pipeline",
            "test_poke_consistency",
            "test_notice_events",
            "test_action_coverage",
            "test_group_facts",
            "test_capability_view",
            "test_persona_tone",
            "test_private_reply_target",
            "test_silence_reason",
            "test_scene_state",
            "test_humanness_engineering",
            "test_ego_topic_real",
            "test_ego_turn_ratchet",
            "test_prompt_segment_dedup",
            "test_proactivity_ledger",
            "test_proactivity_arbitrator",
            "test_proactivity_wiring",
            "test_task_center",
            "test_job_persistence",
            "test_job_wait",
            "test_workflow",
            "test_subagent",
            "test_subagent_resume",
            "test_autonomy_devloop",
            "test_plugin_forge_verify",
            "test_proactive_deliver",
            "test_meme_back",
            "test_memewiki",
            "test_memewiki_v2",
            "test_meme_audit",
            "test_meme_collect_reason",
            "test_meme_collect",
            "test_private_image_policy",
            "test_image_understanding",
            "test_image_subtype",
            "test_forward_vision",
            "test_capability_audit",
            "test_reply_audit",
            "test_grounding",
            "test_grounding_wire",
            "test_tool_result_protocol",
            "test_outbound",
            "test_outbound_verify",
            "test_outbound_no_dup_retry",
            "test_outbound_persistent_retry",
            "test_outbox",
            "test_recall_contract",
            "test_recall_texts",
            "test_recall_manager_plugin",
            "test_recall_ab",
            "test_group_decider_state",
            "test_self_actions",
            "test_action_log",
            "test_private_log_display",
            "test_packaging"
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "::group::$t"
            python "tests/$t.py"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::运行时稳定性失败: $($failed -join ', ')"
            exit 1
          }
